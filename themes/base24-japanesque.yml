# vim: ft=yaml

# Scheme Name: Japanesque
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#d0d2ce"
  directory:
    foreground: "#4c99d3"
  symlink:
    foreground: "#389aac"
  pipe:
    foreground: "#a8aaa7"
  block_device:
    foreground: "#135879"
  char_device:
    foreground: "#135879"
  socket:
    foreground: "#a8aaa7"
  special:
    foreground: "#a57fc4"
  executable:
    foreground: "#7bb75b"
  mount_point:
    foreground: "#135879"

perms:
  user_read:
    foreground: "#135879"
  user_write:
    foreground: "#ce3e60"
  user_execute_file:
    foreground: "#7bb75b"
  user_execute_other:
    foreground: "#7bb75b"
  group_read:
    foreground: "#135879"
  group_write:
    foreground: "#ce3e60"
  group_execute:
    foreground: "#7bb75b"
  other_read:
    foreground: "#135879"
  other_write:
    foreground: "#ce3e60"
  other_execute:
    foreground: "#7bb75b"
  special_user_file:
    foreground: "#a57fc4"
  special_other:
    foreground: "#a8aaa7"
  attribute:
    foreground: "#a8aaa7"

size:
  major:
    foreground: "#7bb75b"
  minor:
    foreground: "#7bb75b"
  number_byte:
    foreground: "#a8aaa7"
  number_kilo:
    foreground: "#d0d2ce"
  number_mega:
    foreground: "#135879"
  number_giga:
    foreground: "#e8b32a"
  number_huge:
    foreground: "#ce3e60"
  unit_byte:
    foreground: "#a8aaa7"
  unit_kilo:
    foreground: "#d0d2ce"
  unit_mega:
    foreground: "#135879"
  unit_giga:
    foreground: "#e8b32a"
  unit_huge:
    foreground: "#ce3e60"

users:
  user_you:
    foreground: "#d0d2ce"
  user_root:
    foreground: "#ce3e60"
  user_other:
    foreground: "#a57fc4"
  group_yours:
    foreground: "#d0d2ce"
  group_other:
    foreground: "#a8aaa7"
  group_root:
    foreground: "#ce3e60"

links:
  normal:
    foreground: "#389aac"
  multi_link_file:
    foreground: "#d0d2ce"
    background: "#389aac"

git:
  new:
    foreground: "#7bb75b"
  modified:
    foreground: "#135879"
  deleted:
    foreground: "#ce3e60"
  renamed:
    foreground: "#80827f"
  typechange:
    foreground: "#a57fc4"
  ignored:
    foreground: "#a8aaa7"
  conflicted:
    foreground: "#e8b32a"

git_repo:
  branch_main:
    foreground: "#d0d2ce"
  branch_other:
    foreground: "#a57fc4"
  git_clean:
    foreground: "#7bb75b"
  git_dirty:
    foreground: "#ce3e60"

security_context:
  colon:
    foreground: "#a8aaa7"
  user:
    foreground: "#d0d2ce"
  role:
    foreground: "#a57fc4"
  typ:
    foreground: "#a8aaa7"
  range:
    foreground: "#a57fc4"

file_type:
  image:
    foreground: "#135879"
  video:
    foreground: "#7bb75b"
  music:
    foreground: "#7bb75b"
  lossless:
    foreground: "#7bb75b"
  crypto:
    foreground: "#a8aaa7"
  document:
    foreground: "#d0d2ce"
  compressed:
    foreground: "#a8aaa7"
  temp:
    foreground: "#585a58"
  compiled:
    foreground: "#4c99d3"
  build:
    foreground: "#a8aaa7"
    is_underline: false
  source:
    foreground: "#4c99d3"

punctuation:
    foreground: "#a8aaa7"
date:
    foreground: "#a8aaa7"
inode:
    foreground: "#a8aaa7"
blocks:
    foreground: "#a8aaa7"
header:
    foreground: "#d0d2ce"
octal:
    foreground: "#80827f"
flags:
    foreground: "#a57fc4"

symlink_path:
    foreground: "#389aac"
control_char:
    foreground: "#e8b32a"
broken_symlink:
    foreground: "#ce3e60"
broken_path_overlay:
    foreground: "#a8aaa7"
