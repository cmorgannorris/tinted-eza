# vim: ft=yaml

# Scheme Name: Primer Dark Dimmed
# Scheme Author: Jimmy Lin
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#909dab"
  directory:
    foreground: "#539bf5"
  symlink:
    foreground: "#96d0ff"
  pipe:
    foreground: "#768390"
  block_device:
    foreground: "#c69026"
  char_device:
    foreground: "#c69026"
  socket:
    foreground: "#768390"
  special:
    foreground: "#e275ad"
  executable:
    foreground: "#57ab5a"
  mount_point:
    foreground: "#c69026"

perms:
  user_read:
    foreground: "#c69026"
  user_write:
    foreground: "#f47067"
  user_execute_file:
    foreground: "#57ab5a"
  user_execute_other:
    foreground: "#57ab5a"
  group_read:
    foreground: "#c69026"
  group_write:
    foreground: "#f47067"
  group_execute:
    foreground: "#57ab5a"
  other_read:
    foreground: "#c69026"
  other_write:
    foreground: "#f47067"
  other_execute:
    foreground: "#57ab5a"
  special_user_file:
    foreground: "#e275ad"
  special_other:
    foreground: "#768390"
  attribute:
    foreground: "#768390"

size:
  major:
    foreground: "#57ab5a"
  minor:
    foreground: "#57ab5a"
  number_byte:
    foreground: "#768390"
  number_kilo:
    foreground: "#909dab"
  number_mega:
    foreground: "#c69026"
  number_giga:
    foreground: "#e0823d"
  number_huge:
    foreground: "#f47067"
  unit_byte:
    foreground: "#768390"
  unit_kilo:
    foreground: "#909dab"
  unit_mega:
    foreground: "#c69026"
  unit_giga:
    foreground: "#e0823d"
  unit_huge:
    foreground: "#f47067"

users:
  user_you:
    foreground: "#909dab"
  user_root:
    foreground: "#f47067"
  user_other:
    foreground: "#e275ad"
  group_yours:
    foreground: "#909dab"
  group_other:
    foreground: "#768390"
  group_root:
    foreground: "#f47067"

links:
  normal:
    foreground: "#96d0ff"
  multi_link_file:
    foreground: "#909dab"
    background: "#96d0ff"

git:
  new:
    foreground: "#57ab5a"
  modified:
    foreground: "#c69026"
  deleted:
    foreground: "#f47067"
  renamed:
    foreground: "#545d68"
  typechange:
    foreground: "#e275ad"
  ignored:
    foreground: "#768390"
  conflicted:
    foreground: "#e0823d"

git_repo:
  branch_main:
    foreground: "#909dab"
  branch_other:
    foreground: "#e275ad"
  git_clean:
    foreground: "#57ab5a"
  git_dirty:
    foreground: "#f47067"

security_context:
  colon:
    foreground: "#768390"
  user:
    foreground: "#909dab"
  role:
    foreground: "#e275ad"
  typ:
    foreground: "#768390"
  range:
    foreground: "#e275ad"

file_type:
  image:
    foreground: "#c69026"
  video:
    foreground: "#57ab5a"
  music:
    foreground: "#57ab5a"
  lossless:
    foreground: "#909dab"
  crypto:
    foreground: "#768390"
  document:
    foreground: "#909dab"
  compressed:
    foreground: "#e275ad"
  temp:
    foreground: "#545d68"
    is_dimmed: false
  compiled:
    foreground: "#539bf5"
  build:
    foreground: "#768390"
    is_underline: false
  source:
    foreground: "#539bf5"

punctuation:
    foreground: "#768390"
date:
    foreground: "#768390"
inode:
    foreground: "#768390"
blocks:
    foreground: "#768390"
header:
    foreground: "#909dab"
octal:
    foreground: "#545d68"
flags:
    foreground: "#e275ad"

symlink_path:
    foreground: "#96d0ff"
control_char:
    foreground: "#e0823d"
broken_symlink:
    foreground: "#f47067"
broken_path_overlay:
    foreground: "#768390"
