# vim: ft=yaml

# Scheme Name: Precious Dark Fifteen
# Scheme Author: 4lex4 &lt;4lex49@zoho.com&gt;
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#bab9b6"
  directory:
    foreground: "#66b0ef"
  symlink:
    foreground: "#42bda7"
  pipe:
    foreground: "#abaaa8"
  block_device:
    foreground: "#cfa546"
  char_device:
    foreground: "#cfa546"
  socket:
    foreground: "#abaaa8"
  special:
    foreground: "#b799ff"
  executable:
    foreground: "#95b659"
  mount_point:
    foreground: "#cfa546"

perms:
  user_read:
    foreground: "#cfa546"
  user_write:
    foreground: "#ff8782"
  user_execute_file:
    foreground: "#95b659"
  user_execute_other:
    foreground: "#95b659"
  group_read:
    foreground: "#cfa546"
  group_write:
    foreground: "#ff8782"
  group_execute:
    foreground: "#95b659"
  other_read:
    foreground: "#cfa546"
  other_write:
    foreground: "#ff8782"
  other_execute:
    foreground: "#95b659"
  special_user_file:
    foreground: "#b799ff"
  special_other:
    foreground: "#abaaa8"
  attribute:
    foreground: "#abaaa8"

size:
  major:
    foreground: "#95b659"
  minor:
    foreground: "#95b659"
  number_byte:
    foreground: "#abaaa8"
  number_kilo:
    foreground: "#bab9b6"
  number_mega:
    foreground: "#cfa546"
  number_giga:
    foreground: "#e99857"
  number_huge:
    foreground: "#ff8782"
  unit_byte:
    foreground: "#abaaa8"
  unit_kilo:
    foreground: "#bab9b6"
  unit_mega:
    foreground: "#cfa546"
  unit_giga:
    foreground: "#e99857"
  unit_huge:
    foreground: "#ff8782"

users:
  user_you:
    foreground: "#bab9b6"
  user_root:
    foreground: "#ff8782"
  user_other:
    foreground: "#b799ff"
  group_yours:
    foreground: "#bab9b6"
  group_other:
    foreground: "#abaaa8"
  group_root:
    foreground: "#ff8782"

links:
  normal:
    foreground: "#42bda7"
  multi_link_file:
    foreground: "#bab9b6"
    background: "#42bda7"

git:
  new:
    foreground: "#95b659"
  modified:
    foreground: "#cfa546"
  deleted:
    foreground: "#ff8782"
  renamed:
    foreground: "#898989"
  typechange:
    foreground: "#b799ff"
  ignored:
    foreground: "#abaaa8"
  conflicted:
    foreground: "#e99857"

git_repo:
  branch_main:
    foreground: "#bab9b6"
  branch_other:
    foreground: "#b799ff"
  git_clean:
    foreground: "#95b659"
  git_dirty:
    foreground: "#ff8782"

security_context:
  colon:
    foreground: "#abaaa8"
  user:
    foreground: "#bab9b6"
  role:
    foreground: "#b799ff"
  typ:
    foreground: "#abaaa8"
  range:
    foreground: "#b799ff"

file_type:
  image:
    foreground: "#cfa546"
  video:
    foreground: "#95b659"
  music:
    foreground: "#95b659"
  lossless:
    foreground: "#bab9b6"
  crypto:
    foreground: "#abaaa8"
  document:
    foreground: "#bab9b6"
  compressed:
    foreground: "#b799ff"
  temp:
    foreground: "#898989"
    is_dimmed: false
  compiled:
    foreground: "#66b0ef"
  build:
    foreground: "#abaaa8"
    is_underline: false
  source:
    foreground: "#66b0ef"

punctuation:
    foreground: "#abaaa8"
date:
    foreground: "#abaaa8"
inode:
    foreground: "#abaaa8"
blocks:
    foreground: "#abaaa8"
header:
    foreground: "#bab9b6"
octal:
    foreground: "#898989"
flags:
    foreground: "#b799ff"

symlink_path:
    foreground: "#42bda7"
control_char:
    foreground: "#e99857"
broken_symlink:
    foreground: "#ff8782"
broken_path_overlay:
    foreground: "#abaaa8"
