# vim: ft=yaml

# Scheme Name: Outrun Dark
# Scheme Author: Hugo Delahousse (http://github.com/hugodelahousse/)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d0d0fa"
  directory:
    foreground: "#66b0ff"
  symlink:
    foreground: "#0ef0f0"
  pipe:
    foreground: "#b0b0da"
  block_device:
    foreground: "#f3e877"
  char_device:
    foreground: "#f3e877"
  socket:
    foreground: "#b0b0da"
  special:
    foreground: "#f10596"
  executable:
    foreground: "#59f176"
  mount_point:
    foreground: "#f3e877"

perms:
  user_read:
    foreground: "#f3e877"
  user_write:
    foreground: "#ff4242"
  user_execute_file:
    foreground: "#59f176"
  user_execute_other:
    foreground: "#59f176"
  group_read:
    foreground: "#f3e877"
  group_write:
    foreground: "#ff4242"
  group_execute:
    foreground: "#59f176"
  other_read:
    foreground: "#f3e877"
  other_write:
    foreground: "#ff4242"
  other_execute:
    foreground: "#59f176"
  special_user_file:
    foreground: "#f10596"
  special_other:
    foreground: "#b0b0da"
  attribute:
    foreground: "#b0b0da"

size:
  major:
    foreground: "#59f176"
  minor:
    foreground: "#59f176"
  number_byte:
    foreground: "#b0b0da"
  number_kilo:
    foreground: "#d0d0fa"
  number_mega:
    foreground: "#f3e877"
  number_giga:
    foreground: "#fc8d28"
  number_huge:
    foreground: "#ff4242"
  unit_byte:
    foreground: "#b0b0da"
  unit_kilo:
    foreground: "#d0d0fa"
  unit_mega:
    foreground: "#f3e877"
  unit_giga:
    foreground: "#fc8d28"
  unit_huge:
    foreground: "#ff4242"

users:
  user_you:
    foreground: "#d0d0fa"
  user_root:
    foreground: "#ff4242"
  user_other:
    foreground: "#f10596"
  group_yours:
    foreground: "#d0d0fa"
  group_other:
    foreground: "#b0b0da"
  group_root:
    foreground: "#ff4242"

links:
  normal:
    foreground: "#0ef0f0"
  multi_link_file:
    foreground: "#d0d0fa"
    background: "#0ef0f0"

git:
  new:
    foreground: "#59f176"
  modified:
    foreground: "#f3e877"
  deleted:
    foreground: "#ff4242"
  renamed:
    foreground: "#50507a"
  typechange:
    foreground: "#f10596"
  ignored:
    foreground: "#b0b0da"
  conflicted:
    foreground: "#fc8d28"

git_repo:
  branch_main:
    foreground: "#d0d0fa"
  branch_other:
    foreground: "#f10596"
  git_clean:
    foreground: "#59f176"
  git_dirty:
    foreground: "#ff4242"

security_context:
  colon:
    foreground: "#b0b0da"
  user:
    foreground: "#d0d0fa"
  role:
    foreground: "#f10596"
  typ:
    foreground: "#b0b0da"
  range:
    foreground: "#f10596"

file_type:
  image:
    foreground: "#f3e877"
  video:
    foreground: "#59f176"
  music:
    foreground: "#59f176"
  lossless:
    foreground: "#d0d0fa"
  crypto:
    foreground: "#b0b0da"
  document:
    foreground: "#d0d0fa"
  compressed:
    foreground: "#f10596"
  temp:
    foreground: "#50507a"
    is_dimmed: false
  compiled:
    foreground: "#66b0ff"
  build:
    foreground: "#b0b0da"
    is_underline: false
  source:
    foreground: "#66b0ff"

punctuation:
    foreground: "#b0b0da"
date:
    foreground: "#b0b0da"
inode:
    foreground: "#b0b0da"
blocks:
    foreground: "#b0b0da"
header:
    foreground: "#d0d0fa"
octal:
    foreground: "#50507a"
flags:
    foreground: "#f10596"

symlink_path:
    foreground: "#0ef0f0"
control_char:
    foreground: "#fc8d28"
broken_symlink:
    foreground: "#ff4242"
broken_path_overlay:
    foreground: "#b0b0da"
