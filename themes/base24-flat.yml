# vim: ft=yaml

# Scheme Name: Flat
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#8c939a"
  directory:
    foreground: "#3167ac"
  symlink:
    foreground: "#2c9370"
  pipe:
    foreground: "#68717b"
  block_device:
    foreground: "#3c7dd2"
  char_device:
    foreground: "#3c7dd2"
  socket:
    foreground: "#68717b"
  special:
    foreground: "#781aa0"
  executable:
    foreground: "#2d9440"
  mount_point:
    foreground: "#3c7dd2"

perms:
  user_read:
    foreground: "#3c7dd2"
  user_write:
    foreground: "#a82320"
  user_execute_file:
    foreground: "#2d9440"
  user_execute_other:
    foreground: "#2d9440"
  group_read:
    foreground: "#3c7dd2"
  group_write:
    foreground: "#a82320"
  group_execute:
    foreground: "#2d9440"
  other_read:
    foreground: "#3c7dd2"
  other_write:
    foreground: "#a82320"
  other_execute:
    foreground: "#2d9440"
  special_user_file:
    foreground: "#781aa0"
  special_other:
    foreground: "#68717b"
  attribute:
    foreground: "#68717b"

size:
  major:
    foreground: "#2d9440"
  minor:
    foreground: "#2d9440"
  number_byte:
    foreground: "#68717b"
  number_kilo:
    foreground: "#8c939a"
  number_mega:
    foreground: "#3c7dd2"
  number_giga:
    foreground: "#e58d11"
  number_huge:
    foreground: "#a82320"
  unit_byte:
    foreground: "#68717b"
  unit_kilo:
    foreground: "#8c939a"
  unit_mega:
    foreground: "#3c7dd2"
  unit_giga:
    foreground: "#e58d11"
  unit_huge:
    foreground: "#a82320"

users:
  user_you:
    foreground: "#8c939a"
  user_root:
    foreground: "#a82320"
  user_other:
    foreground: "#781aa0"
  group_yours:
    foreground: "#8c939a"
  group_other:
    foreground: "#68717b"
  group_root:
    foreground: "#a82320"

links:
  normal:
    foreground: "#2c9370"
  multi_link_file:
    foreground: "#8c939a"
    background: "#2c9370"

git:
  new:
    foreground: "#2d9440"
  modified:
    foreground: "#3c7dd2"
  deleted:
    foreground: "#a82320"
  renamed:
    foreground: "#444e5b"
  typechange:
    foreground: "#781aa0"
  ignored:
    foreground: "#68717b"
  conflicted:
    foreground: "#e58d11"

git_repo:
  branch_main:
    foreground: "#8c939a"
  branch_other:
    foreground: "#781aa0"
  git_clean:
    foreground: "#2d9440"
  git_dirty:
    foreground: "#a82320"

security_context:
  colon:
    foreground: "#68717b"
  user:
    foreground: "#8c939a"
  role:
    foreground: "#781aa0"
  typ:
    foreground: "#68717b"
  range:
    foreground: "#781aa0"

file_type:
  image:
    foreground: "#3c7dd2"
  video:
    foreground: "#2d9440"
  music:
    foreground: "#2d9440"
  lossless:
    foreground: "#2d9440"
  crypto:
    foreground: "#68717b"
  document:
    foreground: "#8c939a"
  compressed:
    foreground: "#68717b"
  temp:
    foreground: "#2e2e45"
  compiled:
    foreground: "#3167ac"
  build:
    foreground: "#68717b"
    is_underline: false
  source:
    foreground: "#3167ac"

punctuation:
    foreground: "#68717b"
date:
    foreground: "#68717b"
inode:
    foreground: "#68717b"
blocks:
    foreground: "#68717b"
header:
    foreground: "#8c939a"
octal:
    foreground: "#444e5b"
flags:
    foreground: "#781aa0"

symlink_path:
    foreground: "#2c9370"
control_char:
    foreground: "#e58d11"
broken_symlink:
    foreground: "#a82320"
broken_path_overlay:
    foreground: "#68717b"
