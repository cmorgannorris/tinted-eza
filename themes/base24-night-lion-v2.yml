# vim: ft=yaml

# Scheme Name: Night Lion V2
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#a1a1a1"
  directory:
    foreground: "#63d0f0"
  symlink:
    foreground: "#00d9df"
  pipe:
    foreground: "#888888"
  block_device:
    foreground: "#62cae7"
  char_device:
    foreground: "#62cae7"
  socket:
    foreground: "#888888"
  special:
    foreground: "#ce6fda"
  executable:
    foreground: "#03f622"
  mount_point:
    foreground: "#62cae7"

perms:
  user_read:
    foreground: "#62cae7"
  user_write:
    foreground: "#bb0000"
  user_execute_file:
    foreground: "#03f622"
  user_execute_other:
    foreground: "#03f622"
  group_read:
    foreground: "#62cae7"
  group_write:
    foreground: "#bb0000"
  group_execute:
    foreground: "#03f622"
  other_read:
    foreground: "#62cae7"
  other_write:
    foreground: "#bb0000"
  other_execute:
    foreground: "#03f622"
  special_user_file:
    foreground: "#ce6fda"
  special_other:
    foreground: "#888888"
  attribute:
    foreground: "#888888"

size:
  major:
    foreground: "#03f622"
  minor:
    foreground: "#03f622"
  number_byte:
    foreground: "#888888"
  number_kilo:
    foreground: "#a1a1a1"
  number_mega:
    foreground: "#62cae7"
  number_giga:
    foreground: "#f2f067"
  number_huge:
    foreground: "#bb0000"
  unit_byte:
    foreground: "#888888"
  unit_kilo:
    foreground: "#a1a1a1"
  unit_mega:
    foreground: "#62cae7"
  unit_giga:
    foreground: "#f2f067"
  unit_huge:
    foreground: "#bb0000"

users:
  user_you:
    foreground: "#a1a1a1"
  user_root:
    foreground: "#bb0000"
  user_other:
    foreground: "#ce6fda"
  group_yours:
    foreground: "#a1a1a1"
  group_other:
    foreground: "#888888"
  group_root:
    foreground: "#bb0000"

links:
  normal:
    foreground: "#00d9df"
  multi_link_file:
    foreground: "#a1a1a1"
    background: "#00d9df"

git:
  new:
    foreground: "#03f622"
  modified:
    foreground: "#62cae7"
  deleted:
    foreground: "#bb0000"
  renamed:
    foreground: "#6e6e6e"
  typechange:
    foreground: "#ce6fda"
  ignored:
    foreground: "#888888"
  conflicted:
    foreground: "#f2f067"

git_repo:
  branch_main:
    foreground: "#a1a1a1"
  branch_other:
    foreground: "#ce6fda"
  git_clean:
    foreground: "#03f622"
  git_dirty:
    foreground: "#bb0000"

security_context:
  colon:
    foreground: "#888888"
  user:
    foreground: "#a1a1a1"
  role:
    foreground: "#ce6fda"
  typ:
    foreground: "#888888"
  range:
    foreground: "#ce6fda"

file_type:
  image:
    foreground: "#62cae7"
  video:
    foreground: "#03f622"
  music:
    foreground: "#03f622"
  lossless:
    foreground: "#03f622"
  crypto:
    foreground: "#888888"
  document:
    foreground: "#a1a1a1"
  compressed:
    foreground: "#888888"
  temp:
    foreground: "#555555"
  compiled:
    foreground: "#63d0f0"
  build:
    foreground: "#888888"
    is_underline: false
  source:
    foreground: "#63d0f0"

punctuation:
    foreground: "#888888"
date:
    foreground: "#888888"
inode:
    foreground: "#888888"
blocks:
    foreground: "#888888"
header:
    foreground: "#a1a1a1"
octal:
    foreground: "#6e6e6e"
flags:
    foreground: "#ce6fda"

symlink_path:
    foreground: "#00d9df"
control_char:
    foreground: "#f2f067"
broken_symlink:
    foreground: "#bb0000"
broken_path_overlay:
    foreground: "#888888"
