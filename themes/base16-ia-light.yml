# vim: ft=yaml

# Scheme Name: iA Light
# Scheme Author: iA Inc. (modified by aramisgithub)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#181818"
  directory:
    foreground: "#48bac2"
  symlink:
    foreground: "#2d6bb1"
  pipe:
    foreground: "#767676"
  block_device:
    foreground: "#c48218"
  char_device:
    foreground: "#c48218"
  socket:
    foreground: "#767676"
  special:
    foreground: "#a94598"
  executable:
    foreground: "#38781c"
  mount_point:
    foreground: "#c48218"

perms:
  user_read:
    foreground: "#c48218"
  user_write:
    foreground: "#9c5a02"
  user_execute_file:
    foreground: "#38781c"
  user_execute_other:
    foreground: "#38781c"
  group_read:
    foreground: "#c48218"
  group_write:
    foreground: "#9c5a02"
  group_execute:
    foreground: "#38781c"
  other_read:
    foreground: "#c48218"
  other_write:
    foreground: "#9c5a02"
  other_execute:
    foreground: "#38781c"
  special_user_file:
    foreground: "#a94598"
  special_other:
    foreground: "#767676"
  attribute:
    foreground: "#767676"

size:
  major:
    foreground: "#38781c"
  minor:
    foreground: "#38781c"
  number_byte:
    foreground: "#767676"
  number_kilo:
    foreground: "#181818"
  number_mega:
    foreground: "#c48218"
  number_giga:
    foreground: "#c43e18"
  number_huge:
    foreground: "#9c5a02"
  unit_byte:
    foreground: "#767676"
  unit_kilo:
    foreground: "#181818"
  unit_mega:
    foreground: "#c48218"
  unit_giga:
    foreground: "#c43e18"
  unit_huge:
    foreground: "#9c5a02"

users:
  user_you:
    foreground: "#181818"
  user_root:
    foreground: "#9c5a02"
  user_other:
    foreground: "#a94598"
  group_yours:
    foreground: "#181818"
  group_other:
    foreground: "#767676"
  group_root:
    foreground: "#9c5a02"

links:
  normal:
    foreground: "#2d6bb1"
  multi_link_file:
    foreground: "#181818"
    background: "#2d6bb1"

git:
  new:
    foreground: "#38781c"
  modified:
    foreground: "#c48218"
  deleted:
    foreground: "#9c5a02"
  renamed:
    foreground: "#898989"
  typechange:
    foreground: "#a94598"
  ignored:
    foreground: "#767676"
  conflicted:
    foreground: "#c43e18"

git_repo:
  branch_main:
    foreground: "#181818"
  branch_other:
    foreground: "#a94598"
  git_clean:
    foreground: "#38781c"
  git_dirty:
    foreground: "#9c5a02"

security_context:
  colon:
    foreground: "#767676"
  user:
    foreground: "#181818"
  role:
    foreground: "#a94598"
  typ:
    foreground: "#767676"
  range:
    foreground: "#a94598"

file_type:
  image:
    foreground: "#c48218"
  video:
    foreground: "#38781c"
  music:
    foreground: "#38781c"
  lossless:
    foreground: "#181818"
  crypto:
    foreground: "#767676"
  document:
    foreground: "#181818"
  compressed:
    foreground: "#a94598"
  temp:
    foreground: "#898989"
    is_dimmed: false
  compiled:
    foreground: "#48bac2"
  build:
    foreground: "#767676"
    is_underline: false
  source:
    foreground: "#48bac2"

punctuation:
    foreground: "#767676"
date:
    foreground: "#767676"
inode:
    foreground: "#767676"
blocks:
    foreground: "#767676"
header:
    foreground: "#181818"
octal:
    foreground: "#898989"
flags:
    foreground: "#a94598"

symlink_path:
    foreground: "#2d6bb1"
control_char:
    foreground: "#c43e18"
broken_symlink:
    foreground: "#9c5a02"
broken_path_overlay:
    foreground: "#767676"
