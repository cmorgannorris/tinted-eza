# vim: ft=yaml

# Scheme Name: Unikitty Light
# Scheme Author: Josh W Lewis (@joshwlewis)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#6c696e"
  directory:
    foreground: "#775dff"
  symlink:
    foreground: "#149bda"
  pipe:
    foreground: "#89878b"
  block_device:
    foreground: "#dc8a0e"
  char_device:
    foreground: "#dc8a0e"
  socket:
    foreground: "#89878b"
  special:
    foreground: "#aa17e6"
  executable:
    foreground: "#17ad98"
  mount_point:
    foreground: "#dc8a0e"

perms:
  user_read:
    foreground: "#dc8a0e"
  user_write:
    foreground: "#d8137f"
  user_execute_file:
    foreground: "#17ad98"
  user_execute_other:
    foreground: "#17ad98"
  group_read:
    foreground: "#dc8a0e"
  group_write:
    foreground: "#d8137f"
  group_execute:
    foreground: "#17ad98"
  other_read:
    foreground: "#dc8a0e"
  other_write:
    foreground: "#d8137f"
  other_execute:
    foreground: "#17ad98"
  special_user_file:
    foreground: "#aa17e6"
  special_other:
    foreground: "#89878b"
  attribute:
    foreground: "#89878b"

size:
  major:
    foreground: "#17ad98"
  minor:
    foreground: "#17ad98"
  number_byte:
    foreground: "#89878b"
  number_kilo:
    foreground: "#6c696e"
  number_mega:
    foreground: "#dc8a0e"
  number_giga:
    foreground: "#d65407"
  number_huge:
    foreground: "#d8137f"
  unit_byte:
    foreground: "#89878b"
  unit_kilo:
    foreground: "#6c696e"
  unit_mega:
    foreground: "#dc8a0e"
  unit_giga:
    foreground: "#d65407"
  unit_huge:
    foreground: "#d8137f"

users:
  user_you:
    foreground: "#6c696e"
  user_root:
    foreground: "#d8137f"
  user_other:
    foreground: "#aa17e6"
  group_yours:
    foreground: "#6c696e"
  group_other:
    foreground: "#89878b"
  group_root:
    foreground: "#d8137f"

links:
  normal:
    foreground: "#149bda"
  multi_link_file:
    foreground: "#6c696e"
    background: "#149bda"

git:
  new:
    foreground: "#17ad98"
  modified:
    foreground: "#dc8a0e"
  deleted:
    foreground: "#d8137f"
  renamed:
    foreground: "#a7a5a8"
  typechange:
    foreground: "#aa17e6"
  ignored:
    foreground: "#89878b"
  conflicted:
    foreground: "#d65407"

git_repo:
  branch_main:
    foreground: "#6c696e"
  branch_other:
    foreground: "#aa17e6"
  git_clean:
    foreground: "#17ad98"
  git_dirty:
    foreground: "#d8137f"

security_context:
  colon:
    foreground: "#89878b"
  user:
    foreground: "#6c696e"
  role:
    foreground: "#aa17e6"
  typ:
    foreground: "#89878b"
  range:
    foreground: "#aa17e6"

file_type:
  image:
    foreground: "#dc8a0e"
  video:
    foreground: "#17ad98"
  music:
    foreground: "#17ad98"
  lossless:
    foreground: "#6c696e"
  crypto:
    foreground: "#89878b"
  document:
    foreground: "#6c696e"
  compressed:
    foreground: "#aa17e6"
  temp:
    foreground: "#a7a5a8"
    is_dimmed: false
  compiled:
    foreground: "#775dff"
  build:
    foreground: "#89878b"
    is_underline: false
  source:
    foreground: "#775dff"

punctuation:
    foreground: "#89878b"
date:
    foreground: "#89878b"
inode:
    foreground: "#89878b"
blocks:
    foreground: "#89878b"
header:
    foreground: "#6c696e"
octal:
    foreground: "#a7a5a8"
flags:
    foreground: "#aa17e6"

symlink_path:
    foreground: "#149bda"
control_char:
    foreground: "#d65407"
broken_symlink:
    foreground: "#d8137f"
broken_path_overlay:
    foreground: "#89878b"
