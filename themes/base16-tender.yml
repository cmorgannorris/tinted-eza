# vim: ft=yaml

# Scheme Name: tender
# Scheme Author: Jacobo Tabernero (https://github/com/jacoborus/tender.vim)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#eeeeee"
  directory:
    foreground: "#b3deef"
  symlink:
    foreground: "#73cef4"
  pipe:
    foreground: "#b8b8b8"
  block_device:
    foreground: "#ffc24b"
  char_device:
    foreground: "#ffc24b"
  socket:
    foreground: "#b8b8b8"
  special:
    foreground: "#d3b987"
  executable:
    foreground: "#c9d05c"
  mount_point:
    foreground: "#ffc24b"

perms:
  user_read:
    foreground: "#ffc24b"
  user_write:
    foreground: "#f43753"
  user_execute_file:
    foreground: "#c9d05c"
  user_execute_other:
    foreground: "#c9d05c"
  group_read:
    foreground: "#ffc24b"
  group_write:
    foreground: "#f43753"
  group_execute:
    foreground: "#c9d05c"
  other_read:
    foreground: "#ffc24b"
  other_write:
    foreground: "#f43753"
  other_execute:
    foreground: "#c9d05c"
  special_user_file:
    foreground: "#d3b987"
  special_other:
    foreground: "#b8b8b8"
  attribute:
    foreground: "#b8b8b8"

size:
  major:
    foreground: "#c9d05c"
  minor:
    foreground: "#c9d05c"
  number_byte:
    foreground: "#b8b8b8"
  number_kilo:
    foreground: "#eeeeee"
  number_mega:
    foreground: "#ffc24b"
  number_giga:
    foreground: "#dc9656"
  number_huge:
    foreground: "#f43753"
  unit_byte:
    foreground: "#b8b8b8"
  unit_kilo:
    foreground: "#eeeeee"
  unit_mega:
    foreground: "#ffc24b"
  unit_giga:
    foreground: "#dc9656"
  unit_huge:
    foreground: "#f43753"

users:
  user_you:
    foreground: "#eeeeee"
  user_root:
    foreground: "#f43753"
  user_other:
    foreground: "#d3b987"
  group_yours:
    foreground: "#eeeeee"
  group_other:
    foreground: "#b8b8b8"
  group_root:
    foreground: "#f43753"

links:
  normal:
    foreground: "#73cef4"
  multi_link_file:
    foreground: "#eeeeee"
    background: "#73cef4"

git:
  new:
    foreground: "#c9d05c"
  modified:
    foreground: "#ffc24b"
  deleted:
    foreground: "#f43753"
  renamed:
    foreground: "#4c4c4c"
  typechange:
    foreground: "#d3b987"
  ignored:
    foreground: "#b8b8b8"
  conflicted:
    foreground: "#dc9656"

git_repo:
  branch_main:
    foreground: "#eeeeee"
  branch_other:
    foreground: "#d3b987"
  git_clean:
    foreground: "#c9d05c"
  git_dirty:
    foreground: "#f43753"

security_context:
  colon:
    foreground: "#b8b8b8"
  user:
    foreground: "#eeeeee"
  role:
    foreground: "#d3b987"
  typ:
    foreground: "#b8b8b8"
  range:
    foreground: "#d3b987"

file_type:
  image:
    foreground: "#ffc24b"
  video:
    foreground: "#c9d05c"
  music:
    foreground: "#c9d05c"
  lossless:
    foreground: "#eeeeee"
  crypto:
    foreground: "#b8b8b8"
  document:
    foreground: "#eeeeee"
  compressed:
    foreground: "#d3b987"
  temp:
    foreground: "#4c4c4c"
  compiled:
    foreground: "#b3deef"
  build:
    foreground: "#b8b8b8"
    is_underline: false
  source:
    foreground: "#b3deef"

punctuation:
    foreground: "#b8b8b8"
date:
    foreground: "#b8b8b8"
inode:
    foreground: "#b8b8b8"
blocks:
    foreground: "#b8b8b8"
header:
    foreground: "#eeeeee"
octal:
    foreground: "#4c4c4c"
flags:
    foreground: "#d3b987"

symlink_path:
    foreground: "#73cef4"
control_char:
    foreground: "#dc9656"
broken_symlink:
    foreground: "#f43753"
broken_path_overlay:
    foreground: "#b8b8b8"
