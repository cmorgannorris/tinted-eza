# vim: ft=yaml

# Scheme Name: Precious Light White
# Scheme Author: 4lex4 &lt;4lex49@zoho.com&gt;
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#555555"
  directory:
    foreground: "#186daa"
  symlink:
    foreground: "#087767"
  pipe:
    foreground: "#636363"
  block_device:
    foreground: "#876500"
  char_device:
    foreground: "#876500"
  socket:
    foreground: "#636363"
  special:
    foreground: "#7b4ecb"
  executable:
    foreground: "#557301"
  mount_point:
    foreground: "#876500"

perms:
  user_read:
    foreground: "#876500"
  user_write:
    foreground: "#af4947"
  user_execute_file:
    foreground: "#557301"
  user_execute_other:
    foreground: "#557301"
  group_read:
    foreground: "#876500"
  group_write:
    foreground: "#af4947"
  group_execute:
    foreground: "#557301"
  other_read:
    foreground: "#876500"
  other_write:
    foreground: "#af4947"
  other_execute:
    foreground: "#557301"
  special_user_file:
    foreground: "#7b4ecb"
  special_other:
    foreground: "#636363"
  attribute:
    foreground: "#636363"

size:
  major:
    foreground: "#557301"
  minor:
    foreground: "#557301"
  number_byte:
    foreground: "#636363"
  number_kilo:
    foreground: "#555555"
  number_mega:
    foreground: "#876500"
  number_giga:
    foreground: "#a0570d"
  number_huge:
    foreground: "#af4947"
  unit_byte:
    foreground: "#636363"
  unit_kilo:
    foreground: "#555555"
  unit_mega:
    foreground: "#876500"
  unit_giga:
    foreground: "#a0570d"
  unit_huge:
    foreground: "#af4947"

users:
  user_you:
    foreground: "#555555"
  user_root:
    foreground: "#af4947"
  user_other:
    foreground: "#7b4ecb"
  group_yours:
    foreground: "#555555"
  group_other:
    foreground: "#636363"
  group_root:
    foreground: "#af4947"

links:
  normal:
    foreground: "#087767"
  multi_link_file:
    foreground: "#555555"
    background: "#087767"

git:
  new:
    foreground: "#557301"
  modified:
    foreground: "#876500"
  deleted:
    foreground: "#af4947"
  renamed:
    foreground: "#848484"
  typechange:
    foreground: "#7b4ecb"
  ignored:
    foreground: "#636363"
  conflicted:
    foreground: "#a0570d"

git_repo:
  branch_main:
    foreground: "#555555"
  branch_other:
    foreground: "#7b4ecb"
  git_clean:
    foreground: "#557301"
  git_dirty:
    foreground: "#af4947"

security_context:
  colon:
    foreground: "#636363"
  user:
    foreground: "#555555"
  role:
    foreground: "#7b4ecb"
  typ:
    foreground: "#636363"
  range:
    foreground: "#7b4ecb"

file_type:
  image:
    foreground: "#876500"
  video:
    foreground: "#557301"
  music:
    foreground: "#557301"
  lossless:
    foreground: "#555555"
  crypto:
    foreground: "#636363"
  document:
    foreground: "#555555"
  compressed:
    foreground: "#7b4ecb"
  temp:
    foreground: "#848484"
    is_dimmed: false
  compiled:
    foreground: "#186daa"
  build:
    foreground: "#636363"
    is_underline: false
  source:
    foreground: "#186daa"

punctuation:
    foreground: "#636363"
date:
    foreground: "#636363"
inode:
    foreground: "#636363"
blocks:
    foreground: "#636363"
header:
    foreground: "#555555"
octal:
    foreground: "#848484"
flags:
    foreground: "#7b4ecb"

symlink_path:
    foreground: "#087767"
control_char:
    foreground: "#a0570d"
broken_symlink:
    foreground: "#af4947"
broken_path_overlay:
    foreground: "#636363"
