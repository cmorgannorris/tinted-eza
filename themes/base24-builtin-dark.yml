# vim: ft=yaml

# Scheme Name: Builtin Dark
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#a1a1a1"
  directory:
    foreground: "#0000bb"
  symlink:
    foreground: "#00bbbb"
  pipe:
    foreground: "#888888"
  block_device:
    foreground: "#5555ff"
  char_device:
    foreground: "#5555ff"
  socket:
    foreground: "#888888"
  special:
    foreground: "#bb00bb"
  executable:
    foreground: "#00bb00"
  mount_point:
    foreground: "#5555ff"

perms:
  user_read:
    foreground: "#5555ff"
  user_write:
    foreground: "#bb0000"
  user_execute_file:
    foreground: "#00bb00"
  user_execute_other:
    foreground: "#00bb00"
  group_read:
    foreground: "#5555ff"
  group_write:
    foreground: "#bb0000"
  group_execute:
    foreground: "#00bb00"
  other_read:
    foreground: "#5555ff"
  other_write:
    foreground: "#bb0000"
  other_execute:
    foreground: "#00bb00"
  special_user_file:
    foreground: "#bb00bb"
  special_other:
    foreground: "#888888"
  attribute:
    foreground: "#888888"

size:
  major:
    foreground: "#00bb00"
  minor:
    foreground: "#00bb00"
  number_byte:
    foreground: "#888888"
  number_kilo:
    foreground: "#a1a1a1"
  number_mega:
    foreground: "#5555ff"
  number_giga:
    foreground: "#bbbb00"
  number_huge:
    foreground: "#bb0000"
  unit_byte:
    foreground: "#888888"
  unit_kilo:
    foreground: "#a1a1a1"
  unit_mega:
    foreground: "#5555ff"
  unit_giga:
    foreground: "#bbbb00"
  unit_huge:
    foreground: "#bb0000"

users:
  user_you:
    foreground: "#a1a1a1"
  user_root:
    foreground: "#bb0000"
  user_other:
    foreground: "#bb00bb"
  group_yours:
    foreground: "#a1a1a1"
  group_other:
    foreground: "#888888"
  group_root:
    foreground: "#bb0000"

links:
  normal:
    foreground: "#00bbbb"
  multi_link_file:
    foreground: "#a1a1a1"
    background: "#00bbbb"

git:
  new:
    foreground: "#00bb00"
  modified:
    foreground: "#5555ff"
  deleted:
    foreground: "#bb0000"
  renamed:
    foreground: "#6e6e6e"
  typechange:
    foreground: "#bb00bb"
  ignored:
    foreground: "#888888"
  conflicted:
    foreground: "#bbbb00"

git_repo:
  branch_main:
    foreground: "#a1a1a1"
  branch_other:
    foreground: "#bb00bb"
  git_clean:
    foreground: "#00bb00"
  git_dirty:
    foreground: "#bb0000"

security_context:
  colon:
    foreground: "#888888"
  user:
    foreground: "#a1a1a1"
  role:
    foreground: "#bb00bb"
  typ:
    foreground: "#888888"
  range:
    foreground: "#bb00bb"

file_type:
  image:
    foreground: "#5555ff"
  video:
    foreground: "#00bb00"
  music:
    foreground: "#00bb00"
  lossless:
    foreground: "#a1a1a1"
  crypto:
    foreground: "#888888"
  document:
    foreground: "#a1a1a1"
  compressed:
    foreground: "#bb00bb"
  temp:
    foreground: "#6e6e6e"
    is_dimmed: false
  compiled:
    foreground: "#0000bb"
  build:
    foreground: "#888888"
    is_underline: false
  source:
    foreground: "#0000bb"

punctuation:
    foreground: "#888888"
date:
    foreground: "#888888"
inode:
    foreground: "#888888"
blocks:
    foreground: "#888888"
header:
    foreground: "#a1a1a1"
octal:
    foreground: "#6e6e6e"
flags:
    foreground: "#bb00bb"

symlink_path:
    foreground: "#00bbbb"
control_char:
    foreground: "#bbbb00"
broken_symlink:
    foreground: "#bb0000"
broken_path_overlay:
    foreground: "#888888"
