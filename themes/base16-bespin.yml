# vim: ft=yaml

# Scheme Name: Bespin
# Scheme Author: Jan T. Sott
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#8a8986"
  directory:
    foreground: "#5ea6ea"
  symlink:
    foreground: "#afc4db"
  pipe:
    foreground: "#797977"
  block_device:
    foreground: "#f9ee98"
  char_device:
    foreground: "#f9ee98"
  socket:
    foreground: "#797977"
  special:
    foreground: "#9b859d"
  executable:
    foreground: "#54be0d"
  mount_point:
    foreground: "#f9ee98"

perms:
  user_read:
    foreground: "#f9ee98"
  user_write:
    foreground: "#cf6a4c"
  user_execute_file:
    foreground: "#54be0d"
  user_execute_other:
    foreground: "#54be0d"
  group_read:
    foreground: "#f9ee98"
  group_write:
    foreground: "#cf6a4c"
  group_execute:
    foreground: "#54be0d"
  other_read:
    foreground: "#f9ee98"
  other_write:
    foreground: "#cf6a4c"
  other_execute:
    foreground: "#54be0d"
  special_user_file:
    foreground: "#9b859d"
  special_other:
    foreground: "#797977"
  attribute:
    foreground: "#797977"

size:
  major:
    foreground: "#54be0d"
  minor:
    foreground: "#54be0d"
  number_byte:
    foreground: "#797977"
  number_kilo:
    foreground: "#8a8986"
  number_mega:
    foreground: "#f9ee98"
  number_giga:
    foreground: "#cf7d34"
  number_huge:
    foreground: "#cf6a4c"
  unit_byte:
    foreground: "#797977"
  unit_kilo:
    foreground: "#8a8986"
  unit_mega:
    foreground: "#f9ee98"
  unit_giga:
    foreground: "#cf7d34"
  unit_huge:
    foreground: "#cf6a4c"

users:
  user_you:
    foreground: "#8a8986"
  user_root:
    foreground: "#cf6a4c"
  user_other:
    foreground: "#9b859d"
  group_yours:
    foreground: "#8a8986"
  group_other:
    foreground: "#797977"
  group_root:
    foreground: "#cf6a4c"

links:
  normal:
    foreground: "#afc4db"
  multi_link_file:
    foreground: "#8a8986"
    background: "#afc4db"

git:
  new:
    foreground: "#54be0d"
  modified:
    foreground: "#f9ee98"
  deleted:
    foreground: "#cf6a4c"
  renamed:
    foreground: "#666666"
  typechange:
    foreground: "#9b859d"
  ignored:
    foreground: "#797977"
  conflicted:
    foreground: "#cf7d34"

git_repo:
  branch_main:
    foreground: "#8a8986"
  branch_other:
    foreground: "#9b859d"
  git_clean:
    foreground: "#54be0d"
  git_dirty:
    foreground: "#cf6a4c"

security_context:
  colon:
    foreground: "#797977"
  user:
    foreground: "#8a8986"
  role:
    foreground: "#9b859d"
  typ:
    foreground: "#797977"
  range:
    foreground: "#9b859d"

file_type:
  image:
    foreground: "#f9ee98"
  video:
    foreground: "#54be0d"
  music:
    foreground: "#54be0d"
  lossless:
    foreground: "#8a8986"
  crypto:
    foreground: "#797977"
  document:
    foreground: "#8a8986"
  compressed:
    foreground: "#9b859d"
  temp:
    foreground: "#666666"
  compiled:
    foreground: "#5ea6ea"
  build:
    foreground: "#797977"
    is_underline: false
  source:
    foreground: "#5ea6ea"

punctuation:
    foreground: "#797977"
date:
    foreground: "#797977"
inode:
    foreground: "#797977"
blocks:
    foreground: "#797977"
header:
    foreground: "#8a8986"
octal:
    foreground: "#666666"
flags:
    foreground: "#9b859d"

symlink_path:
    foreground: "#afc4db"
control_char:
    foreground: "#cf7d34"
broken_symlink:
    foreground: "#cf6a4c"
broken_path_overlay:
    foreground: "#797977"
