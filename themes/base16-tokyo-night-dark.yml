# vim: ft=yaml

# Scheme Name: Tokyo Night Dark
# Scheme Author: Michaël Ball
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a9b1d6"
  directory:
    foreground: "#2ac3de"
  symlink:
    foreground: "#b4f9f8"
  pipe:
    foreground: "#787c99"
  block_device:
    foreground: "#0db9d7"
  char_device:
    foreground: "#0db9d7"
  socket:
    foreground: "#787c99"
  special:
    foreground: "#bb9af7"
  executable:
    foreground: "#9ece6a"
  mount_point:
    foreground: "#0db9d7"

perms:
  user_read:
    foreground: "#0db9d7"
  user_write:
    foreground: "#c0caf5"
  user_execute_file:
    foreground: "#9ece6a"
  user_execute_other:
    foreground: "#9ece6a"
  group_read:
    foreground: "#0db9d7"
  group_write:
    foreground: "#c0caf5"
  group_execute:
    foreground: "#9ece6a"
  other_read:
    foreground: "#0db9d7"
  other_write:
    foreground: "#c0caf5"
  other_execute:
    foreground: "#9ece6a"
  special_user_file:
    foreground: "#bb9af7"
  special_other:
    foreground: "#787c99"
  attribute:
    foreground: "#787c99"

size:
  major:
    foreground: "#9ece6a"
  minor:
    foreground: "#9ece6a"
  number_byte:
    foreground: "#787c99"
  number_kilo:
    foreground: "#a9b1d6"
  number_mega:
    foreground: "#0db9d7"
  number_giga:
    foreground: "#a9b1d6"
  number_huge:
    foreground: "#c0caf5"
  unit_byte:
    foreground: "#787c99"
  unit_kilo:
    foreground: "#a9b1d6"
  unit_mega:
    foreground: "#0db9d7"
  unit_giga:
    foreground: "#a9b1d6"
  unit_huge:
    foreground: "#c0caf5"

users:
  user_you:
    foreground: "#a9b1d6"
  user_root:
    foreground: "#c0caf5"
  user_other:
    foreground: "#bb9af7"
  group_yours:
    foreground: "#a9b1d6"
  group_other:
    foreground: "#787c99"
  group_root:
    foreground: "#c0caf5"

links:
  normal:
    foreground: "#b4f9f8"
  multi_link_file:
    foreground: "#a9b1d6"
    background: "#b4f9f8"

git:
  new:
    foreground: "#9ece6a"
  modified:
    foreground: "#0db9d7"
  deleted:
    foreground: "#c0caf5"
  renamed:
    foreground: "#444b6a"
  typechange:
    foreground: "#bb9af7"
  ignored:
    foreground: "#787c99"
  conflicted:
    foreground: "#a9b1d6"

git_repo:
  branch_main:
    foreground: "#a9b1d6"
  branch_other:
    foreground: "#bb9af7"
  git_clean:
    foreground: "#9ece6a"
  git_dirty:
    foreground: "#c0caf5"

security_context:
  colon:
    foreground: "#787c99"
  user:
    foreground: "#a9b1d6"
  role:
    foreground: "#bb9af7"
  typ:
    foreground: "#787c99"
  range:
    foreground: "#bb9af7"

file_type:
  image:
    foreground: "#0db9d7"
  video:
    foreground: "#9ece6a"
  music:
    foreground: "#9ece6a"
  lossless:
    foreground: "#a9b1d6"
  crypto:
    foreground: "#787c99"
  document:
    foreground: "#a9b1d6"
  compressed:
    foreground: "#bb9af7"
  temp:
    foreground: "#444b6a"
    is_dimmed: false
  compiled:
    foreground: "#2ac3de"
  build:
    foreground: "#787c99"
    is_underline: false
  source:
    foreground: "#2ac3de"

punctuation:
    foreground: "#787c99"
date:
    foreground: "#787c99"
inode:
    foreground: "#787c99"
blocks:
    foreground: "#787c99"
header:
    foreground: "#a9b1d6"
octal:
    foreground: "#444b6a"
flags:
    foreground: "#bb9af7"

symlink_path:
    foreground: "#b4f9f8"
control_char:
    foreground: "#a9b1d6"
broken_symlink:
    foreground: "#c0caf5"
broken_path_overlay:
    foreground: "#787c99"
