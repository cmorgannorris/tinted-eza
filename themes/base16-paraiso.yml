# vim: ft=yaml

# Scheme Name: Paraiso
# Scheme Author: Jan T. Sott
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a39e9b"
  directory:
    foreground: "#06b6ef"
  symlink:
    foreground: "#5bc4bf"
  pipe:
    foreground: "#8d8687"
  block_device:
    foreground: "#fec418"
  char_device:
    foreground: "#fec418"
  socket:
    foreground: "#8d8687"
  special:
    foreground: "#815ba4"
  executable:
    foreground: "#48b685"
  mount_point:
    foreground: "#fec418"

perms:
  user_read:
    foreground: "#fec418"
  user_write:
    foreground: "#ef6155"
  user_execute_file:
    foreground: "#48b685"
  user_execute_other:
    foreground: "#48b685"
  group_read:
    foreground: "#fec418"
  group_write:
    foreground: "#ef6155"
  group_execute:
    foreground: "#48b685"
  other_read:
    foreground: "#fec418"
  other_write:
    foreground: "#ef6155"
  other_execute:
    foreground: "#48b685"
  special_user_file:
    foreground: "#815ba4"
  special_other:
    foreground: "#8d8687"
  attribute:
    foreground: "#8d8687"

size:
  major:
    foreground: "#48b685"
  minor:
    foreground: "#48b685"
  number_byte:
    foreground: "#8d8687"
  number_kilo:
    foreground: "#a39e9b"
  number_mega:
    foreground: "#fec418"
  number_giga:
    foreground: "#f99b15"
  number_huge:
    foreground: "#ef6155"
  unit_byte:
    foreground: "#8d8687"
  unit_kilo:
    foreground: "#a39e9b"
  unit_mega:
    foreground: "#fec418"
  unit_giga:
    foreground: "#f99b15"
  unit_huge:
    foreground: "#ef6155"

users:
  user_you:
    foreground: "#a39e9b"
  user_root:
    foreground: "#ef6155"
  user_other:
    foreground: "#815ba4"
  group_yours:
    foreground: "#a39e9b"
  group_other:
    foreground: "#8d8687"
  group_root:
    foreground: "#ef6155"

links:
  normal:
    foreground: "#5bc4bf"
  multi_link_file:
    foreground: "#a39e9b"
    background: "#5bc4bf"

git:
  new:
    foreground: "#48b685"
  modified:
    foreground: "#fec418"
  deleted:
    foreground: "#ef6155"
  renamed:
    foreground: "#776e71"
  typechange:
    foreground: "#815ba4"
  ignored:
    foreground: "#8d8687"
  conflicted:
    foreground: "#f99b15"

git_repo:
  branch_main:
    foreground: "#a39e9b"
  branch_other:
    foreground: "#815ba4"
  git_clean:
    foreground: "#48b685"
  git_dirty:
    foreground: "#ef6155"

security_context:
  colon:
    foreground: "#8d8687"
  user:
    foreground: "#a39e9b"
  role:
    foreground: "#815ba4"
  typ:
    foreground: "#8d8687"
  range:
    foreground: "#815ba4"

file_type:
  image:
    foreground: "#fec418"
  video:
    foreground: "#48b685"
  music:
    foreground: "#48b685"
  lossless:
    foreground: "#a39e9b"
  crypto:
    foreground: "#8d8687"
  document:
    foreground: "#a39e9b"
  compressed:
    foreground: "#815ba4"
  temp:
    foreground: "#776e71"
    is_dimmed: false
  compiled:
    foreground: "#06b6ef"
  build:
    foreground: "#8d8687"
    is_underline: false
  source:
    foreground: "#06b6ef"

punctuation:
    foreground: "#8d8687"
date:
    foreground: "#8d8687"
inode:
    foreground: "#8d8687"
blocks:
    foreground: "#8d8687"
header:
    foreground: "#a39e9b"
octal:
    foreground: "#776e71"
flags:
    foreground: "#815ba4"

symlink_path:
    foreground: "#5bc4bf"
control_char:
    foreground: "#f99b15"
broken_symlink:
    foreground: "#ef6155"
broken_path_overlay:
    foreground: "#8d8687"
