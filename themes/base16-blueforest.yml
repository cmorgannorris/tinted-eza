# vim: ft=yaml

# Scheme Name: Blue Forest
# Scheme Author: alonsodomin (https://github.com/alonsodomin)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#ffcc33"
  directory:
    foreground: "#a2cff5"
  symlink:
    foreground: "#80ff80"
  pipe:
    foreground: "#1e5c1e"
  block_device:
    foreground: "#91ccff"
  char_device:
    foreground: "#91ccff"
  socket:
    foreground: "#1e5c1e"
  special:
    foreground: "#0099ff"
  executable:
    foreground: "#80ff80"
  mount_point:
    foreground: "#91ccff"

perms:
  user_read:
    foreground: "#91ccff"
  user_write:
    foreground: "#fffab1"
  user_execute_file:
    foreground: "#80ff80"
  user_execute_other:
    foreground: "#80ff80"
  group_read:
    foreground: "#91ccff"
  group_write:
    foreground: "#fffab1"
  group_execute:
    foreground: "#80ff80"
  other_read:
    foreground: "#91ccff"
  other_write:
    foreground: "#fffab1"
  other_execute:
    foreground: "#80ff80"
  special_user_file:
    foreground: "#0099ff"
  special_other:
    foreground: "#1e5c1e"
  attribute:
    foreground: "#1e5c1e"

size:
  major:
    foreground: "#80ff80"
  minor:
    foreground: "#80ff80"
  number_byte:
    foreground: "#1e5c1e"
  number_kilo:
    foreground: "#ffcc33"
  number_mega:
    foreground: "#91ccff"
  number_giga:
    foreground: "#ff8080"
  number_huge:
    foreground: "#fffab1"
  unit_byte:
    foreground: "#1e5c1e"
  unit_kilo:
    foreground: "#ffcc33"
  unit_mega:
    foreground: "#91ccff"
  unit_giga:
    foreground: "#ff8080"
  unit_huge:
    foreground: "#fffab1"

users:
  user_you:
    foreground: "#ffcc33"
  user_root:
    foreground: "#fffab1"
  user_other:
    foreground: "#0099ff"
  group_yours:
    foreground: "#ffcc33"
  group_other:
    foreground: "#1e5c1e"
  group_root:
    foreground: "#fffab1"

links:
  normal:
    foreground: "#80ff80"
  multi_link_file:
    foreground: "#ffcc33"
    background: "#80ff80"

git:
  new:
    foreground: "#80ff80"
  modified:
    foreground: "#91ccff"
  deleted:
    foreground: "#fffab1"
  renamed:
    foreground: "#a0ffa0"
  typechange:
    foreground: "#0099ff"
  ignored:
    foreground: "#1e5c1e"
  conflicted:
    foreground: "#ff8080"

git_repo:
  branch_main:
    foreground: "#ffcc33"
  branch_other:
    foreground: "#0099ff"
  git_clean:
    foreground: "#80ff80"
  git_dirty:
    foreground: "#fffab1"

security_context:
  colon:
    foreground: "#1e5c1e"
  user:
    foreground: "#ffcc33"
  role:
    foreground: "#0099ff"
  typ:
    foreground: "#1e5c1e"
  range:
    foreground: "#0099ff"

file_type:
  image:
    foreground: "#91ccff"
  video:
    foreground: "#80ff80"
  music:
    foreground: "#80ff80"
  lossless:
    foreground: "#ffcc33"
  crypto:
    foreground: "#1e5c1e"
  document:
    foreground: "#ffcc33"
  compressed:
    foreground: "#0099ff"
  temp:
    foreground: "#a0ffa0"
  compiled:
    foreground: "#a2cff5"
  build:
    foreground: "#1e5c1e"
    is_underline: false
  source:
    foreground: "#a2cff5"

punctuation:
    foreground: "#1e5c1e"
date:
    foreground: "#1e5c1e"
inode:
    foreground: "#1e5c1e"
blocks:
    foreground: "#1e5c1e"
header:
    foreground: "#ffcc33"
octal:
    foreground: "#a0ffa0"
flags:
    foreground: "#0099ff"

symlink_path:
    foreground: "#80ff80"
control_char:
    foreground: "#ff8080"
broken_symlink:
    foreground: "#fffab1"
broken_path_overlay:
    foreground: "#1e5c1e"
