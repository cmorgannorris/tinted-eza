# vim: ft=yaml

# Scheme Name: Zenbones
# Scheme Author: mcchrish
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#b279a7"
  directory:
    foreground: "#cf86c1"
  symlink:
    foreground: "#61abda"
  pipe:
    foreground: "#6099c0"
  block_device:
    foreground: "#8bae68"
  char_device:
    foreground: "#8bae68"
  socket:
    foreground: "#6099c0"
  special:
    foreground: "#65b8c1"
  executable:
    foreground: "#d68c67"
  mount_point:
    foreground: "#8bae68"

perms:
  user_read:
    foreground: "#8bae68"
  user_write:
    foreground: "#3d3839"
  user_execute_file:
    foreground: "#d68c67"
  user_execute_other:
    foreground: "#d68c67"
  group_read:
    foreground: "#8bae68"
  group_write:
    foreground: "#3d3839"
  group_execute:
    foreground: "#d68c67"
  other_read:
    foreground: "#8bae68"
  other_write:
    foreground: "#3d3839"
  other_execute:
    foreground: "#d68c67"
  special_user_file:
    foreground: "#65b8c1"
  special_other:
    foreground: "#6099c0"
  attribute:
    foreground: "#6099c0"

size:
  major:
    foreground: "#d68c67"
  minor:
    foreground: "#d68c67"
  number_byte:
    foreground: "#6099c0"
  number_kilo:
    foreground: "#b279a7"
  number_mega:
    foreground: "#8bae68"
  number_giga:
    foreground: "#e8838f"
  number_huge:
    foreground: "#3d3839"
  unit_byte:
    foreground: "#6099c0"
  unit_kilo:
    foreground: "#b279a7"
  unit_mega:
    foreground: "#8bae68"
  unit_giga:
    foreground: "#e8838f"
  unit_huge:
    foreground: "#3d3839"

users:
  user_you:
    foreground: "#b279a7"
  user_root:
    foreground: "#3d3839"
  user_other:
    foreground: "#65b8c1"
  group_yours:
    foreground: "#b279a7"
  group_other:
    foreground: "#6099c0"
  group_root:
    foreground: "#3d3839"

links:
  normal:
    foreground: "#61abda"
  multi_link_file:
    foreground: "#b279a7"
    background: "#61abda"

git:
  new:
    foreground: "#d68c67"
  modified:
    foreground: "#8bae68"
  deleted:
    foreground: "#3d3839"
  renamed:
    foreground: "#b77e64"
  typechange:
    foreground: "#65b8c1"
  ignored:
    foreground: "#6099c0"
  conflicted:
    foreground: "#e8838f"

git_repo:
  branch_main:
    foreground: "#b279a7"
  branch_other:
    foreground: "#65b8c1"
  git_clean:
    foreground: "#d68c67"
  git_dirty:
    foreground: "#3d3839"

security_context:
  colon:
    foreground: "#6099c0"
  user:
    foreground: "#b279a7"
  role:
    foreground: "#65b8c1"
  typ:
    foreground: "#6099c0"
  range:
    foreground: "#65b8c1"

file_type:
  image:
    foreground: "#8bae68"
  video:
    foreground: "#d68c67"
  music:
    foreground: "#d68c67"
  lossless:
    foreground: "#b279a7"
  crypto:
    foreground: "#6099c0"
  document:
    foreground: "#b279a7"
  compressed:
    foreground: "#65b8c1"
  temp:
    foreground: "#b77e64"
    is_dimmed: false
  compiled:
    foreground: "#cf86c1"
  build:
    foreground: "#6099c0"
    is_underline: false
  source:
    foreground: "#cf86c1"

punctuation:
    foreground: "#6099c0"
date:
    foreground: "#6099c0"
inode:
    foreground: "#6099c0"
blocks:
    foreground: "#6099c0"
header:
    foreground: "#b279a7"
octal:
    foreground: "#b77e64"
flags:
    foreground: "#65b8c1"

symlink_path:
    foreground: "#61abda"
control_char:
    foreground: "#e8838f"
broken_symlink:
    foreground: "#3d3839"
broken_path_overlay:
    foreground: "#6099c0"
