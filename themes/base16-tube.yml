# vim: ft=yaml

# Scheme Name: London Tube
# Scheme Author: Jan T. Sott
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d9d8d8"
  directory:
    foreground: "#009ddc"
  symlink:
    foreground: "#85cebc"
  pipe:
    foreground: "#959ca1"
  block_device:
    foreground: "#ffd204"
  char_device:
    foreground: "#ffd204"
  socket:
    foreground: "#959ca1"
  special:
    foreground: "#98005d"
  executable:
    foreground: "#00853e"
  mount_point:
    foreground: "#ffd204"

perms:
  user_read:
    foreground: "#ffd204"
  user_write:
    foreground: "#ee2e24"
  user_execute_file:
    foreground: "#00853e"
  user_execute_other:
    foreground: "#00853e"
  group_read:
    foreground: "#ffd204"
  group_write:
    foreground: "#ee2e24"
  group_execute:
    foreground: "#00853e"
  other_read:
    foreground: "#ffd204"
  other_write:
    foreground: "#ee2e24"
  other_execute:
    foreground: "#00853e"
  special_user_file:
    foreground: "#98005d"
  special_other:
    foreground: "#959ca1"
  attribute:
    foreground: "#959ca1"

size:
  major:
    foreground: "#00853e"
  minor:
    foreground: "#00853e"
  number_byte:
    foreground: "#959ca1"
  number_kilo:
    foreground: "#d9d8d8"
  number_mega:
    foreground: "#ffd204"
  number_giga:
    foreground: "#f386a1"
  number_huge:
    foreground: "#ee2e24"
  unit_byte:
    foreground: "#959ca1"
  unit_kilo:
    foreground: "#d9d8d8"
  unit_mega:
    foreground: "#ffd204"
  unit_giga:
    foreground: "#f386a1"
  unit_huge:
    foreground: "#ee2e24"

users:
  user_you:
    foreground: "#d9d8d8"
  user_root:
    foreground: "#ee2e24"
  user_other:
    foreground: "#98005d"
  group_yours:
    foreground: "#d9d8d8"
  group_other:
    foreground: "#959ca1"
  group_root:
    foreground: "#ee2e24"

links:
  normal:
    foreground: "#85cebc"
  multi_link_file:
    foreground: "#d9d8d8"
    background: "#85cebc"

git:
  new:
    foreground: "#00853e"
  modified:
    foreground: "#ffd204"
  deleted:
    foreground: "#ee2e24"
  renamed:
    foreground: "#737171"
  typechange:
    foreground: "#98005d"
  ignored:
    foreground: "#959ca1"
  conflicted:
    foreground: "#f386a1"

git_repo:
  branch_main:
    foreground: "#d9d8d8"
  branch_other:
    foreground: "#98005d"
  git_clean:
    foreground: "#00853e"
  git_dirty:
    foreground: "#ee2e24"

security_context:
  colon:
    foreground: "#959ca1"
  user:
    foreground: "#d9d8d8"
  role:
    foreground: "#98005d"
  typ:
    foreground: "#959ca1"
  range:
    foreground: "#98005d"

file_type:
  image:
    foreground: "#ffd204"
  video:
    foreground: "#00853e"
  music:
    foreground: "#00853e"
  lossless:
    foreground: "#d9d8d8"
  crypto:
    foreground: "#959ca1"
  document:
    foreground: "#d9d8d8"
  compressed:
    foreground: "#98005d"
  temp:
    foreground: "#737171"
  compiled:
    foreground: "#009ddc"
  build:
    foreground: "#959ca1"
    is_underline: false
  source:
    foreground: "#009ddc"

punctuation:
    foreground: "#959ca1"
date:
    foreground: "#959ca1"
inode:
    foreground: "#959ca1"
blocks:
    foreground: "#959ca1"
header:
    foreground: "#d9d8d8"
octal:
    foreground: "#737171"
flags:
    foreground: "#98005d"

symlink_path:
    foreground: "#85cebc"
control_char:
    foreground: "#f386a1"
broken_symlink:
    foreground: "#ee2e24"
broken_path_overlay:
    foreground: "#959ca1"
