# vim: ft=yaml

# Scheme Name: Pico
# Scheme Author: PICO-8 (http://www.lexaloffle.com/pico-8.php)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#5f574f"
  directory:
    foreground: "#83769c"
  symlink:
    foreground: "#29adff"
  pipe:
    foreground: "#ab5236"
  block_device:
    foreground: "#fff024"
  char_device:
    foreground: "#fff024"
  socket:
    foreground: "#ab5236"
  special:
    foreground: "#ff77a8"
  executable:
    foreground: "#00e756"
  mount_point:
    foreground: "#fff024"

perms:
  user_read:
    foreground: "#fff024"
  user_write:
    foreground: "#ff004d"
  user_execute_file:
    foreground: "#00e756"
  user_execute_other:
    foreground: "#00e756"
  group_read:
    foreground: "#fff024"
  group_write:
    foreground: "#ff004d"
  group_execute:
    foreground: "#00e756"
  other_read:
    foreground: "#fff024"
  other_write:
    foreground: "#ff004d"
  other_execute:
    foreground: "#00e756"
  special_user_file:
    foreground: "#ff77a8"
  special_other:
    foreground: "#ab5236"
  attribute:
    foreground: "#ab5236"

size:
  major:
    foreground: "#00e756"
  minor:
    foreground: "#00e756"
  number_byte:
    foreground: "#ab5236"
  number_kilo:
    foreground: "#5f574f"
  number_mega:
    foreground: "#fff024"
  number_giga:
    foreground: "#ffa300"
  number_huge:
    foreground: "#ff004d"
  unit_byte:
    foreground: "#ab5236"
  unit_kilo:
    foreground: "#5f574f"
  unit_mega:
    foreground: "#fff024"
  unit_giga:
    foreground: "#ffa300"
  unit_huge:
    foreground: "#ff004d"

users:
  user_you:
    foreground: "#5f574f"
  user_root:
    foreground: "#ff004d"
  user_other:
    foreground: "#ff77a8"
  group_yours:
    foreground: "#5f574f"
  group_other:
    foreground: "#ab5236"
  group_root:
    foreground: "#ff004d"

links:
  normal:
    foreground: "#29adff"
  multi_link_file:
    foreground: "#5f574f"
    background: "#29adff"

git:
  new:
    foreground: "#00e756"
  modified:
    foreground: "#fff024"
  deleted:
    foreground: "#ff004d"
  renamed:
    foreground: "#008751"
  typechange:
    foreground: "#ff77a8"
  ignored:
    foreground: "#ab5236"
  conflicted:
    foreground: "#ffa300"

git_repo:
  branch_main:
    foreground: "#5f574f"
  branch_other:
    foreground: "#ff77a8"
  git_clean:
    foreground: "#00e756"
  git_dirty:
    foreground: "#ff004d"

security_context:
  colon:
    foreground: "#ab5236"
  user:
    foreground: "#5f574f"
  role:
    foreground: "#ff77a8"
  typ:
    foreground: "#ab5236"
  range:
    foreground: "#ff77a8"

file_type:
  image:
    foreground: "#fff024"
  video:
    foreground: "#00e756"
  music:
    foreground: "#00e756"
  lossless:
    foreground: "#5f574f"
  crypto:
    foreground: "#ab5236"
  document:
    foreground: "#5f574f"
  compressed:
    foreground: "#ff77a8"
  temp:
    foreground: "#008751"
    is_dimmed: false
  compiled:
    foreground: "#83769c"
  build:
    foreground: "#ab5236"
    is_underline: false
  source:
    foreground: "#83769c"

punctuation:
    foreground: "#ab5236"
date:
    foreground: "#ab5236"
inode:
    foreground: "#ab5236"
blocks:
    foreground: "#ab5236"
header:
    foreground: "#5f574f"
octal:
    foreground: "#008751"
flags:
    foreground: "#ff77a8"

symlink_path:
    foreground: "#29adff"
control_char:
    foreground: "#ffa300"
broken_symlink:
    foreground: "#ff004d"
broken_path_overlay:
    foreground: "#ab5236"
