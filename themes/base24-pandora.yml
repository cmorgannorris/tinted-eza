# vim: ft=yaml

# Scheme Name: Pandora
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#b8beba"
  directory:
    foreground: "#338f86"
  symlink:
    foreground: "#23d7d7"
  pipe:
    foreground: "#8f9b94"
  block_device:
    foreground: "#23d7d7"
  char_device:
    foreground: "#23d7d7"
  socket:
    foreground: "#8f9b94"
  special:
    foreground: "#9413e5"
  executable:
    foreground: "#74af68"
  mount_point:
    foreground: "#23d7d7"

perms:
  user_read:
    foreground: "#23d7d7"
  user_write:
    foreground: "#ff4242"
  user_execute_file:
    foreground: "#74af68"
  user_execute_other:
    foreground: "#74af68"
  group_read:
    foreground: "#23d7d7"
  group_write:
    foreground: "#ff4242"
  group_execute:
    foreground: "#74af68"
  other_read:
    foreground: "#23d7d7"
  other_write:
    foreground: "#ff4242"
  other_execute:
    foreground: "#74af68"
  special_user_file:
    foreground: "#9413e5"
  special_other:
    foreground: "#8f9b94"
  attribute:
    foreground: "#8f9b94"

size:
  major:
    foreground: "#74af68"
  minor:
    foreground: "#74af68"
  number_byte:
    foreground: "#8f9b94"
  number_kilo:
    foreground: "#b8beba"
  number_mega:
    foreground: "#23d7d7"
  number_giga:
    foreground: "#ffad29"
  number_huge:
    foreground: "#ff4242"
  unit_byte:
    foreground: "#8f9b94"
  unit_kilo:
    foreground: "#b8beba"
  unit_mega:
    foreground: "#23d7d7"
  unit_giga:
    foreground: "#ffad29"
  unit_huge:
    foreground: "#ff4242"

users:
  user_you:
    foreground: "#b8beba"
  user_root:
    foreground: "#ff4242"
  user_other:
    foreground: "#9413e5"
  group_yours:
    foreground: "#b8beba"
  group_other:
    foreground: "#8f9b94"
  group_root:
    foreground: "#ff4242"

links:
  normal:
    foreground: "#23d7d7"
  multi_link_file:
    foreground: "#b8beba"
    background: "#23d7d7"

git:
  new:
    foreground: "#74af68"
  modified:
    foreground: "#23d7d7"
  deleted:
    foreground: "#ff4242"
  renamed:
    foreground: "#66786e"
  typechange:
    foreground: "#9413e5"
  ignored:
    foreground: "#8f9b94"
  conflicted:
    foreground: "#ffad29"

git_repo:
  branch_main:
    foreground: "#b8beba"
  branch_other:
    foreground: "#9413e5"
  git_clean:
    foreground: "#74af68"
  git_dirty:
    foreground: "#ff4242"

security_context:
  colon:
    foreground: "#8f9b94"
  user:
    foreground: "#b8beba"
  role:
    foreground: "#9413e5"
  typ:
    foreground: "#8f9b94"
  range:
    foreground: "#9413e5"

file_type:
  image:
    foreground: "#23d7d7"
  video:
    foreground: "#74af68"
  music:
    foreground: "#74af68"
  lossless:
    foreground: "#b8beba"
  crypto:
    foreground: "#8f9b94"
  document:
    foreground: "#b8beba"
  compressed:
    foreground: "#9413e5"
  temp:
    foreground: "#66786e"
    is_dimmed: false
  compiled:
    foreground: "#338f86"
  build:
    foreground: "#8f9b94"
    is_underline: false
  source:
    foreground: "#338f86"

punctuation:
    foreground: "#8f9b94"
date:
    foreground: "#8f9b94"
inode:
    foreground: "#8f9b94"
blocks:
    foreground: "#8f9b94"
header:
    foreground: "#b8beba"
octal:
    foreground: "#66786e"
flags:
    foreground: "#9413e5"

symlink_path:
    foreground: "#23d7d7"
control_char:
    foreground: "#ffad29"
broken_symlink:
    foreground: "#ff4242"
broken_path_overlay:
    foreground: "#8f9b94"
