# vim: ft=yaml

# Scheme Name: Borland
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#d1d1d1"
  directory:
    foreground: "#96cafd"
  symlink:
    foreground: "#c6c4fd"
  pipe:
    foreground: "#b5b5b5"
  block_device:
    foreground: "#b5dcfe"
  char_device:
    foreground: "#b5dcfe"
  socket:
    foreground: "#b5b5b5"
  special:
    foreground: "#ff73fd"
  executable:
    foreground: "#a7ff60"
  mount_point:
    foreground: "#b5dcfe"

perms:
  user_read:
    foreground: "#b5dcfe"
  user_write:
    foreground: "#ff6b60"
  user_execute_file:
    foreground: "#a7ff60"
  user_execute_other:
    foreground: "#a7ff60"
  group_read:
    foreground: "#b5dcfe"
  group_write:
    foreground: "#ff6b60"
  group_execute:
    foreground: "#a7ff60"
  other_read:
    foreground: "#b5dcfe"
  other_write:
    foreground: "#ff6b60"
  other_execute:
    foreground: "#a7ff60"
  special_user_file:
    foreground: "#ff73fd"
  special_other:
    foreground: "#b5b5b5"
  attribute:
    foreground: "#b5b5b5"

size:
  major:
    foreground: "#a7ff60"
  minor:
    foreground: "#a7ff60"
  number_byte:
    foreground: "#b5b5b5"
  number_kilo:
    foreground: "#d1d1d1"
  number_mega:
    foreground: "#b5dcfe"
  number_giga:
    foreground: "#ffffb6"
  number_huge:
    foreground: "#ff6b60"
  unit_byte:
    foreground: "#b5b5b5"
  unit_kilo:
    foreground: "#d1d1d1"
  unit_mega:
    foreground: "#b5dcfe"
  unit_giga:
    foreground: "#ffffb6"
  unit_huge:
    foreground: "#ff6b60"

users:
  user_you:
    foreground: "#d1d1d1"
  user_root:
    foreground: "#ff6b60"
  user_other:
    foreground: "#ff73fd"
  group_yours:
    foreground: "#d1d1d1"
  group_other:
    foreground: "#b5b5b5"
  group_root:
    foreground: "#ff6b60"

links:
  normal:
    foreground: "#c6c4fd"
  multi_link_file:
    foreground: "#d1d1d1"
    background: "#c6c4fd"

git:
  new:
    foreground: "#a7ff60"
  modified:
    foreground: "#b5dcfe"
  deleted:
    foreground: "#ff6b60"
  renamed:
    foreground: "#989898"
  typechange:
    foreground: "#ff73fd"
  ignored:
    foreground: "#b5b5b5"
  conflicted:
    foreground: "#ffffb6"

git_repo:
  branch_main:
    foreground: "#d1d1d1"
  branch_other:
    foreground: "#ff73fd"
  git_clean:
    foreground: "#a7ff60"
  git_dirty:
    foreground: "#ff6b60"

security_context:
  colon:
    foreground: "#b5b5b5"
  user:
    foreground: "#d1d1d1"
  role:
    foreground: "#ff73fd"
  typ:
    foreground: "#b5b5b5"
  range:
    foreground: "#ff73fd"

file_type:
  image:
    foreground: "#b5dcfe"
  video:
    foreground: "#a7ff60"
  music:
    foreground: "#a7ff60"
  lossless:
    foreground: "#d1d1d1"
  crypto:
    foreground: "#b5b5b5"
  document:
    foreground: "#d1d1d1"
  compressed:
    foreground: "#ff73fd"
  temp:
    foreground: "#989898"
    is_dimmed: false
  compiled:
    foreground: "#96cafd"
  build:
    foreground: "#b5b5b5"
    is_underline: false
  source:
    foreground: "#96cafd"

punctuation:
    foreground: "#b5b5b5"
date:
    foreground: "#b5b5b5"
inode:
    foreground: "#b5b5b5"
blocks:
    foreground: "#b5b5b5"
header:
    foreground: "#d1d1d1"
octal:
    foreground: "#989898"
flags:
    foreground: "#ff73fd"

symlink_path:
    foreground: "#c6c4fd"
control_char:
    foreground: "#ffffb6"
broken_symlink:
    foreground: "#ff6b60"
broken_path_overlay:
    foreground: "#b5b5b5"
