# vim: ft=yaml

# Scheme Name: Evenok Dark
# Scheme Author: Mekeor Melire
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d0d0d0"
  directory:
    foreground: "#00aff2"
  symlink:
    foreground: "#00bab3"
  pipe:
    foreground: "#b0b0b0"
  block_device:
    foreground: "#b8a300"
  char_device:
    foreground: "#b8a300"
  socket:
    foreground: "#b0b0b0"
  special:
    foreground: "#9095ff"
  executable:
    foreground: "#54bc5c"
  mount_point:
    foreground: "#b8a300"

perms:
  user_read:
    foreground: "#b8a300"
  user_write:
    foreground: "#f5708a"
  user_execute_file:
    foreground: "#54bc5c"
  user_execute_other:
    foreground: "#54bc5c"
  group_read:
    foreground: "#b8a300"
  group_write:
    foreground: "#f5708a"
  group_execute:
    foreground: "#54bc5c"
  other_read:
    foreground: "#b8a300"
  other_write:
    foreground: "#f5708a"
  other_execute:
    foreground: "#54bc5c"
  special_user_file:
    foreground: "#9095ff"
  special_other:
    foreground: "#b0b0b0"
  attribute:
    foreground: "#b0b0b0"

size:
  major:
    foreground: "#54bc5c"
  minor:
    foreground: "#54bc5c"
  number_byte:
    foreground: "#b0b0b0"
  number_kilo:
    foreground: "#d0d0d0"
  number_mega:
    foreground: "#b8a300"
  number_giga:
    foreground: "#ee8122"
  number_huge:
    foreground: "#f5708a"
  unit_byte:
    foreground: "#b0b0b0"
  unit_kilo:
    foreground: "#d0d0d0"
  unit_mega:
    foreground: "#b8a300"
  unit_giga:
    foreground: "#ee8122"
  unit_huge:
    foreground: "#f5708a"

users:
  user_you:
    foreground: "#d0d0d0"
  user_root:
    foreground: "#f5708a"
  user_other:
    foreground: "#9095ff"
  group_yours:
    foreground: "#d0d0d0"
  group_other:
    foreground: "#b0b0b0"
  group_root:
    foreground: "#f5708a"

links:
  normal:
    foreground: "#00bab3"
  multi_link_file:
    foreground: "#d0d0d0"
    background: "#00bab3"

git:
  new:
    foreground: "#54bc5c"
  modified:
    foreground: "#b8a300"
  deleted:
    foreground: "#f5708a"
  renamed:
    foreground: "#505050"
  typechange:
    foreground: "#9095ff"
  ignored:
    foreground: "#b0b0b0"
  conflicted:
    foreground: "#ee8122"

git_repo:
  branch_main:
    foreground: "#d0d0d0"
  branch_other:
    foreground: "#9095ff"
  git_clean:
    foreground: "#54bc5c"
  git_dirty:
    foreground: "#f5708a"

security_context:
  colon:
    foreground: "#b0b0b0"
  user:
    foreground: "#d0d0d0"
  role:
    foreground: "#9095ff"
  typ:
    foreground: "#b0b0b0"
  range:
    foreground: "#9095ff"

file_type:
  image:
    foreground: "#b8a300"
  video:
    foreground: "#54bc5c"
  music:
    foreground: "#54bc5c"
  lossless:
    foreground: "#d0d0d0"
  crypto:
    foreground: "#b0b0b0"
  document:
    foreground: "#d0d0d0"
  compressed:
    foreground: "#9095ff"
  temp:
    foreground: "#505050"
    is_dimmed: false
  compiled:
    foreground: "#00aff2"
  build:
    foreground: "#b0b0b0"
    is_underline: false
  source:
    foreground: "#00aff2"

punctuation:
    foreground: "#b0b0b0"
date:
    foreground: "#b0b0b0"
inode:
    foreground: "#b0b0b0"
blocks:
    foreground: "#b0b0b0"
header:
    foreground: "#d0d0d0"
octal:
    foreground: "#505050"
flags:
    foreground: "#9095ff"

symlink_path:
    foreground: "#00bab3"
control_char:
    foreground: "#ee8122"
broken_symlink:
    foreground: "#f5708a"
broken_path_overlay:
    foreground: "#b0b0b0"
