# vim: ft=yaml

# Scheme Name: Blueish
# Scheme Author: Ben Mayoras
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c8e1f8"
  directory:
    foreground: "#82aaff"
  symlink:
    foreground: "#5fd1ff"
  pipe:
    foreground: "#74afe7"
  block_device:
    foreground: "#82aaff"
  char_device:
    foreground: "#82aaff"
  socket:
    foreground: "#74afe7"
  special:
    foreground: "#ff84dd"
  executable:
    foreground: "#c3e88d"
  mount_point:
    foreground: "#82aaff"

perms:
  user_read:
    foreground: "#82aaff"
  user_write:
    foreground: "#4ce587"
  user_execute_file:
    foreground: "#c3e88d"
  user_execute_other:
    foreground: "#c3e88d"
  group_read:
    foreground: "#82aaff"
  group_write:
    foreground: "#4ce587"
  group_execute:
    foreground: "#c3e88d"
  other_read:
    foreground: "#82aaff"
  other_write:
    foreground: "#4ce587"
  other_execute:
    foreground: "#c3e88d"
  special_user_file:
    foreground: "#ff84dd"
  special_other:
    foreground: "#74afe7"
  attribute:
    foreground: "#74afe7"

size:
  major:
    foreground: "#c3e88d"
  minor:
    foreground: "#c3e88d"
  number_byte:
    foreground: "#74afe7"
  number_kilo:
    foreground: "#c8e1f8"
  number_mega:
    foreground: "#82aaff"
  number_giga:
    foreground: "#f6a85c"
  number_huge:
    foreground: "#4ce587"
  unit_byte:
    foreground: "#74afe7"
  unit_kilo:
    foreground: "#c8e1f8"
  unit_mega:
    foreground: "#82aaff"
  unit_giga:
    foreground: "#f6a85c"
  unit_huge:
    foreground: "#4ce587"

users:
  user_you:
    foreground: "#c8e1f8"
  user_root:
    foreground: "#4ce587"
  user_other:
    foreground: "#ff84dd"
  group_yours:
    foreground: "#c8e1f8"
  group_other:
    foreground: "#74afe7"
  group_root:
    foreground: "#4ce587"

links:
  normal:
    foreground: "#5fd1ff"
  multi_link_file:
    foreground: "#c8e1f8"
    background: "#5fd1ff"

git:
  new:
    foreground: "#c3e88d"
  modified:
    foreground: "#82aaff"
  deleted:
    foreground: "#4ce587"
  renamed:
    foreground: "#616d78"
  typechange:
    foreground: "#ff84dd"
  ignored:
    foreground: "#74afe7"
  conflicted:
    foreground: "#f6a85c"

git_repo:
  branch_main:
    foreground: "#c8e1f8"
  branch_other:
    foreground: "#ff84dd"
  git_clean:
    foreground: "#c3e88d"
  git_dirty:
    foreground: "#4ce587"

security_context:
  colon:
    foreground: "#74afe7"
  user:
    foreground: "#c8e1f8"
  role:
    foreground: "#ff84dd"
  typ:
    foreground: "#74afe7"
  range:
    foreground: "#ff84dd"

file_type:
  image:
    foreground: "#82aaff"
  video:
    foreground: "#c3e88d"
  music:
    foreground: "#c3e88d"
  lossless:
    foreground: "#c8e1f8"
  crypto:
    foreground: "#74afe7"
  document:
    foreground: "#c8e1f8"
  compressed:
    foreground: "#ff84dd"
  temp:
    foreground: "#616d78"
  compiled:
    foreground: "#82aaff"
  build:
    foreground: "#74afe7"
    is_underline: false
  source:
    foreground: "#82aaff"

punctuation:
    foreground: "#74afe7"
date:
    foreground: "#74afe7"
inode:
    foreground: "#74afe7"
blocks:
    foreground: "#74afe7"
header:
    foreground: "#c8e1f8"
octal:
    foreground: "#616d78"
flags:
    foreground: "#ff84dd"

symlink_path:
    foreground: "#5fd1ff"
control_char:
    foreground: "#f6a85c"
broken_symlink:
    foreground: "#4ce587"
broken_path_overlay:
    foreground: "#74afe7"
