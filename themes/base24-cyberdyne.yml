# vim: ft=yaml

# Scheme Name: Cyberdyne
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#c0c0c0"
  directory:
    foreground: "#0071cf"
  symlink:
    foreground: "#6bffdc"
  pipe:
    foreground: "#8f8f8f"
  block_device:
    foreground: "#c1e3fe"
  char_device:
    foreground: "#c1e3fe"
  socket:
    foreground: "#8f8f8f"
  special:
    foreground: "#ff8ffd"
  executable:
    foreground: "#00c172"
  mount_point:
    foreground: "#c1e3fe"

perms:
  user_read:
    foreground: "#c1e3fe"
  user_write:
    foreground: "#ff8272"
  user_execute_file:
    foreground: "#00c172"
  user_execute_other:
    foreground: "#00c172"
  group_read:
    foreground: "#c1e3fe"
  group_write:
    foreground: "#ff8272"
  group_execute:
    foreground: "#00c172"
  other_read:
    foreground: "#c1e3fe"
  other_write:
    foreground: "#ff8272"
  other_execute:
    foreground: "#00c172"
  special_user_file:
    foreground: "#ff8ffd"
  special_other:
    foreground: "#8f8f8f"
  attribute:
    foreground: "#8f8f8f"

size:
  major:
    foreground: "#00c172"
  minor:
    foreground: "#00c172"
  number_byte:
    foreground: "#8f8f8f"
  number_kilo:
    foreground: "#c0c0c0"
  number_mega:
    foreground: "#c1e3fe"
  number_giga:
    foreground: "#d2a700"
  number_huge:
    foreground: "#ff8272"
  unit_byte:
    foreground: "#8f8f8f"
  unit_kilo:
    foreground: "#c0c0c0"
  unit_mega:
    foreground: "#c1e3fe"
  unit_giga:
    foreground: "#d2a700"
  unit_huge:
    foreground: "#ff8272"

users:
  user_you:
    foreground: "#c0c0c0"
  user_root:
    foreground: "#ff8272"
  user_other:
    foreground: "#ff8ffd"
  group_yours:
    foreground: "#c0c0c0"
  group_other:
    foreground: "#8f8f8f"
  group_root:
    foreground: "#ff8272"

links:
  normal:
    foreground: "#6bffdc"
  multi_link_file:
    foreground: "#c0c0c0"
    background: "#6bffdc"

git:
  new:
    foreground: "#00c172"
  modified:
    foreground: "#c1e3fe"
  deleted:
    foreground: "#ff8272"
  renamed:
    foreground: "#5e5e5e"
  typechange:
    foreground: "#ff8ffd"
  ignored:
    foreground: "#8f8f8f"
  conflicted:
    foreground: "#d2a700"

git_repo:
  branch_main:
    foreground: "#c0c0c0"
  branch_other:
    foreground: "#ff8ffd"
  git_clean:
    foreground: "#00c172"
  git_dirty:
    foreground: "#ff8272"

security_context:
  colon:
    foreground: "#8f8f8f"
  user:
    foreground: "#c0c0c0"
  role:
    foreground: "#ff8ffd"
  typ:
    foreground: "#8f8f8f"
  range:
    foreground: "#ff8ffd"

file_type:
  image:
    foreground: "#c1e3fe"
  video:
    foreground: "#00c172"
  music:
    foreground: "#00c172"
  lossless:
    foreground: "#c0c0c0"
  crypto:
    foreground: "#8f8f8f"
  document:
    foreground: "#c0c0c0"
  compressed:
    foreground: "#ff8ffd"
  temp:
    foreground: "#5e5e5e"
  compiled:
    foreground: "#0071cf"
  build:
    foreground: "#8f8f8f"
    is_underline: false
  source:
    foreground: "#0071cf"

punctuation:
    foreground: "#8f8f8f"
date:
    foreground: "#8f8f8f"
inode:
    foreground: "#8f8f8f"
blocks:
    foreground: "#8f8f8f"
header:
    foreground: "#c0c0c0"
octal:
    foreground: "#5e5e5e"
flags:
    foreground: "#ff8ffd"

symlink_path:
    foreground: "#6bffdc"
control_char:
    foreground: "#d2a700"
broken_symlink:
    foreground: "#ff8272"
broken_path_overlay:
    foreground: "#8f8f8f"
