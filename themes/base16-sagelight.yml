# vim: ft=yaml

# Scheme Name: Sagelight
# Scheme Author: Carter Veldhuizen
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#383838"
  directory:
    foreground: "#a0a7d2"
  symlink:
    foreground: "#a2d6f5"
  pipe:
    foreground: "#585858"
  block_device:
    foreground: "#ffdc61"
  char_device:
    foreground: "#ffdc61"
  socket:
    foreground: "#585858"
  special:
    foreground: "#c8a0d2"
  executable:
    foreground: "#a0d2c8"
  mount_point:
    foreground: "#ffdc61"

perms:
  user_read:
    foreground: "#ffdc61"
  user_write:
    foreground: "#fa8480"
  user_execute_file:
    foreground: "#a0d2c8"
  user_execute_other:
    foreground: "#a0d2c8"
  group_read:
    foreground: "#ffdc61"
  group_write:
    foreground: "#fa8480"
  group_execute:
    foreground: "#a0d2c8"
  other_read:
    foreground: "#ffdc61"
  other_write:
    foreground: "#fa8480"
  other_execute:
    foreground: "#a0d2c8"
  special_user_file:
    foreground: "#c8a0d2"
  special_other:
    foreground: "#585858"
  attribute:
    foreground: "#585858"

size:
  major:
    foreground: "#a0d2c8"
  minor:
    foreground: "#a0d2c8"
  number_byte:
    foreground: "#585858"
  number_kilo:
    foreground: "#383838"
  number_mega:
    foreground: "#ffdc61"
  number_giga:
    foreground: "#ffaa61"
  number_huge:
    foreground: "#fa8480"
  unit_byte:
    foreground: "#585858"
  unit_kilo:
    foreground: "#383838"
  unit_mega:
    foreground: "#ffdc61"
  unit_giga:
    foreground: "#ffaa61"
  unit_huge:
    foreground: "#fa8480"

users:
  user_you:
    foreground: "#383838"
  user_root:
    foreground: "#fa8480"
  user_other:
    foreground: "#c8a0d2"
  group_yours:
    foreground: "#383838"
  group_other:
    foreground: "#585858"
  group_root:
    foreground: "#fa8480"

links:
  normal:
    foreground: "#a2d6f5"
  multi_link_file:
    foreground: "#383838"
    background: "#a2d6f5"

git:
  new:
    foreground: "#a0d2c8"
  modified:
    foreground: "#ffdc61"
  deleted:
    foreground: "#fa8480"
  renamed:
    foreground: "#b8b8b8"
  typechange:
    foreground: "#c8a0d2"
  ignored:
    foreground: "#585858"
  conflicted:
    foreground: "#ffaa61"

git_repo:
  branch_main:
    foreground: "#383838"
  branch_other:
    foreground: "#c8a0d2"
  git_clean:
    foreground: "#a0d2c8"
  git_dirty:
    foreground: "#fa8480"

security_context:
  colon:
    foreground: "#585858"
  user:
    foreground: "#383838"
  role:
    foreground: "#c8a0d2"
  typ:
    foreground: "#585858"
  range:
    foreground: "#c8a0d2"

file_type:
  image:
    foreground: "#ffdc61"
  video:
    foreground: "#a0d2c8"
  music:
    foreground: "#a0d2c8"
  lossless:
    foreground: "#383838"
  crypto:
    foreground: "#585858"
  document:
    foreground: "#383838"
  compressed:
    foreground: "#c8a0d2"
  temp:
    foreground: "#b8b8b8"
  compiled:
    foreground: "#a0a7d2"
  build:
    foreground: "#585858"
    is_underline: false
  source:
    foreground: "#a0a7d2"

punctuation:
    foreground: "#585858"
date:
    foreground: "#585858"
inode:
    foreground: "#585858"
blocks:
    foreground: "#585858"
header:
    foreground: "#383838"
octal:
    foreground: "#b8b8b8"
flags:
    foreground: "#c8a0d2"

symlink_path:
    foreground: "#a2d6f5"
control_char:
    foreground: "#ffaa61"
broken_symlink:
    foreground: "#fa8480"
broken_path_overlay:
    foreground: "#585858"
