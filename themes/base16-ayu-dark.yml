# vim: ft=yaml

# Scheme Name: Ayu Dark
# Scheme Author: Tinted Theming (https://github.com/tinted-theming), Ayu Theme (https://github.com/ayu-theme)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#e6e1cf"
  directory:
    foreground: "#59c2ff"
  symlink:
    foreground: "#95e6cb"
  pipe:
    foreground: "#bfbdb6"
  block_device:
    foreground: "#ffb454"
  char_device:
    foreground: "#ffb454"
  socket:
    foreground: "#bfbdb6"
  special:
    foreground: "#d2a6ff"
  executable:
    foreground: "#aad94c"
  mount_point:
    foreground: "#59c2ff"

perms:
  user_read:
    foreground: "#e6e1cf"
  user_write:
    foreground: "#ff8f40"
  user_execute_file:
    foreground: "#aad94c"
  user_execute_other:
    foreground: "#aad94c"
  group_read:
    foreground: "#e6e1cf"
  group_write:
    foreground: "#ff8f40"
  group_execute:
    foreground: "#aad94c"
  other_read:
    foreground: "#bfbdb6"
  other_write:
    foreground: "#ff8f40"
  other_execute:
    foreground: "#aad94c"
  special_user_file:
    foreground: "#d2a6ff"
  special_other:
    foreground: "#bfbdb6"
  attribute:
    foreground: "#bfbdb6"

size:
  major:
    foreground: "#aad94c"
  minor:
    foreground: "#aad94c"
  number_byte:
    foreground: "#bfbdb6"
  number_kilo:
    foreground: "#e6e1cf"
  number_mega:
    foreground: "#ffb454"
  number_giga:
    foreground: "#ff8f40"
  number_huge:
    foreground: "#f07178"
  unit_byte:
    foreground: "#bfbdb6"
  unit_kilo:
    foreground: "#e6e1cf"
  unit_mega:
    foreground: "#ffb454"
  unit_giga:
    foreground: "#ff8f40"
  unit_huge:
    foreground: "#f07178"

users:
  user_you:
    foreground: "#e6e1cf"
  user_root:
    foreground: "#f07178"
  user_other:
    foreground: "#d2a6ff"
  group_yours:
    foreground: "#e6e1cf"
  group_other:
    foreground: "#bfbdb6"
  group_root:
    foreground: "#f07178"

links:
  normal:
    foreground: "#95e6cb"
  multi_link_file:
    foreground: "#e6e1cf"
    background: "#95e6cb"

git:
  new:
    foreground: "#aad94c"
  modified:
    foreground: "#ffb454"
  deleted:
    foreground: "#f07178"
  renamed:
    foreground: "#aad94c"
  typechange:
    foreground: "#d2a6ff"
  ignored:
    foreground: "#bfbdb6"
  conflicted:
    foreground: "#f07178"

git_repo:
  branch_main:
    foreground: "#e6e1cf"
  branch_other:
    foreground: "#d2a6ff"
  git_clean:
    foreground: "#aad94c"
  git_dirty:
    foreground: "#f07178"

security_context:
  colon:
    foreground: "#bfbdb6"
  user:
    foreground: "#e6e1cf"
  role:
    foreground: "#d2a6ff"
  typ:
    foreground: "#bfbdb6"
  range:
    foreground: "#d2a6ff"

file_type:
  image:
    foreground: "#ffb454"
  video:
    foreground: "#f07178"
  music:
    foreground: "#aad94c"
  lossless:
    foreground: "#95e6cb"
  crypto:
    foreground: "#bfbdb6"
  document:
    foreground: "#e6e1cf"
  compressed:
    foreground: "#d2a6ff"
  temp:
    foreground: "#f07178"
  compiled:
    foreground: "#59c2ff"
  build:
    foreground: "#bfbdb6"
    is_underline: false
  source:
    foreground: "#59c2ff"

punctuation:
    foreground: "#bfbdb6"
date:
    foreground: "#ffb454"
inode:
    foreground: "#bfbdb6"
blocks:
    foreground: "#bfbdb6"
header:
    foreground: "#e6e1cf"
octal:
    foreground: "#95e6cb"
flags:
    foreground: "#d2a6ff"

symlink_path:
    foreground: "#95e6cb"
control_char:
    foreground: "#59c2ff"
broken_symlink:
    foreground: "#f07178"
broken_path_overlay:
    foreground: "#bfbdb6"
