# vim: ft=yaml

# Scheme Name: Gruvbox Material Light, Medium
# Scheme Author: Mayush Kumar (https://github.com/MayushKumar), sainnhe (https://github.com/sainnhe/gruvbox-material-vscode)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#654735"
  directory:
    foreground: "#45707a"
  symlink:
    foreground: "#4c7a5d"
  pipe:
    foreground: "#665c54"
  block_device:
    foreground: "#b47109"
  char_device:
    foreground: "#b47109"
  socket:
    foreground: "#665c54"
  special:
    foreground: "#945e80"
  executable:
    foreground: "#6c782e"
  mount_point:
    foreground: "#b47109"

perms:
  user_read:
    foreground: "#b47109"
  user_write:
    foreground: "#c14a4a"
  user_execute_file:
    foreground: "#6c782e"
  user_execute_other:
    foreground: "#6c782e"
  group_read:
    foreground: "#b47109"
  group_write:
    foreground: "#c14a4a"
  group_execute:
    foreground: "#6c782e"
  other_read:
    foreground: "#b47109"
  other_write:
    foreground: "#c14a4a"
  other_execute:
    foreground: "#6c782e"
  special_user_file:
    foreground: "#945e80"
  special_other:
    foreground: "#665c54"
  attribute:
    foreground: "#665c54"

size:
  major:
    foreground: "#6c782e"
  minor:
    foreground: "#6c782e"
  number_byte:
    foreground: "#665c54"
  number_kilo:
    foreground: "#654735"
  number_mega:
    foreground: "#b47109"
  number_giga:
    foreground: "#c35e0a"
  number_huge:
    foreground: "#c14a4a"
  unit_byte:
    foreground: "#665c54"
  unit_kilo:
    foreground: "#654735"
  unit_mega:
    foreground: "#b47109"
  unit_giga:
    foreground: "#c35e0a"
  unit_huge:
    foreground: "#c14a4a"

users:
  user_you:
    foreground: "#654735"
  user_root:
    foreground: "#c14a4a"
  user_other:
    foreground: "#945e80"
  group_yours:
    foreground: "#654735"
  group_other:
    foreground: "#665c54"
  group_root:
    foreground: "#c14a4a"

links:
  normal:
    foreground: "#4c7a5d"
  multi_link_file:
    foreground: "#654735"
    background: "#4c7a5d"

git:
  new:
    foreground: "#6c782e"
  modified:
    foreground: "#b47109"
  deleted:
    foreground: "#c14a4a"
  renamed:
    foreground: "#bdae93"
  typechange:
    foreground: "#945e80"
  ignored:
    foreground: "#665c54"
  conflicted:
    foreground: "#c35e0a"

git_repo:
  branch_main:
    foreground: "#654735"
  branch_other:
    foreground: "#945e80"
  git_clean:
    foreground: "#6c782e"
  git_dirty:
    foreground: "#c14a4a"

security_context:
  colon:
    foreground: "#665c54"
  user:
    foreground: "#654735"
  role:
    foreground: "#945e80"
  typ:
    foreground: "#665c54"
  range:
    foreground: "#945e80"

file_type:
  image:
    foreground: "#b47109"
  video:
    foreground: "#6c782e"
  music:
    foreground: "#6c782e"
  lossless:
    foreground: "#654735"
  crypto:
    foreground: "#665c54"
  document:
    foreground: "#654735"
  compressed:
    foreground: "#945e80"
  temp:
    foreground: "#bdae93"
  compiled:
    foreground: "#45707a"
  build:
    foreground: "#665c54"
    is_underline: false
  source:
    foreground: "#45707a"

punctuation:
    foreground: "#665c54"
date:
    foreground: "#665c54"
inode:
    foreground: "#665c54"
blocks:
    foreground: "#665c54"
header:
    foreground: "#654735"
octal:
    foreground: "#bdae93"
flags:
    foreground: "#945e80"

symlink_path:
    foreground: "#4c7a5d"
control_char:
    foreground: "#c35e0a"
broken_symlink:
    foreground: "#c14a4a"
broken_path_overlay:
    foreground: "#665c54"
