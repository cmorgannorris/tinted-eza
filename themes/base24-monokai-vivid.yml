# vim: ft=yaml

# Scheme Name: Monokai Vivid
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#dfdfdf"
  directory:
    foreground: "#0442fe"
  symlink:
    foreground: "#01b6ed"
  pipe:
    foreground: "#c0c0c0"
  block_device:
    foreground: "#0442fe"
  char_device:
    foreground: "#0442fe"
  socket:
    foreground: "#c0c0c0"
  special:
    foreground: "#f800f8"
  executable:
    foreground: "#97e123"
  mount_point:
    foreground: "#0442fe"

perms:
  user_read:
    foreground: "#0442fe"
  user_write:
    foreground: "#fa2834"
  user_execute_file:
    foreground: "#97e123"
  user_execute_other:
    foreground: "#97e123"
  group_read:
    foreground: "#0442fe"
  group_write:
    foreground: "#fa2834"
  group_execute:
    foreground: "#97e123"
  other_read:
    foreground: "#0442fe"
  other_write:
    foreground: "#fa2834"
  other_execute:
    foreground: "#97e123"
  special_user_file:
    foreground: "#f800f8"
  special_other:
    foreground: "#c0c0c0"
  attribute:
    foreground: "#c0c0c0"

size:
  major:
    foreground: "#97e123"
  minor:
    foreground: "#97e123"
  number_byte:
    foreground: "#c0c0c0"
  number_kilo:
    foreground: "#dfdfdf"
  number_mega:
    foreground: "#0442fe"
  number_giga:
    foreground: "#fef20a"
  number_huge:
    foreground: "#fa2834"
  unit_byte:
    foreground: "#c0c0c0"
  unit_kilo:
    foreground: "#dfdfdf"
  unit_mega:
    foreground: "#0442fe"
  unit_giga:
    foreground: "#fef20a"
  unit_huge:
    foreground: "#fa2834"

users:
  user_you:
    foreground: "#dfdfdf"
  user_root:
    foreground: "#fa2834"
  user_other:
    foreground: "#f800f8"
  group_yours:
    foreground: "#dfdfdf"
  group_other:
    foreground: "#c0c0c0"
  group_root:
    foreground: "#fa2834"

links:
  normal:
    foreground: "#01b6ed"
  multi_link_file:
    foreground: "#dfdfdf"
    background: "#01b6ed"

git:
  new:
    foreground: "#97e123"
  modified:
    foreground: "#0442fe"
  deleted:
    foreground: "#fa2834"
  renamed:
    foreground: "#a1a1a1"
  typechange:
    foreground: "#f800f8"
  ignored:
    foreground: "#c0c0c0"
  conflicted:
    foreground: "#fef20a"

git_repo:
  branch_main:
    foreground: "#dfdfdf"
  branch_other:
    foreground: "#f800f8"
  git_clean:
    foreground: "#97e123"
  git_dirty:
    foreground: "#fa2834"

security_context:
  colon:
    foreground: "#c0c0c0"
  user:
    foreground: "#dfdfdf"
  role:
    foreground: "#f800f8"
  typ:
    foreground: "#c0c0c0"
  range:
    foreground: "#f800f8"

file_type:
  image:
    foreground: "#0442fe"
  video:
    foreground: "#97e123"
  music:
    foreground: "#97e123"
  lossless:
    foreground: "#dfdfdf"
  crypto:
    foreground: "#c0c0c0"
  document:
    foreground: "#dfdfdf"
  compressed:
    foreground: "#f800f8"
  temp:
    foreground: "#a1a1a1"
    is_dimmed: false
  compiled:
    foreground: "#0442fe"
  build:
    foreground: "#c0c0c0"
    is_underline: false
  source:
    foreground: "#0442fe"

punctuation:
    foreground: "#c0c0c0"
date:
    foreground: "#c0c0c0"
inode:
    foreground: "#c0c0c0"
blocks:
    foreground: "#c0c0c0"
header:
    foreground: "#dfdfdf"
octal:
    foreground: "#a1a1a1"
flags:
    foreground: "#f800f8"

symlink_path:
    foreground: "#01b6ed"
control_char:
    foreground: "#fef20a"
broken_symlink:
    foreground: "#fa2834"
broken_path_overlay:
    foreground: "#c0c0c0"
