# vim: ft=yaml

# Scheme Name: Precious Dark Eleven
# Scheme Author: 4lex4 &lt;4lex49@zoho.com&gt;
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#b8b7b6"
  directory:
    foreground: "#68b0ee"
  symlink:
    foreground: "#42bda7"
  pipe:
    foreground: "#a8a8a7"
  block_device:
    foreground: "#d0a543"
  char_device:
    foreground: "#d0a543"
  socket:
    foreground: "#a8a8a7"
  special:
    foreground: "#b799fe"
  executable:
    foreground: "#95b658"
  mount_point:
    foreground: "#d0a543"

perms:
  user_read:
    foreground: "#d0a543"
  user_write:
    foreground: "#ff8782"
  user_execute_file:
    foreground: "#95b658"
  user_execute_other:
    foreground: "#95b658"
  group_read:
    foreground: "#d0a543"
  group_write:
    foreground: "#ff8782"
  group_execute:
    foreground: "#95b658"
  other_read:
    foreground: "#d0a543"
  other_write:
    foreground: "#ff8782"
  other_execute:
    foreground: "#95b658"
  special_user_file:
    foreground: "#b799fe"
  special_other:
    foreground: "#a8a8a7"
  attribute:
    foreground: "#a8a8a7"

size:
  major:
    foreground: "#95b658"
  minor:
    foreground: "#95b658"
  number_byte:
    foreground: "#a8a8a7"
  number_kilo:
    foreground: "#b8b7b6"
  number_mega:
    foreground: "#d0a543"
  number_giga:
    foreground: "#ea9755"
  number_huge:
    foreground: "#ff8782"
  unit_byte:
    foreground: "#a8a8a7"
  unit_kilo:
    foreground: "#b8b7b6"
  unit_mega:
    foreground: "#d0a543"
  unit_giga:
    foreground: "#ea9755"
  unit_huge:
    foreground: "#ff8782"

users:
  user_you:
    foreground: "#b8b7b6"
  user_root:
    foreground: "#ff8782"
  user_other:
    foreground: "#b799fe"
  group_yours:
    foreground: "#b8b7b6"
  group_other:
    foreground: "#a8a8a7"
  group_root:
    foreground: "#ff8782"

links:
  normal:
    foreground: "#42bda7"
  multi_link_file:
    foreground: "#b8b7b6"
    background: "#42bda7"

git:
  new:
    foreground: "#95b658"
  modified:
    foreground: "#d0a543"
  deleted:
    foreground: "#ff8782"
  renamed:
    foreground: "#858585"
  typechange:
    foreground: "#b799fe"
  ignored:
    foreground: "#a8a8a7"
  conflicted:
    foreground: "#ea9755"

git_repo:
  branch_main:
    foreground: "#b8b7b6"
  branch_other:
    foreground: "#b799fe"
  git_clean:
    foreground: "#95b658"
  git_dirty:
    foreground: "#ff8782"

security_context:
  colon:
    foreground: "#a8a8a7"
  user:
    foreground: "#b8b7b6"
  role:
    foreground: "#b799fe"
  typ:
    foreground: "#a8a8a7"
  range:
    foreground: "#b799fe"

file_type:
  image:
    foreground: "#d0a543"
  video:
    foreground: "#95b658"
  music:
    foreground: "#95b658"
  lossless:
    foreground: "#b8b7b6"
  crypto:
    foreground: "#a8a8a7"
  document:
    foreground: "#b8b7b6"
  compressed:
    foreground: "#b799fe"
  temp:
    foreground: "#858585"
  compiled:
    foreground: "#68b0ee"
  build:
    foreground: "#a8a8a7"
    is_underline: false
  source:
    foreground: "#68b0ee"

punctuation:
    foreground: "#a8a8a7"
date:
    foreground: "#a8a8a7"
inode:
    foreground: "#a8a8a7"
blocks:
    foreground: "#a8a8a7"
header:
    foreground: "#b8b7b6"
octal:
    foreground: "#858585"
flags:
    foreground: "#b799fe"

symlink_path:
    foreground: "#42bda7"
control_char:
    foreground: "#ea9755"
broken_symlink:
    foreground: "#ff8782"
broken_path_overlay:
    foreground: "#a8a8a7"
