# vim: ft=yaml

# Scheme Name: Horizon Terminal Dark
# Scheme Author: Michaël Ball (http://github.com/michael-ball/)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cbced0"
  directory:
    foreground: "#26bbd9"
  symlink:
    foreground: "#59e1e3"
  pipe:
    foreground: "#9da0a2"
  block_device:
    foreground: "#fac29a"
  char_device:
    foreground: "#fac29a"
  socket:
    foreground: "#9da0a2"
  special:
    foreground: "#ee64ac"
  executable:
    foreground: "#29d398"
  mount_point:
    foreground: "#fac29a"

perms:
  user_read:
    foreground: "#fac29a"
  user_write:
    foreground: "#e95678"
  user_execute_file:
    foreground: "#29d398"
  user_execute_other:
    foreground: "#29d398"
  group_read:
    foreground: "#fac29a"
  group_write:
    foreground: "#e95678"
  group_execute:
    foreground: "#29d398"
  other_read:
    foreground: "#fac29a"
  other_write:
    foreground: "#e95678"
  other_execute:
    foreground: "#29d398"
  special_user_file:
    foreground: "#ee64ac"
  special_other:
    foreground: "#9da0a2"
  attribute:
    foreground: "#9da0a2"

size:
  major:
    foreground: "#29d398"
  minor:
    foreground: "#29d398"
  number_byte:
    foreground: "#9da0a2"
  number_kilo:
    foreground: "#cbced0"
  number_mega:
    foreground: "#fac29a"
  number_giga:
    foreground: "#fab795"
  number_huge:
    foreground: "#e95678"
  unit_byte:
    foreground: "#9da0a2"
  unit_kilo:
    foreground: "#cbced0"
  unit_mega:
    foreground: "#fac29a"
  unit_giga:
    foreground: "#fab795"
  unit_huge:
    foreground: "#e95678"

users:
  user_you:
    foreground: "#cbced0"
  user_root:
    foreground: "#e95678"
  user_other:
    foreground: "#ee64ac"
  group_yours:
    foreground: "#cbced0"
  group_other:
    foreground: "#9da0a2"
  group_root:
    foreground: "#e95678"

links:
  normal:
    foreground: "#59e1e3"
  multi_link_file:
    foreground: "#cbced0"
    background: "#59e1e3"

git:
  new:
    foreground: "#29d398"
  modified:
    foreground: "#fac29a"
  deleted:
    foreground: "#e95678"
  renamed:
    foreground: "#6f6f70"
  typechange:
    foreground: "#ee64ac"
  ignored:
    foreground: "#9da0a2"
  conflicted:
    foreground: "#fab795"

git_repo:
  branch_main:
    foreground: "#cbced0"
  branch_other:
    foreground: "#ee64ac"
  git_clean:
    foreground: "#29d398"
  git_dirty:
    foreground: "#e95678"

security_context:
  colon:
    foreground: "#9da0a2"
  user:
    foreground: "#cbced0"
  role:
    foreground: "#ee64ac"
  typ:
    foreground: "#9da0a2"
  range:
    foreground: "#ee64ac"

file_type:
  image:
    foreground: "#fac29a"
  video:
    foreground: "#29d398"
  music:
    foreground: "#29d398"
  lossless:
    foreground: "#cbced0"
  crypto:
    foreground: "#9da0a2"
  document:
    foreground: "#cbced0"
  compressed:
    foreground: "#ee64ac"
  temp:
    foreground: "#6f6f70"
  compiled:
    foreground: "#26bbd9"
  build:
    foreground: "#9da0a2"
    is_underline: false
  source:
    foreground: "#26bbd9"

punctuation:
    foreground: "#9da0a2"
date:
    foreground: "#9da0a2"
inode:
    foreground: "#9da0a2"
blocks:
    foreground: "#9da0a2"
header:
    foreground: "#cbced0"
octal:
    foreground: "#6f6f70"
flags:
    foreground: "#ee64ac"

symlink_path:
    foreground: "#59e1e3"
control_char:
    foreground: "#fab795"
broken_symlink:
    foreground: "#e95678"
broken_path_overlay:
    foreground: "#9da0a2"
