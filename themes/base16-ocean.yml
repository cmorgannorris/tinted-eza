# vim: ft=yaml

# Scheme Name: Ocean
# Scheme Author: Chris Kempson (http://chriskempson.com)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c0c5ce"
  directory:
    foreground: "#8fa1b3"
  symlink:
    foreground: "#96b5b4"
  pipe:
    foreground: "#a7adba"
  block_device:
    foreground: "#ebcb8b"
  char_device:
    foreground: "#ebcb8b"
  socket:
    foreground: "#a7adba"
  special:
    foreground: "#b48ead"
  executable:
    foreground: "#a3be8c"
  mount_point:
    foreground: "#ebcb8b"

perms:
  user_read:
    foreground: "#ebcb8b"
  user_write:
    foreground: "#bf616a"
  user_execute_file:
    foreground: "#a3be8c"
  user_execute_other:
    foreground: "#a3be8c"
  group_read:
    foreground: "#ebcb8b"
  group_write:
    foreground: "#bf616a"
  group_execute:
    foreground: "#a3be8c"
  other_read:
    foreground: "#ebcb8b"
  other_write:
    foreground: "#bf616a"
  other_execute:
    foreground: "#a3be8c"
  special_user_file:
    foreground: "#b48ead"
  special_other:
    foreground: "#a7adba"
  attribute:
    foreground: "#a7adba"

size:
  major:
    foreground: "#a3be8c"
  minor:
    foreground: "#a3be8c"
  number_byte:
    foreground: "#a7adba"
  number_kilo:
    foreground: "#c0c5ce"
  number_mega:
    foreground: "#ebcb8b"
  number_giga:
    foreground: "#d08770"
  number_huge:
    foreground: "#bf616a"
  unit_byte:
    foreground: "#a7adba"
  unit_kilo:
    foreground: "#c0c5ce"
  unit_mega:
    foreground: "#ebcb8b"
  unit_giga:
    foreground: "#d08770"
  unit_huge:
    foreground: "#bf616a"

users:
  user_you:
    foreground: "#c0c5ce"
  user_root:
    foreground: "#bf616a"
  user_other:
    foreground: "#b48ead"
  group_yours:
    foreground: "#c0c5ce"
  group_other:
    foreground: "#a7adba"
  group_root:
    foreground: "#bf616a"

links:
  normal:
    foreground: "#96b5b4"
  multi_link_file:
    foreground: "#c0c5ce"
    background: "#96b5b4"

git:
  new:
    foreground: "#a3be8c"
  modified:
    foreground: "#ebcb8b"
  deleted:
    foreground: "#bf616a"
  renamed:
    foreground: "#65737e"
  typechange:
    foreground: "#b48ead"
  ignored:
    foreground: "#a7adba"
  conflicted:
    foreground: "#d08770"

git_repo:
  branch_main:
    foreground: "#c0c5ce"
  branch_other:
    foreground: "#b48ead"
  git_clean:
    foreground: "#a3be8c"
  git_dirty:
    foreground: "#bf616a"

security_context:
  colon:
    foreground: "#a7adba"
  user:
    foreground: "#c0c5ce"
  role:
    foreground: "#b48ead"
  typ:
    foreground: "#a7adba"
  range:
    foreground: "#b48ead"

file_type:
  image:
    foreground: "#ebcb8b"
  video:
    foreground: "#a3be8c"
  music:
    foreground: "#a3be8c"
  lossless:
    foreground: "#c0c5ce"
  crypto:
    foreground: "#a7adba"
  document:
    foreground: "#c0c5ce"
  compressed:
    foreground: "#b48ead"
  temp:
    foreground: "#65737e"
    is_dimmed: false
  compiled:
    foreground: "#8fa1b3"
  build:
    foreground: "#a7adba"
    is_underline: false
  source:
    foreground: "#8fa1b3"

punctuation:
    foreground: "#a7adba"
date:
    foreground: "#a7adba"
inode:
    foreground: "#a7adba"
blocks:
    foreground: "#a7adba"
header:
    foreground: "#c0c5ce"
octal:
    foreground: "#65737e"
flags:
    foreground: "#b48ead"

symlink_path:
    foreground: "#96b5b4"
control_char:
    foreground: "#d08770"
broken_symlink:
    foreground: "#bf616a"
broken_path_overlay:
    foreground: "#a7adba"
