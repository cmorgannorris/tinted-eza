# vim: ft=yaml

# Scheme Name: Rippedcasts
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#a8a8a8"
  directory:
    foreground: "#75a5b0"
  symlink:
    foreground: "#59647e"
  pipe:
    foreground: "#929292"
  block_device:
    foreground: "#86bdc9"
  char_device:
    foreground: "#86bdc9"
  socket:
    foreground: "#929292"
  special:
    foreground: "#ff73fd"
  executable:
    foreground: "#a7ff60"
  mount_point:
    foreground: "#86bdc9"

perms:
  user_read:
    foreground: "#86bdc9"
  user_write:
    foreground: "#cdaf95"
  user_execute_file:
    foreground: "#a7ff60"
  user_execute_other:
    foreground: "#a7ff60"
  group_read:
    foreground: "#86bdc9"
  group_write:
    foreground: "#cdaf95"
  group_execute:
    foreground: "#a7ff60"
  other_read:
    foreground: "#86bdc9"
  other_write:
    foreground: "#cdaf95"
  other_execute:
    foreground: "#a7ff60"
  special_user_file:
    foreground: "#ff73fd"
  special_other:
    foreground: "#929292"
  attribute:
    foreground: "#929292"

size:
  major:
    foreground: "#a7ff60"
  minor:
    foreground: "#a7ff60"
  number_byte:
    foreground: "#929292"
  number_kilo:
    foreground: "#a8a8a8"
  number_mega:
    foreground: "#86bdc9"
  number_giga:
    foreground: "#bfbb1f"
  number_huge:
    foreground: "#cdaf95"
  unit_byte:
    foreground: "#929292"
  unit_kilo:
    foreground: "#a8a8a8"
  unit_mega:
    foreground: "#86bdc9"
  unit_giga:
    foreground: "#bfbb1f"
  unit_huge:
    foreground: "#cdaf95"

users:
  user_you:
    foreground: "#a8a8a8"
  user_root:
    foreground: "#cdaf95"
  user_other:
    foreground: "#ff73fd"
  group_yours:
    foreground: "#a8a8a8"
  group_other:
    foreground: "#929292"
  group_root:
    foreground: "#cdaf95"

links:
  normal:
    foreground: "#59647e"
  multi_link_file:
    foreground: "#a8a8a8"
    background: "#59647e"

git:
  new:
    foreground: "#a7ff60"
  modified:
    foreground: "#86bdc9"
  deleted:
    foreground: "#cdaf95"
  renamed:
    foreground: "#7c7c7c"
  typechange:
    foreground: "#ff73fd"
  ignored:
    foreground: "#929292"
  conflicted:
    foreground: "#bfbb1f"

git_repo:
  branch_main:
    foreground: "#a8a8a8"
  branch_other:
    foreground: "#ff73fd"
  git_clean:
    foreground: "#a7ff60"
  git_dirty:
    foreground: "#cdaf95"

security_context:
  colon:
    foreground: "#929292"
  user:
    foreground: "#a8a8a8"
  role:
    foreground: "#ff73fd"
  typ:
    foreground: "#929292"
  range:
    foreground: "#ff73fd"

file_type:
  image:
    foreground: "#86bdc9"
  video:
    foreground: "#a7ff60"
  music:
    foreground: "#a7ff60"
  lossless:
    foreground: "#a7ff60"
  crypto:
    foreground: "#929292"
  document:
    foreground: "#a8a8a8"
  compressed:
    foreground: "#929292"
  temp:
    foreground: "#666666"
  compiled:
    foreground: "#75a5b0"
  build:
    foreground: "#929292"
    is_underline: false
  source:
    foreground: "#75a5b0"

punctuation:
    foreground: "#929292"
date:
    foreground: "#929292"
inode:
    foreground: "#929292"
blocks:
    foreground: "#929292"
header:
    foreground: "#a8a8a8"
octal:
    foreground: "#7c7c7c"
flags:
    foreground: "#ff73fd"

symlink_path:
    foreground: "#59647e"
control_char:
    foreground: "#bfbb1f"
broken_symlink:
    foreground: "#cdaf95"
broken_path_overlay:
    foreground: "#929292"
