# vim: ft=yaml

# Scheme Name: Atelier Dune
# Scheme Author: Bram de Haan (http://atelierbramdehaan.nl)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a6a28c"
  directory:
    foreground: "#6684e1"
  symlink:
    foreground: "#1fad83"
  pipe:
    foreground: "#999580"
  block_device:
    foreground: "#ae9513"
  char_device:
    foreground: "#ae9513"
  socket:
    foreground: "#999580"
  special:
    foreground: "#b854d4"
  executable:
    foreground: "#60ac39"
  mount_point:
    foreground: "#ae9513"

perms:
  user_read:
    foreground: "#ae9513"
  user_write:
    foreground: "#d73737"
  user_execute_file:
    foreground: "#60ac39"
  user_execute_other:
    foreground: "#60ac39"
  group_read:
    foreground: "#ae9513"
  group_write:
    foreground: "#d73737"
  group_execute:
    foreground: "#60ac39"
  other_read:
    foreground: "#ae9513"
  other_write:
    foreground: "#d73737"
  other_execute:
    foreground: "#60ac39"
  special_user_file:
    foreground: "#b854d4"
  special_other:
    foreground: "#999580"
  attribute:
    foreground: "#999580"

size:
  major:
    foreground: "#60ac39"
  minor:
    foreground: "#60ac39"
  number_byte:
    foreground: "#999580"
  number_kilo:
    foreground: "#a6a28c"
  number_mega:
    foreground: "#ae9513"
  number_giga:
    foreground: "#b65611"
  number_huge:
    foreground: "#d73737"
  unit_byte:
    foreground: "#999580"
  unit_kilo:
    foreground: "#a6a28c"
  unit_mega:
    foreground: "#ae9513"
  unit_giga:
    foreground: "#b65611"
  unit_huge:
    foreground: "#d73737"

users:
  user_you:
    foreground: "#a6a28c"
  user_root:
    foreground: "#d73737"
  user_other:
    foreground: "#b854d4"
  group_yours:
    foreground: "#a6a28c"
  group_other:
    foreground: "#999580"
  group_root:
    foreground: "#d73737"

links:
  normal:
    foreground: "#1fad83"
  multi_link_file:
    foreground: "#a6a28c"
    background: "#1fad83"

git:
  new:
    foreground: "#60ac39"
  modified:
    foreground: "#ae9513"
  deleted:
    foreground: "#d73737"
  renamed:
    foreground: "#7d7a68"
  typechange:
    foreground: "#b854d4"
  ignored:
    foreground: "#999580"
  conflicted:
    foreground: "#b65611"

git_repo:
  branch_main:
    foreground: "#a6a28c"
  branch_other:
    foreground: "#b854d4"
  git_clean:
    foreground: "#60ac39"
  git_dirty:
    foreground: "#d73737"

security_context:
  colon:
    foreground: "#999580"
  user:
    foreground: "#a6a28c"
  role:
    foreground: "#b854d4"
  typ:
    foreground: "#999580"
  range:
    foreground: "#b854d4"

file_type:
  image:
    foreground: "#ae9513"
  video:
    foreground: "#60ac39"
  music:
    foreground: "#60ac39"
  lossless:
    foreground: "#a6a28c"
  crypto:
    foreground: "#999580"
  document:
    foreground: "#a6a28c"
  compressed:
    foreground: "#b854d4"
  temp:
    foreground: "#7d7a68"
    is_dimmed: false
  compiled:
    foreground: "#6684e1"
  build:
    foreground: "#999580"
    is_underline: false
  source:
    foreground: "#6684e1"

punctuation:
    foreground: "#999580"
date:
    foreground: "#999580"
inode:
    foreground: "#999580"
blocks:
    foreground: "#999580"
header:
    foreground: "#a6a28c"
octal:
    foreground: "#7d7a68"
flags:
    foreground: "#b854d4"

symlink_path:
    foreground: "#1fad83"
control_char:
    foreground: "#b65611"
broken_symlink:
    foreground: "#d73737"
broken_path_overlay:
    foreground: "#999580"
