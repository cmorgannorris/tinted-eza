# vim: ft=yaml

# Scheme Name: Katy
# Scheme Author: George Essig (https://github.com/gessig)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#959dcb"
  directory:
    foreground: "#82aaff"
  symlink:
    foreground: "#83b7e5"
  pipe:
    foreground: "#8796b0"
  block_device:
    foreground: "#e0a557"
  char_device:
    foreground: "#e0a557"
  socket:
    foreground: "#8796b0"
  special:
    foreground: "#c792ea"
  executable:
    foreground: "#78c06e"
  mount_point:
    foreground: "#e0a557"

perms:
  user_read:
    foreground: "#e0a557"
  user_write:
    foreground: "#6e98e1"
  user_execute_file:
    foreground: "#78c06e"
  user_execute_other:
    foreground: "#78c06e"
  group_read:
    foreground: "#e0a557"
  group_write:
    foreground: "#6e98e1"
  group_execute:
    foreground: "#78c06e"
  other_read:
    foreground: "#e0a557"
  other_write:
    foreground: "#6e98e1"
  other_execute:
    foreground: "#78c06e"
  special_user_file:
    foreground: "#c792ea"
  special_other:
    foreground: "#8796b0"
  attribute:
    foreground: "#8796b0"

size:
  major:
    foreground: "#78c06e"
  minor:
    foreground: "#78c06e"
  number_byte:
    foreground: "#8796b0"
  number_kilo:
    foreground: "#959dcb"
  number_mega:
    foreground: "#e0a557"
  number_giga:
    foreground: "#f78c6c"
  number_huge:
    foreground: "#6e98e1"
  unit_byte:
    foreground: "#8796b0"
  unit_kilo:
    foreground: "#959dcb"
  unit_mega:
    foreground: "#e0a557"
  unit_giga:
    foreground: "#f78c6c"
  unit_huge:
    foreground: "#6e98e1"

users:
  user_you:
    foreground: "#959dcb"
  user_root:
    foreground: "#6e98e1"
  user_other:
    foreground: "#c792ea"
  group_yours:
    foreground: "#959dcb"
  group_other:
    foreground: "#8796b0"
  group_root:
    foreground: "#6e98e1"

links:
  normal:
    foreground: "#83b7e5"
  multi_link_file:
    foreground: "#959dcb"
    background: "#83b7e5"

git:
  new:
    foreground: "#78c06e"
  modified:
    foreground: "#e0a557"
  deleted:
    foreground: "#6e98e1"
  renamed:
    foreground: "#676e95"
  typechange:
    foreground: "#c792ea"
  ignored:
    foreground: "#8796b0"
  conflicted:
    foreground: "#f78c6c"

git_repo:
  branch_main:
    foreground: "#959dcb"
  branch_other:
    foreground: "#c792ea"
  git_clean:
    foreground: "#78c06e"
  git_dirty:
    foreground: "#6e98e1"

security_context:
  colon:
    foreground: "#8796b0"
  user:
    foreground: "#959dcb"
  role:
    foreground: "#c792ea"
  typ:
    foreground: "#8796b0"
  range:
    foreground: "#c792ea"

file_type:
  image:
    foreground: "#e0a557"
  video:
    foreground: "#78c06e"
  music:
    foreground: "#78c06e"
  lossless:
    foreground: "#959dcb"
  crypto:
    foreground: "#8796b0"
  document:
    foreground: "#959dcb"
  compressed:
    foreground: "#c792ea"
  temp:
    foreground: "#676e95"
  compiled:
    foreground: "#82aaff"
  build:
    foreground: "#8796b0"
    is_underline: false
  source:
    foreground: "#82aaff"

punctuation:
    foreground: "#8796b0"
date:
    foreground: "#8796b0"
inode:
    foreground: "#8796b0"
blocks:
    foreground: "#8796b0"
header:
    foreground: "#959dcb"
octal:
    foreground: "#676e95"
flags:
    foreground: "#c792ea"

symlink_path:
    foreground: "#83b7e5"
control_char:
    foreground: "#f78c6c"
broken_symlink:
    foreground: "#6e98e1"
broken_path_overlay:
    foreground: "#8796b0"
