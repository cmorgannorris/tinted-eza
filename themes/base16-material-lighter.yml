# vim: ft=yaml

# Scheme Name: Material Lighter
# Scheme Author: Nate Peterson
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#80cbc4"
  directory:
    foreground: "#6182b8"
  symlink:
    foreground: "#39adb5"
  pipe:
    foreground: "#8796b0"
  block_device:
    foreground: "#ffb62c"
  char_device:
    foreground: "#ffb62c"
  socket:
    foreground: "#8796b0"
  special:
    foreground: "#7c4dff"
  executable:
    foreground: "#91b859"
  mount_point:
    foreground: "#ffb62c"

perms:
  user_read:
    foreground: "#ffb62c"
  user_write:
    foreground: "#ff5370"
  user_execute_file:
    foreground: "#91b859"
  user_execute_other:
    foreground: "#91b859"
  group_read:
    foreground: "#ffb62c"
  group_write:
    foreground: "#ff5370"
  group_execute:
    foreground: "#91b859"
  other_read:
    foreground: "#ffb62c"
  other_write:
    foreground: "#ff5370"
  other_execute:
    foreground: "#91b859"
  special_user_file:
    foreground: "#7c4dff"
  special_other:
    foreground: "#8796b0"
  attribute:
    foreground: "#8796b0"

size:
  major:
    foreground: "#91b859"
  minor:
    foreground: "#91b859"
  number_byte:
    foreground: "#8796b0"
  number_kilo:
    foreground: "#80cbc4"
  number_mega:
    foreground: "#ffb62c"
  number_giga:
    foreground: "#f76d47"
  number_huge:
    foreground: "#ff5370"
  unit_byte:
    foreground: "#8796b0"
  unit_kilo:
    foreground: "#80cbc4"
  unit_mega:
    foreground: "#ffb62c"
  unit_giga:
    foreground: "#f76d47"
  unit_huge:
    foreground: "#ff5370"

users:
  user_you:
    foreground: "#80cbc4"
  user_root:
    foreground: "#ff5370"
  user_other:
    foreground: "#7c4dff"
  group_yours:
    foreground: "#80cbc4"
  group_other:
    foreground: "#8796b0"
  group_root:
    foreground: "#ff5370"

links:
  normal:
    foreground: "#39adb5"
  multi_link_file:
    foreground: "#80cbc4"
    background: "#39adb5"

git:
  new:
    foreground: "#91b859"
  modified:
    foreground: "#ffb62c"
  deleted:
    foreground: "#ff5370"
  renamed:
    foreground: "#ccd7da"
  typechange:
    foreground: "#7c4dff"
  ignored:
    foreground: "#8796b0"
  conflicted:
    foreground: "#f76d47"

git_repo:
  branch_main:
    foreground: "#80cbc4"
  branch_other:
    foreground: "#7c4dff"
  git_clean:
    foreground: "#91b859"
  git_dirty:
    foreground: "#ff5370"

security_context:
  colon:
    foreground: "#8796b0"
  user:
    foreground: "#80cbc4"
  role:
    foreground: "#7c4dff"
  typ:
    foreground: "#8796b0"
  range:
    foreground: "#7c4dff"

file_type:
  image:
    foreground: "#ffb62c"
  video:
    foreground: "#91b859"
  music:
    foreground: "#91b859"
  lossless:
    foreground: "#80cbc4"
  crypto:
    foreground: "#8796b0"
  document:
    foreground: "#80cbc4"
  compressed:
    foreground: "#7c4dff"
  temp:
    foreground: "#ccd7da"
    is_dimmed: false
  compiled:
    foreground: "#6182b8"
  build:
    foreground: "#8796b0"
    is_underline: false
  source:
    foreground: "#6182b8"

punctuation:
    foreground: "#8796b0"
date:
    foreground: "#8796b0"
inode:
    foreground: "#8796b0"
blocks:
    foreground: "#8796b0"
header:
    foreground: "#80cbc4"
octal:
    foreground: "#ccd7da"
flags:
    foreground: "#7c4dff"

symlink_path:
    foreground: "#39adb5"
control_char:
    foreground: "#f76d47"
broken_symlink:
    foreground: "#ff5370"
broken_path_overlay:
    foreground: "#8796b0"
