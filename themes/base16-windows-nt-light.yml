# vim: ft=yaml

# Scheme Name: Windows NT Light
# Scheme Author: Fergus Collins (https://github.com/ferguscollins)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#808080"
  directory:
    foreground: "#000080"
  symlink:
    foreground: "#008080"
  pipe:
    foreground: "#a0a0a0"
  block_device:
    foreground: "#808000"
  char_device:
    foreground: "#808000"
  socket:
    foreground: "#a0a0a0"
  special:
    foreground: "#800080"
  executable:
    foreground: "#008000"
  mount_point:
    foreground: "#808000"

perms:
  user_read:
    foreground: "#808000"
  user_write:
    foreground: "#800000"
  user_execute_file:
    foreground: "#008000"
  user_execute_other:
    foreground: "#008000"
  group_read:
    foreground: "#808000"
  group_write:
    foreground: "#800000"
  group_execute:
    foreground: "#008000"
  other_read:
    foreground: "#808000"
  other_write:
    foreground: "#800000"
  other_execute:
    foreground: "#008000"
  special_user_file:
    foreground: "#800080"
  special_other:
    foreground: "#a0a0a0"
  attribute:
    foreground: "#a0a0a0"

size:
  major:
    foreground: "#008000"
  minor:
    foreground: "#008000"
  number_byte:
    foreground: "#a0a0a0"
  number_kilo:
    foreground: "#808080"
  number_mega:
    foreground: "#808000"
  number_giga:
    foreground: "#ffff00"
  number_huge:
    foreground: "#800000"
  unit_byte:
    foreground: "#a0a0a0"
  unit_kilo:
    foreground: "#808080"
  unit_mega:
    foreground: "#808000"
  unit_giga:
    foreground: "#ffff00"
  unit_huge:
    foreground: "#800000"

users:
  user_you:
    foreground: "#808080"
  user_root:
    foreground: "#800000"
  user_other:
    foreground: "#800080"
  group_yours:
    foreground: "#808080"
  group_other:
    foreground: "#a0a0a0"
  group_root:
    foreground: "#800000"

links:
  normal:
    foreground: "#008080"
  multi_link_file:
    foreground: "#808080"
    background: "#008080"

git:
  new:
    foreground: "#008000"
  modified:
    foreground: "#808000"
  deleted:
    foreground: "#800000"
  renamed:
    foreground: "#c0c0c0"
  typechange:
    foreground: "#800080"
  ignored:
    foreground: "#a0a0a0"
  conflicted:
    foreground: "#ffff00"

git_repo:
  branch_main:
    foreground: "#808080"
  branch_other:
    foreground: "#800080"
  git_clean:
    foreground: "#008000"
  git_dirty:
    foreground: "#800000"

security_context:
  colon:
    foreground: "#a0a0a0"
  user:
    foreground: "#808080"
  role:
    foreground: "#800080"
  typ:
    foreground: "#a0a0a0"
  range:
    foreground: "#800080"

file_type:
  image:
    foreground: "#808000"
  video:
    foreground: "#008000"
  music:
    foreground: "#008000"
  lossless:
    foreground: "#808080"
  crypto:
    foreground: "#a0a0a0"
  document:
    foreground: "#808080"
  compressed:
    foreground: "#800080"
  temp:
    foreground: "#c0c0c0"
  compiled:
    foreground: "#000080"
  build:
    foreground: "#a0a0a0"
    is_underline: false
  source:
    foreground: "#000080"

punctuation:
    foreground: "#a0a0a0"
date:
    foreground: "#a0a0a0"
inode:
    foreground: "#a0a0a0"
blocks:
    foreground: "#a0a0a0"
header:
    foreground: "#808080"
octal:
    foreground: "#c0c0c0"
flags:
    foreground: "#800080"

symlink_path:
    foreground: "#008080"
control_char:
    foreground: "#ffff00"
broken_symlink:
    foreground: "#800000"
broken_path_overlay:
    foreground: "#a0a0a0"
