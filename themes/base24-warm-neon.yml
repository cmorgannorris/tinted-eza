# vim: ft=yaml

# Scheme Name: Warm Neon
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#dcc9ba"
  directory:
    foreground: "#4260c5"
  symlink:
    foreground: "#29bad3"
  pipe:
    foreground: "#e7dad0"
  block_device:
    foreground: "#7a90d5"
  char_device:
    foreground: "#7a90d5"
  socket:
    foreground: "#e7dad0"
  special:
    foreground: "#f81ffb"
  executable:
    foreground: "#38b139"
  mount_point:
    foreground: "#7a90d5"

perms:
  user_read:
    foreground: "#7a90d5"
  user_write:
    foreground: "#e24345"
  user_execute_file:
    foreground: "#38b139"
  user_execute_other:
    foreground: "#38b139"
  group_read:
    foreground: "#7a90d5"
  group_write:
    foreground: "#e24345"
  group_execute:
    foreground: "#38b139"
  other_read:
    foreground: "#7a90d5"
  other_write:
    foreground: "#e24345"
  other_execute:
    foreground: "#38b139"
  special_user_file:
    foreground: "#f81ffb"
  special_other:
    foreground: "#e7dad0"
  attribute:
    foreground: "#e7dad0"

size:
  major:
    foreground: "#38b139"
  minor:
    foreground: "#38b139"
  number_byte:
    foreground: "#e7dad0"
  number_kilo:
    foreground: "#dcc9ba"
  number_mega:
    foreground: "#7a90d5"
  number_giga:
    foreground: "#dae145"
  number_huge:
    foreground: "#e24345"
  unit_byte:
    foreground: "#e7dad0"
  unit_kilo:
    foreground: "#dcc9ba"
  unit_mega:
    foreground: "#7a90d5"
  unit_giga:
    foreground: "#dae145"
  unit_huge:
    foreground: "#e24345"

users:
  user_you:
    foreground: "#dcc9ba"
  user_root:
    foreground: "#e24345"
  user_other:
    foreground: "#f81ffb"
  group_yours:
    foreground: "#dcc9ba"
  group_other:
    foreground: "#e7dad0"
  group_root:
    foreground: "#e24345"

links:
  normal:
    foreground: "#29bad3"
  multi_link_file:
    foreground: "#dcc9ba"
    background: "#29bad3"

git:
  new:
    foreground: "#38b139"
  modified:
    foreground: "#7a90d5"
  deleted:
    foreground: "#e24345"
  renamed:
    foreground: "#f2ebe6"
  typechange:
    foreground: "#f81ffb"
  ignored:
    foreground: "#e7dad0"
  conflicted:
    foreground: "#dae145"

git_repo:
  branch_main:
    foreground: "#dcc9ba"
  branch_other:
    foreground: "#f81ffb"
  git_clean:
    foreground: "#38b139"
  git_dirty:
    foreground: "#e24345"

security_context:
  colon:
    foreground: "#e7dad0"
  user:
    foreground: "#dcc9ba"
  role:
    foreground: "#f81ffb"
  typ:
    foreground: "#e7dad0"
  range:
    foreground: "#f81ffb"

file_type:
  image:
    foreground: "#7a90d5"
  video:
    foreground: "#38b139"
  music:
    foreground: "#38b139"
  lossless:
    foreground: "#38b139"
  crypto:
    foreground: "#e7dad0"
  document:
    foreground: "#dcc9ba"
  compressed:
    foreground: "#e7dad0"
  temp:
    foreground: "#fdfcfc"
  compiled:
    foreground: "#4260c5"
  build:
    foreground: "#e7dad0"
    is_underline: false
  source:
    foreground: "#4260c5"

punctuation:
    foreground: "#e7dad0"
date:
    foreground: "#e7dad0"
inode:
    foreground: "#e7dad0"
blocks:
    foreground: "#e7dad0"
header:
    foreground: "#dcc9ba"
octal:
    foreground: "#f2ebe6"
flags:
    foreground: "#f81ffb"

symlink_path:
    foreground: "#29bad3"
control_char:
    foreground: "#dae145"
broken_symlink:
    foreground: "#e24345"
broken_path_overlay:
    foreground: "#e7dad0"
