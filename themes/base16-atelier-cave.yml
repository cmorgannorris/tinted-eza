# vim: ft=yaml

# Scheme Name: Atelier Cave
# Scheme Author: Bram de Haan (http://atelierbramdehaan.nl)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#8b8792"
  directory:
    foreground: "#576ddb"
  symlink:
    foreground: "#398bc6"
  pipe:
    foreground: "#7e7887"
  block_device:
    foreground: "#a06e3b"
  char_device:
    foreground: "#a06e3b"
  socket:
    foreground: "#7e7887"
  special:
    foreground: "#955ae7"
  executable:
    foreground: "#2a9292"
  mount_point:
    foreground: "#a06e3b"

perms:
  user_read:
    foreground: "#a06e3b"
  user_write:
    foreground: "#be4678"
  user_execute_file:
    foreground: "#2a9292"
  user_execute_other:
    foreground: "#2a9292"
  group_read:
    foreground: "#a06e3b"
  group_write:
    foreground: "#be4678"
  group_execute:
    foreground: "#2a9292"
  other_read:
    foreground: "#a06e3b"
  other_write:
    foreground: "#be4678"
  other_execute:
    foreground: "#2a9292"
  special_user_file:
    foreground: "#955ae7"
  special_other:
    foreground: "#7e7887"
  attribute:
    foreground: "#7e7887"

size:
  major:
    foreground: "#2a9292"
  minor:
    foreground: "#2a9292"
  number_byte:
    foreground: "#7e7887"
  number_kilo:
    foreground: "#8b8792"
  number_mega:
    foreground: "#a06e3b"
  number_giga:
    foreground: "#aa573c"
  number_huge:
    foreground: "#be4678"
  unit_byte:
    foreground: "#7e7887"
  unit_kilo:
    foreground: "#8b8792"
  unit_mega:
    foreground: "#a06e3b"
  unit_giga:
    foreground: "#aa573c"
  unit_huge:
    foreground: "#be4678"

users:
  user_you:
    foreground: "#8b8792"
  user_root:
    foreground: "#be4678"
  user_other:
    foreground: "#955ae7"
  group_yours:
    foreground: "#8b8792"
  group_other:
    foreground: "#7e7887"
  group_root:
    foreground: "#be4678"

links:
  normal:
    foreground: "#398bc6"
  multi_link_file:
    foreground: "#8b8792"
    background: "#398bc6"

git:
  new:
    foreground: "#2a9292"
  modified:
    foreground: "#a06e3b"
  deleted:
    foreground: "#be4678"
  renamed:
    foreground: "#655f6d"
  typechange:
    foreground: "#955ae7"
  ignored:
    foreground: "#7e7887"
  conflicted:
    foreground: "#aa573c"

git_repo:
  branch_main:
    foreground: "#8b8792"
  branch_other:
    foreground: "#955ae7"
  git_clean:
    foreground: "#2a9292"
  git_dirty:
    foreground: "#be4678"

security_context:
  colon:
    foreground: "#7e7887"
  user:
    foreground: "#8b8792"
  role:
    foreground: "#955ae7"
  typ:
    foreground: "#7e7887"
  range:
    foreground: "#955ae7"

file_type:
  image:
    foreground: "#a06e3b"
  video:
    foreground: "#2a9292"
  music:
    foreground: "#2a9292"
  lossless:
    foreground: "#8b8792"
  crypto:
    foreground: "#7e7887"
  document:
    foreground: "#8b8792"
  compressed:
    foreground: "#955ae7"
  temp:
    foreground: "#655f6d"
    is_dimmed: false
  compiled:
    foreground: "#576ddb"
  build:
    foreground: "#7e7887"
    is_underline: false
  source:
    foreground: "#576ddb"

punctuation:
    foreground: "#7e7887"
date:
    foreground: "#7e7887"
inode:
    foreground: "#7e7887"
blocks:
    foreground: "#7e7887"
header:
    foreground: "#8b8792"
octal:
    foreground: "#655f6d"
flags:
    foreground: "#955ae7"

symlink_path:
    foreground: "#398bc6"
control_char:
    foreground: "#aa573c"
broken_symlink:
    foreground: "#be4678"
broken_path_overlay:
    foreground: "#7e7887"
