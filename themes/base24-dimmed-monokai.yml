# vim: ft=yaml

# Scheme Name: Dimmed Monokai
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#acafac"
  directory:
    foreground: "#4e76a1"
  symlink:
    foreground: "#568ea3"
  pipe:
    foreground: "#a0a2a0"
  block_device:
    foreground: "#176ce3"
  char_device:
    foreground: "#176ce3"
  socket:
    foreground: "#a0a2a0"
  special:
    foreground: "#855b8d"
  executable:
    foreground: "#869a3a"
  mount_point:
    foreground: "#176ce3"

perms:
  user_read:
    foreground: "#176ce3"
  user_write:
    foreground: "#be3e48"
  user_execute_file:
    foreground: "#869a3a"
  user_execute_other:
    foreground: "#869a3a"
  group_read:
    foreground: "#176ce3"
  group_write:
    foreground: "#be3e48"
  group_execute:
    foreground: "#869a3a"
  other_read:
    foreground: "#176ce3"
  other_write:
    foreground: "#be3e48"
  other_execute:
    foreground: "#869a3a"
  special_user_file:
    foreground: "#855b8d"
  special_other:
    foreground: "#a0a2a0"
  attribute:
    foreground: "#a0a2a0"

size:
  major:
    foreground: "#869a3a"
  minor:
    foreground: "#869a3a"
  number_byte:
    foreground: "#a0a2a0"
  number_kilo:
    foreground: "#acafac"
  number_mega:
    foreground: "#176ce3"
  number_giga:
    foreground: "#c4a535"
  number_huge:
    foreground: "#be3e48"
  unit_byte:
    foreground: "#a0a2a0"
  unit_kilo:
    foreground: "#acafac"
  unit_mega:
    foreground: "#176ce3"
  unit_giga:
    foreground: "#c4a535"
  unit_huge:
    foreground: "#be3e48"

users:
  user_you:
    foreground: "#acafac"
  user_root:
    foreground: "#be3e48"
  user_other:
    foreground: "#855b8d"
  group_yours:
    foreground: "#acafac"
  group_other:
    foreground: "#a0a2a0"
  group_root:
    foreground: "#be3e48"

links:
  normal:
    foreground: "#568ea3"
  multi_link_file:
    foreground: "#acafac"
    background: "#568ea3"

git:
  new:
    foreground: "#869a3a"
  modified:
    foreground: "#176ce3"
  deleted:
    foreground: "#be3e48"
  renamed:
    foreground: "#949593"
  typechange:
    foreground: "#855b8d"
  ignored:
    foreground: "#a0a2a0"
  conflicted:
    foreground: "#c4a535"

git_repo:
  branch_main:
    foreground: "#acafac"
  branch_other:
    foreground: "#855b8d"
  git_clean:
    foreground: "#869a3a"
  git_dirty:
    foreground: "#be3e48"

security_context:
  colon:
    foreground: "#a0a2a0"
  user:
    foreground: "#acafac"
  role:
    foreground: "#855b8d"
  typ:
    foreground: "#a0a2a0"
  range:
    foreground: "#855b8d"

file_type:
  image:
    foreground: "#176ce3"
  video:
    foreground: "#869a3a"
  music:
    foreground: "#869a3a"
  lossless:
    foreground: "#acafac"
  crypto:
    foreground: "#a0a2a0"
  document:
    foreground: "#acafac"
  compressed:
    foreground: "#855b8d"
  temp:
    foreground: "#949593"
  compiled:
    foreground: "#4e76a1"
  build:
    foreground: "#a0a2a0"
    is_underline: false
  source:
    foreground: "#4e76a1"

punctuation:
    foreground: "#a0a2a0"
date:
    foreground: "#a0a2a0"
inode:
    foreground: "#a0a2a0"
blocks:
    foreground: "#a0a2a0"
header:
    foreground: "#acafac"
octal:
    foreground: "#949593"
flags:
    foreground: "#855b8d"

symlink_path:
    foreground: "#568ea3"
control_char:
    foreground: "#c4a535"
broken_symlink:
    foreground: "#be3e48"
broken_path_overlay:
    foreground: "#a0a2a0"
