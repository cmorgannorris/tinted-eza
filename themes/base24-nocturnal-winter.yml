# vim: ft=yaml

# Scheme Name: Nocturnal Winter
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#dcdcdc"
  directory:
    foreground: "#3081df"
  symlink:
    foreground: "#09c87a"
  pipe:
    foreground: "#bdbdbd"
  block_device:
    foreground: "#6095fe"
  char_device:
    foreground: "#6095fe"
  socket:
    foreground: "#bdbdbd"
  special:
    foreground: "#fe2a6c"
  executable:
    foreground: "#08cd7d"
  mount_point:
    foreground: "#6095fe"

perms:
  user_read:
    foreground: "#6095fe"
  user_write:
    foreground: "#f12d52"
  user_execute_file:
    foreground: "#08cd7d"
  user_execute_other:
    foreground: "#08cd7d"
  group_read:
    foreground: "#6095fe"
  group_write:
    foreground: "#f12d52"
  group_execute:
    foreground: "#08cd7d"
  other_read:
    foreground: "#6095fe"
  other_write:
    foreground: "#f12d52"
  other_execute:
    foreground: "#08cd7d"
  special_user_file:
    foreground: "#fe2a6c"
  special_other:
    foreground: "#bdbdbd"
  attribute:
    foreground: "#bdbdbd"

size:
  major:
    foreground: "#08cd7d"
  minor:
    foreground: "#08cd7d"
  number_byte:
    foreground: "#bdbdbd"
  number_kilo:
    foreground: "#dcdcdc"
  number_mega:
    foreground: "#6095fe"
  number_giga:
    foreground: "#f5f079"
  number_huge:
    foreground: "#f12d52"
  unit_byte:
    foreground: "#bdbdbd"
  unit_kilo:
    foreground: "#dcdcdc"
  unit_mega:
    foreground: "#6095fe"
  unit_giga:
    foreground: "#f5f079"
  unit_huge:
    foreground: "#f12d52"

users:
  user_you:
    foreground: "#dcdcdc"
  user_root:
    foreground: "#f12d52"
  user_other:
    foreground: "#fe2a6c"
  group_yours:
    foreground: "#dcdcdc"
  group_other:
    foreground: "#bdbdbd"
  group_root:
    foreground: "#f12d52"

links:
  normal:
    foreground: "#09c87a"
  multi_link_file:
    foreground: "#dcdcdc"
    background: "#09c87a"

git:
  new:
    foreground: "#08cd7d"
  modified:
    foreground: "#6095fe"
  deleted:
    foreground: "#f12d52"
  renamed:
    foreground: "#9e9e9e"
  typechange:
    foreground: "#fe2a6c"
  ignored:
    foreground: "#bdbdbd"
  conflicted:
    foreground: "#f5f079"

git_repo:
  branch_main:
    foreground: "#dcdcdc"
  branch_other:
    foreground: "#fe2a6c"
  git_clean:
    foreground: "#08cd7d"
  git_dirty:
    foreground: "#f12d52"

security_context:
  colon:
    foreground: "#bdbdbd"
  user:
    foreground: "#dcdcdc"
  role:
    foreground: "#fe2a6c"
  typ:
    foreground: "#bdbdbd"
  range:
    foreground: "#fe2a6c"

file_type:
  image:
    foreground: "#6095fe"
  video:
    foreground: "#08cd7d"
  music:
    foreground: "#08cd7d"
  lossless:
    foreground: "#08cd7d"
  crypto:
    foreground: "#bdbdbd"
  document:
    foreground: "#dcdcdc"
  compressed:
    foreground: "#bdbdbd"
  temp:
    foreground: "#7f7f7f"
  compiled:
    foreground: "#3081df"
  build:
    foreground: "#bdbdbd"
    is_underline: false
  source:
    foreground: "#3081df"

punctuation:
    foreground: "#bdbdbd"
date:
    foreground: "#bdbdbd"
inode:
    foreground: "#bdbdbd"
blocks:
    foreground: "#bdbdbd"
header:
    foreground: "#dcdcdc"
octal:
    foreground: "#9e9e9e"
flags:
    foreground: "#fe2a6c"

symlink_path:
    foreground: "#09c87a"
control_char:
    foreground: "#f5f079"
broken_symlink:
    foreground: "#f12d52"
broken_path_overlay:
    foreground: "#bdbdbd"
