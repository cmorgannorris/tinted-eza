# vim: ft=yaml

# Scheme Name: Jabuti
# Scheme Author: https://github.com/notusknot
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c0cbe3"
  directory:
    foreground: "#3fc6de"
  symlink:
    foreground: "#ff7eb6"
  pipe:
    foreground: "#50526b"
  block_device:
    foreground: "#e1c697"
  char_device:
    foreground: "#e1c697"
  socket:
    foreground: "#50526b"
  special:
    foreground: "#be95ff"
  executable:
    foreground: "#3fdaa4"
  mount_point:
    foreground: "#e1c697"

perms:
  user_read:
    foreground: "#e1c697"
  user_write:
    foreground: "#ec6a88"
  user_execute_file:
    foreground: "#3fdaa4"
  user_execute_other:
    foreground: "#3fdaa4"
  group_read:
    foreground: "#e1c697"
  group_write:
    foreground: "#ec6a88"
  group_execute:
    foreground: "#3fdaa4"
  other_read:
    foreground: "#e1c697"
  other_write:
    foreground: "#ec6a88"
  other_execute:
    foreground: "#3fdaa4"
  special_user_file:
    foreground: "#be95ff"
  special_other:
    foreground: "#50526b"
  attribute:
    foreground: "#50526b"

size:
  major:
    foreground: "#3fdaa4"
  minor:
    foreground: "#3fdaa4"
  number_byte:
    foreground: "#50526b"
  number_kilo:
    foreground: "#c0cbe3"
  number_mega:
    foreground: "#e1c697"
  number_giga:
    foreground: "#efb993"
  number_huge:
    foreground: "#ec6a88"
  unit_byte:
    foreground: "#50526b"
  unit_kilo:
    foreground: "#c0cbe3"
  unit_mega:
    foreground: "#e1c697"
  unit_giga:
    foreground: "#efb993"
  unit_huge:
    foreground: "#ec6a88"

users:
  user_you:
    foreground: "#c0cbe3"
  user_root:
    foreground: "#ec6a88"
  user_other:
    foreground: "#be95ff"
  group_yours:
    foreground: "#c0cbe3"
  group_other:
    foreground: "#50526b"
  group_root:
    foreground: "#ec6a88"

links:
  normal:
    foreground: "#ff7eb6"
  multi_link_file:
    foreground: "#c0cbe3"
    background: "#ff7eb6"

git:
  new:
    foreground: "#3fdaa4"
  modified:
    foreground: "#e1c697"
  deleted:
    foreground: "#ec6a88"
  renamed:
    foreground: "#45475d"
  typechange:
    foreground: "#be95ff"
  ignored:
    foreground: "#50526b"
  conflicted:
    foreground: "#efb993"

git_repo:
  branch_main:
    foreground: "#c0cbe3"
  branch_other:
    foreground: "#be95ff"
  git_clean:
    foreground: "#3fdaa4"
  git_dirty:
    foreground: "#ec6a88"

security_context:
  colon:
    foreground: "#50526b"
  user:
    foreground: "#c0cbe3"
  role:
    foreground: "#be95ff"
  typ:
    foreground: "#50526b"
  range:
    foreground: "#be95ff"

file_type:
  image:
    foreground: "#e1c697"
  video:
    foreground: "#3fdaa4"
  music:
    foreground: "#3fdaa4"
  lossless:
    foreground: "#c0cbe3"
  crypto:
    foreground: "#50526b"
  document:
    foreground: "#c0cbe3"
  compressed:
    foreground: "#be95ff"
  temp:
    foreground: "#45475d"
    is_dimmed: false
  compiled:
    foreground: "#3fc6de"
  build:
    foreground: "#50526b"
    is_underline: false
  source:
    foreground: "#3fc6de"

punctuation:
    foreground: "#50526b"
date:
    foreground: "#50526b"
inode:
    foreground: "#50526b"
blocks:
    foreground: "#50526b"
header:
    foreground: "#c0cbe3"
octal:
    foreground: "#45475d"
flags:
    foreground: "#be95ff"

symlink_path:
    foreground: "#ff7eb6"
control_char:
    foreground: "#efb993"
broken_symlink:
    foreground: "#ec6a88"
broken_path_overlay:
    foreground: "#50526b"
