# vim: ft=yaml

# Scheme Name: IR Black
# Scheme Author: Timothée Poisot (http://timotheepoisot.fr)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#b5b3aa"
  directory:
    foreground: "#96cbfe"
  symlink:
    foreground: "#c6c5fe"
  pipe:
    foreground: "#918f88"
  block_device:
    foreground: "#ffffb6"
  char_device:
    foreground: "#ffffb6"
  socket:
    foreground: "#918f88"
  special:
    foreground: "#ff73fd"
  executable:
    foreground: "#a8ff60"
  mount_point:
    foreground: "#ffffb6"

perms:
  user_read:
    foreground: "#ffffb6"
  user_write:
    foreground: "#ff6c60"
  user_execute_file:
    foreground: "#a8ff60"
  user_execute_other:
    foreground: "#a8ff60"
  group_read:
    foreground: "#ffffb6"
  group_write:
    foreground: "#ff6c60"
  group_execute:
    foreground: "#a8ff60"
  other_read:
    foreground: "#ffffb6"
  other_write:
    foreground: "#ff6c60"
  other_execute:
    foreground: "#a8ff60"
  special_user_file:
    foreground: "#ff73fd"
  special_other:
    foreground: "#918f88"
  attribute:
    foreground: "#918f88"

size:
  major:
    foreground: "#a8ff60"
  minor:
    foreground: "#a8ff60"
  number_byte:
    foreground: "#918f88"
  number_kilo:
    foreground: "#b5b3aa"
  number_mega:
    foreground: "#ffffb6"
  number_giga:
    foreground: "#e9c062"
  number_huge:
    foreground: "#ff6c60"
  unit_byte:
    foreground: "#918f88"
  unit_kilo:
    foreground: "#b5b3aa"
  unit_mega:
    foreground: "#ffffb6"
  unit_giga:
    foreground: "#e9c062"
  unit_huge:
    foreground: "#ff6c60"

users:
  user_you:
    foreground: "#b5b3aa"
  user_root:
    foreground: "#ff6c60"
  user_other:
    foreground: "#ff73fd"
  group_yours:
    foreground: "#b5b3aa"
  group_other:
    foreground: "#918f88"
  group_root:
    foreground: "#ff6c60"

links:
  normal:
    foreground: "#c6c5fe"
  multi_link_file:
    foreground: "#b5b3aa"
    background: "#c6c5fe"

git:
  new:
    foreground: "#a8ff60"
  modified:
    foreground: "#ffffb6"
  deleted:
    foreground: "#ff6c60"
  renamed:
    foreground: "#6c6c66"
  typechange:
    foreground: "#ff73fd"
  ignored:
    foreground: "#918f88"
  conflicted:
    foreground: "#e9c062"

git_repo:
  branch_main:
    foreground: "#b5b3aa"
  branch_other:
    foreground: "#ff73fd"
  git_clean:
    foreground: "#a8ff60"
  git_dirty:
    foreground: "#ff6c60"

security_context:
  colon:
    foreground: "#918f88"
  user:
    foreground: "#b5b3aa"
  role:
    foreground: "#ff73fd"
  typ:
    foreground: "#918f88"
  range:
    foreground: "#ff73fd"

file_type:
  image:
    foreground: "#ffffb6"
  video:
    foreground: "#a8ff60"
  music:
    foreground: "#a8ff60"
  lossless:
    foreground: "#b5b3aa"
  crypto:
    foreground: "#918f88"
  document:
    foreground: "#b5b3aa"
  compressed:
    foreground: "#ff73fd"
  temp:
    foreground: "#6c6c66"
    is_dimmed: false
  compiled:
    foreground: "#96cbfe"
  build:
    foreground: "#918f88"
    is_underline: false
  source:
    foreground: "#96cbfe"

punctuation:
    foreground: "#918f88"
date:
    foreground: "#918f88"
inode:
    foreground: "#918f88"
blocks:
    foreground: "#918f88"
header:
    foreground: "#b5b3aa"
octal:
    foreground: "#6c6c66"
flags:
    foreground: "#ff73fd"

symlink_path:
    foreground: "#c6c5fe"
control_char:
    foreground: "#e9c062"
broken_symlink:
    foreground: "#ff6c60"
broken_path_overlay:
    foreground: "#918f88"
