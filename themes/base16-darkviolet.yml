# vim: ft=yaml

# Scheme Name: Dark Violet
# Scheme Author: ruler501 (https://github.com/ruler501/base16-darkviolet)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#b08ae6"
  directory:
    foreground: "#4136d9"
  symlink:
    foreground: "#40dfff"
  pipe:
    foreground: "#00ff00"
  block_device:
    foreground: "#f29df2"
  char_device:
    foreground: "#f29df2"
  socket:
    foreground: "#00ff00"
  special:
    foreground: "#7e5ce6"
  executable:
    foreground: "#4595e6"
  mount_point:
    foreground: "#f29df2"

perms:
  user_read:
    foreground: "#f29df2"
  user_write:
    foreground: "#a82ee6"
  user_execute_file:
    foreground: "#4595e6"
  user_execute_other:
    foreground: "#4595e6"
  group_read:
    foreground: "#f29df2"
  group_write:
    foreground: "#a82ee6"
  group_execute:
    foreground: "#4595e6"
  other_read:
    foreground: "#f29df2"
  other_write:
    foreground: "#a82ee6"
  other_execute:
    foreground: "#4595e6"
  special_user_file:
    foreground: "#7e5ce6"
  special_other:
    foreground: "#00ff00"
  attribute:
    foreground: "#00ff00"

size:
  major:
    foreground: "#4595e6"
  minor:
    foreground: "#4595e6"
  number_byte:
    foreground: "#00ff00"
  number_kilo:
    foreground: "#b08ae6"
  number_mega:
    foreground: "#f29df2"
  number_giga:
    foreground: "#bb66cc"
  number_huge:
    foreground: "#a82ee6"
  unit_byte:
    foreground: "#00ff00"
  unit_kilo:
    foreground: "#b08ae6"
  unit_mega:
    foreground: "#f29df2"
  unit_giga:
    foreground: "#bb66cc"
  unit_huge:
    foreground: "#a82ee6"

users:
  user_you:
    foreground: "#b08ae6"
  user_root:
    foreground: "#a82ee6"
  user_other:
    foreground: "#7e5ce6"
  group_yours:
    foreground: "#b08ae6"
  group_other:
    foreground: "#00ff00"
  group_root:
    foreground: "#a82ee6"

links:
  normal:
    foreground: "#40dfff"
  multi_link_file:
    foreground: "#b08ae6"
    background: "#40dfff"

git:
  new:
    foreground: "#4595e6"
  modified:
    foreground: "#f29df2"
  deleted:
    foreground: "#a82ee6"
  renamed:
    foreground: "#593380"
  typechange:
    foreground: "#7e5ce6"
  ignored:
    foreground: "#00ff00"
  conflicted:
    foreground: "#bb66cc"

git_repo:
  branch_main:
    foreground: "#b08ae6"
  branch_other:
    foreground: "#7e5ce6"
  git_clean:
    foreground: "#4595e6"
  git_dirty:
    foreground: "#a82ee6"

security_context:
  colon:
    foreground: "#00ff00"
  user:
    foreground: "#b08ae6"
  role:
    foreground: "#7e5ce6"
  typ:
    foreground: "#00ff00"
  range:
    foreground: "#7e5ce6"

file_type:
  image:
    foreground: "#f29df2"
  video:
    foreground: "#4595e6"
  music:
    foreground: "#4595e6"
  lossless:
    foreground: "#b08ae6"
  crypto:
    foreground: "#00ff00"
  document:
    foreground: "#b08ae6"
  compressed:
    foreground: "#7e5ce6"
  temp:
    foreground: "#593380"
    is_dimmed: false
  compiled:
    foreground: "#4136d9"
  build:
    foreground: "#00ff00"
    is_underline: false
  source:
    foreground: "#4136d9"

punctuation:
    foreground: "#00ff00"
date:
    foreground: "#00ff00"
inode:
    foreground: "#00ff00"
blocks:
    foreground: "#00ff00"
header:
    foreground: "#b08ae6"
octal:
    foreground: "#593380"
flags:
    foreground: "#7e5ce6"

symlink_path:
    foreground: "#40dfff"
control_char:
    foreground: "#bb66cc"
broken_symlink:
    foreground: "#a82ee6"
broken_path_overlay:
    foreground: "#00ff00"
