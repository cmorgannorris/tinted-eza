# vim: ft=yaml

# Scheme Name: Spacedust
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#cdc7a6"
  directory:
    foreground: "#0e548b"
  symlink:
    foreground: "#06afc7"
  pipe:
    foreground: "#ab9e7f"
  block_device:
    foreground: "#67a0cd"
  char_device:
    foreground: "#67a0cd"
  socket:
    foreground: "#ab9e7f"
  special:
    foreground: "#e35a00"
  executable:
    foreground: "#5cab96"
  mount_point:
    foreground: "#67a0cd"

perms:
  user_read:
    foreground: "#67a0cd"
  user_write:
    foreground: "#e35a00"
  user_execute_file:
    foreground: "#5cab96"
  user_execute_other:
    foreground: "#5cab96"
  group_read:
    foreground: "#67a0cd"
  group_write:
    foreground: "#e35a00"
  group_execute:
    foreground: "#5cab96"
  other_read:
    foreground: "#67a0cd"
  other_write:
    foreground: "#e35a00"
  other_execute:
    foreground: "#5cab96"
  special_user_file:
    foreground: "#e35a00"
  special_other:
    foreground: "#ab9e7f"
  attribute:
    foreground: "#ab9e7f"

size:
  major:
    foreground: "#5cab96"
  minor:
    foreground: "#5cab96"
  number_byte:
    foreground: "#ab9e7f"
  number_kilo:
    foreground: "#cdc7a6"
  number_mega:
    foreground: "#67a0cd"
  number_giga:
    foreground: "#e3cd7b"
  number_huge:
    foreground: "#e35a00"
  unit_byte:
    foreground: "#ab9e7f"
  unit_kilo:
    foreground: "#cdc7a6"
  unit_mega:
    foreground: "#67a0cd"
  unit_giga:
    foreground: "#e3cd7b"
  unit_huge:
    foreground: "#e35a00"

users:
  user_you:
    foreground: "#cdc7a6"
  user_root:
    foreground: "#e35a00"
  user_other:
    foreground: "#e35a00"
  group_yours:
    foreground: "#cdc7a6"
  group_other:
    foreground: "#ab9e7f"
  group_root:
    foreground: "#e35a00"

links:
  normal:
    foreground: "#06afc7"
  multi_link_file:
    foreground: "#cdc7a6"
    background: "#06afc7"

git:
  new:
    foreground: "#5cab96"
  modified:
    foreground: "#67a0cd"
  deleted:
    foreground: "#e35a00"
  renamed:
    foreground: "#897558"
  typechange:
    foreground: "#e35a00"
  ignored:
    foreground: "#ab9e7f"
  conflicted:
    foreground: "#e3cd7b"

git_repo:
  branch_main:
    foreground: "#cdc7a6"
  branch_other:
    foreground: "#e35a00"
  git_clean:
    foreground: "#5cab96"
  git_dirty:
    foreground: "#e35a00"

security_context:
  colon:
    foreground: "#ab9e7f"
  user:
    foreground: "#cdc7a6"
  role:
    foreground: "#e35a00"
  typ:
    foreground: "#ab9e7f"
  range:
    foreground: "#e35a00"

file_type:
  image:
    foreground: "#67a0cd"
  video:
    foreground: "#5cab96"
  music:
    foreground: "#5cab96"
  lossless:
    foreground: "#cdc7a6"
  crypto:
    foreground: "#ab9e7f"
  document:
    foreground: "#cdc7a6"
  compressed:
    foreground: "#e35a00"
  temp:
    foreground: "#897558"
    is_dimmed: false
  compiled:
    foreground: "#0e548b"
  build:
    foreground: "#ab9e7f"
    is_underline: false
  source:
    foreground: "#0e548b"

punctuation:
    foreground: "#ab9e7f"
date:
    foreground: "#ab9e7f"
inode:
    foreground: "#ab9e7f"
blocks:
    foreground: "#ab9e7f"
header:
    foreground: "#cdc7a6"
octal:
    foreground: "#897558"
flags:
    foreground: "#e35a00"

symlink_path:
    foreground: "#06afc7"
control_char:
    foreground: "#e3cd7b"
broken_symlink:
    foreground: "#e35a00"
broken_path_overlay:
    foreground: "#ab9e7f"
