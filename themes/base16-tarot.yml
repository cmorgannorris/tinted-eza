# vim: ft=yaml

# Scheme Name: tarot
# Scheme Author: ed (https://codeberg.org/ed)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#aa556f"
  directory:
    foreground: "#6e6080"
  symlink:
    foreground: "#8c9785"
  pipe:
    foreground: "#8c406f"
  block_device:
    foreground: "#ff6565"
  char_device:
    foreground: "#ff6565"
  socket:
    foreground: "#8c406f"
  special:
    foreground: "#a45782"
  executable:
    foreground: "#a68e5a"
  mount_point:
    foreground: "#ff6565"

perms:
  user_read:
    foreground: "#ff6565"
  user_write:
    foreground: "#c53253"
  user_execute_file:
    foreground: "#a68e5a"
  user_execute_other:
    foreground: "#a68e5a"
  group_read:
    foreground: "#ff6565"
  group_write:
    foreground: "#c53253"
  group_execute:
    foreground: "#a68e5a"
  other_read:
    foreground: "#ff6565"
  other_write:
    foreground: "#c53253"
  other_execute:
    foreground: "#a68e5a"
  special_user_file:
    foreground: "#a45782"
  special_other:
    foreground: "#8c406f"
  attribute:
    foreground: "#8c406f"

size:
  major:
    foreground: "#a68e5a"
  minor:
    foreground: "#a68e5a"
  number_byte:
    foreground: "#8c406f"
  number_kilo:
    foreground: "#aa556f"
  number_mega:
    foreground: "#ff6565"
  number_giga:
    foreground: "#ea4d60"
  number_huge:
    foreground: "#c53253"
  unit_byte:
    foreground: "#8c406f"
  unit_kilo:
    foreground: "#aa556f"
  unit_mega:
    foreground: "#ff6565"
  unit_giga:
    foreground: "#ea4d60"
  unit_huge:
    foreground: "#c53253"

users:
  user_you:
    foreground: "#aa556f"
  user_root:
    foreground: "#c53253"
  user_other:
    foreground: "#a45782"
  group_yours:
    foreground: "#aa556f"
  group_other:
    foreground: "#8c406f"
  group_root:
    foreground: "#c53253"

links:
  normal:
    foreground: "#8c9785"
  multi_link_file:
    foreground: "#aa556f"
    background: "#8c9785"

git:
  new:
    foreground: "#a68e5a"
  modified:
    foreground: "#ff6565"
  deleted:
    foreground: "#c53253"
  renamed:
    foreground: "#74316b"
  typechange:
    foreground: "#a45782"
  ignored:
    foreground: "#8c406f"
  conflicted:
    foreground: "#ea4d60"

git_repo:
  branch_main:
    foreground: "#aa556f"
  branch_other:
    foreground: "#a45782"
  git_clean:
    foreground: "#a68e5a"
  git_dirty:
    foreground: "#c53253"

security_context:
  colon:
    foreground: "#8c406f"
  user:
    foreground: "#aa556f"
  role:
    foreground: "#a45782"
  typ:
    foreground: "#8c406f"
  range:
    foreground: "#a45782"

file_type:
  image:
    foreground: "#ff6565"
  video:
    foreground: "#a68e5a"
  music:
    foreground: "#a68e5a"
  lossless:
    foreground: "#aa556f"
  crypto:
    foreground: "#8c406f"
  document:
    foreground: "#aa556f"
  compressed:
    foreground: "#a45782"
  temp:
    foreground: "#74316b"
    is_dimmed: false
  compiled:
    foreground: "#6e6080"
  build:
    foreground: "#8c406f"
    is_underline: false
  source:
    foreground: "#6e6080"

punctuation:
    foreground: "#8c406f"
date:
    foreground: "#8c406f"
inode:
    foreground: "#8c406f"
blocks:
    foreground: "#8c406f"
header:
    foreground: "#aa556f"
octal:
    foreground: "#74316b"
flags:
    foreground: "#a45782"

symlink_path:
    foreground: "#8c9785"
control_char:
    foreground: "#ea4d60"
broken_symlink:
    foreground: "#c53253"
broken_path_overlay:
    foreground: "#8c406f"
