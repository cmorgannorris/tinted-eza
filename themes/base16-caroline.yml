# vim: ft=yaml

# Scheme Name: caroline
# Scheme Author: ed (https://codeberg.org/ed)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a87569"
  directory:
    foreground: "#684c59"
  symlink:
    foreground: "#6b6566"
  pipe:
    foreground: "#8b5d57"
  block_device:
    foreground: "#f28171"
  char_device:
    foreground: "#f28171"
  socket:
    foreground: "#8b5d57"
  special:
    foreground: "#a63650"
  executable:
    foreground: "#806c61"
  mount_point:
    foreground: "#f28171"

perms:
  user_read:
    foreground: "#f28171"
  user_write:
    foreground: "#c24f57"
  user_execute_file:
    foreground: "#806c61"
  user_execute_other:
    foreground: "#806c61"
  group_read:
    foreground: "#f28171"
  group_write:
    foreground: "#c24f57"
  group_execute:
    foreground: "#806c61"
  other_read:
    foreground: "#f28171"
  other_write:
    foreground: "#c24f57"
  other_execute:
    foreground: "#806c61"
  special_user_file:
    foreground: "#a63650"
  special_other:
    foreground: "#8b5d57"
  attribute:
    foreground: "#8b5d57"

size:
  major:
    foreground: "#806c61"
  minor:
    foreground: "#806c61"
  number_byte:
    foreground: "#8b5d57"
  number_kilo:
    foreground: "#a87569"
  number_mega:
    foreground: "#f28171"
  number_giga:
    foreground: "#a63650"
  number_huge:
    foreground: "#c24f57"
  unit_byte:
    foreground: "#8b5d57"
  unit_kilo:
    foreground: "#a87569"
  unit_mega:
    foreground: "#f28171"
  unit_giga:
    foreground: "#a63650"
  unit_huge:
    foreground: "#c24f57"

users:
  user_you:
    foreground: "#a87569"
  user_root:
    foreground: "#c24f57"
  user_other:
    foreground: "#a63650"
  group_yours:
    foreground: "#a87569"
  group_other:
    foreground: "#8b5d57"
  group_root:
    foreground: "#c24f57"

links:
  normal:
    foreground: "#6b6566"
  multi_link_file:
    foreground: "#a87569"
    background: "#6b6566"

git:
  new:
    foreground: "#806c61"
  modified:
    foreground: "#f28171"
  deleted:
    foreground: "#c24f57"
  renamed:
    foreground: "#6d4745"
  typechange:
    foreground: "#a63650"
  ignored:
    foreground: "#8b5d57"
  conflicted:
    foreground: "#a63650"

git_repo:
  branch_main:
    foreground: "#a87569"
  branch_other:
    foreground: "#a63650"
  git_clean:
    foreground: "#806c61"
  git_dirty:
    foreground: "#c24f57"

security_context:
  colon:
    foreground: "#8b5d57"
  user:
    foreground: "#a87569"
  role:
    foreground: "#a63650"
  typ:
    foreground: "#8b5d57"
  range:
    foreground: "#a63650"

file_type:
  image:
    foreground: "#f28171"
  video:
    foreground: "#806c61"
  music:
    foreground: "#806c61"
  lossless:
    foreground: "#a87569"
  crypto:
    foreground: "#8b5d57"
  document:
    foreground: "#a87569"
  compressed:
    foreground: "#a63650"
  temp:
    foreground: "#6d4745"
    is_dimmed: false
  compiled:
    foreground: "#684c59"
  build:
    foreground: "#8b5d57"
    is_underline: false
  source:
    foreground: "#684c59"

punctuation:
    foreground: "#8b5d57"
date:
    foreground: "#8b5d57"
inode:
    foreground: "#8b5d57"
blocks:
    foreground: "#8b5d57"
header:
    foreground: "#a87569"
octal:
    foreground: "#6d4745"
flags:
    foreground: "#a63650"

symlink_path:
    foreground: "#6b6566"
control_char:
    foreground: "#a63650"
broken_symlink:
    foreground: "#c24f57"
broken_path_overlay:
    foreground: "#8b5d57"
