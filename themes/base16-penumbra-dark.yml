# vim: ft=yaml

# Scheme Name: Penumbra Dark
# Scheme Author: Zachary Weiss (https://github.com/zacharyweiss)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#bebebe"
  directory:
    foreground: "#5794d0"
  symlink:
    foreground: "#00a2af"
  pipe:
    foreground: "#8f8f8f"
  block_device:
    foreground: "#8d9741"
  char_device:
    foreground: "#8d9741"
  socket:
    foreground: "#8f8f8f"
  special:
    foreground: "#9481cc"
  executable:
    foreground: "#47a477"
  mount_point:
    foreground: "#8d9741"

perms:
  user_read:
    foreground: "#8d9741"
  user_write:
    foreground: "#ca736c"
  user_execute_file:
    foreground: "#47a477"
  user_execute_other:
    foreground: "#47a477"
  group_read:
    foreground: "#8d9741"
  group_write:
    foreground: "#ca736c"
  group_execute:
    foreground: "#47a477"
  other_read:
    foreground: "#8d9741"
  other_write:
    foreground: "#ca736c"
  other_execute:
    foreground: "#47a477"
  special_user_file:
    foreground: "#9481cc"
  special_other:
    foreground: "#8f8f8f"
  attribute:
    foreground: "#8f8f8f"

size:
  major:
    foreground: "#47a477"
  minor:
    foreground: "#47a477"
  number_byte:
    foreground: "#8f8f8f"
  number_kilo:
    foreground: "#bebebe"
  number_mega:
    foreground: "#8d9741"
  number_giga:
    foreground: "#ba823a"
  number_huge:
    foreground: "#ca736c"
  unit_byte:
    foreground: "#8f8f8f"
  unit_kilo:
    foreground: "#bebebe"
  unit_mega:
    foreground: "#8d9741"
  unit_giga:
    foreground: "#ba823a"
  unit_huge:
    foreground: "#ca736c"

users:
  user_you:
    foreground: "#bebebe"
  user_root:
    foreground: "#ca736c"
  user_other:
    foreground: "#9481cc"
  group_yours:
    foreground: "#bebebe"
  group_other:
    foreground: "#8f8f8f"
  group_root:
    foreground: "#ca736c"

links:
  normal:
    foreground: "#00a2af"
  multi_link_file:
    foreground: "#bebebe"
    background: "#00a2af"

git:
  new:
    foreground: "#47a477"
  modified:
    foreground: "#8d9741"
  deleted:
    foreground: "#ca736c"
  renamed:
    foreground: "#636363"
  typechange:
    foreground: "#9481cc"
  ignored:
    foreground: "#8f8f8f"
  conflicted:
    foreground: "#ba823a"

git_repo:
  branch_main:
    foreground: "#bebebe"
  branch_other:
    foreground: "#9481cc"
  git_clean:
    foreground: "#47a477"
  git_dirty:
    foreground: "#ca736c"

security_context:
  colon:
    foreground: "#8f8f8f"
  user:
    foreground: "#bebebe"
  role:
    foreground: "#9481cc"
  typ:
    foreground: "#8f8f8f"
  range:
    foreground: "#9481cc"

file_type:
  image:
    foreground: "#8d9741"
  video:
    foreground: "#47a477"
  music:
    foreground: "#47a477"
  lossless:
    foreground: "#bebebe"
  crypto:
    foreground: "#8f8f8f"
  document:
    foreground: "#bebebe"
  compressed:
    foreground: "#9481cc"
  temp:
    foreground: "#636363"
    is_dimmed: false
  compiled:
    foreground: "#5794d0"
  build:
    foreground: "#8f8f8f"
    is_underline: false
  source:
    foreground: "#5794d0"

punctuation:
    foreground: "#8f8f8f"
date:
    foreground: "#8f8f8f"
inode:
    foreground: "#8f8f8f"
blocks:
    foreground: "#8f8f8f"
header:
    foreground: "#bebebe"
octal:
    foreground: "#636363"
flags:
    foreground: "#9481cc"

symlink_path:
    foreground: "#00a2af"
control_char:
    foreground: "#ba823a"
broken_symlink:
    foreground: "#ca736c"
broken_path_overlay:
    foreground: "#8f8f8f"
