# vim: ft=yaml

# Scheme Name: Apathy
# Scheme Author: Jannik Siebert (https://github.com/janniks)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#81b5ac"
  directory:
    foreground: "#96883e"
  symlink:
    foreground: "#963e4c"
  pipe:
    foreground: "#5f9c92"
  block_device:
    foreground: "#3e4c96"
  char_device:
    foreground: "#3e4c96"
  socket:
    foreground: "#5f9c92"
  special:
    foreground: "#4c963e"
  executable:
    foreground: "#883e96"
  mount_point:
    foreground: "#3e4c96"

perms:
  user_read:
    foreground: "#3e4c96"
  user_write:
    foreground: "#3e9688"
  user_execute_file:
    foreground: "#883e96"
  user_execute_other:
    foreground: "#883e96"
  group_read:
    foreground: "#3e4c96"
  group_write:
    foreground: "#3e9688"
  group_execute:
    foreground: "#883e96"
  other_read:
    foreground: "#3e4c96"
  other_write:
    foreground: "#3e9688"
  other_execute:
    foreground: "#883e96"
  special_user_file:
    foreground: "#4c963e"
  special_other:
    foreground: "#5f9c92"
  attribute:
    foreground: "#5f9c92"

size:
  major:
    foreground: "#883e96"
  minor:
    foreground: "#883e96"
  number_byte:
    foreground: "#5f9c92"
  number_kilo:
    foreground: "#81b5ac"
  number_mega:
    foreground: "#3e4c96"
  number_giga:
    foreground: "#3e7996"
  number_huge:
    foreground: "#3e9688"
  unit_byte:
    foreground: "#5f9c92"
  unit_kilo:
    foreground: "#81b5ac"
  unit_mega:
    foreground: "#3e4c96"
  unit_giga:
    foreground: "#3e7996"
  unit_huge:
    foreground: "#3e9688"

users:
  user_you:
    foreground: "#81b5ac"
  user_root:
    foreground: "#3e9688"
  user_other:
    foreground: "#4c963e"
  group_yours:
    foreground: "#81b5ac"
  group_other:
    foreground: "#5f9c92"
  group_root:
    foreground: "#3e9688"

links:
  normal:
    foreground: "#963e4c"
  multi_link_file:
    foreground: "#81b5ac"
    background: "#963e4c"

git:
  new:
    foreground: "#883e96"
  modified:
    foreground: "#3e4c96"
  deleted:
    foreground: "#3e9688"
  renamed:
    foreground: "#2b685e"
  typechange:
    foreground: "#4c963e"
  ignored:
    foreground: "#5f9c92"
  conflicted:
    foreground: "#3e7996"

git_repo:
  branch_main:
    foreground: "#81b5ac"
  branch_other:
    foreground: "#4c963e"
  git_clean:
    foreground: "#883e96"
  git_dirty:
    foreground: "#3e9688"

security_context:
  colon:
    foreground: "#5f9c92"
  user:
    foreground: "#81b5ac"
  role:
    foreground: "#4c963e"
  typ:
    foreground: "#5f9c92"
  range:
    foreground: "#4c963e"

file_type:
  image:
    foreground: "#3e4c96"
  video:
    foreground: "#883e96"
  music:
    foreground: "#883e96"
  lossless:
    foreground: "#81b5ac"
  crypto:
    foreground: "#5f9c92"
  document:
    foreground: "#81b5ac"
  compressed:
    foreground: "#4c963e"
  temp:
    foreground: "#2b685e"
  compiled:
    foreground: "#96883e"
  build:
    foreground: "#5f9c92"
    is_underline: false
  source:
    foreground: "#96883e"

punctuation:
    foreground: "#5f9c92"
date:
    foreground: "#5f9c92"
inode:
    foreground: "#5f9c92"
blocks:
    foreground: "#5f9c92"
header:
    foreground: "#81b5ac"
octal:
    foreground: "#2b685e"
flags:
    foreground: "#4c963e"

symlink_path:
    foreground: "#963e4c"
control_char:
    foreground: "#3e7996"
broken_symlink:
    foreground: "#3e9688"
broken_path_overlay:
    foreground: "#5f9c92"
