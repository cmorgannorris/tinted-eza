# vim: ft=yaml

# Scheme Name: SAGA
# Scheme Author: https://github.com/SAGAtheme/SAGA
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#dce2f7"
  directory:
    foreground: "#c9fff7"
  symlink:
    foreground: "#c5edc1"
  pipe:
    foreground: "#192630"
  block_device:
    foreground: "#fbebc8"
  char_device:
    foreground: "#fbebc8"
  socket:
    foreground: "#192630"
  special:
    foreground: "#dcc3f9"
  executable:
    foreground: "#f7ddff"
  mount_point:
    foreground: "#fbebc8"

perms:
  user_read:
    foreground: "#fbebc8"
  user_write:
    foreground: "#ffd4e9"
  user_execute_file:
    foreground: "#f7ddff"
  user_execute_other:
    foreground: "#f7ddff"
  group_read:
    foreground: "#fbebc8"
  group_write:
    foreground: "#ffd4e9"
  group_execute:
    foreground: "#f7ddff"
  other_read:
    foreground: "#fbebc8"
  other_write:
    foreground: "#ffd4e9"
  other_execute:
    foreground: "#f7ddff"
  special_user_file:
    foreground: "#dcc3f9"
  special_other:
    foreground: "#192630"
  attribute:
    foreground: "#192630"

size:
  major:
    foreground: "#f7ddff"
  minor:
    foreground: "#f7ddff"
  number_byte:
    foreground: "#192630"
  number_kilo:
    foreground: "#dce2f7"
  number_mega:
    foreground: "#fbebc8"
  number_giga:
    foreground: "#fbcbae"
  number_huge:
    foreground: "#ffd4e9"
  unit_byte:
    foreground: "#192630"
  unit_kilo:
    foreground: "#dce2f7"
  unit_mega:
    foreground: "#fbebc8"
  unit_giga:
    foreground: "#fbcbae"
  unit_huge:
    foreground: "#ffd4e9"

users:
  user_you:
    foreground: "#dce2f7"
  user_root:
    foreground: "#ffd4e9"
  user_other:
    foreground: "#dcc3f9"
  group_yours:
    foreground: "#dce2f7"
  group_other:
    foreground: "#192630"
  group_root:
    foreground: "#ffd4e9"

links:
  normal:
    foreground: "#c5edc1"
  multi_link_file:
    foreground: "#dce2f7"
    background: "#c5edc1"

git:
  new:
    foreground: "#f7ddff"
  modified:
    foreground: "#fbebc8"
  deleted:
    foreground: "#ffd4e9"
  renamed:
    foreground: "#141f27"
  typechange:
    foreground: "#dcc3f9"
  ignored:
    foreground: "#192630"
  conflicted:
    foreground: "#fbcbae"

git_repo:
  branch_main:
    foreground: "#dce2f7"
  branch_other:
    foreground: "#dcc3f9"
  git_clean:
    foreground: "#f7ddff"
  git_dirty:
    foreground: "#ffd4e9"

security_context:
  colon:
    foreground: "#192630"
  user:
    foreground: "#dce2f7"
  role:
    foreground: "#dcc3f9"
  typ:
    foreground: "#192630"
  range:
    foreground: "#dcc3f9"

file_type:
  image:
    foreground: "#fbebc8"
  video:
    foreground: "#f7ddff"
  music:
    foreground: "#f7ddff"
  lossless:
    foreground: "#dce2f7"
  crypto:
    foreground: "#192630"
  document:
    foreground: "#dce2f7"
  compressed:
    foreground: "#dcc3f9"
  temp:
    foreground: "#141f27"
  compiled:
    foreground: "#c9fff7"
  build:
    foreground: "#192630"
    is_underline: false
  source:
    foreground: "#c9fff7"

punctuation:
    foreground: "#192630"
date:
    foreground: "#192630"
inode:
    foreground: "#192630"
blocks:
    foreground: "#192630"
header:
    foreground: "#dce2f7"
octal:
    foreground: "#141f27"
flags:
    foreground: "#dcc3f9"

symlink_path:
    foreground: "#c5edc1"
control_char:
    foreground: "#fbcbae"
broken_symlink:
    foreground: "#ffd4e9"
broken_path_overlay:
    foreground: "#192630"
