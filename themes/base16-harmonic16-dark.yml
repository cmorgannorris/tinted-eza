# vim: ft=yaml

# Scheme Name: Harmonic16 Dark
# Scheme Author: Jannik Siebert (https://github.com/janniks)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cbd6e2"
  directory:
    foreground: "#8b56bf"
  symlink:
    foreground: "#568bbf"
  pipe:
    foreground: "#aabcce"
  block_device:
    foreground: "#8bbf56"
  char_device:
    foreground: "#8bbf56"
  socket:
    foreground: "#aabcce"
  special:
    foreground: "#bf568b"
  executable:
    foreground: "#56bf8b"
  mount_point:
    foreground: "#8bbf56"

perms:
  user_read:
    foreground: "#8bbf56"
  user_write:
    foreground: "#bf8b56"
  user_execute_file:
    foreground: "#56bf8b"
  user_execute_other:
    foreground: "#56bf8b"
  group_read:
    foreground: "#8bbf56"
  group_write:
    foreground: "#bf8b56"
  group_execute:
    foreground: "#56bf8b"
  other_read:
    foreground: "#8bbf56"
  other_write:
    foreground: "#bf8b56"
  other_execute:
    foreground: "#56bf8b"
  special_user_file:
    foreground: "#bf568b"
  special_other:
    foreground: "#aabcce"
  attribute:
    foreground: "#aabcce"

size:
  major:
    foreground: "#56bf8b"
  minor:
    foreground: "#56bf8b"
  number_byte:
    foreground: "#aabcce"
  number_kilo:
    foreground: "#cbd6e2"
  number_mega:
    foreground: "#8bbf56"
  number_giga:
    foreground: "#bfbf56"
  number_huge:
    foreground: "#bf8b56"
  unit_byte:
    foreground: "#aabcce"
  unit_kilo:
    foreground: "#cbd6e2"
  unit_mega:
    foreground: "#8bbf56"
  unit_giga:
    foreground: "#bfbf56"
  unit_huge:
    foreground: "#bf8b56"

users:
  user_you:
    foreground: "#cbd6e2"
  user_root:
    foreground: "#bf8b56"
  user_other:
    foreground: "#bf568b"
  group_yours:
    foreground: "#cbd6e2"
  group_other:
    foreground: "#aabcce"
  group_root:
    foreground: "#bf8b56"

links:
  normal:
    foreground: "#568bbf"
  multi_link_file:
    foreground: "#cbd6e2"
    background: "#568bbf"

git:
  new:
    foreground: "#56bf8b"
  modified:
    foreground: "#8bbf56"
  deleted:
    foreground: "#bf8b56"
  renamed:
    foreground: "#627e99"
  typechange:
    foreground: "#bf568b"
  ignored:
    foreground: "#aabcce"
  conflicted:
    foreground: "#bfbf56"

git_repo:
  branch_main:
    foreground: "#cbd6e2"
  branch_other:
    foreground: "#bf568b"
  git_clean:
    foreground: "#56bf8b"
  git_dirty:
    foreground: "#bf8b56"

security_context:
  colon:
    foreground: "#aabcce"
  user:
    foreground: "#cbd6e2"
  role:
    foreground: "#bf568b"
  typ:
    foreground: "#aabcce"
  range:
    foreground: "#bf568b"

file_type:
  image:
    foreground: "#8bbf56"
  video:
    foreground: "#56bf8b"
  music:
    foreground: "#56bf8b"
  lossless:
    foreground: "#cbd6e2"
  crypto:
    foreground: "#aabcce"
  document:
    foreground: "#cbd6e2"
  compressed:
    foreground: "#bf568b"
  temp:
    foreground: "#627e99"
    is_dimmed: false
  compiled:
    foreground: "#8b56bf"
  build:
    foreground: "#aabcce"
    is_underline: false
  source:
    foreground: "#8b56bf"

punctuation:
    foreground: "#aabcce"
date:
    foreground: "#aabcce"
inode:
    foreground: "#aabcce"
blocks:
    foreground: "#aabcce"
header:
    foreground: "#cbd6e2"
octal:
    foreground: "#627e99"
flags:
    foreground: "#bf568b"

symlink_path:
    foreground: "#568bbf"
control_char:
    foreground: "#bfbf56"
broken_symlink:
    foreground: "#bf8b56"
broken_path_overlay:
    foreground: "#aabcce"
