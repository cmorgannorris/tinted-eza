# vim: ft=yaml

# Scheme Name: Dark Plus
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#c5c5c5"
  directory:
    foreground: "#2472c8"
  symlink:
    foreground: "#11a8cd"
  pipe:
    foreground: "#a5a5a5"
  block_device:
    foreground: "#3b8eea"
  char_device:
    foreground: "#3b8eea"
  socket:
    foreground: "#a5a5a5"
  special:
    foreground: "#bc3fbc"
  executable:
    foreground: "#0dbc79"
  mount_point:
    foreground: "#3b8eea"

perms:
  user_read:
    foreground: "#3b8eea"
  user_write:
    foreground: "#cd3131"
  user_execute_file:
    foreground: "#0dbc79"
  user_execute_other:
    foreground: "#0dbc79"
  group_read:
    foreground: "#3b8eea"
  group_write:
    foreground: "#cd3131"
  group_execute:
    foreground: "#0dbc79"
  other_read:
    foreground: "#3b8eea"
  other_write:
    foreground: "#cd3131"
  other_execute:
    foreground: "#0dbc79"
  special_user_file:
    foreground: "#bc3fbc"
  special_other:
    foreground: "#a5a5a5"
  attribute:
    foreground: "#a5a5a5"

size:
  major:
    foreground: "#0dbc79"
  minor:
    foreground: "#0dbc79"
  number_byte:
    foreground: "#a5a5a5"
  number_kilo:
    foreground: "#c5c5c5"
  number_mega:
    foreground: "#3b8eea"
  number_giga:
    foreground: "#e5e510"
  number_huge:
    foreground: "#cd3131"
  unit_byte:
    foreground: "#a5a5a5"
  unit_kilo:
    foreground: "#c5c5c5"
  unit_mega:
    foreground: "#3b8eea"
  unit_giga:
    foreground: "#e5e510"
  unit_huge:
    foreground: "#cd3131"

users:
  user_you:
    foreground: "#c5c5c5"
  user_root:
    foreground: "#cd3131"
  user_other:
    foreground: "#bc3fbc"
  group_yours:
    foreground: "#c5c5c5"
  group_other:
    foreground: "#a5a5a5"
  group_root:
    foreground: "#cd3131"

links:
  normal:
    foreground: "#11a8cd"
  multi_link_file:
    foreground: "#c5c5c5"
    background: "#11a8cd"

git:
  new:
    foreground: "#0dbc79"
  modified:
    foreground: "#3b8eea"
  deleted:
    foreground: "#cd3131"
  renamed:
    foreground: "#858585"
  typechange:
    foreground: "#bc3fbc"
  ignored:
    foreground: "#a5a5a5"
  conflicted:
    foreground: "#e5e510"

git_repo:
  branch_main:
    foreground: "#c5c5c5"
  branch_other:
    foreground: "#bc3fbc"
  git_clean:
    foreground: "#0dbc79"
  git_dirty:
    foreground: "#cd3131"

security_context:
  colon:
    foreground: "#a5a5a5"
  user:
    foreground: "#c5c5c5"
  role:
    foreground: "#bc3fbc"
  typ:
    foreground: "#a5a5a5"
  range:
    foreground: "#bc3fbc"

file_type:
  image:
    foreground: "#3b8eea"
  video:
    foreground: "#0dbc79"
  music:
    foreground: "#0dbc79"
  lossless:
    foreground: "#0dbc79"
  crypto:
    foreground: "#a5a5a5"
  document:
    foreground: "#c5c5c5"
  compressed:
    foreground: "#a5a5a5"
  temp:
    foreground: "#666666"
  compiled:
    foreground: "#2472c8"
  build:
    foreground: "#a5a5a5"
    is_underline: false
  source:
    foreground: "#2472c8"

punctuation:
    foreground: "#a5a5a5"
date:
    foreground: "#a5a5a5"
inode:
    foreground: "#a5a5a5"
blocks:
    foreground: "#a5a5a5"
header:
    foreground: "#c5c5c5"
octal:
    foreground: "#858585"
flags:
    foreground: "#bc3fbc"

symlink_path:
    foreground: "#11a8cd"
control_char:
    foreground: "#e5e510"
broken_symlink:
    foreground: "#cd3131"
broken_path_overlay:
    foreground: "#a5a5a5"
