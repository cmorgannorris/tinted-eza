# vim: ft=yaml

# Scheme Name: pandora
# Scheme Author: Cassandra Fox
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#f15c99"
  directory:
    foreground: "#008080"
  symlink:
    foreground: "#714ca6"
  pipe:
    foreground: "#9b2a46"
  block_device:
    foreground: "#ffcc00"
  char_device:
    foreground: "#ffcc00"
  socket:
    foreground: "#9b2a46"
  special:
    foreground: "#a24030"
  executable:
    foreground: "#9ddf69"
  mount_point:
    foreground: "#ffcc00"

perms:
  user_read:
    foreground: "#ffcc00"
  user_write:
    foreground: "#b00b69"
  user_execute_file:
    foreground: "#9ddf69"
  user_execute_other:
    foreground: "#9ddf69"
  group_read:
    foreground: "#ffcc00"
  group_write:
    foreground: "#b00b69"
  group_execute:
    foreground: "#9ddf69"
  other_read:
    foreground: "#ffcc00"
  other_write:
    foreground: "#b00b69"
  other_execute:
    foreground: "#9ddf69"
  special_user_file:
    foreground: "#a24030"
  special_other:
    foreground: "#9b2a46"
  attribute:
    foreground: "#9b2a46"

size:
  major:
    foreground: "#9ddf69"
  minor:
    foreground: "#9ddf69"
  number_byte:
    foreground: "#9b2a46"
  number_kilo:
    foreground: "#f15c99"
  number_mega:
    foreground: "#ffcc00"
  number_giga:
    foreground: "#ff9153"
  number_huge:
    foreground: "#b00b69"
  unit_byte:
    foreground: "#9b2a46"
  unit_kilo:
    foreground: "#f15c99"
  unit_mega:
    foreground: "#ffcc00"
  unit_giga:
    foreground: "#ff9153"
  unit_huge:
    foreground: "#b00b69"

users:
  user_you:
    foreground: "#f15c99"
  user_root:
    foreground: "#b00b69"
  user_other:
    foreground: "#a24030"
  group_yours:
    foreground: "#f15c99"
  group_other:
    foreground: "#9b2a46"
  group_root:
    foreground: "#b00b69"

links:
  normal:
    foreground: "#714ca6"
  multi_link_file:
    foreground: "#f15c99"
    background: "#714ca6"

git:
  new:
    foreground: "#9ddf69"
  modified:
    foreground: "#ffcc00"
  deleted:
    foreground: "#b00b69"
  renamed:
    foreground: "#ffbee3"
  typechange:
    foreground: "#a24030"
  ignored:
    foreground: "#9b2a46"
  conflicted:
    foreground: "#ff9153"

git_repo:
  branch_main:
    foreground: "#f15c99"
  branch_other:
    foreground: "#a24030"
  git_clean:
    foreground: "#9ddf69"
  git_dirty:
    foreground: "#b00b69"

security_context:
  colon:
    foreground: "#9b2a46"
  user:
    foreground: "#f15c99"
  role:
    foreground: "#a24030"
  typ:
    foreground: "#9b2a46"
  range:
    foreground: "#a24030"

file_type:
  image:
    foreground: "#ffcc00"
  video:
    foreground: "#9ddf69"
  music:
    foreground: "#9ddf69"
  lossless:
    foreground: "#f15c99"
  crypto:
    foreground: "#9b2a46"
  document:
    foreground: "#f15c99"
  compressed:
    foreground: "#a24030"
  temp:
    foreground: "#ffbee3"
    is_dimmed: false
  compiled:
    foreground: "#008080"
  build:
    foreground: "#9b2a46"
    is_underline: false
  source:
    foreground: "#008080"

punctuation:
    foreground: "#9b2a46"
date:
    foreground: "#9b2a46"
inode:
    foreground: "#9b2a46"
blocks:
    foreground: "#9b2a46"
header:
    foreground: "#f15c99"
octal:
    foreground: "#ffbee3"
flags:
    foreground: "#a24030"

symlink_path:
    foreground: "#714ca6"
control_char:
    foreground: "#ff9153"
broken_symlink:
    foreground: "#b00b69"
broken_path_overlay:
    foreground: "#9b2a46"
