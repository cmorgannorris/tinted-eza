# vim: ft=yaml

# Scheme Name: Rosé Pine Dawn
# Scheme Author: Emilia Dunfelt &lt;edun@dunfelt.se&gt;
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#575279"
  directory:
    foreground: "#907aa9"
  symlink:
    foreground: "#56949f"
  pipe:
    foreground: "#797593"
  block_device:
    foreground: "#d7827e"
  char_device:
    foreground: "#d7827e"
  socket:
    foreground: "#797593"
  special:
    foreground: "#ea9d34"
  executable:
    foreground: "#286983"
  mount_point:
    foreground: "#d7827e"

perms:
  user_read:
    foreground: "#d7827e"
  user_write:
    foreground: "#b4637a"
  user_execute_file:
    foreground: "#286983"
  user_execute_other:
    foreground: "#286983"
  group_read:
    foreground: "#d7827e"
  group_write:
    foreground: "#b4637a"
  group_execute:
    foreground: "#286983"
  other_read:
    foreground: "#d7827e"
  other_write:
    foreground: "#b4637a"
  other_execute:
    foreground: "#286983"
  special_user_file:
    foreground: "#ea9d34"
  special_other:
    foreground: "#797593"
  attribute:
    foreground: "#797593"

size:
  major:
    foreground: "#286983"
  minor:
    foreground: "#286983"
  number_byte:
    foreground: "#797593"
  number_kilo:
    foreground: "#575279"
  number_mega:
    foreground: "#d7827e"
  number_giga:
    foreground: "#ea9d34"
  number_huge:
    foreground: "#b4637a"
  unit_byte:
    foreground: "#797593"
  unit_kilo:
    foreground: "#575279"
  unit_mega:
    foreground: "#d7827e"
  unit_giga:
    foreground: "#ea9d34"
  unit_huge:
    foreground: "#b4637a"

users:
  user_you:
    foreground: "#575279"
  user_root:
    foreground: "#b4637a"
  user_other:
    foreground: "#ea9d34"
  group_yours:
    foreground: "#575279"
  group_other:
    foreground: "#797593"
  group_root:
    foreground: "#b4637a"

links:
  normal:
    foreground: "#56949f"
  multi_link_file:
    foreground: "#575279"
    background: "#56949f"

git:
  new:
    foreground: "#286983"
  modified:
    foreground: "#d7827e"
  deleted:
    foreground: "#b4637a"
  renamed:
    foreground: "#9893a5"
  typechange:
    foreground: "#ea9d34"
  ignored:
    foreground: "#797593"
  conflicted:
    foreground: "#ea9d34"

git_repo:
  branch_main:
    foreground: "#575279"
  branch_other:
    foreground: "#ea9d34"
  git_clean:
    foreground: "#286983"
  git_dirty:
    foreground: "#b4637a"

security_context:
  colon:
    foreground: "#797593"
  user:
    foreground: "#575279"
  role:
    foreground: "#ea9d34"
  typ:
    foreground: "#797593"
  range:
    foreground: "#ea9d34"

file_type:
  image:
    foreground: "#d7827e"
  video:
    foreground: "#286983"
  music:
    foreground: "#286983"
  lossless:
    foreground: "#575279"
  crypto:
    foreground: "#797593"
  document:
    foreground: "#575279"
  compressed:
    foreground: "#ea9d34"
  temp:
    foreground: "#9893a5"
  compiled:
    foreground: "#907aa9"
  build:
    foreground: "#797593"
    is_underline: false
  source:
    foreground: "#907aa9"

punctuation:
    foreground: "#797593"
date:
    foreground: "#797593"
inode:
    foreground: "#797593"
blocks:
    foreground: "#797593"
header:
    foreground: "#575279"
octal:
    foreground: "#9893a5"
flags:
    foreground: "#ea9d34"

symlink_path:
    foreground: "#56949f"
control_char:
    foreground: "#ea9d34"
broken_symlink:
    foreground: "#b4637a"
broken_path_overlay:
    foreground: "#797593"
