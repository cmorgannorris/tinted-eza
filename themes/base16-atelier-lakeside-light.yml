# vim: ft=yaml

# Scheme Name: Atelier Lakeside Light
# Scheme Author: Bram de Haan (http://atelierbramdehaan.nl)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#516d7b"
  directory:
    foreground: "#257fad"
  symlink:
    foreground: "#2d8f6f"
  pipe:
    foreground: "#5a7b8c"
  block_device:
    foreground: "#8a8a0f"
  char_device:
    foreground: "#8a8a0f"
  socket:
    foreground: "#5a7b8c"
  special:
    foreground: "#6b6bb8"
  executable:
    foreground: "#568c3b"
  mount_point:
    foreground: "#8a8a0f"

perms:
  user_read:
    foreground: "#8a8a0f"
  user_write:
    foreground: "#d22d72"
  user_execute_file:
    foreground: "#568c3b"
  user_execute_other:
    foreground: "#568c3b"
  group_read:
    foreground: "#8a8a0f"
  group_write:
    foreground: "#d22d72"
  group_execute:
    foreground: "#568c3b"
  other_read:
    foreground: "#8a8a0f"
  other_write:
    foreground: "#d22d72"
  other_execute:
    foreground: "#568c3b"
  special_user_file:
    foreground: "#6b6bb8"
  special_other:
    foreground: "#5a7b8c"
  attribute:
    foreground: "#5a7b8c"

size:
  major:
    foreground: "#568c3b"
  minor:
    foreground: "#568c3b"
  number_byte:
    foreground: "#5a7b8c"
  number_kilo:
    foreground: "#516d7b"
  number_mega:
    foreground: "#8a8a0f"
  number_giga:
    foreground: "#935c25"
  number_huge:
    foreground: "#d22d72"
  unit_byte:
    foreground: "#5a7b8c"
  unit_kilo:
    foreground: "#516d7b"
  unit_mega:
    foreground: "#8a8a0f"
  unit_giga:
    foreground: "#935c25"
  unit_huge:
    foreground: "#d22d72"

users:
  user_you:
    foreground: "#516d7b"
  user_root:
    foreground: "#d22d72"
  user_other:
    foreground: "#6b6bb8"
  group_yours:
    foreground: "#516d7b"
  group_other:
    foreground: "#5a7b8c"
  group_root:
    foreground: "#d22d72"

links:
  normal:
    foreground: "#2d8f6f"
  multi_link_file:
    foreground: "#516d7b"
    background: "#2d8f6f"

git:
  new:
    foreground: "#568c3b"
  modified:
    foreground: "#8a8a0f"
  deleted:
    foreground: "#d22d72"
  renamed:
    foreground: "#7195a8"
  typechange:
    foreground: "#6b6bb8"
  ignored:
    foreground: "#5a7b8c"
  conflicted:
    foreground: "#935c25"

git_repo:
  branch_main:
    foreground: "#516d7b"
  branch_other:
    foreground: "#6b6bb8"
  git_clean:
    foreground: "#568c3b"
  git_dirty:
    foreground: "#d22d72"

security_context:
  colon:
    foreground: "#5a7b8c"
  user:
    foreground: "#516d7b"
  role:
    foreground: "#6b6bb8"
  typ:
    foreground: "#5a7b8c"
  range:
    foreground: "#6b6bb8"

file_type:
  image:
    foreground: "#8a8a0f"
  video:
    foreground: "#568c3b"
  music:
    foreground: "#568c3b"
  lossless:
    foreground: "#516d7b"
  crypto:
    foreground: "#5a7b8c"
  document:
    foreground: "#516d7b"
  compressed:
    foreground: "#6b6bb8"
  temp:
    foreground: "#7195a8"
  compiled:
    foreground: "#257fad"
  build:
    foreground: "#5a7b8c"
    is_underline: false
  source:
    foreground: "#257fad"

punctuation:
    foreground: "#5a7b8c"
date:
    foreground: "#5a7b8c"
inode:
    foreground: "#5a7b8c"
blocks:
    foreground: "#5a7b8c"
header:
    foreground: "#516d7b"
octal:
    foreground: "#7195a8"
flags:
    foreground: "#6b6bb8"

symlink_path:
    foreground: "#2d8f6f"
control_char:
    foreground: "#935c25"
broken_symlink:
    foreground: "#d22d72"
broken_path_overlay:
    foreground: "#5a7b8c"
