# vim: ft=yaml

# Scheme Name: Hardcore
# Scheme Author: Chris Caller
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cdcdcd"
  directory:
    foreground: "#66d9ef"
  symlink:
    foreground: "#708387"
  pipe:
    foreground: "#707070"
  block_device:
    foreground: "#e6db74"
  char_device:
    foreground: "#e6db74"
  socket:
    foreground: "#707070"
  special:
    foreground: "#9e6ffe"
  executable:
    foreground: "#a6e22e"
  mount_point:
    foreground: "#e6db74"

perms:
  user_read:
    foreground: "#e6db74"
  user_write:
    foreground: "#f92672"
  user_execute_file:
    foreground: "#a6e22e"
  user_execute_other:
    foreground: "#a6e22e"
  group_read:
    foreground: "#e6db74"
  group_write:
    foreground: "#f92672"
  group_execute:
    foreground: "#a6e22e"
  other_read:
    foreground: "#e6db74"
  other_write:
    foreground: "#f92672"
  other_execute:
    foreground: "#a6e22e"
  special_user_file:
    foreground: "#9e6ffe"
  special_other:
    foreground: "#707070"
  attribute:
    foreground: "#707070"

size:
  major:
    foreground: "#a6e22e"
  minor:
    foreground: "#a6e22e"
  number_byte:
    foreground: "#707070"
  number_kilo:
    foreground: "#cdcdcd"
  number_mega:
    foreground: "#e6db74"
  number_giga:
    foreground: "#fd971f"
  number_huge:
    foreground: "#f92672"
  unit_byte:
    foreground: "#707070"
  unit_kilo:
    foreground: "#cdcdcd"
  unit_mega:
    foreground: "#e6db74"
  unit_giga:
    foreground: "#fd971f"
  unit_huge:
    foreground: "#f92672"

users:
  user_you:
    foreground: "#cdcdcd"
  user_root:
    foreground: "#f92672"
  user_other:
    foreground: "#9e6ffe"
  group_yours:
    foreground: "#cdcdcd"
  group_other:
    foreground: "#707070"
  group_root:
    foreground: "#f92672"

links:
  normal:
    foreground: "#708387"
  multi_link_file:
    foreground: "#cdcdcd"
    background: "#708387"

git:
  new:
    foreground: "#a6e22e"
  modified:
    foreground: "#e6db74"
  deleted:
    foreground: "#f92672"
  renamed:
    foreground: "#4a4a4a"
  typechange:
    foreground: "#9e6ffe"
  ignored:
    foreground: "#707070"
  conflicted:
    foreground: "#fd971f"

git_repo:
  branch_main:
    foreground: "#cdcdcd"
  branch_other:
    foreground: "#9e6ffe"
  git_clean:
    foreground: "#a6e22e"
  git_dirty:
    foreground: "#f92672"

security_context:
  colon:
    foreground: "#707070"
  user:
    foreground: "#cdcdcd"
  role:
    foreground: "#9e6ffe"
  typ:
    foreground: "#707070"
  range:
    foreground: "#9e6ffe"

file_type:
  image:
    foreground: "#e6db74"
  video:
    foreground: "#a6e22e"
  music:
    foreground: "#a6e22e"
  lossless:
    foreground: "#cdcdcd"
  crypto:
    foreground: "#707070"
  document:
    foreground: "#cdcdcd"
  compressed:
    foreground: "#9e6ffe"
  temp:
    foreground: "#4a4a4a"
  compiled:
    foreground: "#66d9ef"
  build:
    foreground: "#707070"
    is_underline: false
  source:
    foreground: "#66d9ef"

punctuation:
    foreground: "#707070"
date:
    foreground: "#707070"
inode:
    foreground: "#707070"
blocks:
    foreground: "#707070"
header:
    foreground: "#cdcdcd"
octal:
    foreground: "#4a4a4a"
flags:
    foreground: "#9e6ffe"

symlink_path:
    foreground: "#708387"
control_char:
    foreground: "#fd971f"
broken_symlink:
    foreground: "#f92672"
broken_path_overlay:
    foreground: "#707070"
