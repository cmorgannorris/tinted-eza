# vim: ft=yaml

# Scheme Name: Galaxy
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#a1a1a1"
  directory:
    foreground: "#589cf5"
  symlink:
    foreground: "#1e9ee6"
  pipe:
    foreground: "#888888"
  block_device:
    foreground: "#589cf5"
  char_device:
    foreground: "#589cf5"
  socket:
    foreground: "#888888"
  special:
    foreground: "#934d95"
  executable:
    foreground: "#20af89"
  mount_point:
    foreground: "#589cf5"

perms:
  user_read:
    foreground: "#589cf5"
  user_write:
    foreground: "#f9555f"
  user_execute_file:
    foreground: "#20af89"
  user_execute_other:
    foreground: "#20af89"
  group_read:
    foreground: "#589cf5"
  group_write:
    foreground: "#f9555f"
  group_execute:
    foreground: "#20af89"
  other_read:
    foreground: "#589cf5"
  other_write:
    foreground: "#f9555f"
  other_execute:
    foreground: "#20af89"
  special_user_file:
    foreground: "#934d95"
  special_other:
    foreground: "#888888"
  attribute:
    foreground: "#888888"

size:
  major:
    foreground: "#20af89"
  minor:
    foreground: "#20af89"
  number_byte:
    foreground: "#888888"
  number_kilo:
    foreground: "#a1a1a1"
  number_mega:
    foreground: "#589cf5"
  number_giga:
    foreground: "#fdf029"
  number_huge:
    foreground: "#f9555f"
  unit_byte:
    foreground: "#888888"
  unit_kilo:
    foreground: "#a1a1a1"
  unit_mega:
    foreground: "#589cf5"
  unit_giga:
    foreground: "#fdf029"
  unit_huge:
    foreground: "#f9555f"

users:
  user_you:
    foreground: "#a1a1a1"
  user_root:
    foreground: "#f9555f"
  user_other:
    foreground: "#934d95"
  group_yours:
    foreground: "#a1a1a1"
  group_other:
    foreground: "#888888"
  group_root:
    foreground: "#f9555f"

links:
  normal:
    foreground: "#1e9ee6"
  multi_link_file:
    foreground: "#a1a1a1"
    background: "#1e9ee6"

git:
  new:
    foreground: "#20af89"
  modified:
    foreground: "#589cf5"
  deleted:
    foreground: "#f9555f"
  renamed:
    foreground: "#6e6e6e"
  typechange:
    foreground: "#934d95"
  ignored:
    foreground: "#888888"
  conflicted:
    foreground: "#fdf029"

git_repo:
  branch_main:
    foreground: "#a1a1a1"
  branch_other:
    foreground: "#934d95"
  git_clean:
    foreground: "#20af89"
  git_dirty:
    foreground: "#f9555f"

security_context:
  colon:
    foreground: "#888888"
  user:
    foreground: "#a1a1a1"
  role:
    foreground: "#934d95"
  typ:
    foreground: "#888888"
  range:
    foreground: "#934d95"

file_type:
  image:
    foreground: "#589cf5"
  video:
    foreground: "#20af89"
  music:
    foreground: "#20af89"
  lossless:
    foreground: "#a1a1a1"
  crypto:
    foreground: "#888888"
  document:
    foreground: "#a1a1a1"
  compressed:
    foreground: "#934d95"
  temp:
    foreground: "#6e6e6e"
  compiled:
    foreground: "#589cf5"
  build:
    foreground: "#888888"
    is_underline: false
  source:
    foreground: "#589cf5"

punctuation:
    foreground: "#888888"
date:
    foreground: "#888888"
inode:
    foreground: "#888888"
blocks:
    foreground: "#888888"
header:
    foreground: "#a1a1a1"
octal:
    foreground: "#6e6e6e"
flags:
    foreground: "#934d95"

symlink_path:
    foreground: "#1e9ee6"
control_char:
    foreground: "#fdf029"
broken_symlink:
    foreground: "#f9555f"
broken_path_overlay:
    foreground: "#888888"
