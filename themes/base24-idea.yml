# vim: ft=yaml

# Scheme Name: Idea
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#515151"
  directory:
    foreground: "#437ee6"
  symlink:
    foreground: "#248886"
  pipe:
    foreground: "#8b8b8b"
  block_device:
    foreground: "#6c9bed"
  char_device:
    foreground: "#6c9bed"
  socket:
    foreground: "#8b8b8b"
  special:
    foreground: "#9d73b0"
  executable:
    foreground: "#98b61b"
  mount_point:
    foreground: "#6c9bed"

perms:
  user_read:
    foreground: "#6c9bed"
  user_write:
    foreground: "#fb5255"
  user_execute_file:
    foreground: "#98b61b"
  user_execute_other:
    foreground: "#98b61b"
  group_read:
    foreground: "#6c9bed"
  group_write:
    foreground: "#fb5255"
  group_execute:
    foreground: "#98b61b"
  other_read:
    foreground: "#6c9bed"
  other_write:
    foreground: "#fb5255"
  other_execute:
    foreground: "#98b61b"
  special_user_file:
    foreground: "#9d73b0"
  special_other:
    foreground: "#8b8b8b"
  attribute:
    foreground: "#8b8b8b"

size:
  major:
    foreground: "#98b61b"
  minor:
    foreground: "#98b61b"
  number_byte:
    foreground: "#8b8b8b"
  number_kilo:
    foreground: "#515151"
  number_mega:
    foreground: "#6c9bed"
  number_giga:
    foreground: "#ccb343"
  number_huge:
    foreground: "#fb5255"
  unit_byte:
    foreground: "#8b8b8b"
  unit_kilo:
    foreground: "#515151"
  unit_mega:
    foreground: "#6c9bed"
  unit_giga:
    foreground: "#ccb343"
  unit_huge:
    foreground: "#fb5255"

users:
  user_you:
    foreground: "#515151"
  user_root:
    foreground: "#fb5255"
  user_other:
    foreground: "#9d73b0"
  group_yours:
    foreground: "#515151"
  group_other:
    foreground: "#8b8b8b"
  group_root:
    foreground: "#fb5255"

links:
  normal:
    foreground: "#248886"
  multi_link_file:
    foreground: "#515151"
    background: "#248886"

git:
  new:
    foreground: "#98b61b"
  modified:
    foreground: "#6c9bed"
  deleted:
    foreground: "#fb5255"
  renamed:
    foreground: "#c5c5c5"
  typechange:
    foreground: "#9d73b0"
  ignored:
    foreground: "#8b8b8b"
  conflicted:
    foreground: "#ccb343"

git_repo:
  branch_main:
    foreground: "#515151"
  branch_other:
    foreground: "#9d73b0"
  git_clean:
    foreground: "#98b61b"
  git_dirty:
    foreground: "#fb5255"

security_context:
  colon:
    foreground: "#8b8b8b"
  user:
    foreground: "#515151"
  role:
    foreground: "#9d73b0"
  typ:
    foreground: "#8b8b8b"
  range:
    foreground: "#9d73b0"

file_type:
  image:
    foreground: "#6c9bed"
  video:
    foreground: "#98b61b"
  music:
    foreground: "#98b61b"
  lossless:
    foreground: "#98b61b"
  crypto:
    foreground: "#8b8b8b"
  document:
    foreground: "#515151"
  compressed:
    foreground: "#8b8b8b"
  temp:
    foreground: "#fffefe"
  compiled:
    foreground: "#437ee6"
  build:
    foreground: "#8b8b8b"
    is_underline: false
  source:
    foreground: "#437ee6"

punctuation:
    foreground: "#8b8b8b"
date:
    foreground: "#8b8b8b"
inode:
    foreground: "#8b8b8b"
blocks:
    foreground: "#8b8b8b"
header:
    foreground: "#515151"
octal:
    foreground: "#c5c5c5"
flags:
    foreground: "#9d73b0"

symlink_path:
    foreground: "#248886"
control_char:
    foreground: "#ccb343"
broken_symlink:
    foreground: "#fb5255"
broken_path_overlay:
    foreground: "#8b8b8b"
