# vim: ft=yaml

# Scheme Name: iA Dark
# Scheme Author: iA Inc. (modified by aramisgithub)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cccccc"
  directory:
    foreground: "#8eccdd"
  symlink:
    foreground: "#7c9cae"
  pipe:
    foreground: "#b8b8b8"
  block_device:
    foreground: "#b99353"
  char_device:
    foreground: "#b99353"
  socket:
    foreground: "#b8b8b8"
  special:
    foreground: "#b98eb2"
  executable:
    foreground: "#83a471"
  mount_point:
    foreground: "#b99353"

perms:
  user_read:
    foreground: "#b99353"
  user_write:
    foreground: "#d88568"
  user_execute_file:
    foreground: "#83a471"
  user_execute_other:
    foreground: "#83a471"
  group_read:
    foreground: "#b99353"
  group_write:
    foreground: "#d88568"
  group_execute:
    foreground: "#83a471"
  other_read:
    foreground: "#b99353"
  other_write:
    foreground: "#d88568"
  other_execute:
    foreground: "#83a471"
  special_user_file:
    foreground: "#b98eb2"
  special_other:
    foreground: "#b8b8b8"
  attribute:
    foreground: "#b8b8b8"

size:
  major:
    foreground: "#83a471"
  minor:
    foreground: "#83a471"
  number_byte:
    foreground: "#b8b8b8"
  number_kilo:
    foreground: "#cccccc"
  number_mega:
    foreground: "#b99353"
  number_giga:
    foreground: "#d86868"
  number_huge:
    foreground: "#d88568"
  unit_byte:
    foreground: "#b8b8b8"
  unit_kilo:
    foreground: "#cccccc"
  unit_mega:
    foreground: "#b99353"
  unit_giga:
    foreground: "#d86868"
  unit_huge:
    foreground: "#d88568"

users:
  user_you:
    foreground: "#cccccc"
  user_root:
    foreground: "#d88568"
  user_other:
    foreground: "#b98eb2"
  group_yours:
    foreground: "#cccccc"
  group_other:
    foreground: "#b8b8b8"
  group_root:
    foreground: "#d88568"

links:
  normal:
    foreground: "#7c9cae"
  multi_link_file:
    foreground: "#cccccc"
    background: "#7c9cae"

git:
  new:
    foreground: "#83a471"
  modified:
    foreground: "#b99353"
  deleted:
    foreground: "#d88568"
  renamed:
    foreground: "#767676"
  typechange:
    foreground: "#b98eb2"
  ignored:
    foreground: "#b8b8b8"
  conflicted:
    foreground: "#d86868"

git_repo:
  branch_main:
    foreground: "#cccccc"
  branch_other:
    foreground: "#b98eb2"
  git_clean:
    foreground: "#83a471"
  git_dirty:
    foreground: "#d88568"

security_context:
  colon:
    foreground: "#b8b8b8"
  user:
    foreground: "#cccccc"
  role:
    foreground: "#b98eb2"
  typ:
    foreground: "#b8b8b8"
  range:
    foreground: "#b98eb2"

file_type:
  image:
    foreground: "#b99353"
  video:
    foreground: "#83a471"
  music:
    foreground: "#83a471"
  lossless:
    foreground: "#cccccc"
  crypto:
    foreground: "#b8b8b8"
  document:
    foreground: "#cccccc"
  compressed:
    foreground: "#b98eb2"
  temp:
    foreground: "#767676"
  compiled:
    foreground: "#8eccdd"
  build:
    foreground: "#b8b8b8"
    is_underline: false
  source:
    foreground: "#8eccdd"

punctuation:
    foreground: "#b8b8b8"
date:
    foreground: "#b8b8b8"
inode:
    foreground: "#b8b8b8"
blocks:
    foreground: "#b8b8b8"
header:
    foreground: "#cccccc"
octal:
    foreground: "#767676"
flags:
    foreground: "#b98eb2"

symlink_path:
    foreground: "#7c9cae"
control_char:
    foreground: "#d86868"
broken_symlink:
    foreground: "#d88568"
broken_path_overlay:
    foreground: "#b8b8b8"
