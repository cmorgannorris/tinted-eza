# vim: ft=yaml

# Scheme Name: Kibble
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#c0b3c0"
  directory:
    foreground: "#3449d1"
  symlink:
    foreground: "#0798ab"
  pipe:
    foreground: "#9e959e"
  block_device:
    foreground: "#97a4f7"
  char_device:
    foreground: "#97a4f7"
  socket:
    foreground: "#9e959e"
  special:
    foreground: "#8400ff"
  executable:
    foreground: "#29cf13"
  mount_point:
    foreground: "#97a4f7"

perms:
  user_read:
    foreground: "#97a4f7"
  user_write:
    foreground: "#c70031"
  user_execute_file:
    foreground: "#29cf13"
  user_execute_other:
    foreground: "#29cf13"
  group_read:
    foreground: "#97a4f7"
  group_write:
    foreground: "#c70031"
  group_execute:
    foreground: "#29cf13"
  other_read:
    foreground: "#97a4f7"
  other_write:
    foreground: "#c70031"
  other_execute:
    foreground: "#29cf13"
  special_user_file:
    foreground: "#8400ff"
  special_other:
    foreground: "#9e959e"
  attribute:
    foreground: "#9e959e"

size:
  major:
    foreground: "#29cf13"
  minor:
    foreground: "#29cf13"
  number_byte:
    foreground: "#9e959e"
  number_kilo:
    foreground: "#c0b3c0"
  number_mega:
    foreground: "#97a4f7"
  number_giga:
    foreground: "#d8e30e"
  number_huge:
    foreground: "#c70031"
  unit_byte:
    foreground: "#9e959e"
  unit_kilo:
    foreground: "#c0b3c0"
  unit_mega:
    foreground: "#97a4f7"
  unit_giga:
    foreground: "#d8e30e"
  unit_huge:
    foreground: "#c70031"

users:
  user_you:
    foreground: "#c0b3c0"
  user_root:
    foreground: "#c70031"
  user_other:
    foreground: "#8400ff"
  group_yours:
    foreground: "#c0b3c0"
  group_other:
    foreground: "#9e959e"
  group_root:
    foreground: "#c70031"

links:
  normal:
    foreground: "#0798ab"
  multi_link_file:
    foreground: "#c0b3c0"
    background: "#0798ab"

git:
  new:
    foreground: "#29cf13"
  modified:
    foreground: "#97a4f7"
  deleted:
    foreground: "#c70031"
  renamed:
    foreground: "#7c777c"
  typechange:
    foreground: "#8400ff"
  ignored:
    foreground: "#9e959e"
  conflicted:
    foreground: "#d8e30e"

git_repo:
  branch_main:
    foreground: "#c0b3c0"
  branch_other:
    foreground: "#8400ff"
  git_clean:
    foreground: "#29cf13"
  git_dirty:
    foreground: "#c70031"

security_context:
  colon:
    foreground: "#9e959e"
  user:
    foreground: "#c0b3c0"
  role:
    foreground: "#8400ff"
  typ:
    foreground: "#9e959e"
  range:
    foreground: "#8400ff"

file_type:
  image:
    foreground: "#97a4f7"
  video:
    foreground: "#29cf13"
  music:
    foreground: "#29cf13"
  lossless:
    foreground: "#c0b3c0"
  crypto:
    foreground: "#9e959e"
  document:
    foreground: "#c0b3c0"
  compressed:
    foreground: "#8400ff"
  temp:
    foreground: "#7c777c"
    is_dimmed: false
  compiled:
    foreground: "#3449d1"
  build:
    foreground: "#9e959e"
    is_underline: false
  source:
    foreground: "#3449d1"

punctuation:
    foreground: "#9e959e"
date:
    foreground: "#9e959e"
inode:
    foreground: "#9e959e"
blocks:
    foreground: "#9e959e"
header:
    foreground: "#c0b3c0"
octal:
    foreground: "#7c777c"
flags:
    foreground: "#8400ff"

symlink_path:
    foreground: "#0798ab"
control_char:
    foreground: "#d8e30e"
broken_symlink:
    foreground: "#c70031"
broken_path_overlay:
    foreground: "#9e959e"
