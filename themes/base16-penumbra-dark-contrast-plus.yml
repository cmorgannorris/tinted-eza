# vim: ft=yaml

# Scheme Name: Penumbra Dark Contrast Plus
# Scheme Author: Zachary Weiss (https://github.com/zacharyweiss)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cecece"
  directory:
    foreground: "#61a3e6"
  symlink:
    foreground: "#00b3c2"
  pipe:
    foreground: "#9e9e9e"
  block_device:
    foreground: "#9ca748"
  char_device:
    foreground: "#9ca748"
  socket:
    foreground: "#9e9e9e"
  special:
    foreground: "#a48fe1"
  executable:
    foreground: "#50b584"
  mount_point:
    foreground: "#9ca748"

perms:
  user_read:
    foreground: "#9ca748"
  user_write:
    foreground: "#df7f78"
  user_execute_file:
    foreground: "#50b584"
  user_execute_other:
    foreground: "#50b584"
  group_read:
    foreground: "#9ca748"
  group_write:
    foreground: "#df7f78"
  group_execute:
    foreground: "#50b584"
  other_read:
    foreground: "#9ca748"
  other_write:
    foreground: "#df7f78"
  other_execute:
    foreground: "#50b584"
  special_user_file:
    foreground: "#a48fe1"
  special_other:
    foreground: "#9e9e9e"
  attribute:
    foreground: "#9e9e9e"

size:
  major:
    foreground: "#50b584"
  minor:
    foreground: "#50b584"
  number_byte:
    foreground: "#9e9e9e"
  number_kilo:
    foreground: "#cecece"
  number_mega:
    foreground: "#9ca748"
  number_giga:
    foreground: "#ce9042"
  number_huge:
    foreground: "#df7f78"
  unit_byte:
    foreground: "#9e9e9e"
  unit_kilo:
    foreground: "#cecece"
  unit_mega:
    foreground: "#9ca748"
  unit_giga:
    foreground: "#ce9042"
  unit_huge:
    foreground: "#df7f78"

users:
  user_you:
    foreground: "#cecece"
  user_root:
    foreground: "#df7f78"
  user_other:
    foreground: "#a48fe1"
  group_yours:
    foreground: "#cecece"
  group_other:
    foreground: "#9e9e9e"
  group_root:
    foreground: "#df7f78"

links:
  normal:
    foreground: "#00b3c2"
  multi_link_file:
    foreground: "#cecece"
    background: "#00b3c2"

git:
  new:
    foreground: "#50b584"
  modified:
    foreground: "#9ca748"
  deleted:
    foreground: "#df7f78"
  renamed:
    foreground: "#636363"
  typechange:
    foreground: "#a48fe1"
  ignored:
    foreground: "#9e9e9e"
  conflicted:
    foreground: "#ce9042"

git_repo:
  branch_main:
    foreground: "#cecece"
  branch_other:
    foreground: "#a48fe1"
  git_clean:
    foreground: "#50b584"
  git_dirty:
    foreground: "#df7f78"

security_context:
  colon:
    foreground: "#9e9e9e"
  user:
    foreground: "#cecece"
  role:
    foreground: "#a48fe1"
  typ:
    foreground: "#9e9e9e"
  range:
    foreground: "#a48fe1"

file_type:
  image:
    foreground: "#9ca748"
  video:
    foreground: "#50b584"
  music:
    foreground: "#50b584"
  lossless:
    foreground: "#cecece"
  crypto:
    foreground: "#9e9e9e"
  document:
    foreground: "#cecece"
  compressed:
    foreground: "#a48fe1"
  temp:
    foreground: "#636363"
  compiled:
    foreground: "#61a3e6"
  build:
    foreground: "#9e9e9e"
    is_underline: false
  source:
    foreground: "#61a3e6"

punctuation:
    foreground: "#9e9e9e"
date:
    foreground: "#9e9e9e"
inode:
    foreground: "#9e9e9e"
blocks:
    foreground: "#9e9e9e"
header:
    foreground: "#cecece"
octal:
    foreground: "#636363"
flags:
    foreground: "#a48fe1"

symlink_path:
    foreground: "#00b3c2"
control_char:
    foreground: "#ce9042"
broken_symlink:
    foreground: "#df7f78"
broken_path_overlay:
    foreground: "#9e9e9e"
