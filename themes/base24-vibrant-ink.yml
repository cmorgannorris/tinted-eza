# vim: ft=yaml

# Scheme Name: Vibrant Ink
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#cdcdcd"
  directory:
    foreground: "#44b3cc"
  symlink:
    foreground: "#44b3cc"
  pipe:
    foreground: "#a5a5a5"
  block_device:
    foreground: "#0000ff"
  char_device:
    foreground: "#0000ff"
  socket:
    foreground: "#a5a5a5"
  special:
    foreground: "#9933cc"
  executable:
    foreground: "#ccff04"
  mount_point:
    foreground: "#0000ff"

perms:
  user_read:
    foreground: "#0000ff"
  user_write:
    foreground: "#ff6600"
  user_execute_file:
    foreground: "#ccff04"
  user_execute_other:
    foreground: "#ccff04"
  group_read:
    foreground: "#0000ff"
  group_write:
    foreground: "#ff6600"
  group_execute:
    foreground: "#ccff04"
  other_read:
    foreground: "#0000ff"
  other_write:
    foreground: "#ff6600"
  other_execute:
    foreground: "#ccff04"
  special_user_file:
    foreground: "#9933cc"
  special_other:
    foreground: "#a5a5a5"
  attribute:
    foreground: "#a5a5a5"

size:
  major:
    foreground: "#ccff04"
  minor:
    foreground: "#ccff04"
  number_byte:
    foreground: "#a5a5a5"
  number_kilo:
    foreground: "#cdcdcd"
  number_mega:
    foreground: "#0000ff"
  number_giga:
    foreground: "#ffcc00"
  number_huge:
    foreground: "#ff6600"
  unit_byte:
    foreground: "#a5a5a5"
  unit_kilo:
    foreground: "#cdcdcd"
  unit_mega:
    foreground: "#0000ff"
  unit_giga:
    foreground: "#ffcc00"
  unit_huge:
    foreground: "#ff6600"

users:
  user_you:
    foreground: "#cdcdcd"
  user_root:
    foreground: "#ff6600"
  user_other:
    foreground: "#9933cc"
  group_yours:
    foreground: "#cdcdcd"
  group_other:
    foreground: "#a5a5a5"
  group_root:
    foreground: "#ff6600"

links:
  normal:
    foreground: "#44b3cc"
  multi_link_file:
    foreground: "#cdcdcd"
    background: "#44b3cc"

git:
  new:
    foreground: "#ccff04"
  modified:
    foreground: "#0000ff"
  deleted:
    foreground: "#ff6600"
  renamed:
    foreground: "#7d7d7d"
  typechange:
    foreground: "#9933cc"
  ignored:
    foreground: "#a5a5a5"
  conflicted:
    foreground: "#ffcc00"

git_repo:
  branch_main:
    foreground: "#cdcdcd"
  branch_other:
    foreground: "#9933cc"
  git_clean:
    foreground: "#ccff04"
  git_dirty:
    foreground: "#ff6600"

security_context:
  colon:
    foreground: "#a5a5a5"
  user:
    foreground: "#cdcdcd"
  role:
    foreground: "#9933cc"
  typ:
    foreground: "#a5a5a5"
  range:
    foreground: "#9933cc"

file_type:
  image:
    foreground: "#0000ff"
  video:
    foreground: "#ccff04"
  music:
    foreground: "#ccff04"
  lossless:
    foreground: "#cdcdcd"
  crypto:
    foreground: "#a5a5a5"
  document:
    foreground: "#cdcdcd"
  compressed:
    foreground: "#9933cc"
  temp:
    foreground: "#7d7d7d"
    is_dimmed: false
  compiled:
    foreground: "#44b3cc"
  build:
    foreground: "#a5a5a5"
    is_underline: false
  source:
    foreground: "#44b3cc"

punctuation:
    foreground: "#a5a5a5"
date:
    foreground: "#a5a5a5"
inode:
    foreground: "#a5a5a5"
blocks:
    foreground: "#a5a5a5"
header:
    foreground: "#cdcdcd"
octal:
    foreground: "#7d7d7d"
flags:
    foreground: "#9933cc"

symlink_path:
    foreground: "#44b3cc"
control_char:
    foreground: "#ffcc00"
broken_symlink:
    foreground: "#ff6600"
broken_path_overlay:
    foreground: "#a5a5a5"
