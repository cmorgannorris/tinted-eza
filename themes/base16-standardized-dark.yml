# vim: ft=yaml

# Scheme Name: standardized-dark
# Scheme Author: ali (https://github.com/ali-githb/base16-standardized-scheme)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c0c0c0"
  directory:
    foreground: "#00a3f2"
  symlink:
    foreground: "#21c992"
  pipe:
    foreground: "#898989"
  block_device:
    foreground: "#e1b31a"
  char_device:
    foreground: "#e1b31a"
  socket:
    foreground: "#898989"
  special:
    foreground: "#b46ee0"
  executable:
    foreground: "#5db129"
  mount_point:
    foreground: "#e1b31a"

perms:
  user_read:
    foreground: "#e1b31a"
  user_write:
    foreground: "#e15d67"
  user_execute_file:
    foreground: "#5db129"
  user_execute_other:
    foreground: "#5db129"
  group_read:
    foreground: "#e1b31a"
  group_write:
    foreground: "#e15d67"
  group_execute:
    foreground: "#5db129"
  other_read:
    foreground: "#e1b31a"
  other_write:
    foreground: "#e15d67"
  other_execute:
    foreground: "#5db129"
  special_user_file:
    foreground: "#b46ee0"
  special_other:
    foreground: "#898989"
  attribute:
    foreground: "#898989"

size:
  major:
    foreground: "#5db129"
  minor:
    foreground: "#5db129"
  number_byte:
    foreground: "#898989"
  number_kilo:
    foreground: "#c0c0c0"
  number_mega:
    foreground: "#e1b31a"
  number_giga:
    foreground: "#fc804e"
  number_huge:
    foreground: "#e15d67"
  unit_byte:
    foreground: "#898989"
  unit_kilo:
    foreground: "#c0c0c0"
  unit_mega:
    foreground: "#e1b31a"
  unit_giga:
    foreground: "#fc804e"
  unit_huge:
    foreground: "#e15d67"

users:
  user_you:
    foreground: "#c0c0c0"
  user_root:
    foreground: "#e15d67"
  user_other:
    foreground: "#b46ee0"
  group_yours:
    foreground: "#c0c0c0"
  group_other:
    foreground: "#898989"
  group_root:
    foreground: "#e15d67"

links:
  normal:
    foreground: "#21c992"
  multi_link_file:
    foreground: "#c0c0c0"
    background: "#21c992"

git:
  new:
    foreground: "#5db129"
  modified:
    foreground: "#e1b31a"
  deleted:
    foreground: "#e15d67"
  renamed:
    foreground: "#898989"
  typechange:
    foreground: "#b46ee0"
  ignored:
    foreground: "#898989"
  conflicted:
    foreground: "#fc804e"

git_repo:
  branch_main:
    foreground: "#c0c0c0"
  branch_other:
    foreground: "#b46ee0"
  git_clean:
    foreground: "#5db129"
  git_dirty:
    foreground: "#e15d67"

security_context:
  colon:
    foreground: "#898989"
  user:
    foreground: "#c0c0c0"
  role:
    foreground: "#b46ee0"
  typ:
    foreground: "#898989"
  range:
    foreground: "#b46ee0"

file_type:
  image:
    foreground: "#e1b31a"
  video:
    foreground: "#5db129"
  music:
    foreground: "#5db129"
  lossless:
    foreground: "#c0c0c0"
  crypto:
    foreground: "#898989"
  document:
    foreground: "#c0c0c0"
  compressed:
    foreground: "#b46ee0"
  temp:
    foreground: "#898989"
  compiled:
    foreground: "#00a3f2"
  build:
    foreground: "#898989"
    is_underline: false
  source:
    foreground: "#00a3f2"

punctuation:
    foreground: "#898989"
date:
    foreground: "#898989"
inode:
    foreground: "#898989"
blocks:
    foreground: "#898989"
header:
    foreground: "#c0c0c0"
octal:
    foreground: "#898989"
flags:
    foreground: "#b46ee0"

symlink_path:
    foreground: "#21c992"
control_char:
    foreground: "#fc804e"
broken_symlink:
    foreground: "#e15d67"
broken_path_overlay:
    foreground: "#898989"
