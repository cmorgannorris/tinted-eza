# vim: ft=yaml

# Scheme Name: Grayscale Dark
# Scheme Author: Alexandre Gavioli (https://github.com/Alexx2/)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#b9b9b9"
  directory:
    foreground: "#686868"
  symlink:
    foreground: "#868686"
  pipe:
    foreground: "#ababab"
  block_device:
    foreground: "#a0a0a0"
  char_device:
    foreground: "#a0a0a0"
  socket:
    foreground: "#ababab"
  special:
    foreground: "#747474"
  executable:
    foreground: "#8e8e8e"
  mount_point:
    foreground: "#a0a0a0"

perms:
  user_read:
    foreground: "#a0a0a0"
  user_write:
    foreground: "#7c7c7c"
  user_execute_file:
    foreground: "#8e8e8e"
  user_execute_other:
    foreground: "#8e8e8e"
  group_read:
    foreground: "#a0a0a0"
  group_write:
    foreground: "#7c7c7c"
  group_execute:
    foreground: "#8e8e8e"
  other_read:
    foreground: "#a0a0a0"
  other_write:
    foreground: "#7c7c7c"
  other_execute:
    foreground: "#8e8e8e"
  special_user_file:
    foreground: "#747474"
  special_other:
    foreground: "#ababab"
  attribute:
    foreground: "#ababab"

size:
  major:
    foreground: "#8e8e8e"
  minor:
    foreground: "#8e8e8e"
  number_byte:
    foreground: "#ababab"
  number_kilo:
    foreground: "#b9b9b9"
  number_mega:
    foreground: "#a0a0a0"
  number_giga:
    foreground: "#999999"
  number_huge:
    foreground: "#7c7c7c"
  unit_byte:
    foreground: "#ababab"
  unit_kilo:
    foreground: "#b9b9b9"
  unit_mega:
    foreground: "#a0a0a0"
  unit_giga:
    foreground: "#999999"
  unit_huge:
    foreground: "#7c7c7c"

users:
  user_you:
    foreground: "#b9b9b9"
  user_root:
    foreground: "#7c7c7c"
  user_other:
    foreground: "#747474"
  group_yours:
    foreground: "#b9b9b9"
  group_other:
    foreground: "#ababab"
  group_root:
    foreground: "#7c7c7c"

links:
  normal:
    foreground: "#868686"
  multi_link_file:
    foreground: "#b9b9b9"
    background: "#868686"

git:
  new:
    foreground: "#8e8e8e"
  modified:
    foreground: "#a0a0a0"
  deleted:
    foreground: "#7c7c7c"
  renamed:
    foreground: "#525252"
  typechange:
    foreground: "#747474"
  ignored:
    foreground: "#ababab"
  conflicted:
    foreground: "#999999"

git_repo:
  branch_main:
    foreground: "#b9b9b9"
  branch_other:
    foreground: "#747474"
  git_clean:
    foreground: "#8e8e8e"
  git_dirty:
    foreground: "#7c7c7c"

security_context:
  colon:
    foreground: "#ababab"
  user:
    foreground: "#b9b9b9"
  role:
    foreground: "#747474"
  typ:
    foreground: "#ababab"
  range:
    foreground: "#747474"

file_type:
  image:
    foreground: "#a0a0a0"
  video:
    foreground: "#8e8e8e"
  music:
    foreground: "#8e8e8e"
  lossless:
    foreground: "#b9b9b9"
  crypto:
    foreground: "#ababab"
  document:
    foreground: "#b9b9b9"
  compressed:
    foreground: "#747474"
  temp:
    foreground: "#525252"
  compiled:
    foreground: "#686868"
  build:
    foreground: "#ababab"
    is_underline: false
  source:
    foreground: "#686868"

punctuation:
    foreground: "#ababab"
date:
    foreground: "#ababab"
inode:
    foreground: "#ababab"
blocks:
    foreground: "#ababab"
header:
    foreground: "#b9b9b9"
octal:
    foreground: "#525252"
flags:
    foreground: "#747474"

symlink_path:
    foreground: "#868686"
control_char:
    foreground: "#999999"
broken_symlink:
    foreground: "#7c7c7c"
broken_path_overlay:
    foreground: "#ababab"
