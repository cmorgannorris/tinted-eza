# vim: ft=yaml

# Scheme Name: Tokyodark Terminal
# Scheme Author: Tiagovla (https://github.com/tiagovla/)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a0a8cd"
  directory:
    foreground: "#7199ee"
  symlink:
    foreground: "#38a89d"
  pipe:
    foreground: "#4a5057"
  block_device:
    foreground: "#d7a65f"
  char_device:
    foreground: "#d7a65f"
  socket:
    foreground: "#4a5057"
  special:
    foreground: "#a485dd"
  executable:
    foreground: "#95c561"
  mount_point:
    foreground: "#d7a65f"

perms:
  user_read:
    foreground: "#d7a65f"
  user_write:
    foreground: "#ee6d85"
  user_execute_file:
    foreground: "#95c561"
  user_execute_other:
    foreground: "#95c561"
  group_read:
    foreground: "#d7a65f"
  group_write:
    foreground: "#ee6d85"
  group_execute:
    foreground: "#95c561"
  other_read:
    foreground: "#d7a65f"
  other_write:
    foreground: "#ee6d85"
  other_execute:
    foreground: "#95c561"
  special_user_file:
    foreground: "#a485dd"
  special_other:
    foreground: "#4a5057"
  attribute:
    foreground: "#4a5057"

size:
  major:
    foreground: "#95c561"
  minor:
    foreground: "#95c561"
  number_byte:
    foreground: "#4a5057"
  number_kilo:
    foreground: "#a0a8cd"
  number_mega:
    foreground: "#d7a65f"
  number_giga:
    foreground: "#f6955b"
  number_huge:
    foreground: "#ee6d85"
  unit_byte:
    foreground: "#4a5057"
  unit_kilo:
    foreground: "#a0a8cd"
  unit_mega:
    foreground: "#d7a65f"
  unit_giga:
    foreground: "#f6955b"
  unit_huge:
    foreground: "#ee6d85"

users:
  user_you:
    foreground: "#a0a8cd"
  user_root:
    foreground: "#ee6d85"
  user_other:
    foreground: "#a485dd"
  group_yours:
    foreground: "#a0a8cd"
  group_other:
    foreground: "#4a5057"
  group_root:
    foreground: "#ee6d85"

links:
  normal:
    foreground: "#38a89d"
  multi_link_file:
    foreground: "#a0a8cd"
    background: "#38a89d"

git:
  new:
    foreground: "#95c561"
  modified:
    foreground: "#d7a65f"
  deleted:
    foreground: "#ee6d85"
  renamed:
    foreground: "#282c34"
  typechange:
    foreground: "#a485dd"
  ignored:
    foreground: "#4a5057"
  conflicted:
    foreground: "#f6955b"

git_repo:
  branch_main:
    foreground: "#a0a8cd"
  branch_other:
    foreground: "#a485dd"
  git_clean:
    foreground: "#95c561"
  git_dirty:
    foreground: "#ee6d85"

security_context:
  colon:
    foreground: "#4a5057"
  user:
    foreground: "#a0a8cd"
  role:
    foreground: "#a485dd"
  typ:
    foreground: "#4a5057"
  range:
    foreground: "#a485dd"

file_type:
  image:
    foreground: "#d7a65f"
  video:
    foreground: "#95c561"
  music:
    foreground: "#95c561"
  lossless:
    foreground: "#a0a8cd"
  crypto:
    foreground: "#4a5057"
  document:
    foreground: "#a0a8cd"
  compressed:
    foreground: "#a485dd"
  temp:
    foreground: "#282c34"
    is_dimmed: false
  compiled:
    foreground: "#7199ee"
  build:
    foreground: "#4a5057"
    is_underline: false
  source:
    foreground: "#7199ee"

punctuation:
    foreground: "#4a5057"
date:
    foreground: "#4a5057"
inode:
    foreground: "#4a5057"
blocks:
    foreground: "#4a5057"
header:
    foreground: "#a0a8cd"
octal:
    foreground: "#282c34"
flags:
    foreground: "#a485dd"

symlink_path:
    foreground: "#38a89d"
control_char:
    foreground: "#f6955b"
broken_symlink:
    foreground: "#ee6d85"
broken_path_overlay:
    foreground: "#4a5057"
