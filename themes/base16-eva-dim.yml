# vim: ft=yaml

# Scheme Name: Eva Dim
# Scheme Author: kjakapat (https://github.com/kjakapat)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#9fa2a6"
  directory:
    foreground: "#1ae1dc"
  symlink:
    foreground: "#4b8f77"
  pipe:
    foreground: "#7e90a3"
  block_device:
    foreground: "#cfd05d"
  char_device:
    foreground: "#cfd05d"
  socket:
    foreground: "#7e90a3"
  special:
    foreground: "#9c6cd3"
  executable:
    foreground: "#5de561"
  mount_point:
    foreground: "#cfd05d"

perms:
  user_read:
    foreground: "#cfd05d"
  user_write:
    foreground: "#c4676c"
  user_execute_file:
    foreground: "#5de561"
  user_execute_other:
    foreground: "#5de561"
  group_read:
    foreground: "#cfd05d"
  group_write:
    foreground: "#c4676c"
  group_execute:
    foreground: "#5de561"
  other_read:
    foreground: "#cfd05d"
  other_write:
    foreground: "#c4676c"
  other_execute:
    foreground: "#5de561"
  special_user_file:
    foreground: "#9c6cd3"
  special_other:
    foreground: "#7e90a3"
  attribute:
    foreground: "#7e90a3"

size:
  major:
    foreground: "#5de561"
  minor:
    foreground: "#5de561"
  number_byte:
    foreground: "#7e90a3"
  number_kilo:
    foreground: "#9fa2a6"
  number_mega:
    foreground: "#cfd05d"
  number_giga:
    foreground: "#ff9966"
  number_huge:
    foreground: "#c4676c"
  unit_byte:
    foreground: "#7e90a3"
  unit_kilo:
    foreground: "#9fa2a6"
  unit_mega:
    foreground: "#cfd05d"
  unit_giga:
    foreground: "#ff9966"
  unit_huge:
    foreground: "#c4676c"

users:
  user_you:
    foreground: "#9fa2a6"
  user_root:
    foreground: "#c4676c"
  user_other:
    foreground: "#9c6cd3"
  group_yours:
    foreground: "#9fa2a6"
  group_other:
    foreground: "#7e90a3"
  group_root:
    foreground: "#c4676c"

links:
  normal:
    foreground: "#4b8f77"
  multi_link_file:
    foreground: "#9fa2a6"
    background: "#4b8f77"

git:
  new:
    foreground: "#5de561"
  modified:
    foreground: "#cfd05d"
  deleted:
    foreground: "#c4676c"
  renamed:
    foreground: "#55799c"
  typechange:
    foreground: "#9c6cd3"
  ignored:
    foreground: "#7e90a3"
  conflicted:
    foreground: "#ff9966"

git_repo:
  branch_main:
    foreground: "#9fa2a6"
  branch_other:
    foreground: "#9c6cd3"
  git_clean:
    foreground: "#5de561"
  git_dirty:
    foreground: "#c4676c"

security_context:
  colon:
    foreground: "#7e90a3"
  user:
    foreground: "#9fa2a6"
  role:
    foreground: "#9c6cd3"
  typ:
    foreground: "#7e90a3"
  range:
    foreground: "#9c6cd3"

file_type:
  image:
    foreground: "#cfd05d"
  video:
    foreground: "#5de561"
  music:
    foreground: "#5de561"
  lossless:
    foreground: "#9fa2a6"
  crypto:
    foreground: "#7e90a3"
  document:
    foreground: "#9fa2a6"
  compressed:
    foreground: "#9c6cd3"
  temp:
    foreground: "#55799c"
  compiled:
    foreground: "#1ae1dc"
  build:
    foreground: "#7e90a3"
    is_underline: false
  source:
    foreground: "#1ae1dc"

punctuation:
    foreground: "#7e90a3"
date:
    foreground: "#7e90a3"
inode:
    foreground: "#7e90a3"
blocks:
    foreground: "#7e90a3"
header:
    foreground: "#9fa2a6"
octal:
    foreground: "#55799c"
flags:
    foreground: "#9c6cd3"

symlink_path:
    foreground: "#4b8f77"
control_char:
    foreground: "#ff9966"
broken_symlink:
    foreground: "#c4676c"
broken_path_overlay:
    foreground: "#7e90a3"
