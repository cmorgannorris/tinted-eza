# vim: ft=yaml

# Scheme Name: XCode Dusk
# Scheme Author: Elsa Gonsiorowski (https://github.com/gonsie)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#939599"
  directory:
    foreground: "#790ead"
  symlink:
    foreground: "#00a0be"
  pipe:
    foreground: "#7e8086"
  block_device:
    foreground: "#438288"
  char_device:
    foreground: "#438288"
  socket:
    foreground: "#7e8086"
  special:
    foreground: "#b21889"
  executable:
    foreground: "#df0002"
  mount_point:
    foreground: "#438288"

perms:
  user_read:
    foreground: "#438288"
  user_write:
    foreground: "#b21889"
  user_execute_file:
    foreground: "#df0002"
  user_execute_other:
    foreground: "#df0002"
  group_read:
    foreground: "#438288"
  group_write:
    foreground: "#b21889"
  group_execute:
    foreground: "#df0002"
  other_read:
    foreground: "#438288"
  other_write:
    foreground: "#b21889"
  other_execute:
    foreground: "#df0002"
  special_user_file:
    foreground: "#b21889"
  special_other:
    foreground: "#7e8086"
  attribute:
    foreground: "#7e8086"

size:
  major:
    foreground: "#df0002"
  minor:
    foreground: "#df0002"
  number_byte:
    foreground: "#7e8086"
  number_kilo:
    foreground: "#939599"
  number_mega:
    foreground: "#438288"
  number_giga:
    foreground: "#786dc5"
  number_huge:
    foreground: "#b21889"
  unit_byte:
    foreground: "#7e8086"
  unit_kilo:
    foreground: "#939599"
  unit_mega:
    foreground: "#438288"
  unit_giga:
    foreground: "#786dc5"
  unit_huge:
    foreground: "#b21889"

users:
  user_you:
    foreground: "#939599"
  user_root:
    foreground: "#b21889"
  user_other:
    foreground: "#b21889"
  group_yours:
    foreground: "#939599"
  group_other:
    foreground: "#7e8086"
  group_root:
    foreground: "#b21889"

links:
  normal:
    foreground: "#00a0be"
  multi_link_file:
    foreground: "#939599"
    background: "#00a0be"

git:
  new:
    foreground: "#df0002"
  modified:
    foreground: "#438288"
  deleted:
    foreground: "#b21889"
  renamed:
    foreground: "#686a71"
  typechange:
    foreground: "#b21889"
  ignored:
    foreground: "#7e8086"
  conflicted:
    foreground: "#786dc5"

git_repo:
  branch_main:
    foreground: "#939599"
  branch_other:
    foreground: "#b21889"
  git_clean:
    foreground: "#df0002"
  git_dirty:
    foreground: "#b21889"

security_context:
  colon:
    foreground: "#7e8086"
  user:
    foreground: "#939599"
  role:
    foreground: "#b21889"
  typ:
    foreground: "#7e8086"
  range:
    foreground: "#b21889"

file_type:
  image:
    foreground: "#438288"
  video:
    foreground: "#df0002"
  music:
    foreground: "#df0002"
  lossless:
    foreground: "#939599"
  crypto:
    foreground: "#7e8086"
  document:
    foreground: "#939599"
  compressed:
    foreground: "#b21889"
  temp:
    foreground: "#686a71"
    is_dimmed: false
  compiled:
    foreground: "#790ead"
  build:
    foreground: "#7e8086"
    is_underline: false
  source:
    foreground: "#790ead"

punctuation:
    foreground: "#7e8086"
date:
    foreground: "#7e8086"
inode:
    foreground: "#7e8086"
blocks:
    foreground: "#7e8086"
header:
    foreground: "#939599"
octal:
    foreground: "#686a71"
flags:
    foreground: "#b21889"

symlink_path:
    foreground: "#00a0be"
control_char:
    foreground: "#786dc5"
broken_symlink:
    foreground: "#b21889"
broken_path_overlay:
    foreground: "#7e8086"
