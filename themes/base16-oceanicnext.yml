# vim: ft=yaml

# Scheme Name: OceanicNext
# Scheme Author: https://github.com/voronianski/oceanic-next-color-scheme
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c0c5ce"
  directory:
    foreground: "#6699cc"
  symlink:
    foreground: "#5fb3b3"
  pipe:
    foreground: "#a7adba"
  block_device:
    foreground: "#fac863"
  char_device:
    foreground: "#fac863"
  socket:
    foreground: "#a7adba"
  special:
    foreground: "#c594c5"
  executable:
    foreground: "#99c794"
  mount_point:
    foreground: "#fac863"

perms:
  user_read:
    foreground: "#fac863"
  user_write:
    foreground: "#ec5f67"
  user_execute_file:
    foreground: "#99c794"
  user_execute_other:
    foreground: "#99c794"
  group_read:
    foreground: "#fac863"
  group_write:
    foreground: "#ec5f67"
  group_execute:
    foreground: "#99c794"
  other_read:
    foreground: "#fac863"
  other_write:
    foreground: "#ec5f67"
  other_execute:
    foreground: "#99c794"
  special_user_file:
    foreground: "#c594c5"
  special_other:
    foreground: "#a7adba"
  attribute:
    foreground: "#a7adba"

size:
  major:
    foreground: "#99c794"
  minor:
    foreground: "#99c794"
  number_byte:
    foreground: "#a7adba"
  number_kilo:
    foreground: "#c0c5ce"
  number_mega:
    foreground: "#fac863"
  number_giga:
    foreground: "#f99157"
  number_huge:
    foreground: "#ec5f67"
  unit_byte:
    foreground: "#a7adba"
  unit_kilo:
    foreground: "#c0c5ce"
  unit_mega:
    foreground: "#fac863"
  unit_giga:
    foreground: "#f99157"
  unit_huge:
    foreground: "#ec5f67"

users:
  user_you:
    foreground: "#c0c5ce"
  user_root:
    foreground: "#ec5f67"
  user_other:
    foreground: "#c594c5"
  group_yours:
    foreground: "#c0c5ce"
  group_other:
    foreground: "#a7adba"
  group_root:
    foreground: "#ec5f67"

links:
  normal:
    foreground: "#5fb3b3"
  multi_link_file:
    foreground: "#c0c5ce"
    background: "#5fb3b3"

git:
  new:
    foreground: "#99c794"
  modified:
    foreground: "#fac863"
  deleted:
    foreground: "#ec5f67"
  renamed:
    foreground: "#65737e"
  typechange:
    foreground: "#c594c5"
  ignored:
    foreground: "#a7adba"
  conflicted:
    foreground: "#f99157"

git_repo:
  branch_main:
    foreground: "#c0c5ce"
  branch_other:
    foreground: "#c594c5"
  git_clean:
    foreground: "#99c794"
  git_dirty:
    foreground: "#ec5f67"

security_context:
  colon:
    foreground: "#a7adba"
  user:
    foreground: "#c0c5ce"
  role:
    foreground: "#c594c5"
  typ:
    foreground: "#a7adba"
  range:
    foreground: "#c594c5"

file_type:
  image:
    foreground: "#fac863"
  video:
    foreground: "#99c794"
  music:
    foreground: "#99c794"
  lossless:
    foreground: "#c0c5ce"
  crypto:
    foreground: "#a7adba"
  document:
    foreground: "#c0c5ce"
  compressed:
    foreground: "#c594c5"
  temp:
    foreground: "#65737e"
    is_dimmed: false
  compiled:
    foreground: "#6699cc"
  build:
    foreground: "#a7adba"
    is_underline: false
  source:
    foreground: "#6699cc"

punctuation:
    foreground: "#a7adba"
date:
    foreground: "#a7adba"
inode:
    foreground: "#a7adba"
blocks:
    foreground: "#a7adba"
header:
    foreground: "#c0c5ce"
octal:
    foreground: "#65737e"
flags:
    foreground: "#c594c5"

symlink_path:
    foreground: "#5fb3b3"
control_char:
    foreground: "#f99157"
broken_symlink:
    foreground: "#ec5f67"
broken_path_overlay:
    foreground: "#a7adba"
