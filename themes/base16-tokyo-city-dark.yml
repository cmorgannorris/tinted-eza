# vim: ft=yaml

# Scheme Name: Tokyo City Dark
# Scheme Author: Michaël Ball
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d8e2ec"
  directory:
    foreground: "#7aa2f7"
  symlink:
    foreground: "#89ddff"
  pipe:
    foreground: "#b7c5d3"
  block_device:
    foreground: "#b7c5d3"
  char_device:
    foreground: "#b7c5d3"
  socket:
    foreground: "#b7c5d3"
  special:
    foreground: "#bb9af7"
  executable:
    foreground: "#9ece6a"
  mount_point:
    foreground: "#b7c5d3"

perms:
  user_read:
    foreground: "#b7c5d3"
  user_write:
    foreground: "#f7768e"
  user_execute_file:
    foreground: "#9ece6a"
  user_execute_other:
    foreground: "#9ece6a"
  group_read:
    foreground: "#b7c5d3"
  group_write:
    foreground: "#f7768e"
  group_execute:
    foreground: "#9ece6a"
  other_read:
    foreground: "#b7c5d3"
  other_write:
    foreground: "#f7768e"
  other_execute:
    foreground: "#9ece6a"
  special_user_file:
    foreground: "#bb9af7"
  special_other:
    foreground: "#b7c5d3"
  attribute:
    foreground: "#b7c5d3"

size:
  major:
    foreground: "#9ece6a"
  minor:
    foreground: "#9ece6a"
  number_byte:
    foreground: "#b7c5d3"
  number_kilo:
    foreground: "#d8e2ec"
  number_mega:
    foreground: "#b7c5d3"
  number_giga:
    foreground: "#ff9e64"
  number_huge:
    foreground: "#f7768e"
  unit_byte:
    foreground: "#b7c5d3"
  unit_kilo:
    foreground: "#d8e2ec"
  unit_mega:
    foreground: "#b7c5d3"
  unit_giga:
    foreground: "#ff9e64"
  unit_huge:
    foreground: "#f7768e"

users:
  user_you:
    foreground: "#d8e2ec"
  user_root:
    foreground: "#f7768e"
  user_other:
    foreground: "#bb9af7"
  group_yours:
    foreground: "#d8e2ec"
  group_other:
    foreground: "#b7c5d3"
  group_root:
    foreground: "#f7768e"

links:
  normal:
    foreground: "#89ddff"
  multi_link_file:
    foreground: "#d8e2ec"
    background: "#89ddff"

git:
  new:
    foreground: "#9ece6a"
  modified:
    foreground: "#b7c5d3"
  deleted:
    foreground: "#f7768e"
  renamed:
    foreground: "#526270"
  typechange:
    foreground: "#bb9af7"
  ignored:
    foreground: "#b7c5d3"
  conflicted:
    foreground: "#ff9e64"

git_repo:
  branch_main:
    foreground: "#d8e2ec"
  branch_other:
    foreground: "#bb9af7"
  git_clean:
    foreground: "#9ece6a"
  git_dirty:
    foreground: "#f7768e"

security_context:
  colon:
    foreground: "#b7c5d3"
  user:
    foreground: "#d8e2ec"
  role:
    foreground: "#bb9af7"
  typ:
    foreground: "#b7c5d3"
  range:
    foreground: "#bb9af7"

file_type:
  image:
    foreground: "#b7c5d3"
  video:
    foreground: "#9ece6a"
  music:
    foreground: "#9ece6a"
  lossless:
    foreground: "#d8e2ec"
  crypto:
    foreground: "#b7c5d3"
  document:
    foreground: "#d8e2ec"
  compressed:
    foreground: "#bb9af7"
  temp:
    foreground: "#526270"
  compiled:
    foreground: "#7aa2f7"
  build:
    foreground: "#b7c5d3"
    is_underline: false
  source:
    foreground: "#7aa2f7"

punctuation:
    foreground: "#b7c5d3"
date:
    foreground: "#b7c5d3"
inode:
    foreground: "#b7c5d3"
blocks:
    foreground: "#b7c5d3"
header:
    foreground: "#d8e2ec"
octal:
    foreground: "#526270"
flags:
    foreground: "#bb9af7"

symlink_path:
    foreground: "#89ddff"
control_char:
    foreground: "#ff9e64"
broken_symlink:
    foreground: "#f7768e"
broken_path_overlay:
    foreground: "#b7c5d3"
