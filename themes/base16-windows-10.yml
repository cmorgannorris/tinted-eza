# vim: ft=yaml

# Scheme Name: Windows 10
# Scheme Author: Fergus Collins (https://github.com/ferguscollins)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cccccc"
  directory:
    foreground: "#3b78ff"
  symlink:
    foreground: "#61d6d6"
  pipe:
    foreground: "#b9b9b9"
  block_device:
    foreground: "#f9f1a5"
  char_device:
    foreground: "#f9f1a5"
  socket:
    foreground: "#b9b9b9"
  special:
    foreground: "#b4009e"
  executable:
    foreground: "#16c60c"
  mount_point:
    foreground: "#f9f1a5"

perms:
  user_read:
    foreground: "#f9f1a5"
  user_write:
    foreground: "#e74856"
  user_execute_file:
    foreground: "#16c60c"
  user_execute_other:
    foreground: "#16c60c"
  group_read:
    foreground: "#f9f1a5"
  group_write:
    foreground: "#e74856"
  group_execute:
    foreground: "#16c60c"
  other_read:
    foreground: "#f9f1a5"
  other_write:
    foreground: "#e74856"
  other_execute:
    foreground: "#16c60c"
  special_user_file:
    foreground: "#b4009e"
  special_other:
    foreground: "#b9b9b9"
  attribute:
    foreground: "#b9b9b9"

size:
  major:
    foreground: "#16c60c"
  minor:
    foreground: "#16c60c"
  number_byte:
    foreground: "#b9b9b9"
  number_kilo:
    foreground: "#cccccc"
  number_mega:
    foreground: "#f9f1a5"
  number_giga:
    foreground: "#c19c00"
  number_huge:
    foreground: "#e74856"
  unit_byte:
    foreground: "#b9b9b9"
  unit_kilo:
    foreground: "#cccccc"
  unit_mega:
    foreground: "#f9f1a5"
  unit_giga:
    foreground: "#c19c00"
  unit_huge:
    foreground: "#e74856"

users:
  user_you:
    foreground: "#cccccc"
  user_root:
    foreground: "#e74856"
  user_other:
    foreground: "#b4009e"
  group_yours:
    foreground: "#cccccc"
  group_other:
    foreground: "#b9b9b9"
  group_root:
    foreground: "#e74856"

links:
  normal:
    foreground: "#61d6d6"
  multi_link_file:
    foreground: "#cccccc"
    background: "#61d6d6"

git:
  new:
    foreground: "#16c60c"
  modified:
    foreground: "#f9f1a5"
  deleted:
    foreground: "#e74856"
  renamed:
    foreground: "#767676"
  typechange:
    foreground: "#b4009e"
  ignored:
    foreground: "#b9b9b9"
  conflicted:
    foreground: "#c19c00"

git_repo:
  branch_main:
    foreground: "#cccccc"
  branch_other:
    foreground: "#b4009e"
  git_clean:
    foreground: "#16c60c"
  git_dirty:
    foreground: "#e74856"

security_context:
  colon:
    foreground: "#b9b9b9"
  user:
    foreground: "#cccccc"
  role:
    foreground: "#b4009e"
  typ:
    foreground: "#b9b9b9"
  range:
    foreground: "#b4009e"

file_type:
  image:
    foreground: "#f9f1a5"
  video:
    foreground: "#16c60c"
  music:
    foreground: "#16c60c"
  lossless:
    foreground: "#cccccc"
  crypto:
    foreground: "#b9b9b9"
  document:
    foreground: "#cccccc"
  compressed:
    foreground: "#b4009e"
  temp:
    foreground: "#767676"
  compiled:
    foreground: "#3b78ff"
  build:
    foreground: "#b9b9b9"
    is_underline: false
  source:
    foreground: "#3b78ff"

punctuation:
    foreground: "#b9b9b9"
date:
    foreground: "#b9b9b9"
inode:
    foreground: "#b9b9b9"
blocks:
    foreground: "#b9b9b9"
header:
    foreground: "#cccccc"
octal:
    foreground: "#767676"
flags:
    foreground: "#b4009e"

symlink_path:
    foreground: "#61d6d6"
control_char:
    foreground: "#c19c00"
broken_symlink:
    foreground: "#e74856"
broken_path_overlay:
    foreground: "#b9b9b9"
