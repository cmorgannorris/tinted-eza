# vim: ft=yaml

# Scheme Name: Everforest Dark Soft
# Scheme Author: Sainnhe Park (https://github.com/sainnhe)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d3c6aa"
  directory:
    foreground: "#7fbbb3"
  symlink:
    foreground: "#83c092"
  pipe:
    foreground: "#9da9a0"
  block_device:
    foreground: "#dbbc7f"
  char_device:
    foreground: "#dbbc7f"
  socket:
    foreground: "#9da9a0"
  special:
    foreground: "#d699b6"
  executable:
    foreground: "#a7c080"
  mount_point:
    foreground: "#dbbc7f"

perms:
  user_read:
    foreground: "#dbbc7f"
  user_write:
    foreground: "#e67e80"
  user_execute_file:
    foreground: "#a7c080"
  user_execute_other:
    foreground: "#a7c080"
  group_read:
    foreground: "#dbbc7f"
  group_write:
    foreground: "#e67e80"
  group_execute:
    foreground: "#a7c080"
  other_read:
    foreground: "#dbbc7f"
  other_write:
    foreground: "#e67e80"
  other_execute:
    foreground: "#a7c080"
  special_user_file:
    foreground: "#d699b6"
  special_other:
    foreground: "#9da9a0"
  attribute:
    foreground: "#9da9a0"

size:
  major:
    foreground: "#a7c080"
  minor:
    foreground: "#a7c080"
  number_byte:
    foreground: "#9da9a0"
  number_kilo:
    foreground: "#d3c6aa"
  number_mega:
    foreground: "#dbbc7f"
  number_giga:
    foreground: "#e69875"
  number_huge:
    foreground: "#e67e80"
  unit_byte:
    foreground: "#9da9a0"
  unit_kilo:
    foreground: "#d3c6aa"
  unit_mega:
    foreground: "#dbbc7f"
  unit_giga:
    foreground: "#e69875"
  unit_huge:
    foreground: "#e67e80"

users:
  user_you:
    foreground: "#d3c6aa"
  user_root:
    foreground: "#e67e80"
  user_other:
    foreground: "#d699b6"
  group_yours:
    foreground: "#d3c6aa"
  group_other:
    foreground: "#9da9a0"
  group_root:
    foreground: "#e67e80"

links:
  normal:
    foreground: "#83c092"
  multi_link_file:
    foreground: "#d3c6aa"
    background: "#83c092"

git:
  new:
    foreground: "#a7c080"
  modified:
    foreground: "#dbbc7f"
  deleted:
    foreground: "#e67e80"
  renamed:
    foreground: "#859289"
  typechange:
    foreground: "#d699b6"
  ignored:
    foreground: "#9da9a0"
  conflicted:
    foreground: "#e69875"

git_repo:
  branch_main:
    foreground: "#d3c6aa"
  branch_other:
    foreground: "#d699b6"
  git_clean:
    foreground: "#a7c080"
  git_dirty:
    foreground: "#e67e80"

security_context:
  colon:
    foreground: "#9da9a0"
  user:
    foreground: "#d3c6aa"
  role:
    foreground: "#d699b6"
  typ:
    foreground: "#9da9a0"
  range:
    foreground: "#d699b6"

file_type:
  image:
    foreground: "#dbbc7f"
  video:
    foreground: "#a7c080"
  music:
    foreground: "#a7c080"
  lossless:
    foreground: "#d3c6aa"
  crypto:
    foreground: "#9da9a0"
  document:
    foreground: "#d3c6aa"
  compressed:
    foreground: "#d699b6"
  temp:
    foreground: "#859289"
    is_dimmed: false
  compiled:
    foreground: "#7fbbb3"
  build:
    foreground: "#9da9a0"
    is_underline: false
  source:
    foreground: "#7fbbb3"

punctuation:
    foreground: "#9da9a0"
date:
    foreground: "#9da9a0"
inode:
    foreground: "#9da9a0"
blocks:
    foreground: "#9da9a0"
header:
    foreground: "#d3c6aa"
octal:
    foreground: "#859289"
flags:
    foreground: "#d699b6"

symlink_path:
    foreground: "#83c092"
control_char:
    foreground: "#e69875"
broken_symlink:
    foreground: "#e67e80"
broken_path_overlay:
    foreground: "#9da9a0"
