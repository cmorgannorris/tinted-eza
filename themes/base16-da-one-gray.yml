# vim: ft=yaml

# Scheme Name: Da One Gray
# Scheme Author: NNB (https://github.com/NNBnh)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#ffffff"
  directory:
    foreground: "#6bb8ff"
  symlink:
    foreground: "#8af5ff"
  pipe:
    foreground: "#c8c8c8"
  block_device:
    foreground: "#ff9470"
  char_device:
    foreground: "#ff9470"
  socket:
    foreground: "#c8c8c8"
  special:
    foreground: "#e799ff"
  executable:
    foreground: "#98c379"
  mount_point:
    foreground: "#ff9470"

perms:
  user_read:
    foreground: "#ff9470"
  user_write:
    foreground: "#fa7883"
  user_execute_file:
    foreground: "#98c379"
  user_execute_other:
    foreground: "#98c379"
  group_read:
    foreground: "#ff9470"
  group_write:
    foreground: "#fa7883"
  group_execute:
    foreground: "#98c379"
  other_read:
    foreground: "#ff9470"
  other_write:
    foreground: "#fa7883"
  other_execute:
    foreground: "#98c379"
  special_user_file:
    foreground: "#e799ff"
  special_other:
    foreground: "#c8c8c8"
  attribute:
    foreground: "#c8c8c8"

size:
  major:
    foreground: "#98c379"
  minor:
    foreground: "#98c379"
  number_byte:
    foreground: "#c8c8c8"
  number_kilo:
    foreground: "#ffffff"
  number_mega:
    foreground: "#ff9470"
  number_giga:
    foreground: "#ffc387"
  number_huge:
    foreground: "#fa7883"
  unit_byte:
    foreground: "#c8c8c8"
  unit_kilo:
    foreground: "#ffffff"
  unit_mega:
    foreground: "#ff9470"
  unit_giga:
    foreground: "#ffc387"
  unit_huge:
    foreground: "#fa7883"

users:
  user_you:
    foreground: "#ffffff"
  user_root:
    foreground: "#fa7883"
  user_other:
    foreground: "#e799ff"
  group_yours:
    foreground: "#ffffff"
  group_other:
    foreground: "#c8c8c8"
  group_root:
    foreground: "#fa7883"

links:
  normal:
    foreground: "#8af5ff"
  multi_link_file:
    foreground: "#ffffff"
    background: "#8af5ff"

git:
  new:
    foreground: "#98c379"
  modified:
    foreground: "#ff9470"
  deleted:
    foreground: "#fa7883"
  renamed:
    foreground: "#888888"
  typechange:
    foreground: "#e799ff"
  ignored:
    foreground: "#c8c8c8"
  conflicted:
    foreground: "#ffc387"

git_repo:
  branch_main:
    foreground: "#ffffff"
  branch_other:
    foreground: "#e799ff"
  git_clean:
    foreground: "#98c379"
  git_dirty:
    foreground: "#fa7883"

security_context:
  colon:
    foreground: "#c8c8c8"
  user:
    foreground: "#ffffff"
  role:
    foreground: "#e799ff"
  typ:
    foreground: "#c8c8c8"
  range:
    foreground: "#e799ff"

file_type:
  image:
    foreground: "#ff9470"
  video:
    foreground: "#98c379"
  music:
    foreground: "#98c379"
  lossless:
    foreground: "#ffffff"
  crypto:
    foreground: "#c8c8c8"
  document:
    foreground: "#ffffff"
  compressed:
    foreground: "#e799ff"
  temp:
    foreground: "#888888"
  compiled:
    foreground: "#6bb8ff"
  build:
    foreground: "#c8c8c8"
    is_underline: false
  source:
    foreground: "#6bb8ff"

punctuation:
    foreground: "#c8c8c8"
date:
    foreground: "#c8c8c8"
inode:
    foreground: "#c8c8c8"
blocks:
    foreground: "#c8c8c8"
header:
    foreground: "#ffffff"
octal:
    foreground: "#888888"
flags:
    foreground: "#e799ff"

symlink_path:
    foreground: "#8af5ff"
control_char:
    foreground: "#ffc387"
broken_symlink:
    foreground: "#fa7883"
broken_path_overlay:
    foreground: "#c8c8c8"
