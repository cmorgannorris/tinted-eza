# vim: ft=yaml

# Scheme Name: Equilibrium Gray Light
# Scheme Author: Carlo Abelli
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#474747"
  directory:
    foreground: "#0073b5"
  symlink:
    foreground: "#007a72"
  pipe:
    foreground: "#5e5e5e"
  block_device:
    foreground: "#9d6f00"
  char_device:
    foreground: "#9d6f00"
  socket:
    foreground: "#5e5e5e"
  special:
    foreground: "#4e66b6"
  executable:
    foreground: "#637200"
  mount_point:
    foreground: "#9d6f00"

perms:
  user_read:
    foreground: "#9d6f00"
  user_write:
    foreground: "#d02023"
  user_execute_file:
    foreground: "#637200"
  user_execute_other:
    foreground: "#637200"
  group_read:
    foreground: "#9d6f00"
  group_write:
    foreground: "#d02023"
  group_execute:
    foreground: "#637200"
  other_read:
    foreground: "#9d6f00"
  other_write:
    foreground: "#d02023"
  other_execute:
    foreground: "#637200"
  special_user_file:
    foreground: "#4e66b6"
  special_other:
    foreground: "#5e5e5e"
  attribute:
    foreground: "#5e5e5e"

size:
  major:
    foreground: "#637200"
  minor:
    foreground: "#637200"
  number_byte:
    foreground: "#5e5e5e"
  number_kilo:
    foreground: "#474747"
  number_mega:
    foreground: "#9d6f00"
  number_giga:
    foreground: "#bf3e05"
  number_huge:
    foreground: "#d02023"
  unit_byte:
    foreground: "#5e5e5e"
  unit_kilo:
    foreground: "#474747"
  unit_mega:
    foreground: "#9d6f00"
  unit_giga:
    foreground: "#bf3e05"
  unit_huge:
    foreground: "#d02023"

users:
  user_you:
    foreground: "#474747"
  user_root:
    foreground: "#d02023"
  user_other:
    foreground: "#4e66b6"
  group_yours:
    foreground: "#474747"
  group_other:
    foreground: "#5e5e5e"
  group_root:
    foreground: "#d02023"

links:
  normal:
    foreground: "#007a72"
  multi_link_file:
    foreground: "#474747"
    background: "#007a72"

git:
  new:
    foreground: "#637200"
  modified:
    foreground: "#9d6f00"
  deleted:
    foreground: "#d02023"
  renamed:
    foreground: "#777777"
  typechange:
    foreground: "#4e66b6"
  ignored:
    foreground: "#5e5e5e"
  conflicted:
    foreground: "#bf3e05"

git_repo:
  branch_main:
    foreground: "#474747"
  branch_other:
    foreground: "#4e66b6"
  git_clean:
    foreground: "#637200"
  git_dirty:
    foreground: "#d02023"

security_context:
  colon:
    foreground: "#5e5e5e"
  user:
    foreground: "#474747"
  role:
    foreground: "#4e66b6"
  typ:
    foreground: "#5e5e5e"
  range:
    foreground: "#4e66b6"

file_type:
  image:
    foreground: "#9d6f00"
  video:
    foreground: "#637200"
  music:
    foreground: "#637200"
  lossless:
    foreground: "#474747"
  crypto:
    foreground: "#5e5e5e"
  document:
    foreground: "#474747"
  compressed:
    foreground: "#4e66b6"
  temp:
    foreground: "#777777"
  compiled:
    foreground: "#0073b5"
  build:
    foreground: "#5e5e5e"
    is_underline: false
  source:
    foreground: "#0073b5"

punctuation:
    foreground: "#5e5e5e"
date:
    foreground: "#5e5e5e"
inode:
    foreground: "#5e5e5e"
blocks:
    foreground: "#5e5e5e"
header:
    foreground: "#474747"
octal:
    foreground: "#777777"
flags:
    foreground: "#4e66b6"

symlink_path:
    foreground: "#007a72"
control_char:
    foreground: "#bf3e05"
broken_symlink:
    foreground: "#d02023"
broken_path_overlay:
    foreground: "#5e5e5e"
