# vim: ft=yaml

# Scheme Name: Woodland
# Scheme Author: Jay Cornwall (https://jcornwall.com)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cabcb1"
  directory:
    foreground: "#88a4d3"
  symlink:
    foreground: "#6eb958"
  pipe:
    foreground: "#b4a490"
  block_device:
    foreground: "#e0ac16"
  char_device:
    foreground: "#e0ac16"
  socket:
    foreground: "#b4a490"
  special:
    foreground: "#bb90e2"
  executable:
    foreground: "#b7ba53"
  mount_point:
    foreground: "#e0ac16"

perms:
  user_read:
    foreground: "#e0ac16"
  user_write:
    foreground: "#d35c5c"
  user_execute_file:
    foreground: "#b7ba53"
  user_execute_other:
    foreground: "#b7ba53"
  group_read:
    foreground: "#e0ac16"
  group_write:
    foreground: "#d35c5c"
  group_execute:
    foreground: "#b7ba53"
  other_read:
    foreground: "#e0ac16"
  other_write:
    foreground: "#d35c5c"
  other_execute:
    foreground: "#b7ba53"
  special_user_file:
    foreground: "#bb90e2"
  special_other:
    foreground: "#b4a490"
  attribute:
    foreground: "#b4a490"

size:
  major:
    foreground: "#b7ba53"
  minor:
    foreground: "#b7ba53"
  number_byte:
    foreground: "#b4a490"
  number_kilo:
    foreground: "#cabcb1"
  number_mega:
    foreground: "#e0ac16"
  number_giga:
    foreground: "#ca7f32"
  number_huge:
    foreground: "#d35c5c"
  unit_byte:
    foreground: "#b4a490"
  unit_kilo:
    foreground: "#cabcb1"
  unit_mega:
    foreground: "#e0ac16"
  unit_giga:
    foreground: "#ca7f32"
  unit_huge:
    foreground: "#d35c5c"

users:
  user_you:
    foreground: "#cabcb1"
  user_root:
    foreground: "#d35c5c"
  user_other:
    foreground: "#bb90e2"
  group_yours:
    foreground: "#cabcb1"
  group_other:
    foreground: "#b4a490"
  group_root:
    foreground: "#d35c5c"

links:
  normal:
    foreground: "#6eb958"
  multi_link_file:
    foreground: "#cabcb1"
    background: "#6eb958"

git:
  new:
    foreground: "#b7ba53"
  modified:
    foreground: "#e0ac16"
  deleted:
    foreground: "#d35c5c"
  renamed:
    foreground: "#9d8b70"
  typechange:
    foreground: "#bb90e2"
  ignored:
    foreground: "#b4a490"
  conflicted:
    foreground: "#ca7f32"

git_repo:
  branch_main:
    foreground: "#cabcb1"
  branch_other:
    foreground: "#bb90e2"
  git_clean:
    foreground: "#b7ba53"
  git_dirty:
    foreground: "#d35c5c"

security_context:
  colon:
    foreground: "#b4a490"
  user:
    foreground: "#cabcb1"
  role:
    foreground: "#bb90e2"
  typ:
    foreground: "#b4a490"
  range:
    foreground: "#bb90e2"

file_type:
  image:
    foreground: "#e0ac16"
  video:
    foreground: "#b7ba53"
  music:
    foreground: "#b7ba53"
  lossless:
    foreground: "#cabcb1"
  crypto:
    foreground: "#b4a490"
  document:
    foreground: "#cabcb1"
  compressed:
    foreground: "#bb90e2"
  temp:
    foreground: "#9d8b70"
    is_dimmed: false
  compiled:
    foreground: "#88a4d3"
  build:
    foreground: "#b4a490"
    is_underline: false
  source:
    foreground: "#88a4d3"

punctuation:
    foreground: "#b4a490"
date:
    foreground: "#b4a490"
inode:
    foreground: "#b4a490"
blocks:
    foreground: "#b4a490"
header:
    foreground: "#cabcb1"
octal:
    foreground: "#9d8b70"
flags:
    foreground: "#bb90e2"

symlink_path:
    foreground: "#6eb958"
control_char:
    foreground: "#ca7f32"
broken_symlink:
    foreground: "#d35c5c"
broken_path_overlay:
    foreground: "#b4a490"
