# vim: ft=yaml

# Scheme Name: Bright
# Scheme Author: Chris Kempson (http://chriskempson.com)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#e0e0e0"
  directory:
    foreground: "#6fb3d2"
  symlink:
    foreground: "#76c7b7"
  pipe:
    foreground: "#d0d0d0"
  block_device:
    foreground: "#fda331"
  char_device:
    foreground: "#fda331"
  socket:
    foreground: "#d0d0d0"
  special:
    foreground: "#d381c3"
  executable:
    foreground: "#a1c659"
  mount_point:
    foreground: "#fda331"

perms:
  user_read:
    foreground: "#fda331"
  user_write:
    foreground: "#fb0120"
  user_execute_file:
    foreground: "#a1c659"
  user_execute_other:
    foreground: "#a1c659"
  group_read:
    foreground: "#fda331"
  group_write:
    foreground: "#fb0120"
  group_execute:
    foreground: "#a1c659"
  other_read:
    foreground: "#fda331"
  other_write:
    foreground: "#fb0120"
  other_execute:
    foreground: "#a1c659"
  special_user_file:
    foreground: "#d381c3"
  special_other:
    foreground: "#d0d0d0"
  attribute:
    foreground: "#d0d0d0"

size:
  major:
    foreground: "#a1c659"
  minor:
    foreground: "#a1c659"
  number_byte:
    foreground: "#d0d0d0"
  number_kilo:
    foreground: "#e0e0e0"
  number_mega:
    foreground: "#fda331"
  number_giga:
    foreground: "#fc6d24"
  number_huge:
    foreground: "#fb0120"
  unit_byte:
    foreground: "#d0d0d0"
  unit_kilo:
    foreground: "#e0e0e0"
  unit_mega:
    foreground: "#fda331"
  unit_giga:
    foreground: "#fc6d24"
  unit_huge:
    foreground: "#fb0120"

users:
  user_you:
    foreground: "#e0e0e0"
  user_root:
    foreground: "#fb0120"
  user_other:
    foreground: "#d381c3"
  group_yours:
    foreground: "#e0e0e0"
  group_other:
    foreground: "#d0d0d0"
  group_root:
    foreground: "#fb0120"

links:
  normal:
    foreground: "#76c7b7"
  multi_link_file:
    foreground: "#e0e0e0"
    background: "#76c7b7"

git:
  new:
    foreground: "#a1c659"
  modified:
    foreground: "#fda331"
  deleted:
    foreground: "#fb0120"
  renamed:
    foreground: "#b0b0b0"
  typechange:
    foreground: "#d381c3"
  ignored:
    foreground: "#d0d0d0"
  conflicted:
    foreground: "#fc6d24"

git_repo:
  branch_main:
    foreground: "#e0e0e0"
  branch_other:
    foreground: "#d381c3"
  git_clean:
    foreground: "#a1c659"
  git_dirty:
    foreground: "#fb0120"

security_context:
  colon:
    foreground: "#d0d0d0"
  user:
    foreground: "#e0e0e0"
  role:
    foreground: "#d381c3"
  typ:
    foreground: "#d0d0d0"
  range:
    foreground: "#d381c3"

file_type:
  image:
    foreground: "#fda331"
  video:
    foreground: "#a1c659"
  music:
    foreground: "#a1c659"
  lossless:
    foreground: "#e0e0e0"
  crypto:
    foreground: "#d0d0d0"
  document:
    foreground: "#e0e0e0"
  compressed:
    foreground: "#d381c3"
  temp:
    foreground: "#b0b0b0"
    is_dimmed: false
  compiled:
    foreground: "#6fb3d2"
  build:
    foreground: "#d0d0d0"
    is_underline: false
  source:
    foreground: "#6fb3d2"

punctuation:
    foreground: "#d0d0d0"
date:
    foreground: "#d0d0d0"
inode:
    foreground: "#d0d0d0"
blocks:
    foreground: "#d0d0d0"
header:
    foreground: "#e0e0e0"
octal:
    foreground: "#b0b0b0"
flags:
    foreground: "#d381c3"

symlink_path:
    foreground: "#76c7b7"
control_char:
    foreground: "#fc6d24"
broken_symlink:
    foreground: "#fb0120"
broken_path_overlay:
    foreground: "#d0d0d0"
