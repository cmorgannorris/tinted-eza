# vim: ft=yaml

# Scheme Name: Tomorrow
# Scheme Author: Chris Kempson (http://chriskempson.com)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#373b41"
  directory:
    foreground: "#4271ae"
  symlink:
    foreground: "#3e999f"
  pipe:
    foreground: "#969896"
  block_device:
    foreground: "#eab700"
  char_device:
    foreground: "#eab700"
  socket:
    foreground: "#969896"
  special:
    foreground: "#8959a8"
  executable:
    foreground: "#718c00"
  mount_point:
    foreground: "#eab700"

perms:
  user_read:
    foreground: "#eab700"
  user_write:
    foreground: "#c82829"
  user_execute_file:
    foreground: "#718c00"
  user_execute_other:
    foreground: "#718c00"
  group_read:
    foreground: "#eab700"
  group_write:
    foreground: "#c82829"
  group_execute:
    foreground: "#718c00"
  other_read:
    foreground: "#eab700"
  other_write:
    foreground: "#c82829"
  other_execute:
    foreground: "#718c00"
  special_user_file:
    foreground: "#8959a8"
  special_other:
    foreground: "#969896"
  attribute:
    foreground: "#969896"

size:
  major:
    foreground: "#718c00"
  minor:
    foreground: "#718c00"
  number_byte:
    foreground: "#969896"
  number_kilo:
    foreground: "#373b41"
  number_mega:
    foreground: "#eab700"
  number_giga:
    foreground: "#f5871f"
  number_huge:
    foreground: "#c82829"
  unit_byte:
    foreground: "#969896"
  unit_kilo:
    foreground: "#373b41"
  unit_mega:
    foreground: "#eab700"
  unit_giga:
    foreground: "#f5871f"
  unit_huge:
    foreground: "#c82829"

users:
  user_you:
    foreground: "#373b41"
  user_root:
    foreground: "#c82829"
  user_other:
    foreground: "#8959a8"
  group_yours:
    foreground: "#373b41"
  group_other:
    foreground: "#969896"
  group_root:
    foreground: "#c82829"

links:
  normal:
    foreground: "#3e999f"
  multi_link_file:
    foreground: "#373b41"
    background: "#3e999f"

git:
  new:
    foreground: "#718c00"
  modified:
    foreground: "#eab700"
  deleted:
    foreground: "#c82829"
  renamed:
    foreground: "#b4b7b4"
  typechange:
    foreground: "#8959a8"
  ignored:
    foreground: "#969896"
  conflicted:
    foreground: "#f5871f"

git_repo:
  branch_main:
    foreground: "#373b41"
  branch_other:
    foreground: "#8959a8"
  git_clean:
    foreground: "#718c00"
  git_dirty:
    foreground: "#c82829"

security_context:
  colon:
    foreground: "#969896"
  user:
    foreground: "#373b41"
  role:
    foreground: "#8959a8"
  typ:
    foreground: "#969896"
  range:
    foreground: "#8959a8"

file_type:
  image:
    foreground: "#eab700"
  video:
    foreground: "#718c00"
  music:
    foreground: "#718c00"
  lossless:
    foreground: "#373b41"
  crypto:
    foreground: "#969896"
  document:
    foreground: "#373b41"
  compressed:
    foreground: "#8959a8"
  temp:
    foreground: "#b4b7b4"
  compiled:
    foreground: "#4271ae"
  build:
    foreground: "#969896"
    is_underline: false
  source:
    foreground: "#4271ae"

punctuation:
    foreground: "#969896"
date:
    foreground: "#969896"
inode:
    foreground: "#969896"
blocks:
    foreground: "#969896"
header:
    foreground: "#373b41"
octal:
    foreground: "#b4b7b4"
flags:
    foreground: "#8959a8"

symlink_path:
    foreground: "#3e999f"
control_char:
    foreground: "#f5871f"
broken_symlink:
    foreground: "#c82829"
broken_path_overlay:
    foreground: "#969896"
