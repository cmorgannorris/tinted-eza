# vim: ft=yaml

# Scheme Name: Chicago Night
# Scheme Author: Wendell, Ryan &lt;ryanjwendell@gmail.com&gt;
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a7b8af"
  directory:
    foreground: "#522398"
  symlink:
    foreground: "#00a1de"
  pipe:
    foreground: "#8a9a91"
  block_device:
    foreground: "#f9e300"
  char_device:
    foreground: "#f9e300"
  socket:
    foreground: "#8a9a91"
  special:
    foreground: "#e27ea6"
  executable:
    foreground: "#009b3a"
  mount_point:
    foreground: "#f9e300"

perms:
  user_read:
    foreground: "#f9e300"
  user_write:
    foreground: "#c60c30"
  user_execute_file:
    foreground: "#009b3a"
  user_execute_other:
    foreground: "#009b3a"
  group_read:
    foreground: "#f9e300"
  group_write:
    foreground: "#c60c30"
  group_execute:
    foreground: "#009b3a"
  other_read:
    foreground: "#f9e300"
  other_write:
    foreground: "#c60c30"
  other_execute:
    foreground: "#009b3a"
  special_user_file:
    foreground: "#e27ea6"
  special_other:
    foreground: "#8a9a91"
  attribute:
    foreground: "#8a9a91"

size:
  major:
    foreground: "#009b3a"
  minor:
    foreground: "#009b3a"
  number_byte:
    foreground: "#8a9a91"
  number_kilo:
    foreground: "#a7b8af"
  number_mega:
    foreground: "#f9e300"
  number_giga:
    foreground: "#f9461c"
  number_huge:
    foreground: "#c60c30"
  unit_byte:
    foreground: "#8a9a91"
  unit_kilo:
    foreground: "#a7b8af"
  unit_mega:
    foreground: "#f9e300"
  unit_giga:
    foreground: "#f9461c"
  unit_huge:
    foreground: "#c60c30"

users:
  user_you:
    foreground: "#a7b8af"
  user_root:
    foreground: "#c60c30"
  user_other:
    foreground: "#e27ea6"
  group_yours:
    foreground: "#a7b8af"
  group_other:
    foreground: "#8a9a91"
  group_root:
    foreground: "#c60c30"

links:
  normal:
    foreground: "#00a1de"
  multi_link_file:
    foreground: "#a7b8af"
    background: "#00a1de"

git:
  new:
    foreground: "#009b3a"
  modified:
    foreground: "#f9e300"
  deleted:
    foreground: "#c60c30"
  renamed:
    foreground: "#5f7368"
  typechange:
    foreground: "#e27ea6"
  ignored:
    foreground: "#8a9a91"
  conflicted:
    foreground: "#f9461c"

git_repo:
  branch_main:
    foreground: "#a7b8af"
  branch_other:
    foreground: "#e27ea6"
  git_clean:
    foreground: "#009b3a"
  git_dirty:
    foreground: "#c60c30"

security_context:
  colon:
    foreground: "#8a9a91"
  user:
    foreground: "#a7b8af"
  role:
    foreground: "#e27ea6"
  typ:
    foreground: "#8a9a91"
  range:
    foreground: "#e27ea6"

file_type:
  image:
    foreground: "#f9e300"
  video:
    foreground: "#009b3a"
  music:
    foreground: "#009b3a"
  lossless:
    foreground: "#a7b8af"
  crypto:
    foreground: "#8a9a91"
  document:
    foreground: "#a7b8af"
  compressed:
    foreground: "#e27ea6"
  temp:
    foreground: "#5f7368"
    is_dimmed: false
  compiled:
    foreground: "#522398"
  build:
    foreground: "#8a9a91"
    is_underline: false
  source:
    foreground: "#522398"

punctuation:
    foreground: "#8a9a91"
date:
    foreground: "#8a9a91"
inode:
    foreground: "#8a9a91"
blocks:
    foreground: "#8a9a91"
header:
    foreground: "#a7b8af"
octal:
    foreground: "#5f7368"
flags:
    foreground: "#e27ea6"

symlink_path:
    foreground: "#00a1de"
control_char:
    foreground: "#f9461c"
broken_symlink:
    foreground: "#c60c30"
broken_path_overlay:
    foreground: "#8a9a91"
