# vim: ft=yaml

# Scheme Name: Solarized Dark Higher Contrast
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#aec2ba"
  directory:
    foreground: "#2075c7"
  symlink:
    foreground: "#259185"
  pipe:
    foreground: "#74a2a9"
  block_device:
    foreground: "#178dc7"
  char_device:
    foreground: "#178dc7"
  socket:
    foreground: "#74a2a9"
  special:
    foreground: "#c61b6e"
  executable:
    foreground: "#6bbe6c"
  mount_point:
    foreground: "#178dc7"

perms:
  user_read:
    foreground: "#178dc7"
  user_write:
    foreground: "#d01b24"
  user_execute_file:
    foreground: "#6bbe6c"
  user_execute_other:
    foreground: "#6bbe6c"
  group_read:
    foreground: "#178dc7"
  group_write:
    foreground: "#d01b24"
  group_execute:
    foreground: "#6bbe6c"
  other_read:
    foreground: "#178dc7"
  other_write:
    foreground: "#d01b24"
  other_execute:
    foreground: "#6bbe6c"
  special_user_file:
    foreground: "#c61b6e"
  special_other:
    foreground: "#74a2a9"
  attribute:
    foreground: "#74a2a9"

size:
  major:
    foreground: "#6bbe6c"
  minor:
    foreground: "#6bbe6c"
  number_byte:
    foreground: "#74a2a9"
  number_kilo:
    foreground: "#aec2ba"
  number_mega:
    foreground: "#178dc7"
  number_giga:
    foreground: "#a57705"
  number_huge:
    foreground: "#d01b24"
  unit_byte:
    foreground: "#74a2a9"
  unit_kilo:
    foreground: "#aec2ba"
  unit_mega:
    foreground: "#178dc7"
  unit_giga:
    foreground: "#a57705"
  unit_huge:
    foreground: "#d01b24"

users:
  user_you:
    foreground: "#aec2ba"
  user_root:
    foreground: "#d01b24"
  user_other:
    foreground: "#c61b6e"
  group_yours:
    foreground: "#aec2ba"
  group_other:
    foreground: "#74a2a9"
  group_root:
    foreground: "#d01b24"

links:
  normal:
    foreground: "#259185"
  multi_link_file:
    foreground: "#aec2ba"
    background: "#259185"

git:
  new:
    foreground: "#6bbe6c"
  modified:
    foreground: "#178dc7"
  deleted:
    foreground: "#d01b24"
  renamed:
    foreground: "#3a8298"
  typechange:
    foreground: "#c61b6e"
  ignored:
    foreground: "#74a2a9"
  conflicted:
    foreground: "#a57705"

git_repo:
  branch_main:
    foreground: "#aec2ba"
  branch_other:
    foreground: "#c61b6e"
  git_clean:
    foreground: "#6bbe6c"
  git_dirty:
    foreground: "#d01b24"

security_context:
  colon:
    foreground: "#74a2a9"
  user:
    foreground: "#aec2ba"
  role:
    foreground: "#c61b6e"
  typ:
    foreground: "#74a2a9"
  range:
    foreground: "#c61b6e"

file_type:
  image:
    foreground: "#178dc7"
  video:
    foreground: "#6bbe6c"
  music:
    foreground: "#6bbe6c"
  lossless:
    foreground: "#aec2ba"
  crypto:
    foreground: "#74a2a9"
  document:
    foreground: "#aec2ba"
  compressed:
    foreground: "#c61b6e"
  temp:
    foreground: "#3a8298"
    is_dimmed: false
  compiled:
    foreground: "#2075c7"
  build:
    foreground: "#74a2a9"
    is_underline: false
  source:
    foreground: "#2075c7"

punctuation:
    foreground: "#74a2a9"
date:
    foreground: "#74a2a9"
inode:
    foreground: "#74a2a9"
blocks:
    foreground: "#74a2a9"
header:
    foreground: "#aec2ba"
octal:
    foreground: "#3a8298"
flags:
    foreground: "#c61b6e"

symlink_path:
    foreground: "#259185"
control_char:
    foreground: "#a57705"
broken_symlink:
    foreground: "#d01b24"
broken_path_overlay:
    foreground: "#74a2a9"
