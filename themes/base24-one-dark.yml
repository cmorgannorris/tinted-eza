# vim: ft=yaml

# Scheme Name: One Dark
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#abb2bf"
  directory:
    foreground: "#4aa5f0"
  symlink:
    foreground: "#42b3c2"
  pipe:
    foreground: "#9196a1"
  block_device:
    foreground: "#e6b965"
  char_device:
    foreground: "#e6b965"
  socket:
    foreground: "#9196a1"
  special:
    foreground: "#c162de"
  executable:
    foreground: "#8cc265"
  mount_point:
    foreground: "#e6b965"

perms:
  user_read:
    foreground: "#e6b965"
  user_write:
    foreground: "#e05561"
  user_execute_file:
    foreground: "#8cc265"
  user_execute_other:
    foreground: "#8cc265"
  group_read:
    foreground: "#e6b965"
  group_write:
    foreground: "#e05561"
  group_execute:
    foreground: "#8cc265"
  other_read:
    foreground: "#e6b965"
  other_write:
    foreground: "#e05561"
  other_execute:
    foreground: "#8cc265"
  special_user_file:
    foreground: "#c162de"
  special_other:
    foreground: "#9196a1"
  attribute:
    foreground: "#9196a1"

size:
  major:
    foreground: "#8cc265"
  minor:
    foreground: "#8cc265"
  number_byte:
    foreground: "#9196a1"
  number_kilo:
    foreground: "#abb2bf"
  number_mega:
    foreground: "#e6b965"
  number_giga:
    foreground: "#d18f52"
  number_huge:
    foreground: "#e05561"
  unit_byte:
    foreground: "#9196a1"
  unit_kilo:
    foreground: "#abb2bf"
  unit_mega:
    foreground: "#e6b965"
  unit_giga:
    foreground: "#d18f52"
  unit_huge:
    foreground: "#e05561"

users:
  user_you:
    foreground: "#abb2bf"
  user_root:
    foreground: "#e05561"
  user_other:
    foreground: "#c162de"
  group_yours:
    foreground: "#abb2bf"
  group_other:
    foreground: "#9196a1"
  group_root:
    foreground: "#e05561"

links:
  normal:
    foreground: "#42b3c2"
  multi_link_file:
    foreground: "#abb2bf"
    background: "#42b3c2"

git:
  new:
    foreground: "#8cc265"
  modified:
    foreground: "#e6b965"
  deleted:
    foreground: "#e05561"
  renamed:
    foreground: "#545862"
  typechange:
    foreground: "#c162de"
  ignored:
    foreground: "#9196a1"
  conflicted:
    foreground: "#d18f52"

git_repo:
  branch_main:
    foreground: "#abb2bf"
  branch_other:
    foreground: "#c162de"
  git_clean:
    foreground: "#8cc265"
  git_dirty:
    foreground: "#e05561"

security_context:
  colon:
    foreground: "#9196a1"
  user:
    foreground: "#abb2bf"
  role:
    foreground: "#c162de"
  typ:
    foreground: "#9196a1"
  range:
    foreground: "#c162de"

file_type:
  image:
    foreground: "#e6b965"
  video:
    foreground: "#8cc265"
  music:
    foreground: "#8cc265"
  lossless:
    foreground: "#8cc265"
  crypto:
    foreground: "#9196a1"
  document:
    foreground: "#abb2bf"
  compressed:
    foreground: "#9196a1"
  temp:
    foreground: "#4f5666"
  compiled:
    foreground: "#4aa5f0"
  build:
    foreground: "#9196a1"
    is_underline: false
  source:
    foreground: "#4aa5f0"

punctuation:
    foreground: "#9196a1"
date:
    foreground: "#9196a1"
inode:
    foreground: "#9196a1"
blocks:
    foreground: "#9196a1"
header:
    foreground: "#abb2bf"
octal:
    foreground: "#545862"
flags:
    foreground: "#c162de"

symlink_path:
    foreground: "#42b3c2"
control_char:
    foreground: "#d18f52"
broken_symlink:
    foreground: "#e05561"
broken_path_overlay:
    foreground: "#9196a1"
