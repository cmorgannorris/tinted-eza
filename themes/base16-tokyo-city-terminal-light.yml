# vim: ft=yaml

# Scheme Name: Tokyo City Terminal Light
# Scheme Author: Michaël Ball
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#28323a"
  directory:
    foreground: "#34548a"
  symlink:
    foreground: "#0f4b6e"
  pipe:
    foreground: "#526270"
  block_device:
    foreground: "#8f5e15"
  char_device:
    foreground: "#8f5e15"
  socket:
    foreground: "#526270"
  special:
    foreground: "#5a4a78"
  executable:
    foreground: "#33635c"
  mount_point:
    foreground: "#8f5e15"

perms:
  user_read:
    foreground: "#8f5e15"
  user_write:
    foreground: "#8c4351"
  user_execute_file:
    foreground: "#33635c"
  user_execute_other:
    foreground: "#33635c"
  group_read:
    foreground: "#8f5e15"
  group_write:
    foreground: "#8c4351"
  group_execute:
    foreground: "#33635c"
  other_read:
    foreground: "#8f5e15"
  other_write:
    foreground: "#8c4351"
  other_execute:
    foreground: "#33635c"
  special_user_file:
    foreground: "#5a4a78"
  special_other:
    foreground: "#526270"
  attribute:
    foreground: "#526270"

size:
  major:
    foreground: "#33635c"
  minor:
    foreground: "#33635c"
  number_byte:
    foreground: "#526270"
  number_kilo:
    foreground: "#28323a"
  number_mega:
    foreground: "#8f5e15"
  number_giga:
    foreground: "#965027"
  number_huge:
    foreground: "#8c4351"
  unit_byte:
    foreground: "#526270"
  unit_kilo:
    foreground: "#28323a"
  unit_mega:
    foreground: "#8f5e15"
  unit_giga:
    foreground: "#965027"
  unit_huge:
    foreground: "#8c4351"

users:
  user_you:
    foreground: "#28323a"
  user_root:
    foreground: "#8c4351"
  user_other:
    foreground: "#5a4a78"
  group_yours:
    foreground: "#28323a"
  group_other:
    foreground: "#526270"
  group_root:
    foreground: "#8c4351"

links:
  normal:
    foreground: "#0f4b6e"
  multi_link_file:
    foreground: "#28323a"
    background: "#0f4b6e"

git:
  new:
    foreground: "#33635c"
  modified:
    foreground: "#8f5e15"
  deleted:
    foreground: "#8c4351"
  renamed:
    foreground: "#b7c5d3"
  typechange:
    foreground: "#5a4a78"
  ignored:
    foreground: "#526270"
  conflicted:
    foreground: "#965027"

git_repo:
  branch_main:
    foreground: "#28323a"
  branch_other:
    foreground: "#5a4a78"
  git_clean:
    foreground: "#33635c"
  git_dirty:
    foreground: "#8c4351"

security_context:
  colon:
    foreground: "#526270"
  user:
    foreground: "#28323a"
  role:
    foreground: "#5a4a78"
  typ:
    foreground: "#526270"
  range:
    foreground: "#5a4a78"

file_type:
  image:
    foreground: "#8f5e15"
  video:
    foreground: "#33635c"
  music:
    foreground: "#33635c"
  lossless:
    foreground: "#28323a"
  crypto:
    foreground: "#526270"
  document:
    foreground: "#28323a"
  compressed:
    foreground: "#5a4a78"
  temp:
    foreground: "#b7c5d3"
  compiled:
    foreground: "#34548a"
  build:
    foreground: "#526270"
    is_underline: false
  source:
    foreground: "#34548a"

punctuation:
    foreground: "#526270"
date:
    foreground: "#526270"
inode:
    foreground: "#526270"
blocks:
    foreground: "#526270"
header:
    foreground: "#28323a"
octal:
    foreground: "#b7c5d3"
flags:
    foreground: "#5a4a78"

symlink_path:
    foreground: "#0f4b6e"
control_char:
    foreground: "#965027"
broken_symlink:
    foreground: "#8c4351"
broken_path_overlay:
    foreground: "#526270"
