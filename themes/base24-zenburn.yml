# vim: ft=yaml

# Scheme Name: Zenburn
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#c1c9b9"
  directory:
    foreground: "#506070"
  symlink:
    foreground: "#8cd0d3"
  pipe:
    foreground: "#a6b6a6"
  block_device:
    foreground: "#94bff3"
  char_device:
    foreground: "#94bff3"
  socket:
    foreground: "#a6b6a6"
  special:
    foreground: "#dc8cc3"
  executable:
    foreground: "#60b48a"
  mount_point:
    foreground: "#94bff3"

perms:
  user_read:
    foreground: "#94bff3"
  user_write:
    foreground: "#705050"
  user_execute_file:
    foreground: "#60b48a"
  user_execute_other:
    foreground: "#60b48a"
  group_read:
    foreground: "#94bff3"
  group_write:
    foreground: "#705050"
  group_execute:
    foreground: "#60b48a"
  other_read:
    foreground: "#94bff3"
  other_write:
    foreground: "#705050"
  other_execute:
    foreground: "#60b48a"
  special_user_file:
    foreground: "#dc8cc3"
  special_other:
    foreground: "#a6b6a6"
  attribute:
    foreground: "#a6b6a6"

size:
  major:
    foreground: "#60b48a"
  minor:
    foreground: "#60b48a"
  number_byte:
    foreground: "#a6b6a6"
  number_kilo:
    foreground: "#c1c9b9"
  number_mega:
    foreground: "#94bff3"
  number_giga:
    foreground: "#f0dfaf"
  number_huge:
    foreground: "#705050"
  unit_byte:
    foreground: "#a6b6a6"
  unit_kilo:
    foreground: "#c1c9b9"
  unit_mega:
    foreground: "#94bff3"
  unit_giga:
    foreground: "#f0dfaf"
  unit_huge:
    foreground: "#705050"

users:
  user_you:
    foreground: "#c1c9b9"
  user_root:
    foreground: "#705050"
  user_other:
    foreground: "#dc8cc3"
  group_yours:
    foreground: "#c1c9b9"
  group_other:
    foreground: "#a6b6a6"
  group_root:
    foreground: "#705050"

links:
  normal:
    foreground: "#8cd0d3"
  multi_link_file:
    foreground: "#c1c9b9"
    background: "#8cd0d3"

git:
  new:
    foreground: "#60b48a"
  modified:
    foreground: "#94bff3"
  deleted:
    foreground: "#705050"
  renamed:
    foreground: "#8ba393"
  typechange:
    foreground: "#dc8cc3"
  ignored:
    foreground: "#a6b6a6"
  conflicted:
    foreground: "#f0dfaf"

git_repo:
  branch_main:
    foreground: "#c1c9b9"
  branch_other:
    foreground: "#dc8cc3"
  git_clean:
    foreground: "#60b48a"
  git_dirty:
    foreground: "#705050"

security_context:
  colon:
    foreground: "#a6b6a6"
  user:
    foreground: "#c1c9b9"
  role:
    foreground: "#dc8cc3"
  typ:
    foreground: "#a6b6a6"
  range:
    foreground: "#dc8cc3"

file_type:
  image:
    foreground: "#94bff3"
  video:
    foreground: "#60b48a"
  music:
    foreground: "#60b48a"
  lossless:
    foreground: "#c1c9b9"
  crypto:
    foreground: "#a6b6a6"
  document:
    foreground: "#c1c9b9"
  compressed:
    foreground: "#dc8cc3"
  temp:
    foreground: "#8ba393"
  compiled:
    foreground: "#506070"
  build:
    foreground: "#a6b6a6"
    is_underline: false
  source:
    foreground: "#506070"

punctuation:
    foreground: "#a6b6a6"
date:
    foreground: "#a6b6a6"
inode:
    foreground: "#a6b6a6"
blocks:
    foreground: "#a6b6a6"
header:
    foreground: "#c1c9b9"
octal:
    foreground: "#8ba393"
flags:
    foreground: "#dc8cc3"

symlink_path:
    foreground: "#8cd0d3"
control_char:
    foreground: "#f0dfaf"
broken_symlink:
    foreground: "#705050"
broken_path_overlay:
    foreground: "#a6b6a6"
