# vim: ft=yaml

# Scheme Name: Chinoiserie Night
# Scheme Author: Di Wang (https://cs.cmu.edu/~diw3)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c4cbcf"
  directory:
    foreground: "#8fb2c9"
  symlink:
    foreground: "#b0d5df"
  pipe:
    foreground: "#bdaead"
  block_device:
    foreground: "#f4ce69"
  char_device:
    foreground: "#f4ce69"
  socket:
    foreground: "#bdaead"
  special:
    foreground: "#be9db9"
  executable:
    foreground: "#b2cf87"
  mount_point:
    foreground: "#f4ce69"

perms:
  user_read:
    foreground: "#f4ce69"
  user_write:
    foreground: "#f07c82"
  user_execute_file:
    foreground: "#b2cf87"
  user_execute_other:
    foreground: "#b2cf87"
  group_read:
    foreground: "#f4ce69"
  group_write:
    foreground: "#f07c82"
  group_execute:
    foreground: "#b2cf87"
  other_read:
    foreground: "#f4ce69"
  other_write:
    foreground: "#f07c82"
  other_execute:
    foreground: "#b2cf87"
  special_user_file:
    foreground: "#be9db9"
  special_other:
    foreground: "#bdaead"
  attribute:
    foreground: "#bdaead"

size:
  major:
    foreground: "#b2cf87"
  minor:
    foreground: "#b2cf87"
  number_byte:
    foreground: "#bdaead"
  number_kilo:
    foreground: "#c4cbcf"
  number_mega:
    foreground: "#f4ce69"
  number_giga:
    foreground: "#f4a83a"
  number_huge:
    foreground: "#f07c82"
  unit_byte:
    foreground: "#bdaead"
  unit_kilo:
    foreground: "#c4cbcf"
  unit_mega:
    foreground: "#f4ce69"
  unit_giga:
    foreground: "#f4a83a"
  unit_huge:
    foreground: "#f07c82"

users:
  user_you:
    foreground: "#c4cbcf"
  user_root:
    foreground: "#f07c82"
  user_other:
    foreground: "#be9db9"
  group_yours:
    foreground: "#c4cbcf"
  group_other:
    foreground: "#bdaead"
  group_root:
    foreground: "#f07c82"

links:
  normal:
    foreground: "#b0d5df"
  multi_link_file:
    foreground: "#c4cbcf"
    background: "#b0d5df"

git:
  new:
    foreground: "#b2cf87"
  modified:
    foreground: "#f4ce69"
  deleted:
    foreground: "#f07c82"
  renamed:
    foreground: "#918072"
  typechange:
    foreground: "#be9db9"
  ignored:
    foreground: "#bdaead"
  conflicted:
    foreground: "#f4a83a"

git_repo:
  branch_main:
    foreground: "#c4cbcf"
  branch_other:
    foreground: "#be9db9"
  git_clean:
    foreground: "#b2cf87"
  git_dirty:
    foreground: "#f07c82"

security_context:
  colon:
    foreground: "#bdaead"
  user:
    foreground: "#c4cbcf"
  role:
    foreground: "#be9db9"
  typ:
    foreground: "#bdaead"
  range:
    foreground: "#be9db9"

file_type:
  image:
    foreground: "#f4ce69"
  video:
    foreground: "#b2cf87"
  music:
    foreground: "#b2cf87"
  lossless:
    foreground: "#c4cbcf"
  crypto:
    foreground: "#bdaead"
  document:
    foreground: "#c4cbcf"
  compressed:
    foreground: "#be9db9"
  temp:
    foreground: "#918072"
    is_dimmed: false
  compiled:
    foreground: "#8fb2c9"
  build:
    foreground: "#bdaead"
    is_underline: false
  source:
    foreground: "#8fb2c9"

punctuation:
    foreground: "#bdaead"
date:
    foreground: "#bdaead"
inode:
    foreground: "#bdaead"
blocks:
    foreground: "#bdaead"
header:
    foreground: "#c4cbcf"
octal:
    foreground: "#918072"
flags:
    foreground: "#be9db9"

symlink_path:
    foreground: "#b0d5df"
control_char:
    foreground: "#f4a83a"
broken_symlink:
    foreground: "#f07c82"
broken_path_overlay:
    foreground: "#bdaead"
