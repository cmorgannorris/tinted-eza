# vim: ft=yaml

# Scheme Name: Material Palenight
# Scheme Author: Nate Peterson
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#959dcb"
  directory:
    foreground: "#82aaff"
  symlink:
    foreground: "#89ddff"
  pipe:
    foreground: "#8796b0"
  block_device:
    foreground: "#ffcb6b"
  char_device:
    foreground: "#ffcb6b"
  socket:
    foreground: "#8796b0"
  special:
    foreground: "#c792ea"
  executable:
    foreground: "#c3e88d"
  mount_point:
    foreground: "#ffcb6b"

perms:
  user_read:
    foreground: "#ffcb6b"
  user_write:
    foreground: "#f07178"
  user_execute_file:
    foreground: "#c3e88d"
  user_execute_other:
    foreground: "#c3e88d"
  group_read:
    foreground: "#ffcb6b"
  group_write:
    foreground: "#f07178"
  group_execute:
    foreground: "#c3e88d"
  other_read:
    foreground: "#ffcb6b"
  other_write:
    foreground: "#f07178"
  other_execute:
    foreground: "#c3e88d"
  special_user_file:
    foreground: "#c792ea"
  special_other:
    foreground: "#8796b0"
  attribute:
    foreground: "#8796b0"

size:
  major:
    foreground: "#c3e88d"
  minor:
    foreground: "#c3e88d"
  number_byte:
    foreground: "#8796b0"
  number_kilo:
    foreground: "#959dcb"
  number_mega:
    foreground: "#ffcb6b"
  number_giga:
    foreground: "#f78c6c"
  number_huge:
    foreground: "#f07178"
  unit_byte:
    foreground: "#8796b0"
  unit_kilo:
    foreground: "#959dcb"
  unit_mega:
    foreground: "#ffcb6b"
  unit_giga:
    foreground: "#f78c6c"
  unit_huge:
    foreground: "#f07178"

users:
  user_you:
    foreground: "#959dcb"
  user_root:
    foreground: "#f07178"
  user_other:
    foreground: "#c792ea"
  group_yours:
    foreground: "#959dcb"
  group_other:
    foreground: "#8796b0"
  group_root:
    foreground: "#f07178"

links:
  normal:
    foreground: "#89ddff"
  multi_link_file:
    foreground: "#959dcb"
    background: "#89ddff"

git:
  new:
    foreground: "#c3e88d"
  modified:
    foreground: "#ffcb6b"
  deleted:
    foreground: "#f07178"
  renamed:
    foreground: "#676e95"
  typechange:
    foreground: "#c792ea"
  ignored:
    foreground: "#8796b0"
  conflicted:
    foreground: "#f78c6c"

git_repo:
  branch_main:
    foreground: "#959dcb"
  branch_other:
    foreground: "#c792ea"
  git_clean:
    foreground: "#c3e88d"
  git_dirty:
    foreground: "#f07178"

security_context:
  colon:
    foreground: "#8796b0"
  user:
    foreground: "#959dcb"
  role:
    foreground: "#c792ea"
  typ:
    foreground: "#8796b0"
  range:
    foreground: "#c792ea"

file_type:
  image:
    foreground: "#ffcb6b"
  video:
    foreground: "#c3e88d"
  music:
    foreground: "#c3e88d"
  lossless:
    foreground: "#959dcb"
  crypto:
    foreground: "#8796b0"
  document:
    foreground: "#959dcb"
  compressed:
    foreground: "#c792ea"
  temp:
    foreground: "#676e95"
    is_dimmed: false
  compiled:
    foreground: "#82aaff"
  build:
    foreground: "#8796b0"
    is_underline: false
  source:
    foreground: "#82aaff"

punctuation:
    foreground: "#8796b0"
date:
    foreground: "#8796b0"
inode:
    foreground: "#8796b0"
blocks:
    foreground: "#8796b0"
header:
    foreground: "#959dcb"
octal:
    foreground: "#676e95"
flags:
    foreground: "#c792ea"

symlink_path:
    foreground: "#89ddff"
control_char:
    foreground: "#f78c6c"
broken_symlink:
    foreground: "#f07178"
broken_path_overlay:
    foreground: "#8796b0"
