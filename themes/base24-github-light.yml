# vim: ft=yaml

# Scheme Name: Github Light
# Scheme Author: Tinted Theming (https://github.com/tinted-theming)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#424a53"
  directory:
    foreground: "#218bff"
  symlink:
    foreground: "#339d9b"
  pipe:
    foreground: "#6e7781"
  block_device:
    foreground: "#bf8700"
  char_device:
    foreground: "#bf8700"
  socket:
    foreground: "#6e7781"
  special:
    foreground: "#a475f9"
  executable:
    foreground: "#2da44e"
  mount_point:
    foreground: "#bf8700"

perms:
  user_read:
    foreground: "#bf8700"
  user_write:
    foreground: "#fa4549"
  user_execute_file:
    foreground: "#2da44e"
  user_execute_other:
    foreground: "#2da44e"
  group_read:
    foreground: "#bf8700"
  group_write:
    foreground: "#fa4549"
  group_execute:
    foreground: "#2da44e"
  other_read:
    foreground: "#bf8700"
  other_write:
    foreground: "#fa4549"
  other_execute:
    foreground: "#2da44e"
  special_user_file:
    foreground: "#a475f9"
  special_other:
    foreground: "#6e7781"
  attribute:
    foreground: "#6e7781"

size:
  major:
    foreground: "#2da44e"
  minor:
    foreground: "#2da44e"
  number_byte:
    foreground: "#6e7781"
  number_kilo:
    foreground: "#424a53"
  number_mega:
    foreground: "#bf8700"
  number_giga:
    foreground: "#e16f24"
  number_huge:
    foreground: "#fa4549"
  unit_byte:
    foreground: "#6e7781"
  unit_kilo:
    foreground: "#424a53"
  unit_mega:
    foreground: "#bf8700"
  unit_giga:
    foreground: "#e16f24"
  unit_huge:
    foreground: "#fa4549"

users:
  user_you:
    foreground: "#424a53"
  user_root:
    foreground: "#fa4549"
  user_other:
    foreground: "#a475f9"
  group_yours:
    foreground: "#424a53"
  group_other:
    foreground: "#6e7781"
  group_root:
    foreground: "#fa4549"

links:
  normal:
    foreground: "#339d9b"
  multi_link_file:
    foreground: "#424a53"
    background: "#339d9b"

git:
  new:
    foreground: "#2da44e"
  modified:
    foreground: "#bf8700"
  deleted:
    foreground: "#fa4549"
  renamed:
    foreground: "#8c959f"
  typechange:
    foreground: "#a475f9"
  ignored:
    foreground: "#6e7781"
  conflicted:
    foreground: "#e16f24"

git_repo:
  branch_main:
    foreground: "#424a53"
  branch_other:
    foreground: "#a475f9"
  git_clean:
    foreground: "#2da44e"
  git_dirty:
    foreground: "#fa4549"

security_context:
  colon:
    foreground: "#6e7781"
  user:
    foreground: "#424a53"
  role:
    foreground: "#a475f9"
  typ:
    foreground: "#6e7781"
  range:
    foreground: "#a475f9"

file_type:
  image:
    foreground: "#bf8700"
  video:
    foreground: "#2da44e"
  music:
    foreground: "#2da44e"
  lossless:
    foreground: "#2da44e"
  crypto:
    foreground: "#6e7781"
  document:
    foreground: "#424a53"
  compressed:
    foreground: "#6e7781"
  temp:
    foreground: "#afb8c1"
  compiled:
    foreground: "#218bff"
  build:
    foreground: "#6e7781"
    is_underline: false
  source:
    foreground: "#218bff"

punctuation:
    foreground: "#6e7781"
date:
    foreground: "#6e7781"
inode:
    foreground: "#6e7781"
blocks:
    foreground: "#6e7781"
header:
    foreground: "#424a53"
octal:
    foreground: "#8c959f"
flags:
    foreground: "#a475f9"

symlink_path:
    foreground: "#339d9b"
control_char:
    foreground: "#e16f24"
broken_symlink:
    foreground: "#fa4549"
broken_path_overlay:
    foreground: "#6e7781"
