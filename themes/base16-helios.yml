# vim: ft=yaml

# Scheme Name: Helios
# Scheme Author: Alex Meyer (https://github.com/reyemxela)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d5d5d5"
  directory:
    foreground: "#1e8bac"
  symlink:
    foreground: "#1ba595"
  pipe:
    foreground: "#cdcdcd"
  block_device:
    foreground: "#f19d1a"
  char_device:
    foreground: "#f19d1a"
  socket:
    foreground: "#cdcdcd"
  special:
    foreground: "#be4264"
  executable:
    foreground: "#88b92d"
  mount_point:
    foreground: "#f19d1a"

perms:
  user_read:
    foreground: "#f19d1a"
  user_write:
    foreground: "#d72638"
  user_execute_file:
    foreground: "#88b92d"
  user_execute_other:
    foreground: "#88b92d"
  group_read:
    foreground: "#f19d1a"
  group_write:
    foreground: "#d72638"
  group_execute:
    foreground: "#88b92d"
  other_read:
    foreground: "#f19d1a"
  other_write:
    foreground: "#d72638"
  other_execute:
    foreground: "#88b92d"
  special_user_file:
    foreground: "#be4264"
  special_other:
    foreground: "#cdcdcd"
  attribute:
    foreground: "#cdcdcd"

size:
  major:
    foreground: "#88b92d"
  minor:
    foreground: "#88b92d"
  number_byte:
    foreground: "#cdcdcd"
  number_kilo:
    foreground: "#d5d5d5"
  number_mega:
    foreground: "#f19d1a"
  number_giga:
    foreground: "#eb8413"
  number_huge:
    foreground: "#d72638"
  unit_byte:
    foreground: "#cdcdcd"
  unit_kilo:
    foreground: "#d5d5d5"
  unit_mega:
    foreground: "#f19d1a"
  unit_giga:
    foreground: "#eb8413"
  unit_huge:
    foreground: "#d72638"

users:
  user_you:
    foreground: "#d5d5d5"
  user_root:
    foreground: "#d72638"
  user_other:
    foreground: "#be4264"
  group_yours:
    foreground: "#d5d5d5"
  group_other:
    foreground: "#cdcdcd"
  group_root:
    foreground: "#d72638"

links:
  normal:
    foreground: "#1ba595"
  multi_link_file:
    foreground: "#d5d5d5"
    background: "#1ba595"

git:
  new:
    foreground: "#88b92d"
  modified:
    foreground: "#f19d1a"
  deleted:
    foreground: "#d72638"
  renamed:
    foreground: "#6f7579"
  typechange:
    foreground: "#be4264"
  ignored:
    foreground: "#cdcdcd"
  conflicted:
    foreground: "#eb8413"

git_repo:
  branch_main:
    foreground: "#d5d5d5"
  branch_other:
    foreground: "#be4264"
  git_clean:
    foreground: "#88b92d"
  git_dirty:
    foreground: "#d72638"

security_context:
  colon:
    foreground: "#cdcdcd"
  user:
    foreground: "#d5d5d5"
  role:
    foreground: "#be4264"
  typ:
    foreground: "#cdcdcd"
  range:
    foreground: "#be4264"

file_type:
  image:
    foreground: "#f19d1a"
  video:
    foreground: "#88b92d"
  music:
    foreground: "#88b92d"
  lossless:
    foreground: "#d5d5d5"
  crypto:
    foreground: "#cdcdcd"
  document:
    foreground: "#d5d5d5"
  compressed:
    foreground: "#be4264"
  temp:
    foreground: "#6f7579"
  compiled:
    foreground: "#1e8bac"
  build:
    foreground: "#cdcdcd"
    is_underline: false
  source:
    foreground: "#1e8bac"

punctuation:
    foreground: "#cdcdcd"
date:
    foreground: "#cdcdcd"
inode:
    foreground: "#cdcdcd"
blocks:
    foreground: "#cdcdcd"
header:
    foreground: "#d5d5d5"
octal:
    foreground: "#6f7579"
flags:
    foreground: "#be4264"

symlink_path:
    foreground: "#1ba595"
control_char:
    foreground: "#eb8413"
broken_symlink:
    foreground: "#d72638"
broken_path_overlay:
    foreground: "#cdcdcd"
