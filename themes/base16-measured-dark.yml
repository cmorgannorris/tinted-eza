# vim: ft=yaml

# Scheme Name: Measured Dark
# Scheme Author: Measured (https://measured.co)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#dcdcdc"
  directory:
    foreground: "#88b0da"
  symlink:
    foreground: "#62c0be"
  pipe:
    foreground: "#c3c3c3"
  block_device:
    foreground: "#bfac4e"
  char_device:
    foreground: "#bfac4e"
  socket:
    foreground: "#c3c3c3"
  special:
    foreground: "#b39be0"
  executable:
    foreground: "#56c16f"
  mount_point:
    foreground: "#bfac4e"

perms:
  user_read:
    foreground: "#bfac4e"
  user_write:
    foreground: "#ce7e8e"
  user_execute_file:
    foreground: "#56c16f"
  user_execute_other:
    foreground: "#56c16f"
  group_read:
    foreground: "#bfac4e"
  group_write:
    foreground: "#ce7e8e"
  group_execute:
    foreground: "#56c16f"
  other_read:
    foreground: "#bfac4e"
  other_write:
    foreground: "#ce7e8e"
  other_execute:
    foreground: "#56c16f"
  special_user_file:
    foreground: "#b39be0"
  special_other:
    foreground: "#c3c3c3"
  attribute:
    foreground: "#c3c3c3"

size:
  major:
    foreground: "#56c16f"
  minor:
    foreground: "#56c16f"
  number_byte:
    foreground: "#c3c3c3"
  number_kilo:
    foreground: "#dcdcdc"
  number_mega:
    foreground: "#bfac4e"
  number_giga:
    foreground: "#dca37c"
  number_huge:
    foreground: "#ce7e8e"
  unit_byte:
    foreground: "#c3c3c3"
  unit_kilo:
    foreground: "#dcdcdc"
  unit_mega:
    foreground: "#bfac4e"
  unit_giga:
    foreground: "#dca37c"
  unit_huge:
    foreground: "#ce7e8e"

users:
  user_you:
    foreground: "#dcdcdc"
  user_root:
    foreground: "#ce7e8e"
  user_other:
    foreground: "#b39be0"
  group_yours:
    foreground: "#dcdcdc"
  group_other:
    foreground: "#c3c3c3"
  group_root:
    foreground: "#ce7e8e"

links:
  normal:
    foreground: "#62c0be"
  multi_link_file:
    foreground: "#dcdcdc"
    background: "#62c0be"

git:
  new:
    foreground: "#56c16f"
  modified:
    foreground: "#bfac4e"
  deleted:
    foreground: "#ce7e8e"
  renamed:
    foreground: "#ababab"
  typechange:
    foreground: "#b39be0"
  ignored:
    foreground: "#c3c3c3"
  conflicted:
    foreground: "#dca37c"

git_repo:
  branch_main:
    foreground: "#dcdcdc"
  branch_other:
    foreground: "#b39be0"
  git_clean:
    foreground: "#56c16f"
  git_dirty:
    foreground: "#ce7e8e"

security_context:
  colon:
    foreground: "#c3c3c3"
  user:
    foreground: "#dcdcdc"
  role:
    foreground: "#b39be0"
  typ:
    foreground: "#c3c3c3"
  range:
    foreground: "#b39be0"

file_type:
  image:
    foreground: "#bfac4e"
  video:
    foreground: "#56c16f"
  music:
    foreground: "#56c16f"
  lossless:
    foreground: "#dcdcdc"
  crypto:
    foreground: "#c3c3c3"
  document:
    foreground: "#dcdcdc"
  compressed:
    foreground: "#b39be0"
  temp:
    foreground: "#ababab"
    is_dimmed: false
  compiled:
    foreground: "#88b0da"
  build:
    foreground: "#c3c3c3"
    is_underline: false
  source:
    foreground: "#88b0da"

punctuation:
    foreground: "#c3c3c3"
date:
    foreground: "#c3c3c3"
inode:
    foreground: "#c3c3c3"
blocks:
    foreground: "#c3c3c3"
header:
    foreground: "#dcdcdc"
octal:
    foreground: "#ababab"
flags:
    foreground: "#b39be0"

symlink_path:
    foreground: "#62c0be"
control_char:
    foreground: "#dca37c"
broken_symlink:
    foreground: "#ce7e8e"
broken_path_overlay:
    foreground: "#c3c3c3"
