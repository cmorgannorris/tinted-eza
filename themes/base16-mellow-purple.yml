# vim: ft=yaml

# Scheme Name: Mellow Purple
# Scheme Author: gidsi
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#ffeeff"
  directory:
    foreground: "#550068"
  symlink:
    foreground: "#b900b1"
  pipe:
    foreground: "#873582"
  block_device:
    foreground: "#955ae7"
  char_device:
    foreground: "#955ae7"
  socket:
    foreground: "#873582"
  special:
    foreground: "#8991bb"
  executable:
    foreground: "#05cb0d"
  mount_point:
    foreground: "#955ae7"

perms:
  user_read:
    foreground: "#955ae7"
  user_write:
    foreground: "#00d9e9"
  user_execute_file:
    foreground: "#05cb0d"
  user_execute_other:
    foreground: "#05cb0d"
  group_read:
    foreground: "#955ae7"
  group_write:
    foreground: "#00d9e9"
  group_execute:
    foreground: "#05cb0d"
  other_read:
    foreground: "#955ae7"
  other_write:
    foreground: "#00d9e9"
  other_execute:
    foreground: "#05cb0d"
  special_user_file:
    foreground: "#8991bb"
  special_other:
    foreground: "#873582"
  attribute:
    foreground: "#873582"

size:
  major:
    foreground: "#05cb0d"
  minor:
    foreground: "#05cb0d"
  number_byte:
    foreground: "#873582"
  number_kilo:
    foreground: "#ffeeff"
  number_mega:
    foreground: "#955ae7"
  number_giga:
    foreground: "#aa00a3"
  number_huge:
    foreground: "#00d9e9"
  unit_byte:
    foreground: "#873582"
  unit_kilo:
    foreground: "#ffeeff"
  unit_mega:
    foreground: "#955ae7"
  unit_giga:
    foreground: "#aa00a3"
  unit_huge:
    foreground: "#00d9e9"

users:
  user_you:
    foreground: "#ffeeff"
  user_root:
    foreground: "#00d9e9"
  user_other:
    foreground: "#8991bb"
  group_yours:
    foreground: "#ffeeff"
  group_other:
    foreground: "#873582"
  group_root:
    foreground: "#00d9e9"

links:
  normal:
    foreground: "#b900b1"
  multi_link_file:
    foreground: "#ffeeff"
    background: "#b900b1"

git:
  new:
    foreground: "#05cb0d"
  modified:
    foreground: "#955ae7"
  deleted:
    foreground: "#00d9e9"
  renamed:
    foreground: "#320f55"
  typechange:
    foreground: "#8991bb"
  ignored:
    foreground: "#873582"
  conflicted:
    foreground: "#aa00a3"

git_repo:
  branch_main:
    foreground: "#ffeeff"
  branch_other:
    foreground: "#8991bb"
  git_clean:
    foreground: "#05cb0d"
  git_dirty:
    foreground: "#00d9e9"

security_context:
  colon:
    foreground: "#873582"
  user:
    foreground: "#ffeeff"
  role:
    foreground: "#8991bb"
  typ:
    foreground: "#873582"
  range:
    foreground: "#8991bb"

file_type:
  image:
    foreground: "#955ae7"
  video:
    foreground: "#05cb0d"
  music:
    foreground: "#05cb0d"
  lossless:
    foreground: "#ffeeff"
  crypto:
    foreground: "#873582"
  document:
    foreground: "#ffeeff"
  compressed:
    foreground: "#8991bb"
  temp:
    foreground: "#320f55"
  compiled:
    foreground: "#550068"
  build:
    foreground: "#873582"
    is_underline: false
  source:
    foreground: "#550068"

punctuation:
    foreground: "#873582"
date:
    foreground: "#873582"
inode:
    foreground: "#873582"
blocks:
    foreground: "#873582"
header:
    foreground: "#ffeeff"
octal:
    foreground: "#320f55"
flags:
    foreground: "#8991bb"

symlink_path:
    foreground: "#b900b1"
control_char:
    foreground: "#aa00a3"
broken_symlink:
    foreground: "#00d9e9"
broken_path_overlay:
    foreground: "#873582"
