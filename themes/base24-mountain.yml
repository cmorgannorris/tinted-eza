# vim: ft=yaml

# Scheme Name: Mountain
# Scheme Author: Stefan Weigl-Bosker (https://github.com/sweiglbosker), based on Mountain Theme (https://github.com/mountain-theme/Mountain)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#cacaca"
  directory:
    foreground: "#8f8aac"
  symlink:
    foreground: "#8aabac"
  pipe:
    foreground: "#4c4c4c"
  block_device:
    foreground: "#aca98a"
  char_device:
    foreground: "#aca98a"
  socket:
    foreground: "#4c4c4c"
  special:
    foreground: "#ac8aac"
  executable:
    foreground: "#8aac8b"
  mount_point:
    foreground: "#aca98a"

perms:
  user_read:
    foreground: "#aca98a"
  user_write:
    foreground: "#ac8a8c"
  user_execute_file:
    foreground: "#8aac8b"
  user_execute_other:
    foreground: "#8aac8b"
  group_read:
    foreground: "#aca98a"
  group_write:
    foreground: "#ac8a8c"
  group_execute:
    foreground: "#8aac8b"
  other_read:
    foreground: "#aca98a"
  other_write:
    foreground: "#ac8a8c"
  other_execute:
    foreground: "#8aac8b"
  special_user_file:
    foreground: "#ac8aac"
  special_other:
    foreground: "#4c4c4c"
  attribute:
    foreground: "#4c4c4c"

size:
  major:
    foreground: "#8aac8b"
  minor:
    foreground: "#8aac8b"
  number_byte:
    foreground: "#4c4c4c"
  number_kilo:
    foreground: "#cacaca"
  number_mega:
    foreground: "#aca98a"
  number_giga:
    foreground: "#c6a679"
  number_huge:
    foreground: "#ac8a8c"
  unit_byte:
    foreground: "#4c4c4c"
  unit_kilo:
    foreground: "#cacaca"
  unit_mega:
    foreground: "#aca98a"
  unit_giga:
    foreground: "#c6a679"
  unit_huge:
    foreground: "#ac8a8c"

users:
  user_you:
    foreground: "#cacaca"
  user_root:
    foreground: "#ac8a8c"
  user_other:
    foreground: "#ac8aac"
  group_yours:
    foreground: "#cacaca"
  group_other:
    foreground: "#4c4c4c"
  group_root:
    foreground: "#ac8a8c"

links:
  normal:
    foreground: "#8aabac"
  multi_link_file:
    foreground: "#cacaca"
    background: "#8aabac"

git:
  new:
    foreground: "#8aac8b"
  modified:
    foreground: "#aca98a"
  deleted:
    foreground: "#ac8a8c"
  renamed:
    foreground: "#393939"
  typechange:
    foreground: "#ac8aac"
  ignored:
    foreground: "#4c4c4c"
  conflicted:
    foreground: "#c6a679"

git_repo:
  branch_main:
    foreground: "#cacaca"
  branch_other:
    foreground: "#ac8aac"
  git_clean:
    foreground: "#8aac8b"
  git_dirty:
    foreground: "#ac8a8c"

security_context:
  colon:
    foreground: "#4c4c4c"
  user:
    foreground: "#cacaca"
  role:
    foreground: "#ac8aac"
  typ:
    foreground: "#4c4c4c"
  range:
    foreground: "#ac8aac"

file_type:
  image:
    foreground: "#aca98a"
  video:
    foreground: "#8aac8b"
  music:
    foreground: "#8aac8b"
  lossless:
    foreground: "#8aac8b"
  crypto:
    foreground: "#4c4c4c"
  document:
    foreground: "#cacaca"
  compressed:
    foreground: "#4c4c4c"
  temp:
    foreground: "#262626"
  compiled:
    foreground: "#8f8aac"
  build:
    foreground: "#4c4c4c"
    is_underline: false
  source:
    foreground: "#8f8aac"

punctuation:
    foreground: "#4c4c4c"
date:
    foreground: "#4c4c4c"
inode:
    foreground: "#4c4c4c"
blocks:
    foreground: "#4c4c4c"
header:
    foreground: "#cacaca"
octal:
    foreground: "#393939"
flags:
    foreground: "#ac8aac"

symlink_path:
    foreground: "#8aabac"
control_char:
    foreground: "#c6a679"
broken_symlink:
    foreground: "#ac8a8c"
broken_path_overlay:
    foreground: "#4c4c4c"
