# vim: ft=yaml

# Scheme Name: Flat
# Scheme Author: Chris Kempson (http://chriskempson.com)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#e0e0e0"
  directory:
    foreground: "#3498db"
  symlink:
    foreground: "#1abc9c"
  pipe:
    foreground: "#bdc3c7"
  block_device:
    foreground: "#f1c40f"
  char_device:
    foreground: "#f1c40f"
  socket:
    foreground: "#bdc3c7"
  special:
    foreground: "#9b59b6"
  executable:
    foreground: "#2ecc71"
  mount_point:
    foreground: "#f1c40f"

perms:
  user_read:
    foreground: "#f1c40f"
  user_write:
    foreground: "#e74c3c"
  user_execute_file:
    foreground: "#2ecc71"
  user_execute_other:
    foreground: "#2ecc71"
  group_read:
    foreground: "#f1c40f"
  group_write:
    foreground: "#e74c3c"
  group_execute:
    foreground: "#2ecc71"
  other_read:
    foreground: "#f1c40f"
  other_write:
    foreground: "#e74c3c"
  other_execute:
    foreground: "#2ecc71"
  special_user_file:
    foreground: "#9b59b6"
  special_other:
    foreground: "#bdc3c7"
  attribute:
    foreground: "#bdc3c7"

size:
  major:
    foreground: "#2ecc71"
  minor:
    foreground: "#2ecc71"
  number_byte:
    foreground: "#bdc3c7"
  number_kilo:
    foreground: "#e0e0e0"
  number_mega:
    foreground: "#f1c40f"
  number_giga:
    foreground: "#e67e22"
  number_huge:
    foreground: "#e74c3c"
  unit_byte:
    foreground: "#bdc3c7"
  unit_kilo:
    foreground: "#e0e0e0"
  unit_mega:
    foreground: "#f1c40f"
  unit_giga:
    foreground: "#e67e22"
  unit_huge:
    foreground: "#e74c3c"

users:
  user_you:
    foreground: "#e0e0e0"
  user_root:
    foreground: "#e74c3c"
  user_other:
    foreground: "#9b59b6"
  group_yours:
    foreground: "#e0e0e0"
  group_other:
    foreground: "#bdc3c7"
  group_root:
    foreground: "#e74c3c"

links:
  normal:
    foreground: "#1abc9c"
  multi_link_file:
    foreground: "#e0e0e0"
    background: "#1abc9c"

git:
  new:
    foreground: "#2ecc71"
  modified:
    foreground: "#f1c40f"
  deleted:
    foreground: "#e74c3c"
  renamed:
    foreground: "#95a5a6"
  typechange:
    foreground: "#9b59b6"
  ignored:
    foreground: "#bdc3c7"
  conflicted:
    foreground: "#e67e22"

git_repo:
  branch_main:
    foreground: "#e0e0e0"
  branch_other:
    foreground: "#9b59b6"
  git_clean:
    foreground: "#2ecc71"
  git_dirty:
    foreground: "#e74c3c"

security_context:
  colon:
    foreground: "#bdc3c7"
  user:
    foreground: "#e0e0e0"
  role:
    foreground: "#9b59b6"
  typ:
    foreground: "#bdc3c7"
  range:
    foreground: "#9b59b6"

file_type:
  image:
    foreground: "#f1c40f"
  video:
    foreground: "#2ecc71"
  music:
    foreground: "#2ecc71"
  lossless:
    foreground: "#e0e0e0"
  crypto:
    foreground: "#bdc3c7"
  document:
    foreground: "#e0e0e0"
  compressed:
    foreground: "#9b59b6"
  temp:
    foreground: "#95a5a6"
    is_dimmed: false
  compiled:
    foreground: "#3498db"
  build:
    foreground: "#bdc3c7"
    is_underline: false
  source:
    foreground: "#3498db"

punctuation:
    foreground: "#bdc3c7"
date:
    foreground: "#bdc3c7"
inode:
    foreground: "#bdc3c7"
blocks:
    foreground: "#bdc3c7"
header:
    foreground: "#e0e0e0"
octal:
    foreground: "#95a5a6"
flags:
    foreground: "#9b59b6"

symlink_path:
    foreground: "#1abc9c"
control_char:
    foreground: "#e67e22"
broken_symlink:
    foreground: "#e74c3c"
broken_path_overlay:
    foreground: "#bdc3c7"
