# vim: ft=yaml

# Scheme Name: Snazzy
# Scheme Author: Chawye Hsu (https://github.com/chawyehsu), based on Hyper Snazzy Theme (https://github.com/sindresorhus/hyper-snazzy)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#e2e4e5"
  directory:
    foreground: "#57c7ff"
  symlink:
    foreground: "#9aedfe"
  pipe:
    foreground: "#a5a5a9"
  block_device:
    foreground: "#f3f99d"
  char_device:
    foreground: "#f3f99d"
  socket:
    foreground: "#a5a5a9"
  special:
    foreground: "#ff6ac1"
  executable:
    foreground: "#5af78e"
  mount_point:
    foreground: "#f3f99d"

perms:
  user_read:
    foreground: "#f3f99d"
  user_write:
    foreground: "#ff5c57"
  user_execute_file:
    foreground: "#5af78e"
  user_execute_other:
    foreground: "#5af78e"
  group_read:
    foreground: "#f3f99d"
  group_write:
    foreground: "#ff5c57"
  group_execute:
    foreground: "#5af78e"
  other_read:
    foreground: "#f3f99d"
  other_write:
    foreground: "#ff5c57"
  other_execute:
    foreground: "#5af78e"
  special_user_file:
    foreground: "#ff6ac1"
  special_other:
    foreground: "#a5a5a9"
  attribute:
    foreground: "#a5a5a9"

size:
  major:
    foreground: "#5af78e"
  minor:
    foreground: "#5af78e"
  number_byte:
    foreground: "#a5a5a9"
  number_kilo:
    foreground: "#e2e4e5"
  number_mega:
    foreground: "#f3f99d"
  number_giga:
    foreground: "#ff9f43"
  number_huge:
    foreground: "#ff5c57"
  unit_byte:
    foreground: "#a5a5a9"
  unit_kilo:
    foreground: "#e2e4e5"
  unit_mega:
    foreground: "#f3f99d"
  unit_giga:
    foreground: "#ff9f43"
  unit_huge:
    foreground: "#ff5c57"

users:
  user_you:
    foreground: "#e2e4e5"
  user_root:
    foreground: "#ff5c57"
  user_other:
    foreground: "#ff6ac1"
  group_yours:
    foreground: "#e2e4e5"
  group_other:
    foreground: "#a5a5a9"
  group_root:
    foreground: "#ff5c57"

links:
  normal:
    foreground: "#9aedfe"
  multi_link_file:
    foreground: "#e2e4e5"
    background: "#9aedfe"

git:
  new:
    foreground: "#5af78e"
  modified:
    foreground: "#f3f99d"
  deleted:
    foreground: "#ff5c57"
  renamed:
    foreground: "#78787e"
  typechange:
    foreground: "#ff6ac1"
  ignored:
    foreground: "#a5a5a9"
  conflicted:
    foreground: "#ff9f43"

git_repo:
  branch_main:
    foreground: "#e2e4e5"
  branch_other:
    foreground: "#ff6ac1"
  git_clean:
    foreground: "#5af78e"
  git_dirty:
    foreground: "#ff5c57"

security_context:
  colon:
    foreground: "#a5a5a9"
  user:
    foreground: "#e2e4e5"
  role:
    foreground: "#ff6ac1"
  typ:
    foreground: "#a5a5a9"
  range:
    foreground: "#ff6ac1"

file_type:
  image:
    foreground: "#f3f99d"
  video:
    foreground: "#5af78e"
  music:
    foreground: "#5af78e"
  lossless:
    foreground: "#e2e4e5"
  crypto:
    foreground: "#a5a5a9"
  document:
    foreground: "#e2e4e5"
  compressed:
    foreground: "#ff6ac1"
  temp:
    foreground: "#78787e"
  compiled:
    foreground: "#57c7ff"
  build:
    foreground: "#a5a5a9"
    is_underline: false
  source:
    foreground: "#57c7ff"

punctuation:
    foreground: "#a5a5a9"
date:
    foreground: "#a5a5a9"
inode:
    foreground: "#a5a5a9"
blocks:
    foreground: "#a5a5a9"
header:
    foreground: "#e2e4e5"
octal:
    foreground: "#78787e"
flags:
    foreground: "#ff6ac1"

symlink_path:
    foreground: "#9aedfe"
control_char:
    foreground: "#ff9f43"
broken_symlink:
    foreground: "#ff5c57"
broken_path_overlay:
    foreground: "#a5a5a9"
