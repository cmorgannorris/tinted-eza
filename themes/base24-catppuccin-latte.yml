# vim: ft=yaml

# Scheme Name: Catppuccin Latte
# Scheme Author: https://github.com/catppuccin/catppuccin
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#4c4f69"
  directory:
    foreground: "#1e66f5"
  symlink:
    foreground: "#179299"
  pipe:
    foreground: "#acb0be"
  block_device:
    foreground: "#df8e1d"
  char_device:
    foreground: "#df8e1d"
  socket:
    foreground: "#acb0be"
  special:
    foreground: "#8839ef"
  executable:
    foreground: "#40a02b"
  mount_point:
    foreground: "#df8e1d"

perms:
  user_read:
    foreground: "#df8e1d"
  user_write:
    foreground: "#d20f39"
  user_execute_file:
    foreground: "#40a02b"
  user_execute_other:
    foreground: "#40a02b"
  group_read:
    foreground: "#df8e1d"
  group_write:
    foreground: "#d20f39"
  group_execute:
    foreground: "#40a02b"
  other_read:
    foreground: "#df8e1d"
  other_write:
    foreground: "#d20f39"
  other_execute:
    foreground: "#40a02b"
  special_user_file:
    foreground: "#8839ef"
  special_other:
    foreground: "#acb0be"
  attribute:
    foreground: "#acb0be"

size:
  major:
    foreground: "#40a02b"
  minor:
    foreground: "#40a02b"
  number_byte:
    foreground: "#acb0be"
  number_kilo:
    foreground: "#4c4f69"
  number_mega:
    foreground: "#df8e1d"
  number_giga:
    foreground: "#fe640b"
  number_huge:
    foreground: "#d20f39"
  unit_byte:
    foreground: "#acb0be"
  unit_kilo:
    foreground: "#4c4f69"
  unit_mega:
    foreground: "#df8e1d"
  unit_giga:
    foreground: "#fe640b"
  unit_huge:
    foreground: "#d20f39"

users:
  user_you:
    foreground: "#4c4f69"
  user_root:
    foreground: "#d20f39"
  user_other:
    foreground: "#8839ef"
  group_yours:
    foreground: "#4c4f69"
  group_other:
    foreground: "#acb0be"
  group_root:
    foreground: "#d20f39"

links:
  normal:
    foreground: "#179299"
  multi_link_file:
    foreground: "#4c4f69"
    background: "#179299"

git:
  new:
    foreground: "#40a02b"
  modified:
    foreground: "#df8e1d"
  deleted:
    foreground: "#d20f39"
  renamed:
    foreground: "#bcc0cc"
  typechange:
    foreground: "#8839ef"
  ignored:
    foreground: "#acb0be"
  conflicted:
    foreground: "#fe640b"

git_repo:
  branch_main:
    foreground: "#4c4f69"
  branch_other:
    foreground: "#8839ef"
  git_clean:
    foreground: "#40a02b"
  git_dirty:
    foreground: "#d20f39"

security_context:
  colon:
    foreground: "#acb0be"
  user:
    foreground: "#4c4f69"
  role:
    foreground: "#8839ef"
  typ:
    foreground: "#acb0be"
  range:
    foreground: "#8839ef"

file_type:
  image:
    foreground: "#df8e1d"
  video:
    foreground: "#40a02b"
  music:
    foreground: "#40a02b"
  lossless:
    foreground: "#40a02b"
  crypto:
    foreground: "#acb0be"
  document:
    foreground: "#4c4f69"
  compressed:
    foreground: "#acb0be"
  temp:
    foreground: "#ccd0da"
  compiled:
    foreground: "#1e66f5"
  build:
    foreground: "#acb0be"
    is_underline: false
  source:
    foreground: "#1e66f5"

punctuation:
    foreground: "#acb0be"
date:
    foreground: "#acb0be"
inode:
    foreground: "#acb0be"
blocks:
    foreground: "#acb0be"
header:
    foreground: "#4c4f69"
octal:
    foreground: "#bcc0cc"
flags:
    foreground: "#8839ef"

symlink_path:
    foreground: "#179299"
control_char:
    foreground: "#fe640b"
broken_symlink:
    foreground: "#d20f39"
broken_path_overlay:
    foreground: "#acb0be"
