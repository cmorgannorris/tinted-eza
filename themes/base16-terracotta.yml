# vim: ft=yaml

# Scheme Name: Terracotta
# Scheme Author: Alexander Rossell Hayes (https://github.com/rossellhayes)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#473731"
  directory:
    foreground: "#625574"
  symlink:
    foreground: "#847f9e"
  pipe:
    foreground: "#59453d"
  block_device:
    foreground: "#ce943e"
  char_device:
    foreground: "#ce943e"
  socket:
    foreground: "#59453d"
  special:
    foreground: "#8d5968"
  executable:
    foreground: "#7a894a"
  mount_point:
    foreground: "#ce943e"

perms:
  user_read:
    foreground: "#ce943e"
  user_write:
    foreground: "#a75045"
  user_execute_file:
    foreground: "#7a894a"
  user_execute_other:
    foreground: "#7a894a"
  group_read:
    foreground: "#ce943e"
  group_write:
    foreground: "#a75045"
  group_execute:
    foreground: "#7a894a"
  other_read:
    foreground: "#ce943e"
  other_write:
    foreground: "#a75045"
  other_execute:
    foreground: "#7a894a"
  special_user_file:
    foreground: "#8d5968"
  special_other:
    foreground: "#59453d"
  attribute:
    foreground: "#59453d"

size:
  major:
    foreground: "#7a894a"
  minor:
    foreground: "#7a894a"
  number_byte:
    foreground: "#59453d"
  number_kilo:
    foreground: "#473731"
  number_mega:
    foreground: "#ce943e"
  number_giga:
    foreground: "#bd6942"
  number_huge:
    foreground: "#a75045"
  unit_byte:
    foreground: "#59453d"
  unit_kilo:
    foreground: "#473731"
  unit_mega:
    foreground: "#ce943e"
  unit_giga:
    foreground: "#bd6942"
  unit_huge:
    foreground: "#a75045"

users:
  user_you:
    foreground: "#473731"
  user_root:
    foreground: "#a75045"
  user_other:
    foreground: "#8d5968"
  group_yours:
    foreground: "#473731"
  group_other:
    foreground: "#59453d"
  group_root:
    foreground: "#a75045"

links:
  normal:
    foreground: "#847f9e"
  multi_link_file:
    foreground: "#473731"
    background: "#847f9e"

git:
  new:
    foreground: "#7a894a"
  modified:
    foreground: "#ce943e"
  deleted:
    foreground: "#a75045"
  renamed:
    foreground: "#c0aca4"
  typechange:
    foreground: "#8d5968"
  ignored:
    foreground: "#59453d"
  conflicted:
    foreground: "#bd6942"

git_repo:
  branch_main:
    foreground: "#473731"
  branch_other:
    foreground: "#8d5968"
  git_clean:
    foreground: "#7a894a"
  git_dirty:
    foreground: "#a75045"

security_context:
  colon:
    foreground: "#59453d"
  user:
    foreground: "#473731"
  role:
    foreground: "#8d5968"
  typ:
    foreground: "#59453d"
  range:
    foreground: "#8d5968"

file_type:
  image:
    foreground: "#ce943e"
  video:
    foreground: "#7a894a"
  music:
    foreground: "#7a894a"
  lossless:
    foreground: "#473731"
  crypto:
    foreground: "#59453d"
  document:
    foreground: "#473731"
  compressed:
    foreground: "#8d5968"
  temp:
    foreground: "#c0aca4"
  compiled:
    foreground: "#625574"
  build:
    foreground: "#59453d"
    is_underline: false
  source:
    foreground: "#625574"

punctuation:
    foreground: "#59453d"
date:
    foreground: "#59453d"
inode:
    foreground: "#59453d"
blocks:
    foreground: "#59453d"
header:
    foreground: "#473731"
octal:
    foreground: "#c0aca4"
flags:
    foreground: "#8d5968"

symlink_path:
    foreground: "#847f9e"
control_char:
    foreground: "#bd6942"
broken_symlink:
    foreground: "#a75045"
broken_path_overlay:
    foreground: "#59453d"
