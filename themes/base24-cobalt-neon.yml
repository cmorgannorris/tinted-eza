# vim: ft=yaml

# Scheme Name: Cobalt Neon
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#cc72a6"
  directory:
    foreground: "#8ff586"
  symlink:
    foreground: "#8ff586"
  pipe:
    foreground: "#dd9e9c"
  block_device:
    foreground: "#3c7dd2"
  char_device:
    foreground: "#3c7dd2"
  socket:
    foreground: "#dd9e9c"
  special:
    foreground: "#781aa0"
  executable:
    foreground: "#3aa5ff"
  mount_point:
    foreground: "#3c7dd2"

perms:
  user_read:
    foreground: "#3c7dd2"
  user_write:
    foreground: "#ff2320"
  user_execute_file:
    foreground: "#3aa5ff"
  user_execute_other:
    foreground: "#3aa5ff"
  group_read:
    foreground: "#3c7dd2"
  group_write:
    foreground: "#ff2320"
  group_execute:
    foreground: "#3aa5ff"
  other_read:
    foreground: "#3c7dd2"
  other_write:
    foreground: "#ff2320"
  other_execute:
    foreground: "#3aa5ff"
  special_user_file:
    foreground: "#781aa0"
  special_other:
    foreground: "#dd9e9c"
  attribute:
    foreground: "#dd9e9c"

size:
  major:
    foreground: "#3aa5ff"
  minor:
    foreground: "#3aa5ff"
  number_byte:
    foreground: "#dd9e9c"
  number_kilo:
    foreground: "#cc72a6"
  number_mega:
    foreground: "#3c7dd2"
  number_giga:
    foreground: "#e9e75c"
  number_huge:
    foreground: "#ff2320"
  unit_byte:
    foreground: "#dd9e9c"
  unit_kilo:
    foreground: "#cc72a6"
  unit_mega:
    foreground: "#3c7dd2"
  unit_giga:
    foreground: "#e9e75c"
  unit_huge:
    foreground: "#ff2320"

users:
  user_you:
    foreground: "#cc72a6"
  user_root:
    foreground: "#ff2320"
  user_other:
    foreground: "#781aa0"
  group_yours:
    foreground: "#cc72a6"
  group_other:
    foreground: "#dd9e9c"
  group_root:
    foreground: "#ff2320"

links:
  normal:
    foreground: "#8ff586"
  multi_link_file:
    foreground: "#cc72a6"
    background: "#8ff586"

git:
  new:
    foreground: "#3aa5ff"
  modified:
    foreground: "#3c7dd2"
  deleted:
    foreground: "#ff2320"
  renamed:
    foreground: "#eeca92"
  typechange:
    foreground: "#781aa0"
  ignored:
    foreground: "#dd9e9c"
  conflicted:
    foreground: "#e9e75c"

git_repo:
  branch_main:
    foreground: "#cc72a6"
  branch_other:
    foreground: "#781aa0"
  git_clean:
    foreground: "#3aa5ff"
  git_dirty:
    foreground: "#ff2320"

security_context:
  colon:
    foreground: "#dd9e9c"
  user:
    foreground: "#cc72a6"
  role:
    foreground: "#781aa0"
  typ:
    foreground: "#dd9e9c"
  range:
    foreground: "#781aa0"

file_type:
  image:
    foreground: "#3c7dd2"
  video:
    foreground: "#3aa5ff"
  music:
    foreground: "#3aa5ff"
  lossless:
    foreground: "#3aa5ff"
  crypto:
    foreground: "#dd9e9c"
  document:
    foreground: "#cc72a6"
  compressed:
    foreground: "#dd9e9c"
  temp:
    foreground: "#fff688"
  compiled:
    foreground: "#8ff586"
  build:
    foreground: "#dd9e9c"
    is_underline: false
  source:
    foreground: "#8ff586"

punctuation:
    foreground: "#dd9e9c"
date:
    foreground: "#dd9e9c"
inode:
    foreground: "#dd9e9c"
blocks:
    foreground: "#dd9e9c"
header:
    foreground: "#cc72a6"
octal:
    foreground: "#eeca92"
flags:
    foreground: "#781aa0"

symlink_path:
    foreground: "#8ff586"
control_char:
    foreground: "#e9e75c"
broken_symlink:
    foreground: "#ff2320"
broken_path_overlay:
    foreground: "#dd9e9c"
