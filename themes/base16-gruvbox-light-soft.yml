# vim: ft=yaml

# Scheme Name: Gruvbox light, soft
# Scheme Author: Dawid Kurek (dawikur@gmail.com), morhetz (https://github.com/morhetz/gruvbox)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#504945"
  directory:
    foreground: "#076678"
  symlink:
    foreground: "#427b58"
  pipe:
    foreground: "#665c54"
  block_device:
    foreground: "#b57614"
  char_device:
    foreground: "#b57614"
  socket:
    foreground: "#665c54"
  special:
    foreground: "#8f3f71"
  executable:
    foreground: "#79740e"
  mount_point:
    foreground: "#b57614"

perms:
  user_read:
    foreground: "#b57614"
  user_write:
    foreground: "#9d0006"
  user_execute_file:
    foreground: "#79740e"
  user_execute_other:
    foreground: "#79740e"
  group_read:
    foreground: "#b57614"
  group_write:
    foreground: "#9d0006"
  group_execute:
    foreground: "#79740e"
  other_read:
    foreground: "#b57614"
  other_write:
    foreground: "#9d0006"
  other_execute:
    foreground: "#79740e"
  special_user_file:
    foreground: "#8f3f71"
  special_other:
    foreground: "#665c54"
  attribute:
    foreground: "#665c54"

size:
  major:
    foreground: "#79740e"
  minor:
    foreground: "#79740e"
  number_byte:
    foreground: "#665c54"
  number_kilo:
    foreground: "#504945"
  number_mega:
    foreground: "#b57614"
  number_giga:
    foreground: "#af3a03"
  number_huge:
    foreground: "#9d0006"
  unit_byte:
    foreground: "#665c54"
  unit_kilo:
    foreground: "#504945"
  unit_mega:
    foreground: "#b57614"
  unit_giga:
    foreground: "#af3a03"
  unit_huge:
    foreground: "#9d0006"

users:
  user_you:
    foreground: "#504945"
  user_root:
    foreground: "#9d0006"
  user_other:
    foreground: "#8f3f71"
  group_yours:
    foreground: "#504945"
  group_other:
    foreground: "#665c54"
  group_root:
    foreground: "#9d0006"

links:
  normal:
    foreground: "#427b58"
  multi_link_file:
    foreground: "#504945"
    background: "#427b58"

git:
  new:
    foreground: "#79740e"
  modified:
    foreground: "#b57614"
  deleted:
    foreground: "#9d0006"
  renamed:
    foreground: "#bdae93"
  typechange:
    foreground: "#8f3f71"
  ignored:
    foreground: "#665c54"
  conflicted:
    foreground: "#af3a03"

git_repo:
  branch_main:
    foreground: "#504945"
  branch_other:
    foreground: "#8f3f71"
  git_clean:
    foreground: "#79740e"
  git_dirty:
    foreground: "#9d0006"

security_context:
  colon:
    foreground: "#665c54"
  user:
    foreground: "#504945"
  role:
    foreground: "#8f3f71"
  typ:
    foreground: "#665c54"
  range:
    foreground: "#8f3f71"

file_type:
  image:
    foreground: "#b57614"
  video:
    foreground: "#79740e"
  music:
    foreground: "#79740e"
  lossless:
    foreground: "#504945"
  crypto:
    foreground: "#665c54"
  document:
    foreground: "#504945"
  compressed:
    foreground: "#8f3f71"
  temp:
    foreground: "#bdae93"
  compiled:
    foreground: "#076678"
  build:
    foreground: "#665c54"
    is_underline: false
  source:
    foreground: "#076678"

punctuation:
    foreground: "#665c54"
date:
    foreground: "#665c54"
inode:
    foreground: "#665c54"
blocks:
    foreground: "#665c54"
header:
    foreground: "#504945"
octal:
    foreground: "#bdae93"
flags:
    foreground: "#8f3f71"

symlink_path:
    foreground: "#427b58"
control_char:
    foreground: "#af3a03"
broken_symlink:
    foreground: "#9d0006"
broken_path_overlay:
    foreground: "#665c54"
