# vim: ft=yaml

# Scheme Name: Circus
# Scheme Author: Stephan Boyer (https://github.com/stepchowfun) and Esther Wang (https://github.com/ewang12)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a7a7a7"
  directory:
    foreground: "#639ee4"
  symlink:
    foreground: "#4bb1a7"
  pipe:
    foreground: "#505050"
  block_device:
    foreground: "#c3ba63"
  char_device:
    foreground: "#c3ba63"
  socket:
    foreground: "#505050"
  special:
    foreground: "#b888e2"
  executable:
    foreground: "#84b97c"
  mount_point:
    foreground: "#c3ba63"

perms:
  user_read:
    foreground: "#c3ba63"
  user_write:
    foreground: "#dc657d"
  user_execute_file:
    foreground: "#84b97c"
  user_execute_other:
    foreground: "#84b97c"
  group_read:
    foreground: "#c3ba63"
  group_write:
    foreground: "#dc657d"
  group_execute:
    foreground: "#84b97c"
  other_read:
    foreground: "#c3ba63"
  other_write:
    foreground: "#dc657d"
  other_execute:
    foreground: "#84b97c"
  special_user_file:
    foreground: "#b888e2"
  special_other:
    foreground: "#505050"
  attribute:
    foreground: "#505050"

size:
  major:
    foreground: "#84b97c"
  minor:
    foreground: "#84b97c"
  number_byte:
    foreground: "#505050"
  number_kilo:
    foreground: "#a7a7a7"
  number_mega:
    foreground: "#c3ba63"
  number_giga:
    foreground: "#4bb1a7"
  number_huge:
    foreground: "#dc657d"
  unit_byte:
    foreground: "#505050"
  unit_kilo:
    foreground: "#a7a7a7"
  unit_mega:
    foreground: "#c3ba63"
  unit_giga:
    foreground: "#4bb1a7"
  unit_huge:
    foreground: "#dc657d"

users:
  user_you:
    foreground: "#a7a7a7"
  user_root:
    foreground: "#dc657d"
  user_other:
    foreground: "#b888e2"
  group_yours:
    foreground: "#a7a7a7"
  group_other:
    foreground: "#505050"
  group_root:
    foreground: "#dc657d"

links:
  normal:
    foreground: "#4bb1a7"
  multi_link_file:
    foreground: "#a7a7a7"
    background: "#4bb1a7"

git:
  new:
    foreground: "#84b97c"
  modified:
    foreground: "#c3ba63"
  deleted:
    foreground: "#dc657d"
  renamed:
    foreground: "#5f5a60"
  typechange:
    foreground: "#b888e2"
  ignored:
    foreground: "#505050"
  conflicted:
    foreground: "#4bb1a7"

git_repo:
  branch_main:
    foreground: "#a7a7a7"
  branch_other:
    foreground: "#b888e2"
  git_clean:
    foreground: "#84b97c"
  git_dirty:
    foreground: "#dc657d"

security_context:
  colon:
    foreground: "#505050"
  user:
    foreground: "#a7a7a7"
  role:
    foreground: "#b888e2"
  typ:
    foreground: "#505050"
  range:
    foreground: "#b888e2"

file_type:
  image:
    foreground: "#c3ba63"
  video:
    foreground: "#84b97c"
  music:
    foreground: "#84b97c"
  lossless:
    foreground: "#a7a7a7"
  crypto:
    foreground: "#505050"
  document:
    foreground: "#a7a7a7"
  compressed:
    foreground: "#b888e2"
  temp:
    foreground: "#5f5a60"
  compiled:
    foreground: "#639ee4"
  build:
    foreground: "#505050"
    is_underline: false
  source:
    foreground: "#639ee4"

punctuation:
    foreground: "#505050"
date:
    foreground: "#505050"
inode:
    foreground: "#505050"
blocks:
    foreground: "#505050"
header:
    foreground: "#a7a7a7"
octal:
    foreground: "#5f5a60"
flags:
    foreground: "#b888e2"

symlink_path:
    foreground: "#4bb1a7"
control_char:
    foreground: "#4bb1a7"
broken_symlink:
    foreground: "#dc657d"
broken_path_overlay:
    foreground: "#505050"
