# vim: ft=yaml

# Scheme Name: 3024 Day
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#928f8e"
  directory:
    foreground: "#01a0e4"
  symlink:
    foreground: "#b5e4f4"
  pipe:
    foreground: "#807d7b"
  block_device:
    foreground: "#807d7c"
  char_device:
    foreground: "#807d7c"
  socket:
    foreground: "#807d7b"
  special:
    foreground: "#a16a94"
  executable:
    foreground: "#01a252"
  mount_point:
    foreground: "#807d7c"

perms:
  user_read:
    foreground: "#807d7c"
  user_write:
    foreground: "#db2d20"
  user_execute_file:
    foreground: "#01a252"
  user_execute_other:
    foreground: "#01a252"
  group_read:
    foreground: "#807d7c"
  group_write:
    foreground: "#db2d20"
  group_execute:
    foreground: "#01a252"
  other_read:
    foreground: "#807d7c"
  other_write:
    foreground: "#db2d20"
  other_execute:
    foreground: "#01a252"
  special_user_file:
    foreground: "#a16a94"
  special_other:
    foreground: "#807d7b"
  attribute:
    foreground: "#807d7b"

size:
  major:
    foreground: "#01a252"
  minor:
    foreground: "#01a252"
  number_byte:
    foreground: "#807d7b"
  number_kilo:
    foreground: "#928f8e"
  number_mega:
    foreground: "#807d7c"
  number_giga:
    foreground: "#fded02"
  number_huge:
    foreground: "#db2d20"
  unit_byte:
    foreground: "#807d7b"
  unit_kilo:
    foreground: "#928f8e"
  unit_mega:
    foreground: "#807d7c"
  unit_giga:
    foreground: "#fded02"
  unit_huge:
    foreground: "#db2d20"

users:
  user_you:
    foreground: "#928f8e"
  user_root:
    foreground: "#db2d20"
  user_other:
    foreground: "#a16a94"
  group_yours:
    foreground: "#928f8e"
  group_other:
    foreground: "#807d7b"
  group_root:
    foreground: "#db2d20"

links:
  normal:
    foreground: "#b5e4f4"
  multi_link_file:
    foreground: "#928f8e"
    background: "#b5e4f4"

git:
  new:
    foreground: "#01a252"
  modified:
    foreground: "#807d7c"
  deleted:
    foreground: "#db2d20"
  renamed:
    foreground: "#6e6a68"
  typechange:
    foreground: "#a16a94"
  ignored:
    foreground: "#807d7b"
  conflicted:
    foreground: "#fded02"

git_repo:
  branch_main:
    foreground: "#928f8e"
  branch_other:
    foreground: "#a16a94"
  git_clean:
    foreground: "#01a252"
  git_dirty:
    foreground: "#db2d20"

security_context:
  colon:
    foreground: "#807d7b"
  user:
    foreground: "#928f8e"
  role:
    foreground: "#a16a94"
  typ:
    foreground: "#807d7b"
  range:
    foreground: "#a16a94"

file_type:
  image:
    foreground: "#807d7c"
  video:
    foreground: "#01a252"
  music:
    foreground: "#01a252"
  lossless:
    foreground: "#928f8e"
  crypto:
    foreground: "#807d7b"
  document:
    foreground: "#928f8e"
  compressed:
    foreground: "#a16a94"
  temp:
    foreground: "#6e6a68"
    is_dimmed: false
  compiled:
    foreground: "#01a0e4"
  build:
    foreground: "#807d7b"
    is_underline: false
  source:
    foreground: "#01a0e4"

punctuation:
    foreground: "#807d7b"
date:
    foreground: "#807d7b"
inode:
    foreground: "#807d7b"
blocks:
    foreground: "#807d7b"
header:
    foreground: "#928f8e"
octal:
    foreground: "#6e6a68"
flags:
    foreground: "#a16a94"

symlink_path:
    foreground: "#b5e4f4"
control_char:
    foreground: "#fded02"
broken_symlink:
    foreground: "#db2d20"
broken_path_overlay:
    foreground: "#807d7b"
