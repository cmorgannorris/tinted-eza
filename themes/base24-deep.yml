# vim: ft=yaml

# Scheme Name: deep
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#bcbcbc"
  directory:
    foreground: "#5665fe"
  symlink:
    foreground: "#4fd2d9"
  pipe:
    foreground: "#999999"
  block_device:
    foreground: "#9fa8fe"
  char_device:
    foreground: "#9fa8fe"
  socket:
    foreground: "#999999"
  special:
    foreground: "#af51d9"
  executable:
    foreground: "#1cd815"
  mount_point:
    foreground: "#9fa8fe"

perms:
  user_read:
    foreground: "#9fa8fe"
  user_write:
    foreground: "#d60005"
  user_execute_file:
    foreground: "#1cd815"
  user_execute_other:
    foreground: "#1cd815"
  group_read:
    foreground: "#9fa8fe"
  group_write:
    foreground: "#d60005"
  group_execute:
    foreground: "#1cd815"
  other_read:
    foreground: "#9fa8fe"
  other_write:
    foreground: "#d60005"
  other_execute:
    foreground: "#1cd815"
  special_user_file:
    foreground: "#af51d9"
  special_other:
    foreground: "#999999"
  attribute:
    foreground: "#999999"

size:
  major:
    foreground: "#1cd815"
  minor:
    foreground: "#1cd815"
  number_byte:
    foreground: "#999999"
  number_kilo:
    foreground: "#bcbcbc"
  number_mega:
    foreground: "#9fa8fe"
  number_giga:
    foreground: "#d9bc25"
  number_huge:
    foreground: "#d60005"
  unit_byte:
    foreground: "#999999"
  unit_kilo:
    foreground: "#bcbcbc"
  unit_mega:
    foreground: "#9fa8fe"
  unit_giga:
    foreground: "#d9bc25"
  unit_huge:
    foreground: "#d60005"

users:
  user_you:
    foreground: "#bcbcbc"
  user_root:
    foreground: "#d60005"
  user_other:
    foreground: "#af51d9"
  group_yours:
    foreground: "#bcbcbc"
  group_other:
    foreground: "#999999"
  group_root:
    foreground: "#d60005"

links:
  normal:
    foreground: "#4fd2d9"
  multi_link_file:
    foreground: "#bcbcbc"
    background: "#4fd2d9"

git:
  new:
    foreground: "#1cd815"
  modified:
    foreground: "#9fa8fe"
  deleted:
    foreground: "#d60005"
  renamed:
    foreground: "#767676"
  typechange:
    foreground: "#af51d9"
  ignored:
    foreground: "#999999"
  conflicted:
    foreground: "#d9bc25"

git_repo:
  branch_main:
    foreground: "#bcbcbc"
  branch_other:
    foreground: "#af51d9"
  git_clean:
    foreground: "#1cd815"
  git_dirty:
    foreground: "#d60005"

security_context:
  colon:
    foreground: "#999999"
  user:
    foreground: "#bcbcbc"
  role:
    foreground: "#af51d9"
  typ:
    foreground: "#999999"
  range:
    foreground: "#af51d9"

file_type:
  image:
    foreground: "#9fa8fe"
  video:
    foreground: "#1cd815"
  music:
    foreground: "#1cd815"
  lossless:
    foreground: "#bcbcbc"
  crypto:
    foreground: "#999999"
  document:
    foreground: "#bcbcbc"
  compressed:
    foreground: "#af51d9"
  temp:
    foreground: "#767676"
  compiled:
    foreground: "#5665fe"
  build:
    foreground: "#999999"
    is_underline: false
  source:
    foreground: "#5665fe"

punctuation:
    foreground: "#999999"
date:
    foreground: "#999999"
inode:
    foreground: "#999999"
blocks:
    foreground: "#999999"
header:
    foreground: "#bcbcbc"
octal:
    foreground: "#767676"
flags:
    foreground: "#af51d9"

symlink_path:
    foreground: "#4fd2d9"
control_char:
    foreground: "#d9bc25"
broken_symlink:
    foreground: "#d60005"
broken_path_overlay:
    foreground: "#999999"
