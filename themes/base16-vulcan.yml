# vim: ft=yaml

# Scheme Name: vulcan
# Scheme Author: Andrey Varfolomeev
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#5b778c"
  directory:
    foreground: "#977d7c"
  symlink:
    foreground: "#977d7c"
  pipe:
    foreground: "#6b6977"
  block_device:
    foreground: "#adb4b9"
  char_device:
    foreground: "#adb4b9"
  socket:
    foreground: "#6b6977"
  special:
    foreground: "#9198a3"
  executable:
    foreground: "#977d7c"
  mount_point:
    foreground: "#adb4b9"

perms:
  user_read:
    foreground: "#adb4b9"
  user_write:
    foreground: "#818591"
  user_execute_file:
    foreground: "#977d7c"
  user_execute_other:
    foreground: "#977d7c"
  group_read:
    foreground: "#adb4b9"
  group_write:
    foreground: "#818591"
  group_execute:
    foreground: "#977d7c"
  other_read:
    foreground: "#adb4b9"
  other_write:
    foreground: "#818591"
  other_execute:
    foreground: "#977d7c"
  special_user_file:
    foreground: "#9198a3"
  special_other:
    foreground: "#6b6977"
  attribute:
    foreground: "#6b6977"

size:
  major:
    foreground: "#977d7c"
  minor:
    foreground: "#977d7c"
  number_byte:
    foreground: "#6b6977"
  number_kilo:
    foreground: "#5b778c"
  number_mega:
    foreground: "#adb4b9"
  number_giga:
    foreground: "#9198a3"
  number_huge:
    foreground: "#818591"
  unit_byte:
    foreground: "#6b6977"
  unit_kilo:
    foreground: "#5b778c"
  unit_mega:
    foreground: "#adb4b9"
  unit_giga:
    foreground: "#9198a3"
  unit_huge:
    foreground: "#818591"

users:
  user_you:
    foreground: "#5b778c"
  user_root:
    foreground: "#818591"
  user_other:
    foreground: "#9198a3"
  group_yours:
    foreground: "#5b778c"
  group_other:
    foreground: "#6b6977"
  group_root:
    foreground: "#818591"

links:
  normal:
    foreground: "#977d7c"
  multi_link_file:
    foreground: "#5b778c"
    background: "#977d7c"

git:
  new:
    foreground: "#977d7c"
  modified:
    foreground: "#adb4b9"
  deleted:
    foreground: "#818591"
  renamed:
    foreground: "#7a5759"
  typechange:
    foreground: "#9198a3"
  ignored:
    foreground: "#6b6977"
  conflicted:
    foreground: "#9198a3"

git_repo:
  branch_main:
    foreground: "#5b778c"
  branch_other:
    foreground: "#9198a3"
  git_clean:
    foreground: "#977d7c"
  git_dirty:
    foreground: "#818591"

security_context:
  colon:
    foreground: "#6b6977"
  user:
    foreground: "#5b778c"
  role:
    foreground: "#9198a3"
  typ:
    foreground: "#6b6977"
  range:
    foreground: "#9198a3"

file_type:
  image:
    foreground: "#adb4b9"
  video:
    foreground: "#977d7c"
  music:
    foreground: "#977d7c"
  lossless:
    foreground: "#5b778c"
  crypto:
    foreground: "#6b6977"
  document:
    foreground: "#5b778c"
  compressed:
    foreground: "#9198a3"
  temp:
    foreground: "#7a5759"
  compiled:
    foreground: "#977d7c"
  build:
    foreground: "#6b6977"
    is_underline: false
  source:
    foreground: "#977d7c"

punctuation:
    foreground: "#6b6977"
date:
    foreground: "#6b6977"
inode:
    foreground: "#6b6977"
blocks:
    foreground: "#6b6977"
header:
    foreground: "#5b778c"
octal:
    foreground: "#7a5759"
flags:
    foreground: "#9198a3"

symlink_path:
    foreground: "#977d7c"
control_char:
    foreground: "#9198a3"
broken_symlink:
    foreground: "#818591"
broken_path_overlay:
    foreground: "#6b6977"
