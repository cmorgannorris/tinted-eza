# vim: ft=yaml

# Scheme Name: Silk Dark
# Scheme Author: Gabriel Fontes (https://github.com/Misterio77)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c7dbdd"
  directory:
    foreground: "#46bddd"
  symlink:
    foreground: "#3fb2b9"
  pipe:
    foreground: "#9dc8cd"
  block_device:
    foreground: "#fce380"
  char_device:
    foreground: "#fce380"
  socket:
    foreground: "#9dc8cd"
  special:
    foreground: "#756b8a"
  executable:
    foreground: "#73d8ad"
  mount_point:
    foreground: "#fce380"

perms:
  user_read:
    foreground: "#fce380"
  user_write:
    foreground: "#fb6953"
  user_execute_file:
    foreground: "#73d8ad"
  user_execute_other:
    foreground: "#73d8ad"
  group_read:
    foreground: "#fce380"
  group_write:
    foreground: "#fb6953"
  group_execute:
    foreground: "#73d8ad"
  other_read:
    foreground: "#fce380"
  other_write:
    foreground: "#fb6953"
  other_execute:
    foreground: "#73d8ad"
  special_user_file:
    foreground: "#756b8a"
  special_other:
    foreground: "#9dc8cd"
  attribute:
    foreground: "#9dc8cd"

size:
  major:
    foreground: "#73d8ad"
  minor:
    foreground: "#73d8ad"
  number_byte:
    foreground: "#9dc8cd"
  number_kilo:
    foreground: "#c7dbdd"
  number_mega:
    foreground: "#fce380"
  number_giga:
    foreground: "#fcab74"
  number_huge:
    foreground: "#fb6953"
  unit_byte:
    foreground: "#9dc8cd"
  unit_kilo:
    foreground: "#c7dbdd"
  unit_mega:
    foreground: "#fce380"
  unit_giga:
    foreground: "#fcab74"
  unit_huge:
    foreground: "#fb6953"

users:
  user_you:
    foreground: "#c7dbdd"
  user_root:
    foreground: "#fb6953"
  user_other:
    foreground: "#756b8a"
  group_yours:
    foreground: "#c7dbdd"
  group_other:
    foreground: "#9dc8cd"
  group_root:
    foreground: "#fb6953"

links:
  normal:
    foreground: "#3fb2b9"
  multi_link_file:
    foreground: "#c7dbdd"
    background: "#3fb2b9"

git:
  new:
    foreground: "#73d8ad"
  modified:
    foreground: "#fce380"
  deleted:
    foreground: "#fb6953"
  renamed:
    foreground: "#587073"
  typechange:
    foreground: "#756b8a"
  ignored:
    foreground: "#9dc8cd"
  conflicted:
    foreground: "#fcab74"

git_repo:
  branch_main:
    foreground: "#c7dbdd"
  branch_other:
    foreground: "#756b8a"
  git_clean:
    foreground: "#73d8ad"
  git_dirty:
    foreground: "#fb6953"

security_context:
  colon:
    foreground: "#9dc8cd"
  user:
    foreground: "#c7dbdd"
  role:
    foreground: "#756b8a"
  typ:
    foreground: "#9dc8cd"
  range:
    foreground: "#756b8a"

file_type:
  image:
    foreground: "#fce380"
  video:
    foreground: "#73d8ad"
  music:
    foreground: "#73d8ad"
  lossless:
    foreground: "#c7dbdd"
  crypto:
    foreground: "#9dc8cd"
  document:
    foreground: "#c7dbdd"
  compressed:
    foreground: "#756b8a"
  temp:
    foreground: "#587073"
  compiled:
    foreground: "#46bddd"
  build:
    foreground: "#9dc8cd"
    is_underline: false
  source:
    foreground: "#46bddd"

punctuation:
    foreground: "#9dc8cd"
date:
    foreground: "#9dc8cd"
inode:
    foreground: "#9dc8cd"
blocks:
    foreground: "#9dc8cd"
header:
    foreground: "#c7dbdd"
octal:
    foreground: "#587073"
flags:
    foreground: "#756b8a"

symlink_path:
    foreground: "#3fb2b9"
control_char:
    foreground: "#fcab74"
broken_symlink:
    foreground: "#fb6953"
broken_path_overlay:
    foreground: "#9dc8cd"
