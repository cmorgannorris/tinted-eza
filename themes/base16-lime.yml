# vim: ft=yaml

# Scheme Name: lime
# Scheme Author: limelier
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#818175"
  directory:
    foreground: "#2b926f"
  symlink:
    foreground: "#4cad83"
  pipe:
    foreground: "#515155"
  block_device:
    foreground: "#ffd15e"
  char_device:
    foreground: "#ffd15e"
  socket:
    foreground: "#515155"
  special:
    foreground: "#1b825f"
  executable:
    foreground: "#8cd97c"
  mount_point:
    foreground: "#ffd15e"

perms:
  user_read:
    foreground: "#ffd15e"
  user_write:
    foreground: "#ff662a"
  user_execute_file:
    foreground: "#8cd97c"
  user_execute_other:
    foreground: "#8cd97c"
  group_read:
    foreground: "#ffd15e"
  group_write:
    foreground: "#ff662a"
  group_execute:
    foreground: "#8cd97c"
  other_read:
    foreground: "#ffd15e"
  other_write:
    foreground: "#ff662a"
  other_execute:
    foreground: "#8cd97c"
  special_user_file:
    foreground: "#1b825f"
  special_other:
    foreground: "#515155"
  attribute:
    foreground: "#515155"

size:
  major:
    foreground: "#8cd97c"
  minor:
    foreground: "#8cd97c"
  number_byte:
    foreground: "#515155"
  number_kilo:
    foreground: "#818175"
  number_mega:
    foreground: "#ffd15e"
  number_giga:
    foreground: "#ff773a"
  number_huge:
    foreground: "#ff662a"
  unit_byte:
    foreground: "#515155"
  unit_kilo:
    foreground: "#818175"
  unit_mega:
    foreground: "#ffd15e"
  unit_giga:
    foreground: "#ff773a"
  unit_huge:
    foreground: "#ff662a"

users:
  user_you:
    foreground: "#818175"
  user_root:
    foreground: "#ff662a"
  user_other:
    foreground: "#1b825f"
  group_yours:
    foreground: "#818175"
  group_other:
    foreground: "#515155"
  group_root:
    foreground: "#ff662a"

links:
  normal:
    foreground: "#4cad83"
  multi_link_file:
    foreground: "#818175"
    background: "#4cad83"

git:
  new:
    foreground: "#8cd97c"
  modified:
    foreground: "#ffd15e"
  deleted:
    foreground: "#ff662a"
  renamed:
    foreground: "#313140"
  typechange:
    foreground: "#1b825f"
  ignored:
    foreground: "#515155"
  conflicted:
    foreground: "#ff773a"

git_repo:
  branch_main:
    foreground: "#818175"
  branch_other:
    foreground: "#1b825f"
  git_clean:
    foreground: "#8cd97c"
  git_dirty:
    foreground: "#ff662a"

security_context:
  colon:
    foreground: "#515155"
  user:
    foreground: "#818175"
  role:
    foreground: "#1b825f"
  typ:
    foreground: "#515155"
  range:
    foreground: "#1b825f"

file_type:
  image:
    foreground: "#ffd15e"
  video:
    foreground: "#8cd97c"
  music:
    foreground: "#8cd97c"
  lossless:
    foreground: "#818175"
  crypto:
    foreground: "#515155"
  document:
    foreground: "#818175"
  compressed:
    foreground: "#1b825f"
  temp:
    foreground: "#313140"
  compiled:
    foreground: "#2b926f"
  build:
    foreground: "#515155"
    is_underline: false
  source:
    foreground: "#2b926f"

punctuation:
    foreground: "#515155"
date:
    foreground: "#515155"
inode:
    foreground: "#515155"
blocks:
    foreground: "#515155"
header:
    foreground: "#818175"
octal:
    foreground: "#313140"
flags:
    foreground: "#1b825f"

symlink_path:
    foreground: "#4cad83"
control_char:
    foreground: "#ff773a"
broken_symlink:
    foreground: "#ff662a"
broken_path_overlay:
    foreground: "#515155"
