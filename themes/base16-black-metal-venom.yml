# vim: ft=yaml

# Scheme Name: Black Metal (Venom)
# Scheme Author: metalelf0 (https://github.com/metalelf0)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c1c1c1"
  directory:
    foreground: "#888888"
  symlink:
    foreground: "#aaaaaa"
  pipe:
    foreground: "#999999"
  block_device:
    foreground: "#79241f"
  char_device:
    foreground: "#79241f"
  socket:
    foreground: "#999999"
  special:
    foreground: "#999999"
  executable:
    foreground: "#f8f7f2"
  mount_point:
    foreground: "#79241f"

perms:
  user_read:
    foreground: "#79241f"
  user_write:
    foreground: "#5f8787"
  user_execute_file:
    foreground: "#f8f7f2"
  user_execute_other:
    foreground: "#f8f7f2"
  group_read:
    foreground: "#79241f"
  group_write:
    foreground: "#5f8787"
  group_execute:
    foreground: "#f8f7f2"
  other_read:
    foreground: "#79241f"
  other_write:
    foreground: "#5f8787"
  other_execute:
    foreground: "#f8f7f2"
  special_user_file:
    foreground: "#999999"
  special_other:
    foreground: "#999999"
  attribute:
    foreground: "#999999"

size:
  major:
    foreground: "#f8f7f2"
  minor:
    foreground: "#f8f7f2"
  number_byte:
    foreground: "#999999"
  number_kilo:
    foreground: "#c1c1c1"
  number_mega:
    foreground: "#79241f"
  number_giga:
    foreground: "#aaaaaa"
  number_huge:
    foreground: "#5f8787"
  unit_byte:
    foreground: "#999999"
  unit_kilo:
    foreground: "#c1c1c1"
  unit_mega:
    foreground: "#79241f"
  unit_giga:
    foreground: "#aaaaaa"
  unit_huge:
    foreground: "#5f8787"

users:
  user_you:
    foreground: "#c1c1c1"
  user_root:
    foreground: "#5f8787"
  user_other:
    foreground: "#999999"
  group_yours:
    foreground: "#c1c1c1"
  group_other:
    foreground: "#999999"
  group_root:
    foreground: "#5f8787"

links:
  normal:
    foreground: "#aaaaaa"
  multi_link_file:
    foreground: "#c1c1c1"
    background: "#aaaaaa"

git:
  new:
    foreground: "#f8f7f2"
  modified:
    foreground: "#79241f"
  deleted:
    foreground: "#5f8787"
  renamed:
    foreground: "#333333"
  typechange:
    foreground: "#999999"
  ignored:
    foreground: "#999999"
  conflicted:
    foreground: "#aaaaaa"

git_repo:
  branch_main:
    foreground: "#c1c1c1"
  branch_other:
    foreground: "#999999"
  git_clean:
    foreground: "#f8f7f2"
  git_dirty:
    foreground: "#5f8787"

security_context:
  colon:
    foreground: "#999999"
  user:
    foreground: "#c1c1c1"
  role:
    foreground: "#999999"
  typ:
    foreground: "#999999"
  range:
    foreground: "#999999"

file_type:
  image:
    foreground: "#79241f"
  video:
    foreground: "#f8f7f2"
  music:
    foreground: "#f8f7f2"
  lossless:
    foreground: "#c1c1c1"
  crypto:
    foreground: "#999999"
  document:
    foreground: "#c1c1c1"
  compressed:
    foreground: "#999999"
  temp:
    foreground: "#333333"
    is_dimmed: false
  compiled:
    foreground: "#888888"
  build:
    foreground: "#999999"
    is_underline: false
  source:
    foreground: "#888888"

punctuation:
    foreground: "#999999"
date:
    foreground: "#999999"
inode:
    foreground: "#999999"
blocks:
    foreground: "#999999"
header:
    foreground: "#c1c1c1"
octal:
    foreground: "#333333"
flags:
    foreground: "#999999"

symlink_path:
    foreground: "#aaaaaa"
control_char:
    foreground: "#aaaaaa"
broken_symlink:
    foreground: "#5f8787"
broken_path_overlay:
    foreground: "#999999"
