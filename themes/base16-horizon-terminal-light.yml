# vim: ft=yaml

# Scheme Name: Horizon Terminal Light
# Scheme Author: Michaël Ball (http://github.com/michael-ball/)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#403c3d"
  directory:
    foreground: "#26bbd9"
  symlink:
    foreground: "#59e1e3"
  pipe:
    foreground: "#948c8a"
  block_device:
    foreground: "#fadad1"
  char_device:
    foreground: "#fadad1"
  socket:
    foreground: "#948c8a"
  special:
    foreground: "#ee64ac"
  executable:
    foreground: "#29d398"
  mount_point:
    foreground: "#fadad1"

perms:
  user_read:
    foreground: "#fadad1"
  user_write:
    foreground: "#e95678"
  user_execute_file:
    foreground: "#29d398"
  user_execute_other:
    foreground: "#29d398"
  group_read:
    foreground: "#fadad1"
  group_write:
    foreground: "#e95678"
  group_execute:
    foreground: "#29d398"
  other_read:
    foreground: "#fadad1"
  other_write:
    foreground: "#e95678"
  other_execute:
    foreground: "#29d398"
  special_user_file:
    foreground: "#ee64ac"
  special_other:
    foreground: "#948c8a"
  attribute:
    foreground: "#948c8a"

size:
  major:
    foreground: "#29d398"
  minor:
    foreground: "#29d398"
  number_byte:
    foreground: "#948c8a"
  number_kilo:
    foreground: "#403c3d"
  number_mega:
    foreground: "#fadad1"
  number_giga:
    foreground: "#f9cec3"
  number_huge:
    foreground: "#e95678"
  unit_byte:
    foreground: "#948c8a"
  unit_kilo:
    foreground: "#403c3d"
  unit_mega:
    foreground: "#fadad1"
  unit_giga:
    foreground: "#f9cec3"
  unit_huge:
    foreground: "#e95678"

users:
  user_you:
    foreground: "#403c3d"
  user_root:
    foreground: "#e95678"
  user_other:
    foreground: "#ee64ac"
  group_yours:
    foreground: "#403c3d"
  group_other:
    foreground: "#948c8a"
  group_root:
    foreground: "#e95678"

links:
  normal:
    foreground: "#59e1e3"
  multi_link_file:
    foreground: "#403c3d"
    background: "#59e1e3"

git:
  new:
    foreground: "#29d398"
  modified:
    foreground: "#fadad1"
  deleted:
    foreground: "#e95678"
  renamed:
    foreground: "#bdb3b1"
  typechange:
    foreground: "#ee64ac"
  ignored:
    foreground: "#948c8a"
  conflicted:
    foreground: "#f9cec3"

git_repo:
  branch_main:
    foreground: "#403c3d"
  branch_other:
    foreground: "#ee64ac"
  git_clean:
    foreground: "#29d398"
  git_dirty:
    foreground: "#e95678"

security_context:
  colon:
    foreground: "#948c8a"
  user:
    foreground: "#403c3d"
  role:
    foreground: "#ee64ac"
  typ:
    foreground: "#948c8a"
  range:
    foreground: "#ee64ac"

file_type:
  image:
    foreground: "#fadad1"
  video:
    foreground: "#29d398"
  music:
    foreground: "#29d398"
  lossless:
    foreground: "#403c3d"
  crypto:
    foreground: "#948c8a"
  document:
    foreground: "#403c3d"
  compressed:
    foreground: "#ee64ac"
  temp:
    foreground: "#bdb3b1"
    is_dimmed: false
  compiled:
    foreground: "#26bbd9"
  build:
    foreground: "#948c8a"
    is_underline: false
  source:
    foreground: "#26bbd9"

punctuation:
    foreground: "#948c8a"
date:
    foreground: "#948c8a"
inode:
    foreground: "#948c8a"
blocks:
    foreground: "#948c8a"
header:
    foreground: "#403c3d"
octal:
    foreground: "#bdb3b1"
flags:
    foreground: "#ee64ac"

symlink_path:
    foreground: "#59e1e3"
control_char:
    foreground: "#f9cec3"
broken_symlink:
    foreground: "#e95678"
broken_path_overlay:
    foreground: "#948c8a"
