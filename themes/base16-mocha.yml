# vim: ft=yaml

# Scheme Name: Mocha
# Scheme Author: Chris Kempson (http://chriskempson.com)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d0c8c6"
  directory:
    foreground: "#8ab3b5"
  symlink:
    foreground: "#7bbda4"
  pipe:
    foreground: "#b8afad"
  block_device:
    foreground: "#f4bc87"
  char_device:
    foreground: "#f4bc87"
  socket:
    foreground: "#b8afad"
  special:
    foreground: "#a89bb9"
  executable:
    foreground: "#beb55b"
  mount_point:
    foreground: "#f4bc87"

perms:
  user_read:
    foreground: "#f4bc87"
  user_write:
    foreground: "#cb6077"
  user_execute_file:
    foreground: "#beb55b"
  user_execute_other:
    foreground: "#beb55b"
  group_read:
    foreground: "#f4bc87"
  group_write:
    foreground: "#cb6077"
  group_execute:
    foreground: "#beb55b"
  other_read:
    foreground: "#f4bc87"
  other_write:
    foreground: "#cb6077"
  other_execute:
    foreground: "#beb55b"
  special_user_file:
    foreground: "#a89bb9"
  special_other:
    foreground: "#b8afad"
  attribute:
    foreground: "#b8afad"

size:
  major:
    foreground: "#beb55b"
  minor:
    foreground: "#beb55b"
  number_byte:
    foreground: "#b8afad"
  number_kilo:
    foreground: "#d0c8c6"
  number_mega:
    foreground: "#f4bc87"
  number_giga:
    foreground: "#d28b71"
  number_huge:
    foreground: "#cb6077"
  unit_byte:
    foreground: "#b8afad"
  unit_kilo:
    foreground: "#d0c8c6"
  unit_mega:
    foreground: "#f4bc87"
  unit_giga:
    foreground: "#d28b71"
  unit_huge:
    foreground: "#cb6077"

users:
  user_you:
    foreground: "#d0c8c6"
  user_root:
    foreground: "#cb6077"
  user_other:
    foreground: "#a89bb9"
  group_yours:
    foreground: "#d0c8c6"
  group_other:
    foreground: "#b8afad"
  group_root:
    foreground: "#cb6077"

links:
  normal:
    foreground: "#7bbda4"
  multi_link_file:
    foreground: "#d0c8c6"
    background: "#7bbda4"

git:
  new:
    foreground: "#beb55b"
  modified:
    foreground: "#f4bc87"
  deleted:
    foreground: "#cb6077"
  renamed:
    foreground: "#7e705a"
  typechange:
    foreground: "#a89bb9"
  ignored:
    foreground: "#b8afad"
  conflicted:
    foreground: "#d28b71"

git_repo:
  branch_main:
    foreground: "#d0c8c6"
  branch_other:
    foreground: "#a89bb9"
  git_clean:
    foreground: "#beb55b"
  git_dirty:
    foreground: "#cb6077"

security_context:
  colon:
    foreground: "#b8afad"
  user:
    foreground: "#d0c8c6"
  role:
    foreground: "#a89bb9"
  typ:
    foreground: "#b8afad"
  range:
    foreground: "#a89bb9"

file_type:
  image:
    foreground: "#f4bc87"
  video:
    foreground: "#beb55b"
  music:
    foreground: "#beb55b"
  lossless:
    foreground: "#d0c8c6"
  crypto:
    foreground: "#b8afad"
  document:
    foreground: "#d0c8c6"
  compressed:
    foreground: "#a89bb9"
  temp:
    foreground: "#7e705a"
    is_dimmed: false
  compiled:
    foreground: "#8ab3b5"
  build:
    foreground: "#b8afad"
    is_underline: false
  source:
    foreground: "#8ab3b5"

punctuation:
    foreground: "#b8afad"
date:
    foreground: "#b8afad"
inode:
    foreground: "#b8afad"
blocks:
    foreground: "#b8afad"
header:
    foreground: "#d0c8c6"
octal:
    foreground: "#7e705a"
flags:
    foreground: "#a89bb9"

symlink_path:
    foreground: "#7bbda4"
control_char:
    foreground: "#d28b71"
broken_symlink:
    foreground: "#cb6077"
broken_path_overlay:
    foreground: "#b8afad"
