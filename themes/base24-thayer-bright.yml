# vim: ft=yaml

# Scheme Name: Thayer Bright
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#adada9"
  directory:
    foreground: "#2656d6"
  symlink:
    foreground: "#37c8b4"
  pipe:
    foreground: "#8e8f8d"
  block_device:
    foreground: "#3f78ff"
  char_device:
    foreground: "#3f78ff"
  socket:
    foreground: "#8e8f8d"
  special:
    foreground: "#8c54fe"
  executable:
    foreground: "#4df740"
  mount_point:
    foreground: "#3f78ff"

perms:
  user_read:
    foreground: "#3f78ff"
  user_write:
    foreground: "#f92672"
  user_execute_file:
    foreground: "#4df740"
  user_execute_other:
    foreground: "#4df740"
  group_read:
    foreground: "#3f78ff"
  group_write:
    foreground: "#f92672"
  group_execute:
    foreground: "#4df740"
  other_read:
    foreground: "#3f78ff"
  other_write:
    foreground: "#f92672"
  other_execute:
    foreground: "#4df740"
  special_user_file:
    foreground: "#8c54fe"
  special_other:
    foreground: "#8e8f8d"
  attribute:
    foreground: "#8e8f8d"

size:
  major:
    foreground: "#4df740"
  minor:
    foreground: "#4df740"
  number_byte:
    foreground: "#8e8f8d"
  number_kilo:
    foreground: "#adada9"
  number_mega:
    foreground: "#3f78ff"
  number_giga:
    foreground: "#f3fd21"
  number_huge:
    foreground: "#f92672"
  unit_byte:
    foreground: "#8e8f8d"
  unit_kilo:
    foreground: "#adada9"
  unit_mega:
    foreground: "#3f78ff"
  unit_giga:
    foreground: "#f3fd21"
  unit_huge:
    foreground: "#f92672"

users:
  user_you:
    foreground: "#adada9"
  user_root:
    foreground: "#f92672"
  user_other:
    foreground: "#8c54fe"
  group_yours:
    foreground: "#adada9"
  group_other:
    foreground: "#8e8f8d"
  group_root:
    foreground: "#f92672"

links:
  normal:
    foreground: "#37c8b4"
  multi_link_file:
    foreground: "#adada9"
    background: "#37c8b4"

git:
  new:
    foreground: "#4df740"
  modified:
    foreground: "#3f78ff"
  deleted:
    foreground: "#f92672"
  renamed:
    foreground: "#6f7170"
  typechange:
    foreground: "#8c54fe"
  ignored:
    foreground: "#8e8f8d"
  conflicted:
    foreground: "#f3fd21"

git_repo:
  branch_main:
    foreground: "#adada9"
  branch_other:
    foreground: "#8c54fe"
  git_clean:
    foreground: "#4df740"
  git_dirty:
    foreground: "#f92672"

security_context:
  colon:
    foreground: "#8e8f8d"
  user:
    foreground: "#adada9"
  role:
    foreground: "#8c54fe"
  typ:
    foreground: "#8e8f8d"
  range:
    foreground: "#8c54fe"

file_type:
  image:
    foreground: "#3f78ff"
  video:
    foreground: "#4df740"
  music:
    foreground: "#4df740"
  lossless:
    foreground: "#4df740"
  crypto:
    foreground: "#8e8f8d"
  document:
    foreground: "#adada9"
  compressed:
    foreground: "#8e8f8d"
  temp:
    foreground: "#505354"
  compiled:
    foreground: "#2656d6"
  build:
    foreground: "#8e8f8d"
    is_underline: false
  source:
    foreground: "#2656d6"

punctuation:
    foreground: "#8e8f8d"
date:
    foreground: "#8e8f8d"
inode:
    foreground: "#8e8f8d"
blocks:
    foreground: "#8e8f8d"
header:
    foreground: "#adada9"
octal:
    foreground: "#6f7170"
flags:
    foreground: "#8c54fe"

symlink_path:
    foreground: "#37c8b4"
control_char:
    foreground: "#f3fd21"
broken_symlink:
    foreground: "#f92672"
broken_path_overlay:
    foreground: "#8e8f8d"
