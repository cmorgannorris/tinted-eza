# vim: ft=yaml

# Scheme Name: Apprentice
# Scheme Author: romainl
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#5f5f87"
  directory:
    foreground: "#8787af"
  symlink:
    foreground: "#87afd7"
  pipe:
    foreground: "#5f87af"
  block_device:
    foreground: "#87af87"
  char_device:
    foreground: "#87af87"
  socket:
    foreground: "#5f87af"
  special:
    foreground: "#5fafaf"
  executable:
    foreground: "#ffffaf"
  mount_point:
    foreground: "#87af87"

perms:
  user_read:
    foreground: "#87af87"
  user_write:
    foreground: "#444444"
  user_execute_file:
    foreground: "#ffffaf"
  user_execute_other:
    foreground: "#ffffaf"
  group_read:
    foreground: "#87af87"
  group_write:
    foreground: "#444444"
  group_execute:
    foreground: "#ffffaf"
  other_read:
    foreground: "#87af87"
  other_write:
    foreground: "#444444"
  other_execute:
    foreground: "#ffffaf"
  special_user_file:
    foreground: "#5fafaf"
  special_other:
    foreground: "#5f87af"
  attribute:
    foreground: "#5f87af"

size:
  major:
    foreground: "#ffffaf"
  minor:
    foreground: "#ffffaf"
  number_byte:
    foreground: "#5f87af"
  number_kilo:
    foreground: "#5f5f87"
  number_mega:
    foreground: "#87af87"
  number_giga:
    foreground: "#ff8700"
  number_huge:
    foreground: "#444444"
  unit_byte:
    foreground: "#5f87af"
  unit_kilo:
    foreground: "#5f5f87"
  unit_mega:
    foreground: "#87af87"
  unit_giga:
    foreground: "#ff8700"
  unit_huge:
    foreground: "#444444"

users:
  user_you:
    foreground: "#5f5f87"
  user_root:
    foreground: "#444444"
  user_other:
    foreground: "#5fafaf"
  group_yours:
    foreground: "#5f5f87"
  group_other:
    foreground: "#5f87af"
  group_root:
    foreground: "#444444"

links:
  normal:
    foreground: "#87afd7"
  multi_link_file:
    foreground: "#5f5f87"
    background: "#87afd7"

git:
  new:
    foreground: "#ffffaf"
  modified:
    foreground: "#87af87"
  deleted:
    foreground: "#444444"
  renamed:
    foreground: "#87875f"
  typechange:
    foreground: "#5fafaf"
  ignored:
    foreground: "#5f87af"
  conflicted:
    foreground: "#ff8700"

git_repo:
  branch_main:
    foreground: "#5f5f87"
  branch_other:
    foreground: "#5fafaf"
  git_clean:
    foreground: "#ffffaf"
  git_dirty:
    foreground: "#444444"

security_context:
  colon:
    foreground: "#5f87af"
  user:
    foreground: "#5f5f87"
  role:
    foreground: "#5fafaf"
  typ:
    foreground: "#5f87af"
  range:
    foreground: "#5fafaf"

file_type:
  image:
    foreground: "#87af87"
  video:
    foreground: "#ffffaf"
  music:
    foreground: "#ffffaf"
  lossless:
    foreground: "#5f5f87"
  crypto:
    foreground: "#5f87af"
  document:
    foreground: "#5f5f87"
  compressed:
    foreground: "#5fafaf"
  temp:
    foreground: "#87875f"
    is_dimmed: false
  compiled:
    foreground: "#8787af"
  build:
    foreground: "#5f87af"
    is_underline: false
  source:
    foreground: "#8787af"

punctuation:
    foreground: "#5f87af"
date:
    foreground: "#5f87af"
inode:
    foreground: "#5f87af"
blocks:
    foreground: "#5f87af"
header:
    foreground: "#5f5f87"
octal:
    foreground: "#87875f"
flags:
    foreground: "#5fafaf"

symlink_path:
    foreground: "#87afd7"
control_char:
    foreground: "#ff8700"
broken_symlink:
    foreground: "#444444"
broken_path_overlay:
    foreground: "#5f87af"
