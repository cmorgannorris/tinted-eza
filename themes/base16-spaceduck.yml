# vim: ft=yaml

# Scheme Name: Spaceduck
# Scheme Author: Guillermo Rodriguez (https://github.com/pineapplegiant), packaged by Gabriel Fontes (https://github.com/Misterio77)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#ecf0c1"
  directory:
    foreground: "#7a5ccc"
  symlink:
    foreground: "#00a3cc"
  pipe:
    foreground: "#818596"
  block_device:
    foreground: "#f2ce00"
  char_device:
    foreground: "#f2ce00"
  socket:
    foreground: "#818596"
  special:
    foreground: "#b3a1e6"
  executable:
    foreground: "#5ccc96"
  mount_point:
    foreground: "#f2ce00"

perms:
  user_read:
    foreground: "#f2ce00"
  user_write:
    foreground: "#e33400"
  user_execute_file:
    foreground: "#5ccc96"
  user_execute_other:
    foreground: "#5ccc96"
  group_read:
    foreground: "#f2ce00"
  group_write:
    foreground: "#e33400"
  group_execute:
    foreground: "#5ccc96"
  other_read:
    foreground: "#f2ce00"
  other_write:
    foreground: "#e33400"
  other_execute:
    foreground: "#5ccc96"
  special_user_file:
    foreground: "#b3a1e6"
  special_other:
    foreground: "#818596"
  attribute:
    foreground: "#818596"

size:
  major:
    foreground: "#5ccc96"
  minor:
    foreground: "#5ccc96"
  number_byte:
    foreground: "#818596"
  number_kilo:
    foreground: "#ecf0c1"
  number_mega:
    foreground: "#f2ce00"
  number_giga:
    foreground: "#e39400"
  number_huge:
    foreground: "#e33400"
  unit_byte:
    foreground: "#818596"
  unit_kilo:
    foreground: "#ecf0c1"
  unit_mega:
    foreground: "#f2ce00"
  unit_giga:
    foreground: "#e39400"
  unit_huge:
    foreground: "#e33400"

users:
  user_you:
    foreground: "#ecf0c1"
  user_root:
    foreground: "#e33400"
  user_other:
    foreground: "#b3a1e6"
  group_yours:
    foreground: "#ecf0c1"
  group_other:
    foreground: "#818596"
  group_root:
    foreground: "#e33400"

links:
  normal:
    foreground: "#00a3cc"
  multi_link_file:
    foreground: "#ecf0c1"
    background: "#00a3cc"

git:
  new:
    foreground: "#5ccc96"
  modified:
    foreground: "#f2ce00"
  deleted:
    foreground: "#e33400"
  renamed:
    foreground: "#686f9a"
  typechange:
    foreground: "#b3a1e6"
  ignored:
    foreground: "#818596"
  conflicted:
    foreground: "#e39400"

git_repo:
  branch_main:
    foreground: "#ecf0c1"
  branch_other:
    foreground: "#b3a1e6"
  git_clean:
    foreground: "#5ccc96"
  git_dirty:
    foreground: "#e33400"

security_context:
  colon:
    foreground: "#818596"
  user:
    foreground: "#ecf0c1"
  role:
    foreground: "#b3a1e6"
  typ:
    foreground: "#818596"
  range:
    foreground: "#b3a1e6"

file_type:
  image:
    foreground: "#f2ce00"
  video:
    foreground: "#5ccc96"
  music:
    foreground: "#5ccc96"
  lossless:
    foreground: "#ecf0c1"
  crypto:
    foreground: "#818596"
  document:
    foreground: "#ecf0c1"
  compressed:
    foreground: "#b3a1e6"
  temp:
    foreground: "#686f9a"
    is_dimmed: false
  compiled:
    foreground: "#7a5ccc"
  build:
    foreground: "#818596"
    is_underline: false
  source:
    foreground: "#7a5ccc"

punctuation:
    foreground: "#818596"
date:
    foreground: "#818596"
inode:
    foreground: "#818596"
blocks:
    foreground: "#818596"
header:
    foreground: "#ecf0c1"
octal:
    foreground: "#686f9a"
flags:
    foreground: "#b3a1e6"

symlink_path:
    foreground: "#00a3cc"
control_char:
    foreground: "#e39400"
broken_symlink:
    foreground: "#e33400"
broken_path_overlay:
    foreground: "#818596"
