# vim: ft=yaml

# Scheme Name: nosferatu
# Scheme Author: morgan
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#f8f8f2"
  directory:
    foreground: "#bd93f9"
  symlink:
    foreground: "#8be9fd"
  pipe:
    foreground: "#9ea8c7"
  block_device:
    foreground: "#f1fa8c"
  char_device:
    foreground: "#f1fa8c"
  socket:
    foreground: "#9ea8c7"
  special:
    foreground: "#ff79c6"
  executable:
    foreground: "#50fa7b"
  mount_point:
    foreground: "#f1fa8c"

perms:
  user_read:
    foreground: "#f1fa8c"
  user_write:
    foreground: "#ff5555"
  user_execute_file:
    foreground: "#50fa7b"
  user_execute_other:
    foreground: "#50fa7b"
  group_read:
    foreground: "#f1fa8c"
  group_write:
    foreground: "#ff5555"
  group_execute:
    foreground: "#50fa7b"
  other_read:
    foreground: "#f1fa8c"
  other_write:
    foreground: "#ff5555"
  other_execute:
    foreground: "#50fa7b"
  special_user_file:
    foreground: "#ff79c6"
  special_other:
    foreground: "#9ea8c7"
  attribute:
    foreground: "#9ea8c7"

size:
  major:
    foreground: "#50fa7b"
  minor:
    foreground: "#50fa7b"
  number_byte:
    foreground: "#9ea8c7"
  number_kilo:
    foreground: "#f8f8f2"
  number_mega:
    foreground: "#f1fa8c"
  number_giga:
    foreground: "#ffb86c"
  number_huge:
    foreground: "#ff5555"
  unit_byte:
    foreground: "#9ea8c7"
  unit_kilo:
    foreground: "#f8f8f2"
  unit_mega:
    foreground: "#f1fa8c"
  unit_giga:
    foreground: "#ffb86c"
  unit_huge:
    foreground: "#ff5555"

users:
  user_you:
    foreground: "#f8f8f2"
  user_root:
    foreground: "#ff5555"
  user_other:
    foreground: "#ff79c6"
  group_yours:
    foreground: "#f8f8f2"
  group_other:
    foreground: "#9ea8c7"
  group_root:
    foreground: "#ff5555"

links:
  normal:
    foreground: "#8be9fd"
  multi_link_file:
    foreground: "#f8f8f2"
    background: "#8be9fd"

git:
  new:
    foreground: "#50fa7b"
  modified:
    foreground: "#f1fa8c"
  deleted:
    foreground: "#ff5555"
  renamed:
    foreground: "#6272a4"
  typechange:
    foreground: "#ff79c6"
  ignored:
    foreground: "#9ea8c7"
  conflicted:
    foreground: "#ffb86c"

git_repo:
  branch_main:
    foreground: "#f8f8f2"
  branch_other:
    foreground: "#ff79c6"
  git_clean:
    foreground: "#50fa7b"
  git_dirty:
    foreground: "#ff5555"

security_context:
  colon:
    foreground: "#9ea8c7"
  user:
    foreground: "#f8f8f2"
  role:
    foreground: "#ff79c6"
  typ:
    foreground: "#9ea8c7"
  range:
    foreground: "#ff79c6"

file_type:
  image:
    foreground: "#f1fa8c"
  video:
    foreground: "#50fa7b"
  music:
    foreground: "#50fa7b"
  lossless:
    foreground: "#f8f8f2"
  crypto:
    foreground: "#9ea8c7"
  document:
    foreground: "#f8f8f2"
  compressed:
    foreground: "#ff79c6"
  temp:
    foreground: "#6272a4"
    is_dimmed: false
  compiled:
    foreground: "#bd93f9"
  build:
    foreground: "#9ea8c7"
    is_underline: false
  source:
    foreground: "#bd93f9"

punctuation:
    foreground: "#9ea8c7"
date:
    foreground: "#9ea8c7"
inode:
    foreground: "#9ea8c7"
blocks:
    foreground: "#9ea8c7"
header:
    foreground: "#f8f8f2"
octal:
    foreground: "#6272a4"
flags:
    foreground: "#ff79c6"

symlink_path:
    foreground: "#8be9fd"
control_char:
    foreground: "#ffb86c"
broken_symlink:
    foreground: "#ff5555"
broken_path_overlay:
    foreground: "#9ea8c7"
