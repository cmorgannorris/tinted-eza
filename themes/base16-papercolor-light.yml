# vim: ft=yaml

# Scheme Name: PaperColor Light
# Scheme Author: Jon Leopard (http://github.com/jonleopard), based on PaperColor Theme (https://github.com/NLKNguyen/papercolor-theme)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#444444"
  directory:
    foreground: "#d75f00"
  symlink:
    foreground: "#d75f00"
  pipe:
    foreground: "#0087af"
  block_device:
    foreground: "#d70087"
  char_device:
    foreground: "#d70087"
  socket:
    foreground: "#0087af"
  special:
    foreground: "#005faf"
  executable:
    foreground: "#8700af"
  mount_point:
    foreground: "#d70087"

perms:
  user_read:
    foreground: "#d70087"
  user_write:
    foreground: "#bcbcbc"
  user_execute_file:
    foreground: "#8700af"
  user_execute_other:
    foreground: "#8700af"
  group_read:
    foreground: "#d70087"
  group_write:
    foreground: "#bcbcbc"
  group_execute:
    foreground: "#8700af"
  other_read:
    foreground: "#d70087"
  other_write:
    foreground: "#bcbcbc"
  other_execute:
    foreground: "#8700af"
  special_user_file:
    foreground: "#005faf"
  special_other:
    foreground: "#0087af"
  attribute:
    foreground: "#0087af"

size:
  major:
    foreground: "#8700af"
  minor:
    foreground: "#8700af"
  number_byte:
    foreground: "#0087af"
  number_kilo:
    foreground: "#444444"
  number_mega:
    foreground: "#d70087"
  number_giga:
    foreground: "#d70000"
  number_huge:
    foreground: "#bcbcbc"
  unit_byte:
    foreground: "#0087af"
  unit_kilo:
    foreground: "#444444"
  unit_mega:
    foreground: "#d70087"
  unit_giga:
    foreground: "#d70000"
  unit_huge:
    foreground: "#bcbcbc"

users:
  user_you:
    foreground: "#444444"
  user_root:
    foreground: "#bcbcbc"
  user_other:
    foreground: "#005faf"
  group_yours:
    foreground: "#444444"
  group_other:
    foreground: "#0087af"
  group_root:
    foreground: "#bcbcbc"

links:
  normal:
    foreground: "#d75f00"
  multi_link_file:
    foreground: "#444444"
    background: "#d75f00"

git:
  new:
    foreground: "#8700af"
  modified:
    foreground: "#d70087"
  deleted:
    foreground: "#bcbcbc"
  renamed:
    foreground: "#5f8700"
  typechange:
    foreground: "#005faf"
  ignored:
    foreground: "#0087af"
  conflicted:
    foreground: "#d70000"

git_repo:
  branch_main:
    foreground: "#444444"
  branch_other:
    foreground: "#005faf"
  git_clean:
    foreground: "#8700af"
  git_dirty:
    foreground: "#bcbcbc"

security_context:
  colon:
    foreground: "#0087af"
  user:
    foreground: "#444444"
  role:
    foreground: "#005faf"
  typ:
    foreground: "#0087af"
  range:
    foreground: "#005faf"

file_type:
  image:
    foreground: "#d70087"
  video:
    foreground: "#8700af"
  music:
    foreground: "#8700af"
  lossless:
    foreground: "#444444"
  crypto:
    foreground: "#0087af"
  document:
    foreground: "#444444"
  compressed:
    foreground: "#005faf"
  temp:
    foreground: "#5f8700"
    is_dimmed: false
  compiled:
    foreground: "#d75f00"
  build:
    foreground: "#0087af"
    is_underline: false
  source:
    foreground: "#d75f00"

punctuation:
    foreground: "#0087af"
date:
    foreground: "#0087af"
inode:
    foreground: "#0087af"
blocks:
    foreground: "#0087af"
header:
    foreground: "#444444"
octal:
    foreground: "#5f8700"
flags:
    foreground: "#005faf"

symlink_path:
    foreground: "#d75f00"
control_char:
    foreground: "#d70000"
broken_symlink:
    foreground: "#bcbcbc"
broken_path_overlay:
    foreground: "#0087af"
