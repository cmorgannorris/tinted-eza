# vim: ft=yaml

# Scheme Name: Chinoiserie
# Scheme Author: Di Wang (https://cs.cmu.edu/~diw3)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#4a4035"
  directory:
    foreground: "#815c94"
  symlink:
    foreground: "#2b73af"
  pipe:
    foreground: "#918072"
  block_device:
    foreground: "#d6a01d"
  char_device:
    foreground: "#d6a01d"
  socket:
    foreground: "#918072"
  special:
    foreground: "#c08eaf"
  executable:
    foreground: "#428675"
  mount_point:
    foreground: "#d6a01d"

perms:
  user_read:
    foreground: "#d6a01d"
  user_write:
    foreground: "#c04851"
  user_execute_file:
    foreground: "#428675"
  user_execute_other:
    foreground: "#428675"
  group_read:
    foreground: "#d6a01d"
  group_write:
    foreground: "#c04851"
  group_execute:
    foreground: "#428675"
  other_read:
    foreground: "#d6a01d"
  other_write:
    foreground: "#c04851"
  other_execute:
    foreground: "#428675"
  special_user_file:
    foreground: "#c08eaf"
  special_other:
    foreground: "#918072"
  attribute:
    foreground: "#918072"

size:
  major:
    foreground: "#428675"
  minor:
    foreground: "#428675"
  number_byte:
    foreground: "#918072"
  number_kilo:
    foreground: "#4a4035"
  number_mega:
    foreground: "#d6a01d"
  number_giga:
    foreground: "#fb8b05"
  number_huge:
    foreground: "#c04851"
  unit_byte:
    foreground: "#918072"
  unit_kilo:
    foreground: "#4a4035"
  unit_mega:
    foreground: "#d6a01d"
  unit_giga:
    foreground: "#fb8b05"
  unit_huge:
    foreground: "#c04851"

users:
  user_you:
    foreground: "#4a4035"
  user_root:
    foreground: "#c04851"
  user_other:
    foreground: "#c08eaf"
  group_yours:
    foreground: "#4a4035"
  group_other:
    foreground: "#918072"
  group_root:
    foreground: "#c04851"

links:
  normal:
    foreground: "#2b73af"
  multi_link_file:
    foreground: "#4a4035"
    background: "#2b73af"

git:
  new:
    foreground: "#428675"
  modified:
    foreground: "#d6a01d"
  deleted:
    foreground: "#c04851"
  renamed:
    foreground: "#80766e"
  typechange:
    foreground: "#c08eaf"
  ignored:
    foreground: "#918072"
  conflicted:
    foreground: "#fb8b05"

git_repo:
  branch_main:
    foreground: "#4a4035"
  branch_other:
    foreground: "#c08eaf"
  git_clean:
    foreground: "#428675"
  git_dirty:
    foreground: "#c04851"

security_context:
  colon:
    foreground: "#918072"
  user:
    foreground: "#4a4035"
  role:
    foreground: "#c08eaf"
  typ:
    foreground: "#918072"
  range:
    foreground: "#c08eaf"

file_type:
  image:
    foreground: "#d6a01d"
  video:
    foreground: "#428675"
  music:
    foreground: "#428675"
  lossless:
    foreground: "#4a4035"
  crypto:
    foreground: "#918072"
  document:
    foreground: "#4a4035"
  compressed:
    foreground: "#c08eaf"
  temp:
    foreground: "#80766e"
    is_dimmed: false
  compiled:
    foreground: "#815c94"
  build:
    foreground: "#918072"
    is_underline: false
  source:
    foreground: "#815c94"

punctuation:
    foreground: "#918072"
date:
    foreground: "#918072"
inode:
    foreground: "#918072"
blocks:
    foreground: "#918072"
header:
    foreground: "#4a4035"
octal:
    foreground: "#80766e"
flags:
    foreground: "#c08eaf"

symlink_path:
    foreground: "#2b73af"
control_char:
    foreground: "#fb8b05"
broken_symlink:
    foreground: "#c04851"
broken_path_overlay:
    foreground: "#918072"
