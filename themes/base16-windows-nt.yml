# vim: ft=yaml

# Scheme Name: Windows NT
# Scheme Author: Fergus Collins (https://github.com/ferguscollins)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c0c0c0"
  directory:
    foreground: "#0000ff"
  symlink:
    foreground: "#00ffff"
  pipe:
    foreground: "#a1a1a1"
  block_device:
    foreground: "#ffff00"
  char_device:
    foreground: "#ffff00"
  socket:
    foreground: "#a1a1a1"
  special:
    foreground: "#ff00ff"
  executable:
    foreground: "#00ff00"
  mount_point:
    foreground: "#ffff00"

perms:
  user_read:
    foreground: "#ffff00"
  user_write:
    foreground: "#ff0000"
  user_execute_file:
    foreground: "#00ff00"
  user_execute_other:
    foreground: "#00ff00"
  group_read:
    foreground: "#ffff00"
  group_write:
    foreground: "#ff0000"
  group_execute:
    foreground: "#00ff00"
  other_read:
    foreground: "#ffff00"
  other_write:
    foreground: "#ff0000"
  other_execute:
    foreground: "#00ff00"
  special_user_file:
    foreground: "#ff00ff"
  special_other:
    foreground: "#a1a1a1"
  attribute:
    foreground: "#a1a1a1"

size:
  major:
    foreground: "#00ff00"
  minor:
    foreground: "#00ff00"
  number_byte:
    foreground: "#a1a1a1"
  number_kilo:
    foreground: "#c0c0c0"
  number_mega:
    foreground: "#ffff00"
  number_giga:
    foreground: "#808000"
  number_huge:
    foreground: "#ff0000"
  unit_byte:
    foreground: "#a1a1a1"
  unit_kilo:
    foreground: "#c0c0c0"
  unit_mega:
    foreground: "#ffff00"
  unit_giga:
    foreground: "#808000"
  unit_huge:
    foreground: "#ff0000"

users:
  user_you:
    foreground: "#c0c0c0"
  user_root:
    foreground: "#ff0000"
  user_other:
    foreground: "#ff00ff"
  group_yours:
    foreground: "#c0c0c0"
  group_other:
    foreground: "#a1a1a1"
  group_root:
    foreground: "#ff0000"

links:
  normal:
    foreground: "#00ffff"
  multi_link_file:
    foreground: "#c0c0c0"
    background: "#00ffff"

git:
  new:
    foreground: "#00ff00"
  modified:
    foreground: "#ffff00"
  deleted:
    foreground: "#ff0000"
  renamed:
    foreground: "#808080"
  typechange:
    foreground: "#ff00ff"
  ignored:
    foreground: "#a1a1a1"
  conflicted:
    foreground: "#808000"

git_repo:
  branch_main:
    foreground: "#c0c0c0"
  branch_other:
    foreground: "#ff00ff"
  git_clean:
    foreground: "#00ff00"
  git_dirty:
    foreground: "#ff0000"

security_context:
  colon:
    foreground: "#a1a1a1"
  user:
    foreground: "#c0c0c0"
  role:
    foreground: "#ff00ff"
  typ:
    foreground: "#a1a1a1"
  range:
    foreground: "#ff00ff"

file_type:
  image:
    foreground: "#ffff00"
  video:
    foreground: "#00ff00"
  music:
    foreground: "#00ff00"
  lossless:
    foreground: "#c0c0c0"
  crypto:
    foreground: "#a1a1a1"
  document:
    foreground: "#c0c0c0"
  compressed:
    foreground: "#ff00ff"
  temp:
    foreground: "#808080"
    is_dimmed: false
  compiled:
    foreground: "#0000ff"
  build:
    foreground: "#a1a1a1"
    is_underline: false
  source:
    foreground: "#0000ff"

punctuation:
    foreground: "#a1a1a1"
date:
    foreground: "#a1a1a1"
inode:
    foreground: "#a1a1a1"
blocks:
    foreground: "#a1a1a1"
header:
    foreground: "#c0c0c0"
octal:
    foreground: "#808080"
flags:
    foreground: "#ff00ff"

symlink_path:
    foreground: "#00ffff"
control_char:
    foreground: "#808000"
broken_symlink:
    foreground: "#ff0000"
broken_path_overlay:
    foreground: "#a1a1a1"
