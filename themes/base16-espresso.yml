# vim: ft=yaml

# Scheme Name: Espresso
# Scheme Author: Unknown. Maintained by Alex Mirrington (https://github.com/alexmirrington)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cccccc"
  directory:
    foreground: "#6c99bb"
  symlink:
    foreground: "#bed6ff"
  pipe:
    foreground: "#b4b7b4"
  block_device:
    foreground: "#ffc66d"
  char_device:
    foreground: "#ffc66d"
  socket:
    foreground: "#b4b7b4"
  special:
    foreground: "#d197d9"
  executable:
    foreground: "#a5c261"
  mount_point:
    foreground: "#ffc66d"

perms:
  user_read:
    foreground: "#ffc66d"
  user_write:
    foreground: "#d25252"
  user_execute_file:
    foreground: "#a5c261"
  user_execute_other:
    foreground: "#a5c261"
  group_read:
    foreground: "#ffc66d"
  group_write:
    foreground: "#d25252"
  group_execute:
    foreground: "#a5c261"
  other_read:
    foreground: "#ffc66d"
  other_write:
    foreground: "#d25252"
  other_execute:
    foreground: "#a5c261"
  special_user_file:
    foreground: "#d197d9"
  special_other:
    foreground: "#b4b7b4"
  attribute:
    foreground: "#b4b7b4"

size:
  major:
    foreground: "#a5c261"
  minor:
    foreground: "#a5c261"
  number_byte:
    foreground: "#b4b7b4"
  number_kilo:
    foreground: "#cccccc"
  number_mega:
    foreground: "#ffc66d"
  number_giga:
    foreground: "#f9a959"
  number_huge:
    foreground: "#d25252"
  unit_byte:
    foreground: "#b4b7b4"
  unit_kilo:
    foreground: "#cccccc"
  unit_mega:
    foreground: "#ffc66d"
  unit_giga:
    foreground: "#f9a959"
  unit_huge:
    foreground: "#d25252"

users:
  user_you:
    foreground: "#cccccc"
  user_root:
    foreground: "#d25252"
  user_other:
    foreground: "#d197d9"
  group_yours:
    foreground: "#cccccc"
  group_other:
    foreground: "#b4b7b4"
  group_root:
    foreground: "#d25252"

links:
  normal:
    foreground: "#bed6ff"
  multi_link_file:
    foreground: "#cccccc"
    background: "#bed6ff"

git:
  new:
    foreground: "#a5c261"
  modified:
    foreground: "#ffc66d"
  deleted:
    foreground: "#d25252"
  renamed:
    foreground: "#777777"
  typechange:
    foreground: "#d197d9"
  ignored:
    foreground: "#b4b7b4"
  conflicted:
    foreground: "#f9a959"

git_repo:
  branch_main:
    foreground: "#cccccc"
  branch_other:
    foreground: "#d197d9"
  git_clean:
    foreground: "#a5c261"
  git_dirty:
    foreground: "#d25252"

security_context:
  colon:
    foreground: "#b4b7b4"
  user:
    foreground: "#cccccc"
  role:
    foreground: "#d197d9"
  typ:
    foreground: "#b4b7b4"
  range:
    foreground: "#d197d9"

file_type:
  image:
    foreground: "#ffc66d"
  video:
    foreground: "#a5c261"
  music:
    foreground: "#a5c261"
  lossless:
    foreground: "#cccccc"
  crypto:
    foreground: "#b4b7b4"
  document:
    foreground: "#cccccc"
  compressed:
    foreground: "#d197d9"
  temp:
    foreground: "#777777"
    is_dimmed: false
  compiled:
    foreground: "#6c99bb"
  build:
    foreground: "#b4b7b4"
    is_underline: false
  source:
    foreground: "#6c99bb"

punctuation:
    foreground: "#b4b7b4"
date:
    foreground: "#b4b7b4"
inode:
    foreground: "#b4b7b4"
blocks:
    foreground: "#b4b7b4"
header:
    foreground: "#cccccc"
octal:
    foreground: "#777777"
flags:
    foreground: "#d197d9"

symlink_path:
    foreground: "#bed6ff"
control_char:
    foreground: "#f9a959"
broken_symlink:
    foreground: "#d25252"
broken_path_overlay:
    foreground: "#b4b7b4"
