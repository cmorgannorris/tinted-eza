# vim: ft=yaml

# Scheme Name: Brogrammer
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#c1c8d7"
  directory:
    foreground: "#2a84d2"
  symlink:
    foreground: "#0f80d5"
  pipe:
    foreground: "#d6dae4"
  block_device:
    foreground: "#0f80d5"
  char_device:
    foreground: "#0f80d5"
  socket:
    foreground: "#d6dae4"
  special:
    foreground: "#4e59b7"
  executable:
    foreground: "#2cc55d"
  mount_point:
    foreground: "#0f80d5"

perms:
  user_read:
    foreground: "#0f80d5"
  user_write:
    foreground: "#f71118"
  user_execute_file:
    foreground: "#2cc55d"
  user_execute_other:
    foreground: "#2cc55d"
  group_read:
    foreground: "#0f80d5"
  group_write:
    foreground: "#f71118"
  group_execute:
    foreground: "#2cc55d"
  other_read:
    foreground: "#0f80d5"
  other_write:
    foreground: "#f71118"
  other_execute:
    foreground: "#2cc55d"
  special_user_file:
    foreground: "#4e59b7"
  special_other:
    foreground: "#d6dae4"
  attribute:
    foreground: "#d6dae4"

size:
  major:
    foreground: "#2cc55d"
  minor:
    foreground: "#2cc55d"
  number_byte:
    foreground: "#d6dae4"
  number_kilo:
    foreground: "#c1c8d7"
  number_mega:
    foreground: "#0f80d5"
  number_giga:
    foreground: "#ecb90f"
  number_huge:
    foreground: "#f71118"
  unit_byte:
    foreground: "#d6dae4"
  unit_kilo:
    foreground: "#c1c8d7"
  unit_mega:
    foreground: "#0f80d5"
  unit_giga:
    foreground: "#ecb90f"
  unit_huge:
    foreground: "#f71118"

users:
  user_you:
    foreground: "#c1c8d7"
  user_root:
    foreground: "#f71118"
  user_other:
    foreground: "#4e59b7"
  group_yours:
    foreground: "#c1c8d7"
  group_other:
    foreground: "#d6dae4"
  group_root:
    foreground: "#f71118"

links:
  normal:
    foreground: "#0f80d5"
  multi_link_file:
    foreground: "#c1c8d7"
    background: "#0f80d5"

git:
  new:
    foreground: "#2cc55d"
  modified:
    foreground: "#0f80d5"
  deleted:
    foreground: "#f71118"
  renamed:
    foreground: "#343d50"
  typechange:
    foreground: "#4e59b7"
  ignored:
    foreground: "#d6dae4"
  conflicted:
    foreground: "#ecb90f"

git_repo:
  branch_main:
    foreground: "#c1c8d7"
  branch_other:
    foreground: "#4e59b7"
  git_clean:
    foreground: "#2cc55d"
  git_dirty:
    foreground: "#f71118"

security_context:
  colon:
    foreground: "#d6dae4"
  user:
    foreground: "#c1c8d7"
  role:
    foreground: "#4e59b7"
  typ:
    foreground: "#d6dae4"
  range:
    foreground: "#4e59b7"

file_type:
  image:
    foreground: "#0f80d5"
  video:
    foreground: "#2cc55d"
  music:
    foreground: "#2cc55d"
  lossless:
    foreground: "#c1c8d7"
  crypto:
    foreground: "#d6dae4"
  document:
    foreground: "#c1c8d7"
  compressed:
    foreground: "#4e59b7"
  temp:
    foreground: "#343d50"
    is_dimmed: false
  compiled:
    foreground: "#2a84d2"
  build:
    foreground: "#d6dae4"
    is_underline: false
  source:
    foreground: "#2a84d2"

punctuation:
    foreground: "#d6dae4"
date:
    foreground: "#d6dae4"
inode:
    foreground: "#d6dae4"
blocks:
    foreground: "#d6dae4"
header:
    foreground: "#c1c8d7"
octal:
    foreground: "#343d50"
flags:
    foreground: "#4e59b7"

symlink_path:
    foreground: "#0f80d5"
control_char:
    foreground: "#ecb90f"
broken_symlink:
    foreground: "#f71118"
broken_path_overlay:
    foreground: "#d6dae4"
