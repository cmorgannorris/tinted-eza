# vim: ft=yaml

# Scheme Name: Seti UI
# Scheme Author: 
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d6d6d6"
  directory:
    foreground: "#55b5db"
  symlink:
    foreground: "#55dbbe"
  pipe:
    foreground: "#43a5d5"
  block_device:
    foreground: "#e6cd69"
  char_device:
    foreground: "#e6cd69"
  socket:
    foreground: "#43a5d5"
  special:
    foreground: "#a074c4"
  executable:
    foreground: "#9fca56"
  mount_point:
    foreground: "#e6cd69"

perms:
  user_read:
    foreground: "#e6cd69"
  user_write:
    foreground: "#cd3f45"
  user_execute_file:
    foreground: "#9fca56"
  user_execute_other:
    foreground: "#9fca56"
  group_read:
    foreground: "#e6cd69"
  group_write:
    foreground: "#cd3f45"
  group_execute:
    foreground: "#9fca56"
  other_read:
    foreground: "#e6cd69"
  other_write:
    foreground: "#cd3f45"
  other_execute:
    foreground: "#9fca56"
  special_user_file:
    foreground: "#a074c4"
  special_other:
    foreground: "#43a5d5"
  attribute:
    foreground: "#43a5d5"

size:
  major:
    foreground: "#9fca56"
  minor:
    foreground: "#9fca56"
  number_byte:
    foreground: "#43a5d5"
  number_kilo:
    foreground: "#d6d6d6"
  number_mega:
    foreground: "#e6cd69"
  number_giga:
    foreground: "#db7b55"
  number_huge:
    foreground: "#cd3f45"
  unit_byte:
    foreground: "#43a5d5"
  unit_kilo:
    foreground: "#d6d6d6"
  unit_mega:
    foreground: "#e6cd69"
  unit_giga:
    foreground: "#db7b55"
  unit_huge:
    foreground: "#cd3f45"

users:
  user_you:
    foreground: "#d6d6d6"
  user_root:
    foreground: "#cd3f45"
  user_other:
    foreground: "#a074c4"
  group_yours:
    foreground: "#d6d6d6"
  group_other:
    foreground: "#43a5d5"
  group_root:
    foreground: "#cd3f45"

links:
  normal:
    foreground: "#55dbbe"
  multi_link_file:
    foreground: "#d6d6d6"
    background: "#55dbbe"

git:
  new:
    foreground: "#9fca56"
  modified:
    foreground: "#e6cd69"
  deleted:
    foreground: "#cd3f45"
  renamed:
    foreground: "#41535b"
  typechange:
    foreground: "#a074c4"
  ignored:
    foreground: "#43a5d5"
  conflicted:
    foreground: "#db7b55"

git_repo:
  branch_main:
    foreground: "#d6d6d6"
  branch_other:
    foreground: "#a074c4"
  git_clean:
    foreground: "#9fca56"
  git_dirty:
    foreground: "#cd3f45"

security_context:
  colon:
    foreground: "#43a5d5"
  user:
    foreground: "#d6d6d6"
  role:
    foreground: "#a074c4"
  typ:
    foreground: "#43a5d5"
  range:
    foreground: "#a074c4"

file_type:
  image:
    foreground: "#e6cd69"
  video:
    foreground: "#9fca56"
  music:
    foreground: "#9fca56"
  lossless:
    foreground: "#d6d6d6"
  crypto:
    foreground: "#43a5d5"
  document:
    foreground: "#d6d6d6"
  compressed:
    foreground: "#a074c4"
  temp:
    foreground: "#41535b"
    is_dimmed: false
  compiled:
    foreground: "#55b5db"
  build:
    foreground: "#43a5d5"
    is_underline: false
  source:
    foreground: "#55b5db"

punctuation:
    foreground: "#43a5d5"
date:
    foreground: "#43a5d5"
inode:
    foreground: "#43a5d5"
blocks:
    foreground: "#43a5d5"
header:
    foreground: "#d6d6d6"
octal:
    foreground: "#41535b"
flags:
    foreground: "#a074c4"

symlink_path:
    foreground: "#55dbbe"
control_char:
    foreground: "#db7b55"
broken_symlink:
    foreground: "#cd3f45"
broken_path_overlay:
    foreground: "#43a5d5"
