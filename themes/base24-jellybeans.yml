# vim: ft=yaml

# Scheme Name: Jellybeans
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#d5d5d5"
  directory:
    foreground: "#97bedc"
  symlink:
    foreground: "#00988e"
  pipe:
    foreground: "#cdcdcd"
  block_device:
    foreground: "#b1d8f6"
  char_device:
    foreground: "#b1d8f6"
  socket:
    foreground: "#cdcdcd"
  special:
    foreground: "#e1c0fa"
  executable:
    foreground: "#93b979"
  mount_point:
    foreground: "#b1d8f6"

perms:
  user_read:
    foreground: "#b1d8f6"
  user_write:
    foreground: "#e27373"
  user_execute_file:
    foreground: "#93b979"
  user_execute_other:
    foreground: "#93b979"
  group_read:
    foreground: "#b1d8f6"
  group_write:
    foreground: "#e27373"
  group_execute:
    foreground: "#93b979"
  other_read:
    foreground: "#b1d8f6"
  other_write:
    foreground: "#e27373"
  other_execute:
    foreground: "#93b979"
  special_user_file:
    foreground: "#e1c0fa"
  special_other:
    foreground: "#cdcdcd"
  attribute:
    foreground: "#cdcdcd"

size:
  major:
    foreground: "#93b979"
  minor:
    foreground: "#93b979"
  number_byte:
    foreground: "#cdcdcd"
  number_kilo:
    foreground: "#d5d5d5"
  number_mega:
    foreground: "#b1d8f6"
  number_giga:
    foreground: "#ffba7b"
  number_huge:
    foreground: "#e27373"
  unit_byte:
    foreground: "#cdcdcd"
  unit_kilo:
    foreground: "#d5d5d5"
  unit_mega:
    foreground: "#b1d8f6"
  unit_giga:
    foreground: "#ffba7b"
  unit_huge:
    foreground: "#e27373"

users:
  user_you:
    foreground: "#d5d5d5"
  user_root:
    foreground: "#e27373"
  user_other:
    foreground: "#e1c0fa"
  group_yours:
    foreground: "#d5d5d5"
  group_other:
    foreground: "#cdcdcd"
  group_root:
    foreground: "#e27373"

links:
  normal:
    foreground: "#00988e"
  multi_link_file:
    foreground: "#d5d5d5"
    background: "#00988e"

git:
  new:
    foreground: "#93b979"
  modified:
    foreground: "#b1d8f6"
  deleted:
    foreground: "#e27373"
  renamed:
    foreground: "#c5c5c5"
  typechange:
    foreground: "#e1c0fa"
  ignored:
    foreground: "#cdcdcd"
  conflicted:
    foreground: "#ffba7b"

git_repo:
  branch_main:
    foreground: "#d5d5d5"
  branch_other:
    foreground: "#e1c0fa"
  git_clean:
    foreground: "#93b979"
  git_dirty:
    foreground: "#e27373"

security_context:
  colon:
    foreground: "#cdcdcd"
  user:
    foreground: "#d5d5d5"
  role:
    foreground: "#e1c0fa"
  typ:
    foreground: "#cdcdcd"
  range:
    foreground: "#e1c0fa"

file_type:
  image:
    foreground: "#b1d8f6"
  video:
    foreground: "#93b979"
  music:
    foreground: "#93b979"
  lossless:
    foreground: "#d5d5d5"
  crypto:
    foreground: "#cdcdcd"
  document:
    foreground: "#d5d5d5"
  compressed:
    foreground: "#e1c0fa"
  temp:
    foreground: "#c5c5c5"
  compiled:
    foreground: "#97bedc"
  build:
    foreground: "#cdcdcd"
    is_underline: false
  source:
    foreground: "#97bedc"

punctuation:
    foreground: "#cdcdcd"
date:
    foreground: "#cdcdcd"
inode:
    foreground: "#cdcdcd"
blocks:
    foreground: "#cdcdcd"
header:
    foreground: "#d5d5d5"
octal:
    foreground: "#c5c5c5"
flags:
    foreground: "#e1c0fa"

symlink_path:
    foreground: "#00988e"
control_char:
    foreground: "#ffba7b"
broken_symlink:
    foreground: "#e27373"
broken_path_overlay:
    foreground: "#cdcdcd"
