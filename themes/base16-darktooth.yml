# vim: ft=yaml

# Scheme Name: Darktooth
# Scheme Author: Jason Milkins (https://github.com/jasonm23)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a89984"
  directory:
    foreground: "#0d6678"
  symlink:
    foreground: "#8ba59b"
  pipe:
    foreground: "#928374"
  block_device:
    foreground: "#fac03b"
  char_device:
    foreground: "#fac03b"
  socket:
    foreground: "#928374"
  special:
    foreground: "#8f4673"
  executable:
    foreground: "#95c085"
  mount_point:
    foreground: "#fac03b"

perms:
  user_read:
    foreground: "#fac03b"
  user_write:
    foreground: "#fb543f"
  user_execute_file:
    foreground: "#95c085"
  user_execute_other:
    foreground: "#95c085"
  group_read:
    foreground: "#fac03b"
  group_write:
    foreground: "#fb543f"
  group_execute:
    foreground: "#95c085"
  other_read:
    foreground: "#fac03b"
  other_write:
    foreground: "#fb543f"
  other_execute:
    foreground: "#95c085"
  special_user_file:
    foreground: "#8f4673"
  special_other:
    foreground: "#928374"
  attribute:
    foreground: "#928374"

size:
  major:
    foreground: "#95c085"
  minor:
    foreground: "#95c085"
  number_byte:
    foreground: "#928374"
  number_kilo:
    foreground: "#a89984"
  number_mega:
    foreground: "#fac03b"
  number_giga:
    foreground: "#fe8625"
  number_huge:
    foreground: "#fb543f"
  unit_byte:
    foreground: "#928374"
  unit_kilo:
    foreground: "#a89984"
  unit_mega:
    foreground: "#fac03b"
  unit_giga:
    foreground: "#fe8625"
  unit_huge:
    foreground: "#fb543f"

users:
  user_you:
    foreground: "#a89984"
  user_root:
    foreground: "#fb543f"
  user_other:
    foreground: "#8f4673"
  group_yours:
    foreground: "#a89984"
  group_other:
    foreground: "#928374"
  group_root:
    foreground: "#fb543f"

links:
  normal:
    foreground: "#8ba59b"
  multi_link_file:
    foreground: "#a89984"
    background: "#8ba59b"

git:
  new:
    foreground: "#95c085"
  modified:
    foreground: "#fac03b"
  deleted:
    foreground: "#fb543f"
  renamed:
    foreground: "#665c54"
  typechange:
    foreground: "#8f4673"
  ignored:
    foreground: "#928374"
  conflicted:
    foreground: "#fe8625"

git_repo:
  branch_main:
    foreground: "#a89984"
  branch_other:
    foreground: "#8f4673"
  git_clean:
    foreground: "#95c085"
  git_dirty:
    foreground: "#fb543f"

security_context:
  colon:
    foreground: "#928374"
  user:
    foreground: "#a89984"
  role:
    foreground: "#8f4673"
  typ:
    foreground: "#928374"
  range:
    foreground: "#8f4673"

file_type:
  image:
    foreground: "#fac03b"
  video:
    foreground: "#95c085"
  music:
    foreground: "#95c085"
  lossless:
    foreground: "#a89984"
  crypto:
    foreground: "#928374"
  document:
    foreground: "#a89984"
  compressed:
    foreground: "#8f4673"
  temp:
    foreground: "#665c54"
    is_dimmed: false
  compiled:
    foreground: "#0d6678"
  build:
    foreground: "#928374"
    is_underline: false
  source:
    foreground: "#0d6678"

punctuation:
    foreground: "#928374"
date:
    foreground: "#928374"
inode:
    foreground: "#928374"
blocks:
    foreground: "#928374"
header:
    foreground: "#a89984"
octal:
    foreground: "#665c54"
flags:
    foreground: "#8f4673"

symlink_path:
    foreground: "#8ba59b"
control_char:
    foreground: "#fe8625"
broken_symlink:
    foreground: "#fb543f"
broken_path_overlay:
    foreground: "#928374"
