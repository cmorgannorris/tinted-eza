# vim: ft=yaml

# Scheme Name: Tomorrow Night
# Scheme Author: Cody Buell (https://github.com/codybuell)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#c5c8c6"
  directory:
    foreground: "#81a2be"
  symlink:
    foreground: "#8abeb7"
  pipe:
    foreground: "#b4b7b4"
  block_device:
    foreground: "#f0c674"
  char_device:
    foreground: "#f0c674"
  socket:
    foreground: "#b4b7b4"
  special:
    foreground: "#b294bb"
  executable:
    foreground: "#b5bd68"
  mount_point:
    foreground: "#f0c674"

perms:
  user_read:
    foreground: "#f0c674"
  user_write:
    foreground: "#cc6666"
  user_execute_file:
    foreground: "#b5bd68"
  user_execute_other:
    foreground: "#b5bd68"
  group_read:
    foreground: "#f0c674"
  group_write:
    foreground: "#cc6666"
  group_execute:
    foreground: "#b5bd68"
  other_read:
    foreground: "#f0c674"
  other_write:
    foreground: "#cc6666"
  other_execute:
    foreground: "#b5bd68"
  special_user_file:
    foreground: "#b294bb"
  special_other:
    foreground: "#b4b7b4"
  attribute:
    foreground: "#b4b7b4"

size:
  major:
    foreground: "#b5bd68"
  minor:
    foreground: "#b5bd68"
  number_byte:
    foreground: "#b4b7b4"
  number_kilo:
    foreground: "#c5c8c6"
  number_mega:
    foreground: "#f0c674"
  number_giga:
    foreground: "#de935f"
  number_huge:
    foreground: "#cc6666"
  unit_byte:
    foreground: "#b4b7b4"
  unit_kilo:
    foreground: "#c5c8c6"
  unit_mega:
    foreground: "#f0c674"
  unit_giga:
    foreground: "#de935f"
  unit_huge:
    foreground: "#cc6666"

users:
  user_you:
    foreground: "#c5c8c6"
  user_root:
    foreground: "#cc6666"
  user_other:
    foreground: "#b294bb"
  group_yours:
    foreground: "#c5c8c6"
  group_other:
    foreground: "#b4b7b4"
  group_root:
    foreground: "#cc6666"

links:
  normal:
    foreground: "#8abeb7"
  multi_link_file:
    foreground: "#c5c8c6"
    background: "#8abeb7"

git:
  new:
    foreground: "#b5bd68"
  modified:
    foreground: "#f0c674"
  deleted:
    foreground: "#cc6666"
  renamed:
    foreground: "#969896"
  typechange:
    foreground: "#b294bb"
  ignored:
    foreground: "#b4b7b4"
  conflicted:
    foreground: "#de935f"

git_repo:
  branch_main:
    foreground: "#c5c8c6"
  branch_other:
    foreground: "#b294bb"
  git_clean:
    foreground: "#b5bd68"
  git_dirty:
    foreground: "#cc6666"

security_context:
  colon:
    foreground: "#b4b7b4"
  user:
    foreground: "#c5c8c6"
  role:
    foreground: "#b294bb"
  typ:
    foreground: "#b4b7b4"
  range:
    foreground: "#b294bb"

file_type:
  image:
    foreground: "#f0c674"
  video:
    foreground: "#b5bd68"
  music:
    foreground: "#b5bd68"
  lossless:
    foreground: "#c5c8c6"
  crypto:
    foreground: "#b4b7b4"
  document:
    foreground: "#c5c8c6"
  compressed:
    foreground: "#b294bb"
  temp:
    foreground: "#969896"
    is_dimmed: false
  compiled:
    foreground: "#81a2be"
  build:
    foreground: "#b4b7b4"
    is_underline: false
  source:
    foreground: "#81a2be"

punctuation:
    foreground: "#b4b7b4"
date:
    foreground: "#b4b7b4"
inode:
    foreground: "#b4b7b4"
blocks:
    foreground: "#b4b7b4"
header:
    foreground: "#c5c8c6"
octal:
    foreground: "#969896"
flags:
    foreground: "#b294bb"

symlink_path:
    foreground: "#8abeb7"
control_char:
    foreground: "#de935f"
broken_symlink:
    foreground: "#cc6666"
broken_path_overlay:
    foreground: "#b4b7b4"
