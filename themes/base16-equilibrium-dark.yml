# vim: ft=yaml

# Scheme Name: Equilibrium Dark
# Scheme Author: Carlo Abelli
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#afaba2"
  directory:
    foreground: "#008dd1"
  symlink:
    foreground: "#00948b"
  pipe:
    foreground: "#949088"
  block_device:
    foreground: "#bb8801"
  char_device:
    foreground: "#bb8801"
  socket:
    foreground: "#949088"
  special:
    foreground: "#6a7fd2"
  executable:
    foreground: "#7f8b00"
  mount_point:
    foreground: "#bb8801"

perms:
  user_read:
    foreground: "#bb8801"
  user_write:
    foreground: "#f04339"
  user_execute_file:
    foreground: "#7f8b00"
  user_execute_other:
    foreground: "#7f8b00"
  group_read:
    foreground: "#bb8801"
  group_write:
    foreground: "#f04339"
  group_execute:
    foreground: "#7f8b00"
  other_read:
    foreground: "#bb8801"
  other_write:
    foreground: "#f04339"
  other_execute:
    foreground: "#7f8b00"
  special_user_file:
    foreground: "#6a7fd2"
  special_other:
    foreground: "#949088"
  attribute:
    foreground: "#949088"

size:
  major:
    foreground: "#7f8b00"
  minor:
    foreground: "#7f8b00"
  number_byte:
    foreground: "#949088"
  number_kilo:
    foreground: "#afaba2"
  number_mega:
    foreground: "#bb8801"
  number_giga:
    foreground: "#df5923"
  number_huge:
    foreground: "#f04339"
  unit_byte:
    foreground: "#949088"
  unit_kilo:
    foreground: "#afaba2"
  unit_mega:
    foreground: "#bb8801"
  unit_giga:
    foreground: "#df5923"
  unit_huge:
    foreground: "#f04339"

users:
  user_you:
    foreground: "#afaba2"
  user_root:
    foreground: "#f04339"
  user_other:
    foreground: "#6a7fd2"
  group_yours:
    foreground: "#afaba2"
  group_other:
    foreground: "#949088"
  group_root:
    foreground: "#f04339"

links:
  normal:
    foreground: "#00948b"
  multi_link_file:
    foreground: "#afaba2"
    background: "#00948b"

git:
  new:
    foreground: "#7f8b00"
  modified:
    foreground: "#bb8801"
  deleted:
    foreground: "#f04339"
  renamed:
    foreground: "#7b776e"
  typechange:
    foreground: "#6a7fd2"
  ignored:
    foreground: "#949088"
  conflicted:
    foreground: "#df5923"

git_repo:
  branch_main:
    foreground: "#afaba2"
  branch_other:
    foreground: "#6a7fd2"
  git_clean:
    foreground: "#7f8b00"
  git_dirty:
    foreground: "#f04339"

security_context:
  colon:
    foreground: "#949088"
  user:
    foreground: "#afaba2"
  role:
    foreground: "#6a7fd2"
  typ:
    foreground: "#949088"
  range:
    foreground: "#6a7fd2"

file_type:
  image:
    foreground: "#bb8801"
  video:
    foreground: "#7f8b00"
  music:
    foreground: "#7f8b00"
  lossless:
    foreground: "#afaba2"
  crypto:
    foreground: "#949088"
  document:
    foreground: "#afaba2"
  compressed:
    foreground: "#6a7fd2"
  temp:
    foreground: "#7b776e"
  compiled:
    foreground: "#008dd1"
  build:
    foreground: "#949088"
    is_underline: false
  source:
    foreground: "#008dd1"

punctuation:
    foreground: "#949088"
date:
    foreground: "#949088"
inode:
    foreground: "#949088"
blocks:
    foreground: "#949088"
header:
    foreground: "#afaba2"
octal:
    foreground: "#7b776e"
flags:
    foreground: "#6a7fd2"

symlink_path:
    foreground: "#00948b"
control_char:
    foreground: "#df5923"
broken_symlink:
    foreground: "#f04339"
broken_path_overlay:
    foreground: "#949088"
