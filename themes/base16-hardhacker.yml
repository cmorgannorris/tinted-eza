# vim: ft=yaml

# Scheme Name: Hardhacker
# Scheme Author: fe2-Nyxar, based on the https://github.com/hardhackerlabs
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#e4dee9"
  directory:
    foreground: "#95a6f4"
  symlink:
    foreground: "#b3f4f3"
  pipe:
    foreground: "#8a829e"
  block_device:
    foreground: "#ebde76"
  char_device:
    foreground: "#ebde76"
  socket:
    foreground: "#8a829e"
  special:
    foreground: "#ff79c6"
  executable:
    foreground: "#b1f2a7"
  mount_point:
    foreground: "#ebde76"

perms:
  user_read:
    foreground: "#ebde76"
  user_write:
    foreground: "#e965a5"
  user_execute_file:
    foreground: "#b1f2a7"
  user_execute_other:
    foreground: "#b1f2a7"
  group_read:
    foreground: "#ebde76"
  group_write:
    foreground: "#e965a5"
  group_execute:
    foreground: "#b1f2a7"
  other_read:
    foreground: "#ebde76"
  other_write:
    foreground: "#e965a5"
  other_execute:
    foreground: "#b1f2a7"
  special_user_file:
    foreground: "#ff79c6"
  special_other:
    foreground: "#8a829e"
  attribute:
    foreground: "#8a829e"

size:
  major:
    foreground: "#b1f2a7"
  minor:
    foreground: "#b1f2a7"
  number_byte:
    foreground: "#8a829e"
  number_kilo:
    foreground: "#e4dee9"
  number_mega:
    foreground: "#ebde76"
  number_giga:
    foreground: "#f4b870"
  number_huge:
    foreground: "#e965a5"
  unit_byte:
    foreground: "#8a829e"
  unit_kilo:
    foreground: "#e4dee9"
  unit_mega:
    foreground: "#ebde76"
  unit_giga:
    foreground: "#f4b870"
  unit_huge:
    foreground: "#e965a5"

users:
  user_you:
    foreground: "#e4dee9"
  user_root:
    foreground: "#e965a5"
  user_other:
    foreground: "#ff79c6"
  group_yours:
    foreground: "#e4dee9"
  group_other:
    foreground: "#8a829e"
  group_root:
    foreground: "#e965a5"

links:
  normal:
    foreground: "#b3f4f3"
  multi_link_file:
    foreground: "#e4dee9"
    background: "#b3f4f3"

git:
  new:
    foreground: "#b1f2a7"
  modified:
    foreground: "#ebde76"
  deleted:
    foreground: "#e965a5"
  renamed:
    foreground: "#6e6780"
  typechange:
    foreground: "#ff79c6"
  ignored:
    foreground: "#8a829e"
  conflicted:
    foreground: "#f4b870"

git_repo:
  branch_main:
    foreground: "#e4dee9"
  branch_other:
    foreground: "#ff79c6"
  git_clean:
    foreground: "#b1f2a7"
  git_dirty:
    foreground: "#e965a5"

security_context:
  colon:
    foreground: "#8a829e"
  user:
    foreground: "#e4dee9"
  role:
    foreground: "#ff79c6"
  typ:
    foreground: "#8a829e"
  range:
    foreground: "#ff79c6"

file_type:
  image:
    foreground: "#ebde76"
  video:
    foreground: "#b1f2a7"
  music:
    foreground: "#b1f2a7"
  lossless:
    foreground: "#e4dee9"
  crypto:
    foreground: "#8a829e"
  document:
    foreground: "#e4dee9"
  compressed:
    foreground: "#ff79c6"
  temp:
    foreground: "#6e6780"
  compiled:
    foreground: "#95a6f4"
  build:
    foreground: "#8a829e"
    is_underline: false
  source:
    foreground: "#95a6f4"

punctuation:
    foreground: "#8a829e"
date:
    foreground: "#8a829e"
inode:
    foreground: "#8a829e"
blocks:
    foreground: "#8a829e"
header:
    foreground: "#e4dee9"
octal:
    foreground: "#6e6780"
flags:
    foreground: "#ff79c6"

symlink_path:
    foreground: "#b3f4f3"
control_char:
    foreground: "#f4b870"
broken_symlink:
    foreground: "#e965a5"
broken_path_overlay:
    foreground: "#8a829e"
