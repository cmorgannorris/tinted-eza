# vim: ft=yaml

# Scheme Name: Gigavolt
# Scheme Author: Aidan Swope (http://github.com/Whillikers)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#e9e7e1"
  directory:
    foreground: "#40bfff"
  symlink:
    foreground: "#fb6acb"
  pipe:
    foreground: "#cad3ff"
  block_device:
    foreground: "#ffdc2d"
  char_device:
    foreground: "#ffdc2d"
  socket:
    foreground: "#cad3ff"
  special:
    foreground: "#ae94f9"
  executable:
    foreground: "#f2e6a9"
  mount_point:
    foreground: "#ffdc2d"

perms:
  user_read:
    foreground: "#ffdc2d"
  user_write:
    foreground: "#ff661a"
  user_execute_file:
    foreground: "#f2e6a9"
  user_execute_other:
    foreground: "#f2e6a9"
  group_read:
    foreground: "#ffdc2d"
  group_write:
    foreground: "#ff661a"
  group_execute:
    foreground: "#f2e6a9"
  other_read:
    foreground: "#ffdc2d"
  other_write:
    foreground: "#ff661a"
  other_execute:
    foreground: "#f2e6a9"
  special_user_file:
    foreground: "#ae94f9"
  special_other:
    foreground: "#cad3ff"
  attribute:
    foreground: "#cad3ff"

size:
  major:
    foreground: "#f2e6a9"
  minor:
    foreground: "#f2e6a9"
  number_byte:
    foreground: "#cad3ff"
  number_kilo:
    foreground: "#e9e7e1"
  number_mega:
    foreground: "#ffdc2d"
  number_giga:
    foreground: "#19f988"
  number_huge:
    foreground: "#ff661a"
  unit_byte:
    foreground: "#cad3ff"
  unit_kilo:
    foreground: "#e9e7e1"
  unit_mega:
    foreground: "#ffdc2d"
  unit_giga:
    foreground: "#19f988"
  unit_huge:
    foreground: "#ff661a"

users:
  user_you:
    foreground: "#e9e7e1"
  user_root:
    foreground: "#ff661a"
  user_other:
    foreground: "#ae94f9"
  group_yours:
    foreground: "#e9e7e1"
  group_other:
    foreground: "#cad3ff"
  group_root:
    foreground: "#ff661a"

links:
  normal:
    foreground: "#fb6acb"
  multi_link_file:
    foreground: "#e9e7e1"
    background: "#fb6acb"

git:
  new:
    foreground: "#f2e6a9"
  modified:
    foreground: "#ffdc2d"
  deleted:
    foreground: "#ff661a"
  renamed:
    foreground: "#a1d2e6"
  typechange:
    foreground: "#ae94f9"
  ignored:
    foreground: "#cad3ff"
  conflicted:
    foreground: "#19f988"

git_repo:
  branch_main:
    foreground: "#e9e7e1"
  branch_other:
    foreground: "#ae94f9"
  git_clean:
    foreground: "#f2e6a9"
  git_dirty:
    foreground: "#ff661a"

security_context:
  colon:
    foreground: "#cad3ff"
  user:
    foreground: "#e9e7e1"
  role:
    foreground: "#ae94f9"
  typ:
    foreground: "#cad3ff"
  range:
    foreground: "#ae94f9"

file_type:
  image:
    foreground: "#ffdc2d"
  video:
    foreground: "#f2e6a9"
  music:
    foreground: "#f2e6a9"
  lossless:
    foreground: "#e9e7e1"
  crypto:
    foreground: "#cad3ff"
  document:
    foreground: "#e9e7e1"
  compressed:
    foreground: "#ae94f9"
  temp:
    foreground: "#a1d2e6"
  compiled:
    foreground: "#40bfff"
  build:
    foreground: "#cad3ff"
    is_underline: false
  source:
    foreground: "#40bfff"

punctuation:
    foreground: "#cad3ff"
date:
    foreground: "#cad3ff"
inode:
    foreground: "#cad3ff"
blocks:
    foreground: "#cad3ff"
header:
    foreground: "#e9e7e1"
octal:
    foreground: "#a1d2e6"
flags:
    foreground: "#ae94f9"

symlink_path:
    foreground: "#fb6acb"
control_char:
    foreground: "#19f988"
broken_symlink:
    foreground: "#ff661a"
broken_path_overlay:
    foreground: "#cad3ff"
