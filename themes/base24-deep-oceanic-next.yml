# vim: ft=yaml

# Scheme Name: Deep Oceanic Next
# Scheme Author: spearkkk (https://github.com/spearkkk)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#d4e1e8"
  directory:
    foreground: "#568ccf"
  symlink:
    foreground: "#4fb7ae"
  pipe:
    foreground: "#0093a3"
  block_device:
    foreground: "#f3b863"
  char_device:
    foreground: "#f3b863"
  socket:
    foreground: "#0093a3"
  special:
    foreground: "#8b66d6"
  executable:
    foreground: "#63b784"
  mount_point:
    foreground: "#f3b863"

perms:
  user_read:
    foreground: "#f3b863"
  user_write:
    foreground: "#d3464d"
  user_execute_file:
    foreground: "#63b784"
  user_execute_other:
    foreground: "#63b784"
  group_read:
    foreground: "#f3b863"
  group_write:
    foreground: "#d3464d"
  group_execute:
    foreground: "#63b784"
  other_read:
    foreground: "#f3b863"
  other_write:
    foreground: "#d3464d"
  other_execute:
    foreground: "#63b784"
  special_user_file:
    foreground: "#8b66d6"
  special_other:
    foreground: "#0093a3"
  attribute:
    foreground: "#0093a3"

size:
  major:
    foreground: "#63b784"
  minor:
    foreground: "#63b784"
  number_byte:
    foreground: "#0093a3"
  number_kilo:
    foreground: "#d4e1e8"
  number_mega:
    foreground: "#f3b863"
  number_giga:
    foreground: "#e37552"
  number_huge:
    foreground: "#d3464d"
  unit_byte:
    foreground: "#0093a3"
  unit_kilo:
    foreground: "#d4e1e8"
  unit_mega:
    foreground: "#f3b863"
  unit_giga:
    foreground: "#e37552"
  unit_huge:
    foreground: "#d3464d"

users:
  user_you:
    foreground: "#d4e1e8"
  user_root:
    foreground: "#d3464d"
  user_other:
    foreground: "#8b66d6"
  group_yours:
    foreground: "#d4e1e8"
  group_other:
    foreground: "#0093a3"
  group_root:
    foreground: "#d3464d"

links:
  normal:
    foreground: "#4fb7ae"
  multi_link_file:
    foreground: "#d4e1e8"
    background: "#4fb7ae"

git:
  new:
    foreground: "#63b784"
  modified:
    foreground: "#f3b863"
  deleted:
    foreground: "#d3464d"
  renamed:
    foreground: "#004852"
  typechange:
    foreground: "#8b66d6"
  ignored:
    foreground: "#0093a3"
  conflicted:
    foreground: "#e37552"

git_repo:
  branch_main:
    foreground: "#d4e1e8"
  branch_other:
    foreground: "#8b66d6"
  git_clean:
    foreground: "#63b784"
  git_dirty:
    foreground: "#d3464d"

security_context:
  colon:
    foreground: "#0093a3"
  user:
    foreground: "#d4e1e8"
  role:
    foreground: "#8b66d6"
  typ:
    foreground: "#0093a3"
  range:
    foreground: "#8b66d6"

file_type:
  image:
    foreground: "#f3b863"
  video:
    foreground: "#63b784"
  music:
    foreground: "#63b784"
  lossless:
    foreground: "#d4e1e8"
  crypto:
    foreground: "#0093a3"
  document:
    foreground: "#d4e1e8"
  compressed:
    foreground: "#8b66d6"
  temp:
    foreground: "#004852"
  compiled:
    foreground: "#568ccf"
  build:
    foreground: "#0093a3"
    is_underline: false
  source:
    foreground: "#568ccf"

punctuation:
    foreground: "#0093a3"
date:
    foreground: "#0093a3"
inode:
    foreground: "#0093a3"
blocks:
    foreground: "#0093a3"
header:
    foreground: "#d4e1e8"
octal:
    foreground: "#004852"
flags:
    foreground: "#8b66d6"

symlink_path:
    foreground: "#4fb7ae"
control_char:
    foreground: "#e37552"
broken_symlink:
    foreground: "#d3464d"
broken_path_overlay:
    foreground: "#0093a3"
