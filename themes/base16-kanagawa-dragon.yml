# vim: ft=yaml

# Scheme Name: Kanagawa Dragon
# Scheme Author: Tommaso Laurenzi (https://github.com/rebelot)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c5c9c5"
  directory:
    foreground: "#8ba4b0"
  symlink:
    foreground: "#8ea4a2"
  pipe:
    foreground: "#a6a69c"
  block_device:
    foreground: "#c4b28a"
  char_device:
    foreground: "#c4b28a"
  socket:
    foreground: "#a6a69c"
  special:
    foreground: "#8992a7"
  executable:
    foreground: "#87a987"
  mount_point:
    foreground: "#c4b28a"

perms:
  user_read:
    foreground: "#c4b28a"
  user_write:
    foreground: "#c4746e"
  user_execute_file:
    foreground: "#87a987"
  user_execute_other:
    foreground: "#87a987"
  group_read:
    foreground: "#c4b28a"
  group_write:
    foreground: "#c4746e"
  group_execute:
    foreground: "#87a987"
  other_read:
    foreground: "#c4b28a"
  other_write:
    foreground: "#c4746e"
  other_execute:
    foreground: "#87a987"
  special_user_file:
    foreground: "#8992a7"
  special_other:
    foreground: "#a6a69c"
  attribute:
    foreground: "#a6a69c"

size:
  major:
    foreground: "#87a987"
  minor:
    foreground: "#87a987"
  number_byte:
    foreground: "#a6a69c"
  number_kilo:
    foreground: "#c5c9c5"
  number_mega:
    foreground: "#c4b28a"
  number_giga:
    foreground: "#b98d7b"
  number_huge:
    foreground: "#c4746e"
  unit_byte:
    foreground: "#a6a69c"
  unit_kilo:
    foreground: "#c5c9c5"
  unit_mega:
    foreground: "#c4b28a"
  unit_giga:
    foreground: "#b98d7b"
  unit_huge:
    foreground: "#c4746e"

users:
  user_you:
    foreground: "#c5c9c5"
  user_root:
    foreground: "#c4746e"
  user_other:
    foreground: "#8992a7"
  group_yours:
    foreground: "#c5c9c5"
  group_other:
    foreground: "#a6a69c"
  group_root:
    foreground: "#c4746e"

links:
  normal:
    foreground: "#8ea4a2"
  multi_link_file:
    foreground: "#c5c9c5"
    background: "#8ea4a2"

git:
  new:
    foreground: "#87a987"
  modified:
    foreground: "#c4b28a"
  deleted:
    foreground: "#c4746e"
  renamed:
    foreground: "#737c73"
  typechange:
    foreground: "#8992a7"
  ignored:
    foreground: "#a6a69c"
  conflicted:
    foreground: "#b98d7b"

git_repo:
  branch_main:
    foreground: "#c5c9c5"
  branch_other:
    foreground: "#8992a7"
  git_clean:
    foreground: "#87a987"
  git_dirty:
    foreground: "#c4746e"

security_context:
  colon:
    foreground: "#a6a69c"
  user:
    foreground: "#c5c9c5"
  role:
    foreground: "#8992a7"
  typ:
    foreground: "#a6a69c"
  range:
    foreground: "#8992a7"

file_type:
  image:
    foreground: "#c4b28a"
  video:
    foreground: "#87a987"
  music:
    foreground: "#87a987"
  lossless:
    foreground: "#c5c9c5"
  crypto:
    foreground: "#a6a69c"
  document:
    foreground: "#c5c9c5"
  compressed:
    foreground: "#8992a7"
  temp:
    foreground: "#737c73"
    is_dimmed: false
  compiled:
    foreground: "#8ba4b0"
  build:
    foreground: "#a6a69c"
    is_underline: false
  source:
    foreground: "#8ba4b0"

punctuation:
    foreground: "#a6a69c"
date:
    foreground: "#a6a69c"
inode:
    foreground: "#a6a69c"
blocks:
    foreground: "#a6a69c"
header:
    foreground: "#c5c9c5"
octal:
    foreground: "#737c73"
flags:
    foreground: "#8992a7"

symlink_path:
    foreground: "#8ea4a2"
control_char:
    foreground: "#b98d7b"
broken_symlink:
    foreground: "#c4746e"
broken_path_overlay:
    foreground: "#a6a69c"
