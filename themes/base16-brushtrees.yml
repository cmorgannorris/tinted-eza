# vim: ft=yaml

# Scheme Name: Brush Trees
# Scheme Author: Abraham White &lt;abelincoln.white@gmail.com&gt;
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#6d828e"
  directory:
    foreground: "#868cb3"
  symlink:
    foreground: "#86b3b3"
  pipe:
    foreground: "#8299a1"
  block_device:
    foreground: "#aab386"
  char_device:
    foreground: "#aab386"
  socket:
    foreground: "#8299a1"
  special:
    foreground: "#b386b2"
  executable:
    foreground: "#87b386"
  mount_point:
    foreground: "#aab386"

perms:
  user_read:
    foreground: "#aab386"
  user_write:
    foreground: "#b38686"
  user_execute_file:
    foreground: "#87b386"
  user_execute_other:
    foreground: "#87b386"
  group_read:
    foreground: "#aab386"
  group_write:
    foreground: "#b38686"
  group_execute:
    foreground: "#87b386"
  other_read:
    foreground: "#aab386"
  other_write:
    foreground: "#b38686"
  other_execute:
    foreground: "#87b386"
  special_user_file:
    foreground: "#b386b2"
  special_other:
    foreground: "#8299a1"
  attribute:
    foreground: "#8299a1"

size:
  major:
    foreground: "#87b386"
  minor:
    foreground: "#87b386"
  number_byte:
    foreground: "#8299a1"
  number_kilo:
    foreground: "#6d828e"
  number_mega:
    foreground: "#aab386"
  number_giga:
    foreground: "#d8bba2"
  number_huge:
    foreground: "#b38686"
  unit_byte:
    foreground: "#8299a1"
  unit_kilo:
    foreground: "#6d828e"
  unit_mega:
    foreground: "#aab386"
  unit_giga:
    foreground: "#d8bba2"
  unit_huge:
    foreground: "#b38686"

users:
  user_you:
    foreground: "#6d828e"
  user_root:
    foreground: "#b38686"
  user_other:
    foreground: "#b386b2"
  group_yours:
    foreground: "#6d828e"
  group_other:
    foreground: "#8299a1"
  group_root:
    foreground: "#b38686"

links:
  normal:
    foreground: "#86b3b3"
  multi_link_file:
    foreground: "#6d828e"
    background: "#86b3b3"

git:
  new:
    foreground: "#87b386"
  modified:
    foreground: "#aab386"
  deleted:
    foreground: "#b38686"
  renamed:
    foreground: "#98afb5"
  typechange:
    foreground: "#b386b2"
  ignored:
    foreground: "#8299a1"
  conflicted:
    foreground: "#d8bba2"

git_repo:
  branch_main:
    foreground: "#6d828e"
  branch_other:
    foreground: "#b386b2"
  git_clean:
    foreground: "#87b386"
  git_dirty:
    foreground: "#b38686"

security_context:
  colon:
    foreground: "#8299a1"
  user:
    foreground: "#6d828e"
  role:
    foreground: "#b386b2"
  typ:
    foreground: "#8299a1"
  range:
    foreground: "#b386b2"

file_type:
  image:
    foreground: "#aab386"
  video:
    foreground: "#87b386"
  music:
    foreground: "#87b386"
  lossless:
    foreground: "#6d828e"
  crypto:
    foreground: "#8299a1"
  document:
    foreground: "#6d828e"
  compressed:
    foreground: "#b386b2"
  temp:
    foreground: "#98afb5"
    is_dimmed: false
  compiled:
    foreground: "#868cb3"
  build:
    foreground: "#8299a1"
    is_underline: false
  source:
    foreground: "#868cb3"

punctuation:
    foreground: "#8299a1"
date:
    foreground: "#8299a1"
inode:
    foreground: "#8299a1"
blocks:
    foreground: "#8299a1"
header:
    foreground: "#6d828e"
octal:
    foreground: "#98afb5"
flags:
    foreground: "#b386b2"

symlink_path:
    foreground: "#86b3b3"
control_char:
    foreground: "#d8bba2"
broken_symlink:
    foreground: "#b38686"
broken_path_overlay:
    foreground: "#8299a1"
