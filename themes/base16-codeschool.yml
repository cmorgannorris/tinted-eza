# vim: ft=yaml

# Scheme Name: Codeschool
# Scheme Author: blockloop
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#9ea7a6"
  directory:
    foreground: "#484d79"
  symlink:
    foreground: "#b02f30"
  pipe:
    foreground: "#84898c"
  block_device:
    foreground: "#a03b1e"
  char_device:
    foreground: "#a03b1e"
  socket:
    foreground: "#84898c"
  special:
    foreground: "#c59820"
  executable:
    foreground: "#237986"
  mount_point:
    foreground: "#a03b1e"

perms:
  user_read:
    foreground: "#a03b1e"
  user_write:
    foreground: "#2a5491"
  user_execute_file:
    foreground: "#237986"
  user_execute_other:
    foreground: "#237986"
  group_read:
    foreground: "#a03b1e"
  group_write:
    foreground: "#2a5491"
  group_execute:
    foreground: "#237986"
  other_read:
    foreground: "#a03b1e"
  other_write:
    foreground: "#2a5491"
  other_execute:
    foreground: "#237986"
  special_user_file:
    foreground: "#c59820"
  special_other:
    foreground: "#84898c"
  attribute:
    foreground: "#84898c"

size:
  major:
    foreground: "#237986"
  minor:
    foreground: "#237986"
  number_byte:
    foreground: "#84898c"
  number_kilo:
    foreground: "#9ea7a6"
  number_mega:
    foreground: "#a03b1e"
  number_giga:
    foreground: "#43820d"
  number_huge:
    foreground: "#2a5491"
  unit_byte:
    foreground: "#84898c"
  unit_kilo:
    foreground: "#9ea7a6"
  unit_mega:
    foreground: "#a03b1e"
  unit_giga:
    foreground: "#43820d"
  unit_huge:
    foreground: "#2a5491"

users:
  user_you:
    foreground: "#9ea7a6"
  user_root:
    foreground: "#2a5491"
  user_other:
    foreground: "#c59820"
  group_yours:
    foreground: "#9ea7a6"
  group_other:
    foreground: "#84898c"
  group_root:
    foreground: "#2a5491"

links:
  normal:
    foreground: "#b02f30"
  multi_link_file:
    foreground: "#9ea7a6"
    background: "#b02f30"

git:
  new:
    foreground: "#237986"
  modified:
    foreground: "#a03b1e"
  deleted:
    foreground: "#2a5491"
  renamed:
    foreground: "#3f4944"
  typechange:
    foreground: "#c59820"
  ignored:
    foreground: "#84898c"
  conflicted:
    foreground: "#43820d"

git_repo:
  branch_main:
    foreground: "#9ea7a6"
  branch_other:
    foreground: "#c59820"
  git_clean:
    foreground: "#237986"
  git_dirty:
    foreground: "#2a5491"

security_context:
  colon:
    foreground: "#84898c"
  user:
    foreground: "#9ea7a6"
  role:
    foreground: "#c59820"
  typ:
    foreground: "#84898c"
  range:
    foreground: "#c59820"

file_type:
  image:
    foreground: "#a03b1e"
  video:
    foreground: "#237986"
  music:
    foreground: "#237986"
  lossless:
    foreground: "#9ea7a6"
  crypto:
    foreground: "#84898c"
  document:
    foreground: "#9ea7a6"
  compressed:
    foreground: "#c59820"
  temp:
    foreground: "#3f4944"
  compiled:
    foreground: "#484d79"
  build:
    foreground: "#84898c"
    is_underline: false
  source:
    foreground: "#484d79"

punctuation:
    foreground: "#84898c"
date:
    foreground: "#84898c"
inode:
    foreground: "#84898c"
blocks:
    foreground: "#84898c"
header:
    foreground: "#9ea7a6"
octal:
    foreground: "#3f4944"
flags:
    foreground: "#c59820"

symlink_path:
    foreground: "#b02f30"
control_char:
    foreground: "#43820d"
broken_symlink:
    foreground: "#2a5491"
broken_path_overlay:
    foreground: "#84898c"
