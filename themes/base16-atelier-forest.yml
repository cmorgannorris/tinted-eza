# vim: ft=yaml

# Scheme Name: Atelier Forest
# Scheme Author: Bram de Haan (http://atelierbramdehaan.nl)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a8a19f"
  directory:
    foreground: "#407ee7"
  symlink:
    foreground: "#3d97b8"
  pipe:
    foreground: "#9c9491"
  block_device:
    foreground: "#c38418"
  char_device:
    foreground: "#c38418"
  socket:
    foreground: "#9c9491"
  special:
    foreground: "#6666ea"
  executable:
    foreground: "#7b9726"
  mount_point:
    foreground: "#c38418"

perms:
  user_read:
    foreground: "#c38418"
  user_write:
    foreground: "#f22c40"
  user_execute_file:
    foreground: "#7b9726"
  user_execute_other:
    foreground: "#7b9726"
  group_read:
    foreground: "#c38418"
  group_write:
    foreground: "#f22c40"
  group_execute:
    foreground: "#7b9726"
  other_read:
    foreground: "#c38418"
  other_write:
    foreground: "#f22c40"
  other_execute:
    foreground: "#7b9726"
  special_user_file:
    foreground: "#6666ea"
  special_other:
    foreground: "#9c9491"
  attribute:
    foreground: "#9c9491"

size:
  major:
    foreground: "#7b9726"
  minor:
    foreground: "#7b9726"
  number_byte:
    foreground: "#9c9491"
  number_kilo:
    foreground: "#a8a19f"
  number_mega:
    foreground: "#c38418"
  number_giga:
    foreground: "#df5320"
  number_huge:
    foreground: "#f22c40"
  unit_byte:
    foreground: "#9c9491"
  unit_kilo:
    foreground: "#a8a19f"
  unit_mega:
    foreground: "#c38418"
  unit_giga:
    foreground: "#df5320"
  unit_huge:
    foreground: "#f22c40"

users:
  user_you:
    foreground: "#a8a19f"
  user_root:
    foreground: "#f22c40"
  user_other:
    foreground: "#6666ea"
  group_yours:
    foreground: "#a8a19f"
  group_other:
    foreground: "#9c9491"
  group_root:
    foreground: "#f22c40"

links:
  normal:
    foreground: "#3d97b8"
  multi_link_file:
    foreground: "#a8a19f"
    background: "#3d97b8"

git:
  new:
    foreground: "#7b9726"
  modified:
    foreground: "#c38418"
  deleted:
    foreground: "#f22c40"
  renamed:
    foreground: "#766e6b"
  typechange:
    foreground: "#6666ea"
  ignored:
    foreground: "#9c9491"
  conflicted:
    foreground: "#df5320"

git_repo:
  branch_main:
    foreground: "#a8a19f"
  branch_other:
    foreground: "#6666ea"
  git_clean:
    foreground: "#7b9726"
  git_dirty:
    foreground: "#f22c40"

security_context:
  colon:
    foreground: "#9c9491"
  user:
    foreground: "#a8a19f"
  role:
    foreground: "#6666ea"
  typ:
    foreground: "#9c9491"
  range:
    foreground: "#6666ea"

file_type:
  image:
    foreground: "#c38418"
  video:
    foreground: "#7b9726"
  music:
    foreground: "#7b9726"
  lossless:
    foreground: "#a8a19f"
  crypto:
    foreground: "#9c9491"
  document:
    foreground: "#a8a19f"
  compressed:
    foreground: "#6666ea"
  temp:
    foreground: "#766e6b"
  compiled:
    foreground: "#407ee7"
  build:
    foreground: "#9c9491"
    is_underline: false
  source:
    foreground: "#407ee7"

punctuation:
    foreground: "#9c9491"
date:
    foreground: "#9c9491"
inode:
    foreground: "#9c9491"
blocks:
    foreground: "#9c9491"
header:
    foreground: "#a8a19f"
octal:
    foreground: "#766e6b"
flags:
    foreground: "#6666ea"

symlink_path:
    foreground: "#3d97b8"
control_char:
    foreground: "#df5320"
broken_symlink:
    foreground: "#f22c40"
broken_path_overlay:
    foreground: "#9c9491"
