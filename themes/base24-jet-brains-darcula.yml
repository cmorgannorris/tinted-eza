# vim: ft=yaml

# Scheme Name: Jet Brains Darcula
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#979797"
  directory:
    foreground: "#4581eb"
  symlink:
    foreground: "#33c2c1"
  pipe:
    foreground: "#818181"
  block_device:
    foreground: "#6d9df1"
  char_device:
    foreground: "#6d9df1"
  socket:
    foreground: "#818181"
  special:
    foreground: "#fa54ff"
  executable:
    foreground: "#126e00"
  mount_point:
    foreground: "#6d9df1"

perms:
  user_read:
    foreground: "#6d9df1"
  user_write:
    foreground: "#fa5355"
  user_execute_file:
    foreground: "#126e00"
  user_execute_other:
    foreground: "#126e00"
  group_read:
    foreground: "#6d9df1"
  group_write:
    foreground: "#fa5355"
  group_execute:
    foreground: "#126e00"
  other_read:
    foreground: "#6d9df1"
  other_write:
    foreground: "#fa5355"
  other_execute:
    foreground: "#126e00"
  special_user_file:
    foreground: "#fa54ff"
  special_other:
    foreground: "#818181"
  attribute:
    foreground: "#818181"

size:
  major:
    foreground: "#126e00"
  minor:
    foreground: "#126e00"
  number_byte:
    foreground: "#818181"
  number_kilo:
    foreground: "#979797"
  number_mega:
    foreground: "#6d9df1"
  number_giga:
    foreground: "#c2c300"
  number_huge:
    foreground: "#fa5355"
  unit_byte:
    foreground: "#818181"
  unit_kilo:
    foreground: "#979797"
  unit_mega:
    foreground: "#6d9df1"
  unit_giga:
    foreground: "#c2c300"
  unit_huge:
    foreground: "#fa5355"

users:
  user_you:
    foreground: "#979797"
  user_root:
    foreground: "#fa5355"
  user_other:
    foreground: "#fa54ff"
  group_yours:
    foreground: "#979797"
  group_other:
    foreground: "#818181"
  group_root:
    foreground: "#fa5355"

links:
  normal:
    foreground: "#33c2c1"
  multi_link_file:
    foreground: "#979797"
    background: "#33c2c1"

git:
  new:
    foreground: "#126e00"
  modified:
    foreground: "#6d9df1"
  deleted:
    foreground: "#fa5355"
  renamed:
    foreground: "#6b6b6b"
  typechange:
    foreground: "#fa54ff"
  ignored:
    foreground: "#818181"
  conflicted:
    foreground: "#c2c300"

git_repo:
  branch_main:
    foreground: "#979797"
  branch_other:
    foreground: "#fa54ff"
  git_clean:
    foreground: "#126e00"
  git_dirty:
    foreground: "#fa5355"

security_context:
  colon:
    foreground: "#818181"
  user:
    foreground: "#979797"
  role:
    foreground: "#fa54ff"
  typ:
    foreground: "#818181"
  range:
    foreground: "#fa54ff"

file_type:
  image:
    foreground: "#6d9df1"
  video:
    foreground: "#126e00"
  music:
    foreground: "#126e00"
  lossless:
    foreground: "#126e00"
  crypto:
    foreground: "#818181"
  document:
    foreground: "#979797"
  compressed:
    foreground: "#818181"
  temp:
    foreground: "#555555"
  compiled:
    foreground: "#4581eb"
  build:
    foreground: "#818181"
    is_underline: false
  source:
    foreground: "#4581eb"

punctuation:
    foreground: "#818181"
date:
    foreground: "#818181"
inode:
    foreground: "#818181"
blocks:
    foreground: "#818181"
header:
    foreground: "#979797"
octal:
    foreground: "#6b6b6b"
flags:
    foreground: "#fa54ff"

symlink_path:
    foreground: "#33c2c1"
control_char:
    foreground: "#c2c300"
broken_symlink:
    foreground: "#fa5355"
broken_path_overlay:
    foreground: "#818181"
