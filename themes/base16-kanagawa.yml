# vim: ft=yaml

# Scheme Name: Kanagawa
# Scheme Author: Tommaso Laurenzi (https://github.com/rebelot)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#dcd7ba"
  directory:
    foreground: "#7e9cd8"
  symlink:
    foreground: "#6a9589"
  pipe:
    foreground: "#727169"
  block_device:
    foreground: "#c0a36e"
  char_device:
    foreground: "#c0a36e"
  socket:
    foreground: "#727169"
  special:
    foreground: "#957fb8"
  executable:
    foreground: "#76946a"
  mount_point:
    foreground: "#c0a36e"

perms:
  user_read:
    foreground: "#c0a36e"
  user_write:
    foreground: "#c34043"
  user_execute_file:
    foreground: "#76946a"
  user_execute_other:
    foreground: "#76946a"
  group_read:
    foreground: "#c0a36e"
  group_write:
    foreground: "#c34043"
  group_execute:
    foreground: "#76946a"
  other_read:
    foreground: "#c0a36e"
  other_write:
    foreground: "#c34043"
  other_execute:
    foreground: "#76946a"
  special_user_file:
    foreground: "#957fb8"
  special_other:
    foreground: "#727169"
  attribute:
    foreground: "#727169"

size:
  major:
    foreground: "#76946a"
  minor:
    foreground: "#76946a"
  number_byte:
    foreground: "#727169"
  number_kilo:
    foreground: "#dcd7ba"
  number_mega:
    foreground: "#c0a36e"
  number_giga:
    foreground: "#ffa066"
  number_huge:
    foreground: "#c34043"
  unit_byte:
    foreground: "#727169"
  unit_kilo:
    foreground: "#dcd7ba"
  unit_mega:
    foreground: "#c0a36e"
  unit_giga:
    foreground: "#ffa066"
  unit_huge:
    foreground: "#c34043"

users:
  user_you:
    foreground: "#dcd7ba"
  user_root:
    foreground: "#c34043"
  user_other:
    foreground: "#957fb8"
  group_yours:
    foreground: "#dcd7ba"
  group_other:
    foreground: "#727169"
  group_root:
    foreground: "#c34043"

links:
  normal:
    foreground: "#6a9589"
  multi_link_file:
    foreground: "#dcd7ba"
    background: "#6a9589"

git:
  new:
    foreground: "#76946a"
  modified:
    foreground: "#c0a36e"
  deleted:
    foreground: "#c34043"
  renamed:
    foreground: "#54546d"
  typechange:
    foreground: "#957fb8"
  ignored:
    foreground: "#727169"
  conflicted:
    foreground: "#ffa066"

git_repo:
  branch_main:
    foreground: "#dcd7ba"
  branch_other:
    foreground: "#957fb8"
  git_clean:
    foreground: "#76946a"
  git_dirty:
    foreground: "#c34043"

security_context:
  colon:
    foreground: "#727169"
  user:
    foreground: "#dcd7ba"
  role:
    foreground: "#957fb8"
  typ:
    foreground: "#727169"
  range:
    foreground: "#957fb8"

file_type:
  image:
    foreground: "#c0a36e"
  video:
    foreground: "#76946a"
  music:
    foreground: "#76946a"
  lossless:
    foreground: "#dcd7ba"
  crypto:
    foreground: "#727169"
  document:
    foreground: "#dcd7ba"
  compressed:
    foreground: "#957fb8"
  temp:
    foreground: "#54546d"
    is_dimmed: false
  compiled:
    foreground: "#7e9cd8"
  build:
    foreground: "#727169"
    is_underline: false
  source:
    foreground: "#7e9cd8"

punctuation:
    foreground: "#727169"
date:
    foreground: "#727169"
inode:
    foreground: "#727169"
blocks:
    foreground: "#727169"
header:
    foreground: "#dcd7ba"
octal:
    foreground: "#54546d"
flags:
    foreground: "#957fb8"

symlink_path:
    foreground: "#6a9589"
control_char:
    foreground: "#ffa066"
broken_symlink:
    foreground: "#c34043"
broken_path_overlay:
    foreground: "#727169"
