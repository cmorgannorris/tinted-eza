# vim: ft=yaml

# Scheme Name: Silk Light
# Scheme Author: Gabriel Fontes (https://github.com/Misterio77)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#385156"
  directory:
    foreground: "#39aac9"
  symlink:
    foreground: "#329ca2"
  pipe:
    foreground: "#4b5b5f"
  block_device:
    foreground: "#cfad25"
  char_device:
    foreground: "#cfad25"
  socket:
    foreground: "#4b5b5f"
  special:
    foreground: "#6e6582"
  executable:
    foreground: "#6ca38c"
  mount_point:
    foreground: "#cfad25"

perms:
  user_read:
    foreground: "#cfad25"
  user_write:
    foreground: "#cf432e"
  user_execute_file:
    foreground: "#6ca38c"
  user_execute_other:
    foreground: "#6ca38c"
  group_read:
    foreground: "#cfad25"
  group_write:
    foreground: "#cf432e"
  group_execute:
    foreground: "#6ca38c"
  other_read:
    foreground: "#cfad25"
  other_write:
    foreground: "#cf432e"
  other_execute:
    foreground: "#6ca38c"
  special_user_file:
    foreground: "#6e6582"
  special_other:
    foreground: "#4b5b5f"
  attribute:
    foreground: "#4b5b5f"

size:
  major:
    foreground: "#6ca38c"
  minor:
    foreground: "#6ca38c"
  number_byte:
    foreground: "#4b5b5f"
  number_kilo:
    foreground: "#385156"
  number_mega:
    foreground: "#cfad25"
  number_giga:
    foreground: "#d27f46"
  number_huge:
    foreground: "#cf432e"
  unit_byte:
    foreground: "#4b5b5f"
  unit_kilo:
    foreground: "#385156"
  unit_mega:
    foreground: "#cfad25"
  unit_giga:
    foreground: "#d27f46"
  unit_huge:
    foreground: "#cf432e"

users:
  user_you:
    foreground: "#385156"
  user_root:
    foreground: "#cf432e"
  user_other:
    foreground: "#6e6582"
  group_yours:
    foreground: "#385156"
  group_other:
    foreground: "#4b5b5f"
  group_root:
    foreground: "#cf432e"

links:
  normal:
    foreground: "#329ca2"
  multi_link_file:
    foreground: "#385156"
    background: "#329ca2"

git:
  new:
    foreground: "#6ca38c"
  modified:
    foreground: "#cfad25"
  deleted:
    foreground: "#cf432e"
  renamed:
    foreground: "#5c787b"
  typechange:
    foreground: "#6e6582"
  ignored:
    foreground: "#4b5b5f"
  conflicted:
    foreground: "#d27f46"

git_repo:
  branch_main:
    foreground: "#385156"
  branch_other:
    foreground: "#6e6582"
  git_clean:
    foreground: "#6ca38c"
  git_dirty:
    foreground: "#cf432e"

security_context:
  colon:
    foreground: "#4b5b5f"
  user:
    foreground: "#385156"
  role:
    foreground: "#6e6582"
  typ:
    foreground: "#4b5b5f"
  range:
    foreground: "#6e6582"

file_type:
  image:
    foreground: "#cfad25"
  video:
    foreground: "#6ca38c"
  music:
    foreground: "#6ca38c"
  lossless:
    foreground: "#385156"
  crypto:
    foreground: "#4b5b5f"
  document:
    foreground: "#385156"
  compressed:
    foreground: "#6e6582"
  temp:
    foreground: "#5c787b"
    is_dimmed: false
  compiled:
    foreground: "#39aac9"
  build:
    foreground: "#4b5b5f"
    is_underline: false
  source:
    foreground: "#39aac9"

punctuation:
    foreground: "#4b5b5f"
date:
    foreground: "#4b5b5f"
inode:
    foreground: "#4b5b5f"
blocks:
    foreground: "#4b5b5f"
header:
    foreground: "#385156"
octal:
    foreground: "#5c787b"
flags:
    foreground: "#6e6582"

symlink_path:
    foreground: "#329ca2"
control_char:
    foreground: "#d27f46"
broken_symlink:
    foreground: "#cf432e"
broken_path_overlay:
    foreground: "#4b5b5f"
