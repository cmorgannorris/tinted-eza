# vim: ft=yaml

# Scheme Name: Brewer
# Scheme Author: Timothée Poisot (http://github.com/tpoisot)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#b7b8b9"
  directory:
    foreground: "#3182bd"
  symlink:
    foreground: "#80b1d3"
  pipe:
    foreground: "#959697"
  block_device:
    foreground: "#dca060"
  char_device:
    foreground: "#dca060"
  socket:
    foreground: "#959697"
  special:
    foreground: "#756bb1"
  executable:
    foreground: "#31a354"
  mount_point:
    foreground: "#dca060"

perms:
  user_read:
    foreground: "#dca060"
  user_write:
    foreground: "#e31a1c"
  user_execute_file:
    foreground: "#31a354"
  user_execute_other:
    foreground: "#31a354"
  group_read:
    foreground: "#dca060"
  group_write:
    foreground: "#e31a1c"
  group_execute:
    foreground: "#31a354"
  other_read:
    foreground: "#dca060"
  other_write:
    foreground: "#e31a1c"
  other_execute:
    foreground: "#31a354"
  special_user_file:
    foreground: "#756bb1"
  special_other:
    foreground: "#959697"
  attribute:
    foreground: "#959697"

size:
  major:
    foreground: "#31a354"
  minor:
    foreground: "#31a354"
  number_byte:
    foreground: "#959697"
  number_kilo:
    foreground: "#b7b8b9"
  number_mega:
    foreground: "#dca060"
  number_giga:
    foreground: "#e6550d"
  number_huge:
    foreground: "#e31a1c"
  unit_byte:
    foreground: "#959697"
  unit_kilo:
    foreground: "#b7b8b9"
  unit_mega:
    foreground: "#dca060"
  unit_giga:
    foreground: "#e6550d"
  unit_huge:
    foreground: "#e31a1c"

users:
  user_you:
    foreground: "#b7b8b9"
  user_root:
    foreground: "#e31a1c"
  user_other:
    foreground: "#756bb1"
  group_yours:
    foreground: "#b7b8b9"
  group_other:
    foreground: "#959697"
  group_root:
    foreground: "#e31a1c"

links:
  normal:
    foreground: "#80b1d3"
  multi_link_file:
    foreground: "#b7b8b9"
    background: "#80b1d3"

git:
  new:
    foreground: "#31a354"
  modified:
    foreground: "#dca060"
  deleted:
    foreground: "#e31a1c"
  renamed:
    foreground: "#737475"
  typechange:
    foreground: "#756bb1"
  ignored:
    foreground: "#959697"
  conflicted:
    foreground: "#e6550d"

git_repo:
  branch_main:
    foreground: "#b7b8b9"
  branch_other:
    foreground: "#756bb1"
  git_clean:
    foreground: "#31a354"
  git_dirty:
    foreground: "#e31a1c"

security_context:
  colon:
    foreground: "#959697"
  user:
    foreground: "#b7b8b9"
  role:
    foreground: "#756bb1"
  typ:
    foreground: "#959697"
  range:
    foreground: "#756bb1"

file_type:
  image:
    foreground: "#dca060"
  video:
    foreground: "#31a354"
  music:
    foreground: "#31a354"
  lossless:
    foreground: "#b7b8b9"
  crypto:
    foreground: "#959697"
  document:
    foreground: "#b7b8b9"
  compressed:
    foreground: "#756bb1"
  temp:
    foreground: "#737475"
  compiled:
    foreground: "#3182bd"
  build:
    foreground: "#959697"
    is_underline: false
  source:
    foreground: "#3182bd"

punctuation:
    foreground: "#959697"
date:
    foreground: "#959697"
inode:
    foreground: "#959697"
blocks:
    foreground: "#959697"
header:
    foreground: "#b7b8b9"
octal:
    foreground: "#737475"
flags:
    foreground: "#756bb1"

symlink_path:
    foreground: "#80b1d3"
control_char:
    foreground: "#e6550d"
broken_symlink:
    foreground: "#e31a1c"
broken_path_overlay:
    foreground: "#959697"
