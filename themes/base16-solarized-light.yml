# vim: ft=yaml

# Scheme Name: Solarized Light
# Scheme Author: Ethan Schoonover (modified by aramisgithub)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#586e75"
  directory:
    foreground: "#268bd2"
  symlink:
    foreground: "#2aa198"
  pipe:
    foreground: "#657b83"
  block_device:
    foreground: "#b58900"
  char_device:
    foreground: "#b58900"
  socket:
    foreground: "#657b83"
  special:
    foreground: "#6c71c4"
  executable:
    foreground: "#859900"
  mount_point:
    foreground: "#b58900"

perms:
  user_read:
    foreground: "#b58900"
  user_write:
    foreground: "#dc322f"
  user_execute_file:
    foreground: "#859900"
  user_execute_other:
    foreground: "#859900"
  group_read:
    foreground: "#b58900"
  group_write:
    foreground: "#dc322f"
  group_execute:
    foreground: "#859900"
  other_read:
    foreground: "#b58900"
  other_write:
    foreground: "#dc322f"
  other_execute:
    foreground: "#859900"
  special_user_file:
    foreground: "#6c71c4"
  special_other:
    foreground: "#657b83"
  attribute:
    foreground: "#657b83"

size:
  major:
    foreground: "#859900"
  minor:
    foreground: "#859900"
  number_byte:
    foreground: "#657b83"
  number_kilo:
    foreground: "#586e75"
  number_mega:
    foreground: "#b58900"
  number_giga:
    foreground: "#cb4b16"
  number_huge:
    foreground: "#dc322f"
  unit_byte:
    foreground: "#657b83"
  unit_kilo:
    foreground: "#586e75"
  unit_mega:
    foreground: "#b58900"
  unit_giga:
    foreground: "#cb4b16"
  unit_huge:
    foreground: "#dc322f"

users:
  user_you:
    foreground: "#586e75"
  user_root:
    foreground: "#dc322f"
  user_other:
    foreground: "#6c71c4"
  group_yours:
    foreground: "#586e75"
  group_other:
    foreground: "#657b83"
  group_root:
    foreground: "#dc322f"

links:
  normal:
    foreground: "#2aa198"
  multi_link_file:
    foreground: "#586e75"
    background: "#2aa198"

git:
  new:
    foreground: "#859900"
  modified:
    foreground: "#b58900"
  deleted:
    foreground: "#dc322f"
  renamed:
    foreground: "#839496"
  typechange:
    foreground: "#6c71c4"
  ignored:
    foreground: "#657b83"
  conflicted:
    foreground: "#cb4b16"

git_repo:
  branch_main:
    foreground: "#586e75"
  branch_other:
    foreground: "#6c71c4"
  git_clean:
    foreground: "#859900"
  git_dirty:
    foreground: "#dc322f"

security_context:
  colon:
    foreground: "#657b83"
  user:
    foreground: "#586e75"
  role:
    foreground: "#6c71c4"
  typ:
    foreground: "#657b83"
  range:
    foreground: "#6c71c4"

file_type:
  image:
    foreground: "#b58900"
  video:
    foreground: "#859900"
  music:
    foreground: "#859900"
  lossless:
    foreground: "#586e75"
  crypto:
    foreground: "#657b83"
  document:
    foreground: "#586e75"
  compressed:
    foreground: "#6c71c4"
  temp:
    foreground: "#839496"
    is_dimmed: false
  compiled:
    foreground: "#268bd2"
  build:
    foreground: "#657b83"
    is_underline: false
  source:
    foreground: "#268bd2"

punctuation:
    foreground: "#657b83"
date:
    foreground: "#657b83"
inode:
    foreground: "#657b83"
blocks:
    foreground: "#657b83"
header:
    foreground: "#586e75"
octal:
    foreground: "#839496"
flags:
    foreground: "#6c71c4"

symlink_path:
    foreground: "#2aa198"
control_char:
    foreground: "#cb4b16"
broken_symlink:
    foreground: "#dc322f"
broken_path_overlay:
    foreground: "#657b83"
