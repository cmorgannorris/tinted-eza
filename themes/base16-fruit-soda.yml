# vim: ft=yaml

# Scheme Name: Fruit Soda
# Scheme Author: jozip
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#515151"
  directory:
    foreground: "#2931df"
  symlink:
    foreground: "#0f9cfd"
  pipe:
    foreground: "#979598"
  block_device:
    foreground: "#f7e203"
  char_device:
    foreground: "#f7e203"
  socket:
    foreground: "#979598"
  special:
    foreground: "#611fce"
  executable:
    foreground: "#47f74c"
  mount_point:
    foreground: "#f7e203"

perms:
  user_read:
    foreground: "#f7e203"
  user_write:
    foreground: "#fe3e31"
  user_execute_file:
    foreground: "#47f74c"
  user_execute_other:
    foreground: "#47f74c"
  group_read:
    foreground: "#f7e203"
  group_write:
    foreground: "#fe3e31"
  group_execute:
    foreground: "#47f74c"
  other_read:
    foreground: "#f7e203"
  other_write:
    foreground: "#fe3e31"
  other_execute:
    foreground: "#47f74c"
  special_user_file:
    foreground: "#611fce"
  special_other:
    foreground: "#979598"
  attribute:
    foreground: "#979598"

size:
  major:
    foreground: "#47f74c"
  minor:
    foreground: "#47f74c"
  number_byte:
    foreground: "#979598"
  number_kilo:
    foreground: "#515151"
  number_mega:
    foreground: "#f7e203"
  number_giga:
    foreground: "#fe6d08"
  number_huge:
    foreground: "#fe3e31"
  unit_byte:
    foreground: "#979598"
  unit_kilo:
    foreground: "#515151"
  unit_mega:
    foreground: "#f7e203"
  unit_giga:
    foreground: "#fe6d08"
  unit_huge:
    foreground: "#fe3e31"

users:
  user_you:
    foreground: "#515151"
  user_root:
    foreground: "#fe3e31"
  user_other:
    foreground: "#611fce"
  group_yours:
    foreground: "#515151"
  group_other:
    foreground: "#979598"
  group_root:
    foreground: "#fe3e31"

links:
  normal:
    foreground: "#0f9cfd"
  multi_link_file:
    foreground: "#515151"
    background: "#0f9cfd"

git:
  new:
    foreground: "#47f74c"
  modified:
    foreground: "#f7e203"
  deleted:
    foreground: "#fe3e31"
  renamed:
    foreground: "#b5b4b6"
  typechange:
    foreground: "#611fce"
  ignored:
    foreground: "#979598"
  conflicted:
    foreground: "#fe6d08"

git_repo:
  branch_main:
    foreground: "#515151"
  branch_other:
    foreground: "#611fce"
  git_clean:
    foreground: "#47f74c"
  git_dirty:
    foreground: "#fe3e31"

security_context:
  colon:
    foreground: "#979598"
  user:
    foreground: "#515151"
  role:
    foreground: "#611fce"
  typ:
    foreground: "#979598"
  range:
    foreground: "#611fce"

file_type:
  image:
    foreground: "#f7e203"
  video:
    foreground: "#47f74c"
  music:
    foreground: "#47f74c"
  lossless:
    foreground: "#515151"
  crypto:
    foreground: "#979598"
  document:
    foreground: "#515151"
  compressed:
    foreground: "#611fce"
  temp:
    foreground: "#b5b4b6"
    is_dimmed: false
  compiled:
    foreground: "#2931df"
  build:
    foreground: "#979598"
    is_underline: false
  source:
    foreground: "#2931df"

punctuation:
    foreground: "#979598"
date:
    foreground: "#979598"
inode:
    foreground: "#979598"
blocks:
    foreground: "#979598"
header:
    foreground: "#515151"
octal:
    foreground: "#b5b4b6"
flags:
    foreground: "#611fce"

symlink_path:
    foreground: "#0f9cfd"
control_char:
    foreground: "#fe6d08"
broken_symlink:
    foreground: "#fe3e31"
broken_path_overlay:
    foreground: "#979598"
