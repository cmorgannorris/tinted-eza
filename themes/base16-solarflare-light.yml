# vim: ft=yaml

# Scheme Name: Solar Flare Light
# Scheme Author: Chuck Harmston (https://chuck.harmston.ch)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#586875"
  directory:
    foreground: "#33b5e1"
  symlink:
    foreground: "#52cbb0"
  pipe:
    foreground: "#667581"
  block_device:
    foreground: "#e4b51c"
  char_device:
    foreground: "#e4b51c"
  socket:
    foreground: "#667581"
  special:
    foreground: "#a363d5"
  executable:
    foreground: "#7cc844"
  mount_point:
    foreground: "#e4b51c"

perms:
  user_read:
    foreground: "#e4b51c"
  user_write:
    foreground: "#ef5253"
  user_execute_file:
    foreground: "#7cc844"
  user_execute_other:
    foreground: "#7cc844"
  group_read:
    foreground: "#e4b51c"
  group_write:
    foreground: "#ef5253"
  group_execute:
    foreground: "#7cc844"
  other_read:
    foreground: "#e4b51c"
  other_write:
    foreground: "#ef5253"
  other_execute:
    foreground: "#7cc844"
  special_user_file:
    foreground: "#a363d5"
  special_other:
    foreground: "#667581"
  attribute:
    foreground: "#667581"

size:
  major:
    foreground: "#7cc844"
  minor:
    foreground: "#7cc844"
  number_byte:
    foreground: "#667581"
  number_kilo:
    foreground: "#586875"
  number_mega:
    foreground: "#e4b51c"
  number_giga:
    foreground: "#e66b2b"
  number_huge:
    foreground: "#ef5253"
  unit_byte:
    foreground: "#667581"
  unit_kilo:
    foreground: "#586875"
  unit_mega:
    foreground: "#e4b51c"
  unit_giga:
    foreground: "#e66b2b"
  unit_huge:
    foreground: "#ef5253"

users:
  user_you:
    foreground: "#586875"
  user_root:
    foreground: "#ef5253"
  user_other:
    foreground: "#a363d5"
  group_yours:
    foreground: "#586875"
  group_other:
    foreground: "#667581"
  group_root:
    foreground: "#ef5253"

links:
  normal:
    foreground: "#52cbb0"
  multi_link_file:
    foreground: "#586875"
    background: "#52cbb0"

git:
  new:
    foreground: "#7cc844"
  modified:
    foreground: "#e4b51c"
  deleted:
    foreground: "#ef5253"
  renamed:
    foreground: "#85939e"
  typechange:
    foreground: "#a363d5"
  ignored:
    foreground: "#667581"
  conflicted:
    foreground: "#e66b2b"

git_repo:
  branch_main:
    foreground: "#586875"
  branch_other:
    foreground: "#a363d5"
  git_clean:
    foreground: "#7cc844"
  git_dirty:
    foreground: "#ef5253"

security_context:
  colon:
    foreground: "#667581"
  user:
    foreground: "#586875"
  role:
    foreground: "#a363d5"
  typ:
    foreground: "#667581"
  range:
    foreground: "#a363d5"

file_type:
  image:
    foreground: "#e4b51c"
  video:
    foreground: "#7cc844"
  music:
    foreground: "#7cc844"
  lossless:
    foreground: "#586875"
  crypto:
    foreground: "#667581"
  document:
    foreground: "#586875"
  compressed:
    foreground: "#a363d5"
  temp:
    foreground: "#85939e"
  compiled:
    foreground: "#33b5e1"
  build:
    foreground: "#667581"
    is_underline: false
  source:
    foreground: "#33b5e1"

punctuation:
    foreground: "#667581"
date:
    foreground: "#667581"
inode:
    foreground: "#667581"
blocks:
    foreground: "#667581"
header:
    foreground: "#586875"
octal:
    foreground: "#85939e"
flags:
    foreground: "#a363d5"

symlink_path:
    foreground: "#52cbb0"
control_char:
    foreground: "#e66b2b"
broken_symlink:
    foreground: "#ef5253"
broken_path_overlay:
    foreground: "#667581"
