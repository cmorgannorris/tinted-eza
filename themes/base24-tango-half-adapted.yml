# vim: ft=yaml

# Scheme Name: Tango Half Adapted
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#c6cac1"
  directory:
    foreground: "#008df5"
  symlink:
    foreground: "#00bdc3"
  pipe:
    foreground: "#acb0a8"
  block_device:
    foreground: "#75beff"
  char_device:
    foreground: "#75beff"
  socket:
    foreground: "#acb0a8"
  special:
    foreground: "#a86bb2"
  executable:
    foreground: "#4cc300"
  mount_point:
    foreground: "#75beff"

perms:
  user_read:
    foreground: "#75beff"
  user_write:
    foreground: "#ff0000"
  user_execute_file:
    foreground: "#4cc300"
  user_execute_other:
    foreground: "#4cc300"
  group_read:
    foreground: "#75beff"
  group_write:
    foreground: "#ff0000"
  group_execute:
    foreground: "#4cc300"
  other_read:
    foreground: "#75beff"
  other_write:
    foreground: "#ff0000"
  other_execute:
    foreground: "#4cc300"
  special_user_file:
    foreground: "#a86bb2"
  special_other:
    foreground: "#acb0a8"
  attribute:
    foreground: "#acb0a8"

size:
  major:
    foreground: "#4cc300"
  minor:
    foreground: "#4cc300"
  number_byte:
    foreground: "#acb0a8"
  number_kilo:
    foreground: "#c6cac1"
  number_mega:
    foreground: "#75beff"
  number_giga:
    foreground: "#e2bf00"
  number_huge:
    foreground: "#ff0000"
  unit_byte:
    foreground: "#acb0a8"
  unit_kilo:
    foreground: "#c6cac1"
  unit_mega:
    foreground: "#75beff"
  unit_giga:
    foreground: "#e2bf00"
  unit_huge:
    foreground: "#ff0000"

users:
  user_you:
    foreground: "#c6cac1"
  user_root:
    foreground: "#ff0000"
  user_other:
    foreground: "#a86bb2"
  group_yours:
    foreground: "#c6cac1"
  group_other:
    foreground: "#acb0a8"
  group_root:
    foreground: "#ff0000"

links:
  normal:
    foreground: "#00bdc3"
  multi_link_file:
    foreground: "#c6cac1"
    background: "#00bdc3"

git:
  new:
    foreground: "#4cc300"
  modified:
    foreground: "#75beff"
  deleted:
    foreground: "#ff0000"
  renamed:
    foreground: "#92968e"
  typechange:
    foreground: "#a86bb2"
  ignored:
    foreground: "#acb0a8"
  conflicted:
    foreground: "#e2bf00"

git_repo:
  branch_main:
    foreground: "#c6cac1"
  branch_other:
    foreground: "#a86bb2"
  git_clean:
    foreground: "#4cc300"
  git_dirty:
    foreground: "#ff0000"

security_context:
  colon:
    foreground: "#acb0a8"
  user:
    foreground: "#c6cac1"
  role:
    foreground: "#a86bb2"
  typ:
    foreground: "#acb0a8"
  range:
    foreground: "#a86bb2"

file_type:
  image:
    foreground: "#75beff"
  video:
    foreground: "#4cc300"
  music:
    foreground: "#4cc300"
  lossless:
    foreground: "#c6cac1"
  crypto:
    foreground: "#acb0a8"
  document:
    foreground: "#c6cac1"
  compressed:
    foreground: "#a86bb2"
  temp:
    foreground: "#92968e"
  compiled:
    foreground: "#008df5"
  build:
    foreground: "#acb0a8"
    is_underline: false
  source:
    foreground: "#008df5"

punctuation:
    foreground: "#acb0a8"
date:
    foreground: "#acb0a8"
inode:
    foreground: "#acb0a8"
blocks:
    foreground: "#acb0a8"
header:
    foreground: "#c6cac1"
octal:
    foreground: "#92968e"
flags:
    foreground: "#a86bb2"

symlink_path:
    foreground: "#00bdc3"
control_char:
    foreground: "#e2bf00"
broken_symlink:
    foreground: "#ff0000"
broken_path_overlay:
    foreground: "#acb0a8"
