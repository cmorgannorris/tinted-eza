# vim: ft=yaml

# Scheme Name: standardized-light
# Scheme Author: ali (https://github.com/ali-githb/base16-standardized-scheme)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#444444"
  directory:
    foreground: "#3173c5"
  symlink:
    foreground: "#00998f"
  pipe:
    foreground: "#767676"
  block_device:
    foreground: "#ad8200"
  char_device:
    foreground: "#ad8200"
  socket:
    foreground: "#767676"
  special:
    foreground: "#9e57c2"
  executable:
    foreground: "#31861f"
  mount_point:
    foreground: "#ad8200"

perms:
  user_read:
    foreground: "#ad8200"
  user_write:
    foreground: "#d03e3e"
  user_execute_file:
    foreground: "#31861f"
  user_execute_other:
    foreground: "#31861f"
  group_read:
    foreground: "#ad8200"
  group_write:
    foreground: "#d03e3e"
  group_execute:
    foreground: "#31861f"
  other_read:
    foreground: "#ad8200"
  other_write:
    foreground: "#d03e3e"
  other_execute:
    foreground: "#31861f"
  special_user_file:
    foreground: "#9e57c2"
  special_other:
    foreground: "#767676"
  attribute:
    foreground: "#767676"

size:
  major:
    foreground: "#31861f"
  minor:
    foreground: "#31861f"
  number_byte:
    foreground: "#767676"
  number_kilo:
    foreground: "#444444"
  number_mega:
    foreground: "#ad8200"
  number_giga:
    foreground: "#d7691d"
  number_huge:
    foreground: "#d03e3e"
  unit_byte:
    foreground: "#767676"
  unit_kilo:
    foreground: "#444444"
  unit_mega:
    foreground: "#ad8200"
  unit_giga:
    foreground: "#d7691d"
  unit_huge:
    foreground: "#d03e3e"

users:
  user_you:
    foreground: "#444444"
  user_root:
    foreground: "#d03e3e"
  user_other:
    foreground: "#9e57c2"
  group_yours:
    foreground: "#444444"
  group_other:
    foreground: "#767676"
  group_root:
    foreground: "#d03e3e"

links:
  normal:
    foreground: "#00998f"
  multi_link_file:
    foreground: "#444444"
    background: "#00998f"

git:
  new:
    foreground: "#31861f"
  modified:
    foreground: "#ad8200"
  deleted:
    foreground: "#d03e3e"
  renamed:
    foreground: "#767676"
  typechange:
    foreground: "#9e57c2"
  ignored:
    foreground: "#767676"
  conflicted:
    foreground: "#d7691d"

git_repo:
  branch_main:
    foreground: "#444444"
  branch_other:
    foreground: "#9e57c2"
  git_clean:
    foreground: "#31861f"
  git_dirty:
    foreground: "#d03e3e"

security_context:
  colon:
    foreground: "#767676"
  user:
    foreground: "#444444"
  role:
    foreground: "#9e57c2"
  typ:
    foreground: "#767676"
  range:
    foreground: "#9e57c2"

file_type:
  image:
    foreground: "#ad8200"
  video:
    foreground: "#31861f"
  music:
    foreground: "#31861f"
  lossless:
    foreground: "#444444"
  crypto:
    foreground: "#767676"
  document:
    foreground: "#444444"
  compressed:
    foreground: "#9e57c2"
  temp:
    foreground: "#767676"
  compiled:
    foreground: "#3173c5"
  build:
    foreground: "#767676"
    is_underline: false
  source:
    foreground: "#3173c5"

punctuation:
    foreground: "#767676"
date:
    foreground: "#767676"
inode:
    foreground: "#767676"
blocks:
    foreground: "#767676"
header:
    foreground: "#444444"
octal:
    foreground: "#767676"
flags:
    foreground: "#9e57c2"

symlink_path:
    foreground: "#00998f"
control_char:
    foreground: "#d7691d"
broken_symlink:
    foreground: "#d03e3e"
broken_path_overlay:
    foreground: "#767676"
