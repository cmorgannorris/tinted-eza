# vim: ft=yaml

# Scheme Name: emil
# Scheme Author: limelier
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#313145"
  directory:
    foreground: "#471397"
  symlink:
    foreground: "#2155d6"
  pipe:
    foreground: "#505063"
  block_device:
    foreground: "#ff669b"
  char_device:
    foreground: "#ff669b"
  socket:
    foreground: "#505063"
  special:
    foreground: "#6916b6"
  executable:
    foreground: "#0073a8"
  mount_point:
    foreground: "#ff669b"

perms:
  user_read:
    foreground: "#ff669b"
  user_write:
    foreground: "#f43979"
  user_execute_file:
    foreground: "#0073a8"
  user_execute_other:
    foreground: "#0073a8"
  group_read:
    foreground: "#ff669b"
  group_write:
    foreground: "#f43979"
  group_execute:
    foreground: "#0073a8"
  other_read:
    foreground: "#ff669b"
  other_write:
    foreground: "#f43979"
  other_execute:
    foreground: "#0073a8"
  special_user_file:
    foreground: "#6916b6"
  special_other:
    foreground: "#505063"
  attribute:
    foreground: "#505063"

size:
  major:
    foreground: "#0073a8"
  minor:
    foreground: "#0073a8"
  number_byte:
    foreground: "#505063"
  number_kilo:
    foreground: "#313145"
  number_mega:
    foreground: "#ff669b"
  number_giga:
    foreground: "#d22a8b"
  number_huge:
    foreground: "#f43979"
  unit_byte:
    foreground: "#505063"
  unit_kilo:
    foreground: "#313145"
  unit_mega:
    foreground: "#ff669b"
  unit_giga:
    foreground: "#d22a8b"
  unit_huge:
    foreground: "#f43979"

users:
  user_you:
    foreground: "#313145"
  user_root:
    foreground: "#f43979"
  user_other:
    foreground: "#6916b6"
  group_yours:
    foreground: "#313145"
  group_other:
    foreground: "#505063"
  group_root:
    foreground: "#f43979"

links:
  normal:
    foreground: "#2155d6"
  multi_link_file:
    foreground: "#313145"
    background: "#2155d6"

git:
  new:
    foreground: "#0073a8"
  modified:
    foreground: "#ff669b"
  deleted:
    foreground: "#f43979"
  renamed:
    foreground: "#7c7c98"
  typechange:
    foreground: "#6916b6"
  ignored:
    foreground: "#505063"
  conflicted:
    foreground: "#d22a8b"

git_repo:
  branch_main:
    foreground: "#313145"
  branch_other:
    foreground: "#6916b6"
  git_clean:
    foreground: "#0073a8"
  git_dirty:
    foreground: "#f43979"

security_context:
  colon:
    foreground: "#505063"
  user:
    foreground: "#313145"
  role:
    foreground: "#6916b6"
  typ:
    foreground: "#505063"
  range:
    foreground: "#6916b6"

file_type:
  image:
    foreground: "#ff669b"
  video:
    foreground: "#0073a8"
  music:
    foreground: "#0073a8"
  lossless:
    foreground: "#313145"
  crypto:
    foreground: "#505063"
  document:
    foreground: "#313145"
  compressed:
    foreground: "#6916b6"
  temp:
    foreground: "#7c7c98"
  compiled:
    foreground: "#471397"
  build:
    foreground: "#505063"
    is_underline: false
  source:
    foreground: "#471397"

punctuation:
    foreground: "#505063"
date:
    foreground: "#505063"
inode:
    foreground: "#505063"
blocks:
    foreground: "#505063"
header:
    foreground: "#313145"
octal:
    foreground: "#7c7c98"
flags:
    foreground: "#6916b6"

symlink_path:
    foreground: "#2155d6"
control_char:
    foreground: "#d22a8b"
broken_symlink:
    foreground: "#f43979"
broken_path_overlay:
    foreground: "#505063"
