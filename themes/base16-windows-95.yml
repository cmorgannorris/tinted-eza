# vim: ft=yaml

# Scheme Name: Windows 95
# Scheme Author: Fergus Collins (https://github.com/ferguscollins)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#a8a8a8"
  directory:
    foreground: "#5454fc"
  symlink:
    foreground: "#54fcfc"
  pipe:
    foreground: "#7e7e7e"
  block_device:
    foreground: "#fcfc54"
  char_device:
    foreground: "#fcfc54"
  socket:
    foreground: "#7e7e7e"
  special:
    foreground: "#fc54fc"
  executable:
    foreground: "#54fc54"
  mount_point:
    foreground: "#fcfc54"

perms:
  user_read:
    foreground: "#fcfc54"
  user_write:
    foreground: "#fc5454"
  user_execute_file:
    foreground: "#54fc54"
  user_execute_other:
    foreground: "#54fc54"
  group_read:
    foreground: "#fcfc54"
  group_write:
    foreground: "#fc5454"
  group_execute:
    foreground: "#54fc54"
  other_read:
    foreground: "#fcfc54"
  other_write:
    foreground: "#fc5454"
  other_execute:
    foreground: "#54fc54"
  special_user_file:
    foreground: "#fc54fc"
  special_other:
    foreground: "#7e7e7e"
  attribute:
    foreground: "#7e7e7e"

size:
  major:
    foreground: "#54fc54"
  minor:
    foreground: "#54fc54"
  number_byte:
    foreground: "#7e7e7e"
  number_kilo:
    foreground: "#a8a8a8"
  number_mega:
    foreground: "#fcfc54"
  number_giga:
    foreground: "#a85400"
  number_huge:
    foreground: "#fc5454"
  unit_byte:
    foreground: "#7e7e7e"
  unit_kilo:
    foreground: "#a8a8a8"
  unit_mega:
    foreground: "#fcfc54"
  unit_giga:
    foreground: "#a85400"
  unit_huge:
    foreground: "#fc5454"

users:
  user_you:
    foreground: "#a8a8a8"
  user_root:
    foreground: "#fc5454"
  user_other:
    foreground: "#fc54fc"
  group_yours:
    foreground: "#a8a8a8"
  group_other:
    foreground: "#7e7e7e"
  group_root:
    foreground: "#fc5454"

links:
  normal:
    foreground: "#54fcfc"
  multi_link_file:
    foreground: "#a8a8a8"
    background: "#54fcfc"

git:
  new:
    foreground: "#54fc54"
  modified:
    foreground: "#fcfc54"
  deleted:
    foreground: "#fc5454"
  renamed:
    foreground: "#545454"
  typechange:
    foreground: "#fc54fc"
  ignored:
    foreground: "#7e7e7e"
  conflicted:
    foreground: "#a85400"

git_repo:
  branch_main:
    foreground: "#a8a8a8"
  branch_other:
    foreground: "#fc54fc"
  git_clean:
    foreground: "#54fc54"
  git_dirty:
    foreground: "#fc5454"

security_context:
  colon:
    foreground: "#7e7e7e"
  user:
    foreground: "#a8a8a8"
  role:
    foreground: "#fc54fc"
  typ:
    foreground: "#7e7e7e"
  range:
    foreground: "#fc54fc"

file_type:
  image:
    foreground: "#fcfc54"
  video:
    foreground: "#54fc54"
  music:
    foreground: "#54fc54"
  lossless:
    foreground: "#a8a8a8"
  crypto:
    foreground: "#7e7e7e"
  document:
    foreground: "#a8a8a8"
  compressed:
    foreground: "#fc54fc"
  temp:
    foreground: "#545454"
    is_dimmed: false
  compiled:
    foreground: "#5454fc"
  build:
    foreground: "#7e7e7e"
    is_underline: false
  source:
    foreground: "#5454fc"

punctuation:
    foreground: "#7e7e7e"
date:
    foreground: "#7e7e7e"
inode:
    foreground: "#7e7e7e"
blocks:
    foreground: "#7e7e7e"
header:
    foreground: "#a8a8a8"
octal:
    foreground: "#545454"
flags:
    foreground: "#fc54fc"

symlink_path:
    foreground: "#54fcfc"
control_char:
    foreground: "#a85400"
broken_symlink:
    foreground: "#fc5454"
broken_path_overlay:
    foreground: "#7e7e7e"
