# vim: ft=yaml

# Scheme Name: Pop
# Scheme Author: Chris Kempson (http://chriskempson.com)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d0d0d0"
  directory:
    foreground: "#0e5a94"
  symlink:
    foreground: "#00aabb"
  pipe:
    foreground: "#b0b0b0"
  block_device:
    foreground: "#f8ca12"
  char_device:
    foreground: "#f8ca12"
  socket:
    foreground: "#b0b0b0"
  special:
    foreground: "#b31e8d"
  executable:
    foreground: "#37b349"
  mount_point:
    foreground: "#f8ca12"

perms:
  user_read:
    foreground: "#f8ca12"
  user_write:
    foreground: "#eb008a"
  user_execute_file:
    foreground: "#37b349"
  user_execute_other:
    foreground: "#37b349"
  group_read:
    foreground: "#f8ca12"
  group_write:
    foreground: "#eb008a"
  group_execute:
    foreground: "#37b349"
  other_read:
    foreground: "#f8ca12"
  other_write:
    foreground: "#eb008a"
  other_execute:
    foreground: "#37b349"
  special_user_file:
    foreground: "#b31e8d"
  special_other:
    foreground: "#b0b0b0"
  attribute:
    foreground: "#b0b0b0"

size:
  major:
    foreground: "#37b349"
  minor:
    foreground: "#37b349"
  number_byte:
    foreground: "#b0b0b0"
  number_kilo:
    foreground: "#d0d0d0"
  number_mega:
    foreground: "#f8ca12"
  number_giga:
    foreground: "#f29333"
  number_huge:
    foreground: "#eb008a"
  unit_byte:
    foreground: "#b0b0b0"
  unit_kilo:
    foreground: "#d0d0d0"
  unit_mega:
    foreground: "#f8ca12"
  unit_giga:
    foreground: "#f29333"
  unit_huge:
    foreground: "#eb008a"

users:
  user_you:
    foreground: "#d0d0d0"
  user_root:
    foreground: "#eb008a"
  user_other:
    foreground: "#b31e8d"
  group_yours:
    foreground: "#d0d0d0"
  group_other:
    foreground: "#b0b0b0"
  group_root:
    foreground: "#eb008a"

links:
  normal:
    foreground: "#00aabb"
  multi_link_file:
    foreground: "#d0d0d0"
    background: "#00aabb"

git:
  new:
    foreground: "#37b349"
  modified:
    foreground: "#f8ca12"
  deleted:
    foreground: "#eb008a"
  renamed:
    foreground: "#505050"
  typechange:
    foreground: "#b31e8d"
  ignored:
    foreground: "#b0b0b0"
  conflicted:
    foreground: "#f29333"

git_repo:
  branch_main:
    foreground: "#d0d0d0"
  branch_other:
    foreground: "#b31e8d"
  git_clean:
    foreground: "#37b349"
  git_dirty:
    foreground: "#eb008a"

security_context:
  colon:
    foreground: "#b0b0b0"
  user:
    foreground: "#d0d0d0"
  role:
    foreground: "#b31e8d"
  typ:
    foreground: "#b0b0b0"
  range:
    foreground: "#b31e8d"

file_type:
  image:
    foreground: "#f8ca12"
  video:
    foreground: "#37b349"
  music:
    foreground: "#37b349"
  lossless:
    foreground: "#d0d0d0"
  crypto:
    foreground: "#b0b0b0"
  document:
    foreground: "#d0d0d0"
  compressed:
    foreground: "#b31e8d"
  temp:
    foreground: "#505050"
    is_dimmed: false
  compiled:
    foreground: "#0e5a94"
  build:
    foreground: "#b0b0b0"
    is_underline: false
  source:
    foreground: "#0e5a94"

punctuation:
    foreground: "#b0b0b0"
date:
    foreground: "#b0b0b0"
inode:
    foreground: "#b0b0b0"
blocks:
    foreground: "#b0b0b0"
header:
    foreground: "#d0d0d0"
octal:
    foreground: "#505050"
flags:
    foreground: "#b31e8d"

symlink_path:
    foreground: "#00aabb"
control_char:
    foreground: "#f29333"
broken_symlink:
    foreground: "#eb008a"
broken_path_overlay:
    foreground: "#b0b0b0"
