# vim: ft=yaml

# Scheme Name: Windows 10 Light
# Scheme Author: Fergus Collins (https://github.com/ferguscollins)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#767676"
  directory:
    foreground: "#0037da"
  symlink:
    foreground: "#3a96dd"
  pipe:
    foreground: "#ababab"
  block_device:
    foreground: "#c19c00"
  char_device:
    foreground: "#c19c00"
  socket:
    foreground: "#ababab"
  special:
    foreground: "#881798"
  executable:
    foreground: "#13a10e"
  mount_point:
    foreground: "#c19c00"

perms:
  user_read:
    foreground: "#c19c00"
  user_write:
    foreground: "#c50f1f"
  user_execute_file:
    foreground: "#13a10e"
  user_execute_other:
    foreground: "#13a10e"
  group_read:
    foreground: "#c19c00"
  group_write:
    foreground: "#c50f1f"
  group_execute:
    foreground: "#13a10e"
  other_read:
    foreground: "#c19c00"
  other_write:
    foreground: "#c50f1f"
  other_execute:
    foreground: "#13a10e"
  special_user_file:
    foreground: "#881798"
  special_other:
    foreground: "#ababab"
  attribute:
    foreground: "#ababab"

size:
  major:
    foreground: "#13a10e"
  minor:
    foreground: "#13a10e"
  number_byte:
    foreground: "#ababab"
  number_kilo:
    foreground: "#767676"
  number_mega:
    foreground: "#c19c00"
  number_giga:
    foreground: "#f9f1a5"
  number_huge:
    foreground: "#c50f1f"
  unit_byte:
    foreground: "#ababab"
  unit_kilo:
    foreground: "#767676"
  unit_mega:
    foreground: "#c19c00"
  unit_giga:
    foreground: "#f9f1a5"
  unit_huge:
    foreground: "#c50f1f"

users:
  user_you:
    foreground: "#767676"
  user_root:
    foreground: "#c50f1f"
  user_other:
    foreground: "#881798"
  group_yours:
    foreground: "#767676"
  group_other:
    foreground: "#ababab"
  group_root:
    foreground: "#c50f1f"

links:
  normal:
    foreground: "#3a96dd"
  multi_link_file:
    foreground: "#767676"
    background: "#3a96dd"

git:
  new:
    foreground: "#13a10e"
  modified:
    foreground: "#c19c00"
  deleted:
    foreground: "#c50f1f"
  renamed:
    foreground: "#cccccc"
  typechange:
    foreground: "#881798"
  ignored:
    foreground: "#ababab"
  conflicted:
    foreground: "#f9f1a5"

git_repo:
  branch_main:
    foreground: "#767676"
  branch_other:
    foreground: "#881798"
  git_clean:
    foreground: "#13a10e"
  git_dirty:
    foreground: "#c50f1f"

security_context:
  colon:
    foreground: "#ababab"
  user:
    foreground: "#767676"
  role:
    foreground: "#881798"
  typ:
    foreground: "#ababab"
  range:
    foreground: "#881798"

file_type:
  image:
    foreground: "#c19c00"
  video:
    foreground: "#13a10e"
  music:
    foreground: "#13a10e"
  lossless:
    foreground: "#767676"
  crypto:
    foreground: "#ababab"
  document:
    foreground: "#767676"
  compressed:
    foreground: "#881798"
  temp:
    foreground: "#cccccc"
    is_dimmed: false
  compiled:
    foreground: "#0037da"
  build:
    foreground: "#ababab"
    is_underline: false
  source:
    foreground: "#0037da"

punctuation:
    foreground: "#ababab"
date:
    foreground: "#ababab"
inode:
    foreground: "#ababab"
blocks:
    foreground: "#ababab"
header:
    foreground: "#767676"
octal:
    foreground: "#cccccc"
flags:
    foreground: "#881798"

symlink_path:
    foreground: "#3a96dd"
control_char:
    foreground: "#f9f1a5"
broken_symlink:
    foreground: "#c50f1f"
broken_path_overlay:
    foreground: "#ababab"
