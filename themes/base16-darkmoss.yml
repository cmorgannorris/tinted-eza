# vim: ft=yaml

# Scheme Name: darkmoss
# Scheme Author: Gabriel Avanzi (https://github.com/avanzzzi)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#c7c7a5"
  directory:
    foreground: "#498091"
  symlink:
    foreground: "#66d9ef"
  pipe:
    foreground: "#818f80"
  block_device:
    foreground: "#fdb11f"
  char_device:
    foreground: "#fdb11f"
  socket:
    foreground: "#818f80"
  special:
    foreground: "#9bc0c8"
  executable:
    foreground: "#499180"
  mount_point:
    foreground: "#fdb11f"

perms:
  user_read:
    foreground: "#fdb11f"
  user_write:
    foreground: "#ff4658"
  user_execute_file:
    foreground: "#499180"
  user_execute_other:
    foreground: "#499180"
  group_read:
    foreground: "#fdb11f"
  group_write:
    foreground: "#ff4658"
  group_execute:
    foreground: "#499180"
  other_read:
    foreground: "#fdb11f"
  other_write:
    foreground: "#ff4658"
  other_execute:
    foreground: "#499180"
  special_user_file:
    foreground: "#9bc0c8"
  special_other:
    foreground: "#818f80"
  attribute:
    foreground: "#818f80"

size:
  major:
    foreground: "#499180"
  minor:
    foreground: "#499180"
  number_byte:
    foreground: "#818f80"
  number_kilo:
    foreground: "#c7c7a5"
  number_mega:
    foreground: "#fdb11f"
  number_giga:
    foreground: "#e6db74"
  number_huge:
    foreground: "#ff4658"
  unit_byte:
    foreground: "#818f80"
  unit_kilo:
    foreground: "#c7c7a5"
  unit_mega:
    foreground: "#fdb11f"
  unit_giga:
    foreground: "#e6db74"
  unit_huge:
    foreground: "#ff4658"

users:
  user_you:
    foreground: "#c7c7a5"
  user_root:
    foreground: "#ff4658"
  user_other:
    foreground: "#9bc0c8"
  group_yours:
    foreground: "#c7c7a5"
  group_other:
    foreground: "#818f80"
  group_root:
    foreground: "#ff4658"

links:
  normal:
    foreground: "#66d9ef"
  multi_link_file:
    foreground: "#c7c7a5"
    background: "#66d9ef"

git:
  new:
    foreground: "#499180"
  modified:
    foreground: "#fdb11f"
  deleted:
    foreground: "#ff4658"
  renamed:
    foreground: "#555e5f"
  typechange:
    foreground: "#9bc0c8"
  ignored:
    foreground: "#818f80"
  conflicted:
    foreground: "#e6db74"

git_repo:
  branch_main:
    foreground: "#c7c7a5"
  branch_other:
    foreground: "#9bc0c8"
  git_clean:
    foreground: "#499180"
  git_dirty:
    foreground: "#ff4658"

security_context:
  colon:
    foreground: "#818f80"
  user:
    foreground: "#c7c7a5"
  role:
    foreground: "#9bc0c8"
  typ:
    foreground: "#818f80"
  range:
    foreground: "#9bc0c8"

file_type:
  image:
    foreground: "#fdb11f"
  video:
    foreground: "#499180"
  music:
    foreground: "#499180"
  lossless:
    foreground: "#c7c7a5"
  crypto:
    foreground: "#818f80"
  document:
    foreground: "#c7c7a5"
  compressed:
    foreground: "#9bc0c8"
  temp:
    foreground: "#555e5f"
    is_dimmed: false
  compiled:
    foreground: "#498091"
  build:
    foreground: "#818f80"
    is_underline: false
  source:
    foreground: "#498091"

punctuation:
    foreground: "#818f80"
date:
    foreground: "#818f80"
inode:
    foreground: "#818f80"
blocks:
    foreground: "#818f80"
header:
    foreground: "#c7c7a5"
octal:
    foreground: "#555e5f"
flags:
    foreground: "#9bc0c8"

symlink_path:
    foreground: "#66d9ef"
control_char:
    foreground: "#e6db74"
broken_symlink:
    foreground: "#ff4658"
broken_path_overlay:
    foreground: "#818f80"
