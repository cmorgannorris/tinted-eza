# vim: ft=yaml

# Scheme Name: Bluloco Dark
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#b1bac9"
  directory:
    foreground: "#285afe"
  symlink:
    foreground: "#366f99"
  pipe:
    foreground: "#969faf"
  block_device:
    foreground: "#189ffd"
  char_device:
    foreground: "#189ffd"
  socket:
    foreground: "#969faf"
  special:
    foreground: "#8c62fd"
  executable:
    foreground: "#23974a"
  mount_point:
    foreground: "#189ffd"

perms:
  user_read:
    foreground: "#189ffd"
  user_write:
    foreground: "#f71041"
  user_execute_file:
    foreground: "#23974a"
  user_execute_other:
    foreground: "#23974a"
  group_read:
    foreground: "#189ffd"
  group_write:
    foreground: "#f71041"
  group_execute:
    foreground: "#23974a"
  other_read:
    foreground: "#189ffd"
  other_write:
    foreground: "#f71041"
  other_execute:
    foreground: "#23974a"
  special_user_file:
    foreground: "#8c62fd"
  special_other:
    foreground: "#969faf"
  attribute:
    foreground: "#969faf"

size:
  major:
    foreground: "#23974a"
  minor:
    foreground: "#23974a"
  number_byte:
    foreground: "#969faf"
  number_kilo:
    foreground: "#b1bac9"
  number_mega:
    foreground: "#189ffd"
  number_giga:
    foreground: "#fc7e57"
  number_huge:
    foreground: "#f71041"
  unit_byte:
    foreground: "#969faf"
  unit_kilo:
    foreground: "#b1bac9"
  unit_mega:
    foreground: "#189ffd"
  unit_giga:
    foreground: "#fc7e57"
  unit_huge:
    foreground: "#f71041"

users:
  user_you:
    foreground: "#b1bac9"
  user_root:
    foreground: "#f71041"
  user_other:
    foreground: "#8c62fd"
  group_yours:
    foreground: "#b1bac9"
  group_other:
    foreground: "#969faf"
  group_root:
    foreground: "#f71041"

links:
  normal:
    foreground: "#366f99"
  multi_link_file:
    foreground: "#b1bac9"
    background: "#366f99"

git:
  new:
    foreground: "#23974a"
  modified:
    foreground: "#189ffd"
  deleted:
    foreground: "#f71041"
  renamed:
    foreground: "#7b8494"
  typechange:
    foreground: "#8c62fd"
  ignored:
    foreground: "#969faf"
  conflicted:
    foreground: "#fc7e57"

git_repo:
  branch_main:
    foreground: "#b1bac9"
  branch_other:
    foreground: "#8c62fd"
  git_clean:
    foreground: "#23974a"
  git_dirty:
    foreground: "#f71041"

security_context:
  colon:
    foreground: "#969faf"
  user:
    foreground: "#b1bac9"
  role:
    foreground: "#8c62fd"
  typ:
    foreground: "#969faf"
  range:
    foreground: "#8c62fd"

file_type:
  image:
    foreground: "#189ffd"
  video:
    foreground: "#23974a"
  music:
    foreground: "#23974a"
  lossless:
    foreground: "#b1bac9"
  crypto:
    foreground: "#969faf"
  document:
    foreground: "#b1bac9"
  compressed:
    foreground: "#8c62fd"
  temp:
    foreground: "#7b8494"
    is_dimmed: false
  compiled:
    foreground: "#285afe"
  build:
    foreground: "#969faf"
    is_underline: false
  source:
    foreground: "#285afe"

punctuation:
    foreground: "#969faf"
date:
    foreground: "#969faf"
inode:
    foreground: "#969faf"
blocks:
    foreground: "#969faf"
header:
    foreground: "#b1bac9"
octal:
    foreground: "#7b8494"
flags:
    foreground: "#8c62fd"

symlink_path:
    foreground: "#366f99"
control_char:
    foreground: "#fc7e57"
broken_symlink:
    foreground: "#f71041"
broken_path_overlay:
    foreground: "#969faf"
