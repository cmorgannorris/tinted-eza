# vim: ft=yaml

# Scheme Name: Atelier Estuary Light
# Scheme Author: Bram de Haan (http://atelierbramdehaan.nl)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#5f5e4e"
  directory:
    foreground: "#36a166"
  symlink:
    foreground: "#5b9d48"
  pipe:
    foreground: "#6c6b5a"
  block_device:
    foreground: "#a5980d"
  char_device:
    foreground: "#a5980d"
  socket:
    foreground: "#6c6b5a"
  special:
    foreground: "#5f9182"
  executable:
    foreground: "#7d9726"
  mount_point:
    foreground: "#a5980d"

perms:
  user_read:
    foreground: "#a5980d"
  user_write:
    foreground: "#ba6236"
  user_execute_file:
    foreground: "#7d9726"
  user_execute_other:
    foreground: "#7d9726"
  group_read:
    foreground: "#a5980d"
  group_write:
    foreground: "#ba6236"
  group_execute:
    foreground: "#7d9726"
  other_read:
    foreground: "#a5980d"
  other_write:
    foreground: "#ba6236"
  other_execute:
    foreground: "#7d9726"
  special_user_file:
    foreground: "#5f9182"
  special_other:
    foreground: "#6c6b5a"
  attribute:
    foreground: "#6c6b5a"

size:
  major:
    foreground: "#7d9726"
  minor:
    foreground: "#7d9726"
  number_byte:
    foreground: "#6c6b5a"
  number_kilo:
    foreground: "#5f5e4e"
  number_mega:
    foreground: "#a5980d"
  number_giga:
    foreground: "#ae7313"
  number_huge:
    foreground: "#ba6236"
  unit_byte:
    foreground: "#6c6b5a"
  unit_kilo:
    foreground: "#5f5e4e"
  unit_mega:
    foreground: "#a5980d"
  unit_giga:
    foreground: "#ae7313"
  unit_huge:
    foreground: "#ba6236"

users:
  user_you:
    foreground: "#5f5e4e"
  user_root:
    foreground: "#ba6236"
  user_other:
    foreground: "#5f9182"
  group_yours:
    foreground: "#5f5e4e"
  group_other:
    foreground: "#6c6b5a"
  group_root:
    foreground: "#ba6236"

links:
  normal:
    foreground: "#5b9d48"
  multi_link_file:
    foreground: "#5f5e4e"
    background: "#5b9d48"

git:
  new:
    foreground: "#7d9726"
  modified:
    foreground: "#a5980d"
  deleted:
    foreground: "#ba6236"
  renamed:
    foreground: "#878573"
  typechange:
    foreground: "#5f9182"
  ignored:
    foreground: "#6c6b5a"
  conflicted:
    foreground: "#ae7313"

git_repo:
  branch_main:
    foreground: "#5f5e4e"
  branch_other:
    foreground: "#5f9182"
  git_clean:
    foreground: "#7d9726"
  git_dirty:
    foreground: "#ba6236"

security_context:
  colon:
    foreground: "#6c6b5a"
  user:
    foreground: "#5f5e4e"
  role:
    foreground: "#5f9182"
  typ:
    foreground: "#6c6b5a"
  range:
    foreground: "#5f9182"

file_type:
  image:
    foreground: "#a5980d"
  video:
    foreground: "#7d9726"
  music:
    foreground: "#7d9726"
  lossless:
    foreground: "#5f5e4e"
  crypto:
    foreground: "#6c6b5a"
  document:
    foreground: "#5f5e4e"
  compressed:
    foreground: "#5f9182"
  temp:
    foreground: "#878573"
  compiled:
    foreground: "#36a166"
  build:
    foreground: "#6c6b5a"
    is_underline: false
  source:
    foreground: "#36a166"

punctuation:
    foreground: "#6c6b5a"
date:
    foreground: "#6c6b5a"
inode:
    foreground: "#6c6b5a"
blocks:
    foreground: "#6c6b5a"
header:
    foreground: "#5f5e4e"
octal:
    foreground: "#878573"
flags:
    foreground: "#5f9182"

symlink_path:
    foreground: "#5b9d48"
control_char:
    foreground: "#ae7313"
broken_symlink:
    foreground: "#ba6236"
broken_path_overlay:
    foreground: "#6c6b5a"
