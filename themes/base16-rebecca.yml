# vim: ft=yaml

# Scheme Name: Rebecca
# Scheme Author: Victor Borja (http://github.com/vic) based on Rebecca Theme (http://github.com/vic/rebecca-theme)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#f1eff8"
  directory:
    foreground: "#2de0a7"
  symlink:
    foreground: "#8eaee0"
  pipe:
    foreground: "#a0a0c5"
  block_device:
    foreground: "#ae81ff"
  char_device:
    foreground: "#ae81ff"
  socket:
    foreground: "#a0a0c5"
  special:
    foreground: "#7aa5ff"
  executable:
    foreground: "#6dfedf"
  mount_point:
    foreground: "#ae81ff"

perms:
  user_read:
    foreground: "#ae81ff"
  user_write:
    foreground: "#a0a0c5"
  user_execute_file:
    foreground: "#6dfedf"
  user_execute_other:
    foreground: "#6dfedf"
  group_read:
    foreground: "#ae81ff"
  group_write:
    foreground: "#a0a0c5"
  group_execute:
    foreground: "#6dfedf"
  other_read:
    foreground: "#ae81ff"
  other_write:
    foreground: "#a0a0c5"
  other_execute:
    foreground: "#6dfedf"
  special_user_file:
    foreground: "#7aa5ff"
  special_other:
    foreground: "#a0a0c5"
  attribute:
    foreground: "#a0a0c5"

size:
  major:
    foreground: "#6dfedf"
  minor:
    foreground: "#6dfedf"
  number_byte:
    foreground: "#a0a0c5"
  number_kilo:
    foreground: "#f1eff8"
  number_mega:
    foreground: "#ae81ff"
  number_giga:
    foreground: "#efe4a1"
  number_huge:
    foreground: "#a0a0c5"
  unit_byte:
    foreground: "#a0a0c5"
  unit_kilo:
    foreground: "#f1eff8"
  unit_mega:
    foreground: "#ae81ff"
  unit_giga:
    foreground: "#efe4a1"
  unit_huge:
    foreground: "#a0a0c5"

users:
  user_you:
    foreground: "#f1eff8"
  user_root:
    foreground: "#a0a0c5"
  user_other:
    foreground: "#7aa5ff"
  group_yours:
    foreground: "#f1eff8"
  group_other:
    foreground: "#a0a0c5"
  group_root:
    foreground: "#a0a0c5"

links:
  normal:
    foreground: "#8eaee0"
  multi_link_file:
    foreground: "#f1eff8"
    background: "#8eaee0"

git:
  new:
    foreground: "#6dfedf"
  modified:
    foreground: "#ae81ff"
  deleted:
    foreground: "#a0a0c5"
  renamed:
    foreground: "#666699"
  typechange:
    foreground: "#7aa5ff"
  ignored:
    foreground: "#a0a0c5"
  conflicted:
    foreground: "#efe4a1"

git_repo:
  branch_main:
    foreground: "#f1eff8"
  branch_other:
    foreground: "#7aa5ff"
  git_clean:
    foreground: "#6dfedf"
  git_dirty:
    foreground: "#a0a0c5"

security_context:
  colon:
    foreground: "#a0a0c5"
  user:
    foreground: "#f1eff8"
  role:
    foreground: "#7aa5ff"
  typ:
    foreground: "#a0a0c5"
  range:
    foreground: "#7aa5ff"

file_type:
  image:
    foreground: "#ae81ff"
  video:
    foreground: "#6dfedf"
  music:
    foreground: "#6dfedf"
  lossless:
    foreground: "#f1eff8"
  crypto:
    foreground: "#a0a0c5"
  document:
    foreground: "#f1eff8"
  compressed:
    foreground: "#7aa5ff"
  temp:
    foreground: "#666699"
  compiled:
    foreground: "#2de0a7"
  build:
    foreground: "#a0a0c5"
    is_underline: false
  source:
    foreground: "#2de0a7"

punctuation:
    foreground: "#a0a0c5"
date:
    foreground: "#a0a0c5"
inode:
    foreground: "#a0a0c5"
blocks:
    foreground: "#a0a0c5"
header:
    foreground: "#f1eff8"
octal:
    foreground: "#666699"
flags:
    foreground: "#7aa5ff"

symlink_path:
    foreground: "#8eaee0"
control_char:
    foreground: "#efe4a1"
broken_symlink:
    foreground: "#a0a0c5"
broken_path_overlay:
    foreground: "#a0a0c5"
