# vim: ft=yaml

# Scheme Name: Tokyo Night Moon
# Scheme Author: Ólafur Bjarki Bogason
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#3b4261"
  directory:
    foreground: "#82aaff"
  symlink:
    foreground: "#86e1fc"
  pipe:
    foreground: "#828bb8"
  block_device:
    foreground: "#ffc777"
  char_device:
    foreground: "#ffc777"
  socket:
    foreground: "#828bb8"
  special:
    foreground: "#fca7ea"
  executable:
    foreground: "#c3e88d"
  mount_point:
    foreground: "#ffc777"

perms:
  user_read:
    foreground: "#ffc777"
  user_write:
    foreground: "#ff757f"
  user_execute_file:
    foreground: "#c3e88d"
  user_execute_other:
    foreground: "#c3e88d"
  group_read:
    foreground: "#ffc777"
  group_write:
    foreground: "#ff757f"
  group_execute:
    foreground: "#c3e88d"
  other_read:
    foreground: "#ffc777"
  other_write:
    foreground: "#ff757f"
  other_execute:
    foreground: "#c3e88d"
  special_user_file:
    foreground: "#fca7ea"
  special_other:
    foreground: "#828bb8"
  attribute:
    foreground: "#828bb8"

size:
  major:
    foreground: "#c3e88d"
  minor:
    foreground: "#c3e88d"
  number_byte:
    foreground: "#828bb8"
  number_kilo:
    foreground: "#3b4261"
  number_mega:
    foreground: "#ffc777"
  number_giga:
    foreground: "#ffc777"
  number_huge:
    foreground: "#ff757f"
  unit_byte:
    foreground: "#828bb8"
  unit_kilo:
    foreground: "#3b4261"
  unit_mega:
    foreground: "#ffc777"
  unit_giga:
    foreground: "#ffc777"
  unit_huge:
    foreground: "#ff757f"

users:
  user_you:
    foreground: "#3b4261"
  user_root:
    foreground: "#ff757f"
  user_other:
    foreground: "#fca7ea"
  group_yours:
    foreground: "#3b4261"
  group_other:
    foreground: "#828bb8"
  group_root:
    foreground: "#ff757f"

links:
  normal:
    foreground: "#86e1fc"
  multi_link_file:
    foreground: "#3b4261"
    background: "#86e1fc"

git:
  new:
    foreground: "#c3e88d"
  modified:
    foreground: "#ffc777"
  deleted:
    foreground: "#ff757f"
  renamed:
    foreground: "#636da6"
  typechange:
    foreground: "#fca7ea"
  ignored:
    foreground: "#828bb8"
  conflicted:
    foreground: "#ffc777"

git_repo:
  branch_main:
    foreground: "#3b4261"
  branch_other:
    foreground: "#fca7ea"
  git_clean:
    foreground: "#c3e88d"
  git_dirty:
    foreground: "#ff757f"

security_context:
  colon:
    foreground: "#828bb8"
  user:
    foreground: "#3b4261"
  role:
    foreground: "#fca7ea"
  typ:
    foreground: "#828bb8"
  range:
    foreground: "#fca7ea"

file_type:
  image:
    foreground: "#ffc777"
  video:
    foreground: "#c3e88d"
  music:
    foreground: "#c3e88d"
  lossless:
    foreground: "#3b4261"
  crypto:
    foreground: "#828bb8"
  document:
    foreground: "#3b4261"
  compressed:
    foreground: "#fca7ea"
  temp:
    foreground: "#636da6"
  compiled:
    foreground: "#82aaff"
  build:
    foreground: "#828bb8"
    is_underline: false
  source:
    foreground: "#82aaff"

punctuation:
    foreground: "#828bb8"
date:
    foreground: "#828bb8"
inode:
    foreground: "#828bb8"
blocks:
    foreground: "#828bb8"
header:
    foreground: "#3b4261"
octal:
    foreground: "#636da6"
flags:
    foreground: "#fca7ea"

symlink_path:
    foreground: "#86e1fc"
control_char:
    foreground: "#ffc777"
broken_symlink:
    foreground: "#ff757f"
broken_path_overlay:
    foreground: "#828bb8"
