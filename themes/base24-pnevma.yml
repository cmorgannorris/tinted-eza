# vim: ft=yaml

# Scheme Name: Pnevma
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#aeaead"
  directory:
    foreground: "#7fa5bd"
  symlink:
    foreground: "#8adbb4"
  pipe:
    foreground: "#8d8c8a"
  block_device:
    foreground: "#a1bdce"
  char_device:
    foreground: "#a1bdce"
  socket:
    foreground: "#8d8c8a"
  special:
    foreground: "#c79ec4"
  executable:
    foreground: "#90a57d"
  mount_point:
    foreground: "#a1bdce"

perms:
  user_read:
    foreground: "#a1bdce"
  user_write:
    foreground: "#a36666"
  user_execute_file:
    foreground: "#90a57d"
  user_execute_other:
    foreground: "#90a57d"
  group_read:
    foreground: "#a1bdce"
  group_write:
    foreground: "#a36666"
  group_execute:
    foreground: "#90a57d"
  other_read:
    foreground: "#a1bdce"
  other_write:
    foreground: "#a36666"
  other_execute:
    foreground: "#90a57d"
  special_user_file:
    foreground: "#c79ec4"
  special_other:
    foreground: "#8d8c8a"
  attribute:
    foreground: "#8d8c8a"

size:
  major:
    foreground: "#90a57d"
  minor:
    foreground: "#90a57d"
  number_byte:
    foreground: "#8d8c8a"
  number_kilo:
    foreground: "#aeaead"
  number_mega:
    foreground: "#a1bdce"
  number_giga:
    foreground: "#d7af87"
  number_huge:
    foreground: "#a36666"
  unit_byte:
    foreground: "#8d8c8a"
  unit_kilo:
    foreground: "#aeaead"
  unit_mega:
    foreground: "#a1bdce"
  unit_giga:
    foreground: "#d7af87"
  unit_huge:
    foreground: "#a36666"

users:
  user_you:
    foreground: "#aeaead"
  user_root:
    foreground: "#a36666"
  user_other:
    foreground: "#c79ec4"
  group_yours:
    foreground: "#aeaead"
  group_other:
    foreground: "#8d8c8a"
  group_root:
    foreground: "#a36666"

links:
  normal:
    foreground: "#8adbb4"
  multi_link_file:
    foreground: "#aeaead"
    background: "#8adbb4"

git:
  new:
    foreground: "#90a57d"
  modified:
    foreground: "#a1bdce"
  deleted:
    foreground: "#a36666"
  renamed:
    foreground: "#6b6a67"
  typechange:
    foreground: "#c79ec4"
  ignored:
    foreground: "#8d8c8a"
  conflicted:
    foreground: "#d7af87"

git_repo:
  branch_main:
    foreground: "#aeaead"
  branch_other:
    foreground: "#c79ec4"
  git_clean:
    foreground: "#90a57d"
  git_dirty:
    foreground: "#a36666"

security_context:
  colon:
    foreground: "#8d8c8a"
  user:
    foreground: "#aeaead"
  role:
    foreground: "#c79ec4"
  typ:
    foreground: "#8d8c8a"
  range:
    foreground: "#c79ec4"

file_type:
  image:
    foreground: "#a1bdce"
  video:
    foreground: "#90a57d"
  music:
    foreground: "#90a57d"
  lossless:
    foreground: "#aeaead"
  crypto:
    foreground: "#8d8c8a"
  document:
    foreground: "#aeaead"
  compressed:
    foreground: "#c79ec4"
  temp:
    foreground: "#6b6a67"
  compiled:
    foreground: "#7fa5bd"
  build:
    foreground: "#8d8c8a"
    is_underline: false
  source:
    foreground: "#7fa5bd"

punctuation:
    foreground: "#8d8c8a"
date:
    foreground: "#8d8c8a"
inode:
    foreground: "#8d8c8a"
blocks:
    foreground: "#8d8c8a"
header:
    foreground: "#aeaead"
octal:
    foreground: "#6b6a67"
flags:
    foreground: "#c79ec4"

symlink_path:
    foreground: "#8adbb4"
control_char:
    foreground: "#d7af87"
broken_symlink:
    foreground: "#a36666"
broken_path_overlay:
    foreground: "#8d8c8a"
