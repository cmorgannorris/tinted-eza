# vim: ft=yaml

# Scheme Name: Tokyo Night Light
# Scheme Author: Michaël Ball
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#343b59"
  directory:
    foreground: "#34548a"
  symlink:
    foreground: "#3e6968"
  pipe:
    foreground: "#4c505e"
  block_device:
    foreground: "#166775"
  char_device:
    foreground: "#166775"
  socket:
    foreground: "#4c505e"
  special:
    foreground: "#5a4a78"
  executable:
    foreground: "#485e30"
  mount_point:
    foreground: "#166775"

perms:
  user_read:
    foreground: "#166775"
  user_write:
    foreground: "#343b58"
  user_execute_file:
    foreground: "#485e30"
  user_execute_other:
    foreground: "#485e30"
  group_read:
    foreground: "#166775"
  group_write:
    foreground: "#343b58"
  group_execute:
    foreground: "#485e30"
  other_read:
    foreground: "#166775"
  other_write:
    foreground: "#343b58"
  other_execute:
    foreground: "#485e30"
  special_user_file:
    foreground: "#5a4a78"
  special_other:
    foreground: "#4c505e"
  attribute:
    foreground: "#4c505e"

size:
  major:
    foreground: "#485e30"
  minor:
    foreground: "#485e30"
  number_byte:
    foreground: "#4c505e"
  number_kilo:
    foreground: "#343b59"
  number_mega:
    foreground: "#166775"
  number_giga:
    foreground: "#965027"
  number_huge:
    foreground: "#343b58"
  unit_byte:
    foreground: "#4c505e"
  unit_kilo:
    foreground: "#343b59"
  unit_mega:
    foreground: "#166775"
  unit_giga:
    foreground: "#965027"
  unit_huge:
    foreground: "#343b58"

users:
  user_you:
    foreground: "#343b59"
  user_root:
    foreground: "#343b58"
  user_other:
    foreground: "#5a4a78"
  group_yours:
    foreground: "#343b59"
  group_other:
    foreground: "#4c505e"
  group_root:
    foreground: "#343b58"

links:
  normal:
    foreground: "#3e6968"
  multi_link_file:
    foreground: "#343b59"
    background: "#3e6968"

git:
  new:
    foreground: "#485e30"
  modified:
    foreground: "#166775"
  deleted:
    foreground: "#343b58"
  renamed:
    foreground: "#9699a3"
  typechange:
    foreground: "#5a4a78"
  ignored:
    foreground: "#4c505e"
  conflicted:
    foreground: "#965027"

git_repo:
  branch_main:
    foreground: "#343b59"
  branch_other:
    foreground: "#5a4a78"
  git_clean:
    foreground: "#485e30"
  git_dirty:
    foreground: "#343b58"

security_context:
  colon:
    foreground: "#4c505e"
  user:
    foreground: "#343b59"
  role:
    foreground: "#5a4a78"
  typ:
    foreground: "#4c505e"
  range:
    foreground: "#5a4a78"

file_type:
  image:
    foreground: "#166775"
  video:
    foreground: "#485e30"
  music:
    foreground: "#485e30"
  lossless:
    foreground: "#343b59"
  crypto:
    foreground: "#4c505e"
  document:
    foreground: "#343b59"
  compressed:
    foreground: "#5a4a78"
  temp:
    foreground: "#9699a3"
    is_dimmed: false
  compiled:
    foreground: "#34548a"
  build:
    foreground: "#4c505e"
    is_underline: false
  source:
    foreground: "#34548a"

punctuation:
    foreground: "#4c505e"
date:
    foreground: "#4c505e"
inode:
    foreground: "#4c505e"
blocks:
    foreground: "#4c505e"
header:
    foreground: "#343b59"
octal:
    foreground: "#9699a3"
flags:
    foreground: "#5a4a78"

symlink_path:
    foreground: "#3e6968"
control_char:
    foreground: "#965027"
broken_symlink:
    foreground: "#343b58"
broken_path_overlay:
    foreground: "#4c505e"
