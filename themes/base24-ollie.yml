# vim: ft=yaml

# Scheme Name: Ollie
# Scheme Author: FredHappyface (https://github.com/fredHappyface)
# Scheme System: base24

colourful: true

filekinds:
  normal:
    foreground: "#7e7789"
  directory:
    foreground: "#2c56ab"
  symlink:
    foreground: "#1fa5ab"
  pipe:
    foreground: "#726168"
  block_device:
    foreground: "#4487ff"
  char_device:
    foreground: "#4487ff"
  socket:
    foreground: "#726168"
  special:
    foreground: "#af8427"
  executable:
    foreground: "#31ab60"
  mount_point:
    foreground: "#4487ff"

perms:
  user_read:
    foreground: "#4487ff"
  user_write:
    foreground: "#ab2e30"
  user_execute_file:
    foreground: "#31ab60"
  user_execute_other:
    foreground: "#31ab60"
  group_read:
    foreground: "#4487ff"
  group_write:
    foreground: "#ab2e30"
  group_execute:
    foreground: "#31ab60"
  other_read:
    foreground: "#4487ff"
  other_write:
    foreground: "#ab2e30"
  other_execute:
    foreground: "#31ab60"
  special_user_file:
    foreground: "#af8427"
  special_other:
    foreground: "#726168"
  attribute:
    foreground: "#726168"

size:
  major:
    foreground: "#31ab60"
  minor:
    foreground: "#31ab60"
  number_byte:
    foreground: "#726168"
  number_kilo:
    foreground: "#7e7789"
  number_mega:
    foreground: "#4487ff"
  number_giga:
    foreground: "#ab4200"
  number_huge:
    foreground: "#ab2e30"
  unit_byte:
    foreground: "#726168"
  unit_kilo:
    foreground: "#7e7789"
  unit_mega:
    foreground: "#4487ff"
  unit_giga:
    foreground: "#ab4200"
  unit_huge:
    foreground: "#ab2e30"

users:
  user_you:
    foreground: "#7e7789"
  user_root:
    foreground: "#ab2e30"
  user_other:
    foreground: "#af8427"
  group_yours:
    foreground: "#7e7789"
  group_other:
    foreground: "#726168"
  group_root:
    foreground: "#ab2e30"

links:
  normal:
    foreground: "#1fa5ab"
  multi_link_file:
    foreground: "#7e7789"
    background: "#1fa5ab"

git:
  new:
    foreground: "#31ab60"
  modified:
    foreground: "#4487ff"
  deleted:
    foreground: "#ab2e30"
  renamed:
    foreground: "#664b46"
  typechange:
    foreground: "#af8427"
  ignored:
    foreground: "#726168"
  conflicted:
    foreground: "#ab4200"

git_repo:
  branch_main:
    foreground: "#7e7789"
  branch_other:
    foreground: "#af8427"
  git_clean:
    foreground: "#31ab60"
  git_dirty:
    foreground: "#ab2e30"

security_context:
  colon:
    foreground: "#726168"
  user:
    foreground: "#7e7789"
  role:
    foreground: "#af8427"
  typ:
    foreground: "#726168"
  range:
    foreground: "#af8427"

file_type:
  image:
    foreground: "#4487ff"
  video:
    foreground: "#31ab60"
  music:
    foreground: "#31ab60"
  lossless:
    foreground: "#31ab60"
  crypto:
    foreground: "#726168"
  document:
    foreground: "#7e7789"
  compressed:
    foreground: "#726168"
  temp:
    foreground: "#5a3625"
  compiled:
    foreground: "#2c56ab"
  build:
    foreground: "#726168"
    is_underline: false
  source:
    foreground: "#2c56ab"

punctuation:
    foreground: "#726168"
date:
    foreground: "#726168"
inode:
    foreground: "#726168"
blocks:
    foreground: "#726168"
header:
    foreground: "#7e7789"
octal:
    foreground: "#664b46"
flags:
    foreground: "#af8427"

symlink_path:
    foreground: "#1fa5ab"
control_char:
    foreground: "#ab4200"
broken_symlink:
    foreground: "#ab2e30"
broken_path_overlay:
    foreground: "#726168"
