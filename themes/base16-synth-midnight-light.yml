# vim: ft=yaml

# Scheme Name: Synth Midnight Terminal Light
# Scheme Author: Michaël Ball (http://github.com/michael-ball/)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#28292a"
  directory:
    foreground: "#03aeff"
  symlink:
    foreground: "#42fff9"
  pipe:
    foreground: "#474849"
  block_device:
    foreground: "#c9d364"
  char_device:
    foreground: "#c9d364"
  socket:
    foreground: "#474849"
  special:
    foreground: "#ea5ce2"
  executable:
    foreground: "#06ea61"
  mount_point:
    foreground: "#c9d364"

perms:
  user_read:
    foreground: "#c9d364"
  user_write:
    foreground: "#b53b50"
  user_execute_file:
    foreground: "#06ea61"
  user_execute_other:
    foreground: "#06ea61"
  group_read:
    foreground: "#c9d364"
  group_write:
    foreground: "#b53b50"
  group_execute:
    foreground: "#06ea61"
  other_read:
    foreground: "#c9d364"
  other_write:
    foreground: "#b53b50"
  other_execute:
    foreground: "#06ea61"
  special_user_file:
    foreground: "#ea5ce2"
  special_other:
    foreground: "#474849"
  attribute:
    foreground: "#474849"

size:
  major:
    foreground: "#06ea61"
  minor:
    foreground: "#06ea61"
  number_byte:
    foreground: "#474849"
  number_kilo:
    foreground: "#28292a"
  number_mega:
    foreground: "#c9d364"
  number_giga:
    foreground: "#ea770d"
  number_huge:
    foreground: "#b53b50"
  unit_byte:
    foreground: "#474849"
  unit_kilo:
    foreground: "#28292a"
  unit_mega:
    foreground: "#c9d364"
  unit_giga:
    foreground: "#ea770d"
  unit_huge:
    foreground: "#b53b50"

users:
  user_you:
    foreground: "#28292a"
  user_root:
    foreground: "#b53b50"
  user_other:
    foreground: "#ea5ce2"
  group_yours:
    foreground: "#28292a"
  group_other:
    foreground: "#474849"
  group_root:
    foreground: "#b53b50"

links:
  normal:
    foreground: "#42fff9"
  multi_link_file:
    foreground: "#28292a"
    background: "#42fff9"

git:
  new:
    foreground: "#06ea61"
  modified:
    foreground: "#c9d364"
  deleted:
    foreground: "#b53b50"
  renamed:
    foreground: "#a3a5a6"
  typechange:
    foreground: "#ea5ce2"
  ignored:
    foreground: "#474849"
  conflicted:
    foreground: "#ea770d"

git_repo:
  branch_main:
    foreground: "#28292a"
  branch_other:
    foreground: "#ea5ce2"
  git_clean:
    foreground: "#06ea61"
  git_dirty:
    foreground: "#b53b50"

security_context:
  colon:
    foreground: "#474849"
  user:
    foreground: "#28292a"
  role:
    foreground: "#ea5ce2"
  typ:
    foreground: "#474849"
  range:
    foreground: "#ea5ce2"

file_type:
  image:
    foreground: "#c9d364"
  video:
    foreground: "#06ea61"
  music:
    foreground: "#06ea61"
  lossless:
    foreground: "#28292a"
  crypto:
    foreground: "#474849"
  document:
    foreground: "#28292a"
  compressed:
    foreground: "#ea5ce2"
  temp:
    foreground: "#a3a5a6"
  compiled:
    foreground: "#03aeff"
  build:
    foreground: "#474849"
    is_underline: false
  source:
    foreground: "#03aeff"

punctuation:
    foreground: "#474849"
date:
    foreground: "#474849"
inode:
    foreground: "#474849"
blocks:
    foreground: "#474849"
header:
    foreground: "#28292a"
octal:
    foreground: "#a3a5a6"
flags:
    foreground: "#ea5ce2"

symlink_path:
    foreground: "#42fff9"
control_char:
    foreground: "#ea770d"
broken_symlink:
    foreground: "#b53b50"
broken_path_overlay:
    foreground: "#474849"
