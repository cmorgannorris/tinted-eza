# vim: ft=yaml

# Scheme Name: Zenburn
# Scheme Author: elnawe
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#dcdccc"
  directory:
    foreground: "#7cb8bb"
  symlink:
    foreground: "#93e0e3"
  pipe:
    foreground: "#808080"
  block_device:
    foreground: "#e0cf9f"
  char_device:
    foreground: "#e0cf9f"
  socket:
    foreground: "#808080"
  special:
    foreground: "#dc8cc3"
  executable:
    foreground: "#5f7f5f"
  mount_point:
    foreground: "#e0cf9f"

perms:
  user_read:
    foreground: "#e0cf9f"
  user_write:
    foreground: "#dca3a3"
  user_execute_file:
    foreground: "#5f7f5f"
  user_execute_other:
    foreground: "#5f7f5f"
  group_read:
    foreground: "#e0cf9f"
  group_write:
    foreground: "#dca3a3"
  group_execute:
    foreground: "#5f7f5f"
  other_read:
    foreground: "#e0cf9f"
  other_write:
    foreground: "#dca3a3"
  other_execute:
    foreground: "#5f7f5f"
  special_user_file:
    foreground: "#dc8cc3"
  special_other:
    foreground: "#808080"
  attribute:
    foreground: "#808080"

size:
  major:
    foreground: "#5f7f5f"
  minor:
    foreground: "#5f7f5f"
  number_byte:
    foreground: "#808080"
  number_kilo:
    foreground: "#dcdccc"
  number_mega:
    foreground: "#e0cf9f"
  number_giga:
    foreground: "#dfaf8f"
  number_huge:
    foreground: "#dca3a3"
  unit_byte:
    foreground: "#808080"
  unit_kilo:
    foreground: "#dcdccc"
  unit_mega:
    foreground: "#e0cf9f"
  unit_giga:
    foreground: "#dfaf8f"
  unit_huge:
    foreground: "#dca3a3"

users:
  user_you:
    foreground: "#dcdccc"
  user_root:
    foreground: "#dca3a3"
  user_other:
    foreground: "#dc8cc3"
  group_yours:
    foreground: "#dcdccc"
  group_other:
    foreground: "#808080"
  group_root:
    foreground: "#dca3a3"

links:
  normal:
    foreground: "#93e0e3"
  multi_link_file:
    foreground: "#dcdccc"
    background: "#93e0e3"

git:
  new:
    foreground: "#5f7f5f"
  modified:
    foreground: "#e0cf9f"
  deleted:
    foreground: "#dca3a3"
  renamed:
    foreground: "#6f6f6f"
  typechange:
    foreground: "#dc8cc3"
  ignored:
    foreground: "#808080"
  conflicted:
    foreground: "#dfaf8f"

git_repo:
  branch_main:
    foreground: "#dcdccc"
  branch_other:
    foreground: "#dc8cc3"
  git_clean:
    foreground: "#5f7f5f"
  git_dirty:
    foreground: "#dca3a3"

security_context:
  colon:
    foreground: "#808080"
  user:
    foreground: "#dcdccc"
  role:
    foreground: "#dc8cc3"
  typ:
    foreground: "#808080"
  range:
    foreground: "#dc8cc3"

file_type:
  image:
    foreground: "#e0cf9f"
  video:
    foreground: "#5f7f5f"
  music:
    foreground: "#5f7f5f"
  lossless:
    foreground: "#dcdccc"
  crypto:
    foreground: "#808080"
  document:
    foreground: "#dcdccc"
  compressed:
    foreground: "#dc8cc3"
  temp:
    foreground: "#6f6f6f"
  compiled:
    foreground: "#7cb8bb"
  build:
    foreground: "#808080"
    is_underline: false
  source:
    foreground: "#7cb8bb"

punctuation:
    foreground: "#808080"
date:
    foreground: "#808080"
inode:
    foreground: "#808080"
blocks:
    foreground: "#808080"
header:
    foreground: "#dcdccc"
octal:
    foreground: "#6f6f6f"
flags:
    foreground: "#dc8cc3"

symlink_path:
    foreground: "#93e0e3"
control_char:
    foreground: "#dfaf8f"
broken_symlink:
    foreground: "#dca3a3"
broken_path_overlay:
    foreground: "#808080"
