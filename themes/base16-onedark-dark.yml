# vim: ft=yaml

# Scheme Name: OneDark Dark
# Scheme Author: olimorris (https://github.com/olimorris)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#abb2bf"
  directory:
    foreground: "#61afef"
  symlink:
    foreground: "#2bbac5"
  pipe:
    foreground: "#565c64"
  block_device:
    foreground: "#e5c07b"
  char_device:
    foreground: "#e5c07b"
  socket:
    foreground: "#565c64"
  special:
    foreground: "#d55fde"
  executable:
    foreground: "#89ca78"
  mount_point:
    foreground: "#e5c07b"

perms:
  user_read:
    foreground: "#e5c07b"
  user_write:
    foreground: "#ef596f"
  user_execute_file:
    foreground: "#89ca78"
  user_execute_other:
    foreground: "#89ca78"
  group_read:
    foreground: "#e5c07b"
  group_write:
    foreground: "#ef596f"
  group_execute:
    foreground: "#89ca78"
  other_read:
    foreground: "#e5c07b"
  other_write:
    foreground: "#ef596f"
  other_execute:
    foreground: "#89ca78"
  special_user_file:
    foreground: "#d55fde"
  special_other:
    foreground: "#565c64"
  attribute:
    foreground: "#565c64"

size:
  major:
    foreground: "#89ca78"
  minor:
    foreground: "#89ca78"
  number_byte:
    foreground: "#565c64"
  number_kilo:
    foreground: "#abb2bf"
  number_mega:
    foreground: "#e5c07b"
  number_giga:
    foreground: "#d19a66"
  number_huge:
    foreground: "#ef596f"
  unit_byte:
    foreground: "#565c64"
  unit_kilo:
    foreground: "#abb2bf"
  unit_mega:
    foreground: "#e5c07b"
  unit_giga:
    foreground: "#d19a66"
  unit_huge:
    foreground: "#ef596f"

users:
  user_you:
    foreground: "#abb2bf"
  user_root:
    foreground: "#ef596f"
  user_other:
    foreground: "#d55fde"
  group_yours:
    foreground: "#abb2bf"
  group_other:
    foreground: "#565c64"
  group_root:
    foreground: "#ef596f"

links:
  normal:
    foreground: "#2bbac5"
  multi_link_file:
    foreground: "#abb2bf"
    background: "#2bbac5"

git:
  new:
    foreground: "#89ca78"
  modified:
    foreground: "#e5c07b"
  deleted:
    foreground: "#ef596f"
  renamed:
    foreground: "#434852"
  typechange:
    foreground: "#d55fde"
  ignored:
    foreground: "#565c64"
  conflicted:
    foreground: "#d19a66"

git_repo:
  branch_main:
    foreground: "#abb2bf"
  branch_other:
    foreground: "#d55fde"
  git_clean:
    foreground: "#89ca78"
  git_dirty:
    foreground: "#ef596f"

security_context:
  colon:
    foreground: "#565c64"
  user:
    foreground: "#abb2bf"
  role:
    foreground: "#d55fde"
  typ:
    foreground: "#565c64"
  range:
    foreground: "#d55fde"

file_type:
  image:
    foreground: "#e5c07b"
  video:
    foreground: "#89ca78"
  music:
    foreground: "#89ca78"
  lossless:
    foreground: "#abb2bf"
  crypto:
    foreground: "#565c64"
  document:
    foreground: "#abb2bf"
  compressed:
    foreground: "#d55fde"
  temp:
    foreground: "#434852"
    is_dimmed: false
  compiled:
    foreground: "#61afef"
  build:
    foreground: "#565c64"
    is_underline: false
  source:
    foreground: "#61afef"

punctuation:
    foreground: "#565c64"
date:
    foreground: "#565c64"
inode:
    foreground: "#565c64"
blocks:
    foreground: "#565c64"
header:
    foreground: "#abb2bf"
octal:
    foreground: "#434852"
flags:
    foreground: "#d55fde"

symlink_path:
    foreground: "#2bbac5"
control_char:
    foreground: "#d19a66"
broken_symlink:
    foreground: "#ef596f"
broken_path_overlay:
    foreground: "#565c64"
