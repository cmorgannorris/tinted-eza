# vim: ft=yaml

# Scheme Name: Primer Light
# Scheme Author: Jimmy Lin
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#2f363d"
  directory:
    foreground: "#0366d6"
  symlink:
    foreground: "#79b8ff"
  pipe:
    foreground: "#444d56"
  block_device:
    foreground: "#ffd33d"
  char_device:
    foreground: "#ffd33d"
  socket:
    foreground: "#444d56"
  special:
    foreground: "#ea4aaa"
  executable:
    foreground: "#28a745"
  mount_point:
    foreground: "#ffd33d"

perms:
  user_read:
    foreground: "#ffd33d"
  user_write:
    foreground: "#d73a49"
  user_execute_file:
    foreground: "#28a745"
  user_execute_other:
    foreground: "#28a745"
  group_read:
    foreground: "#ffd33d"
  group_write:
    foreground: "#d73a49"
  group_execute:
    foreground: "#28a745"
  other_read:
    foreground: "#ffd33d"
  other_write:
    foreground: "#d73a49"
  other_execute:
    foreground: "#28a745"
  special_user_file:
    foreground: "#ea4aaa"
  special_other:
    foreground: "#444d56"
  attribute:
    foreground: "#444d56"

size:
  major:
    foreground: "#28a745"
  minor:
    foreground: "#28a745"
  number_byte:
    foreground: "#444d56"
  number_kilo:
    foreground: "#2f363d"
  number_mega:
    foreground: "#ffd33d"
  number_giga:
    foreground: "#f66a0a"
  number_huge:
    foreground: "#d73a49"
  unit_byte:
    foreground: "#444d56"
  unit_kilo:
    foreground: "#2f363d"
  unit_mega:
    foreground: "#ffd33d"
  unit_giga:
    foreground: "#f66a0a"
  unit_huge:
    foreground: "#d73a49"

users:
  user_you:
    foreground: "#2f363d"
  user_root:
    foreground: "#d73a49"
  user_other:
    foreground: "#ea4aaa"
  group_yours:
    foreground: "#2f363d"
  group_other:
    foreground: "#444d56"
  group_root:
    foreground: "#d73a49"

links:
  normal:
    foreground: "#79b8ff"
  multi_link_file:
    foreground: "#2f363d"
    background: "#79b8ff"

git:
  new:
    foreground: "#28a745"
  modified:
    foreground: "#ffd33d"
  deleted:
    foreground: "#d73a49"
  renamed:
    foreground: "#959da5"
  typechange:
    foreground: "#ea4aaa"
  ignored:
    foreground: "#444d56"
  conflicted:
    foreground: "#f66a0a"

git_repo:
  branch_main:
    foreground: "#2f363d"
  branch_other:
    foreground: "#ea4aaa"
  git_clean:
    foreground: "#28a745"
  git_dirty:
    foreground: "#d73a49"

security_context:
  colon:
    foreground: "#444d56"
  user:
    foreground: "#2f363d"
  role:
    foreground: "#ea4aaa"
  typ:
    foreground: "#444d56"
  range:
    foreground: "#ea4aaa"

file_type:
  image:
    foreground: "#ffd33d"
  video:
    foreground: "#28a745"
  music:
    foreground: "#28a745"
  lossless:
    foreground: "#2f363d"
  crypto:
    foreground: "#444d56"
  document:
    foreground: "#2f363d"
  compressed:
    foreground: "#ea4aaa"
  temp:
    foreground: "#959da5"
  compiled:
    foreground: "#0366d6"
  build:
    foreground: "#444d56"
    is_underline: false
  source:
    foreground: "#0366d6"

punctuation:
    foreground: "#444d56"
date:
    foreground: "#444d56"
inode:
    foreground: "#444d56"
blocks:
    foreground: "#444d56"
header:
    foreground: "#2f363d"
octal:
    foreground: "#959da5"
flags:
    foreground: "#ea4aaa"

symlink_path:
    foreground: "#79b8ff"
control_char:
    foreground: "#f66a0a"
broken_symlink:
    foreground: "#d73a49"
broken_path_overlay:
    foreground: "#444d56"
