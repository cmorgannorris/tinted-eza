# vim: ft=yaml

# Scheme Name: Windows 95 Light
# Scheme Author: Fergus Collins (https://github.com/ferguscollins)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#545454"
  directory:
    foreground: "#0000a8"
  symlink:
    foreground: "#00a8a8"
  pipe:
    foreground: "#7e7e7e"
  block_device:
    foreground: "#a85400"
  char_device:
    foreground: "#a85400"
  socket:
    foreground: "#7e7e7e"
  special:
    foreground: "#a800a8"
  executable:
    foreground: "#00a800"
  mount_point:
    foreground: "#a85400"

perms:
  user_read:
    foreground: "#a85400"
  user_write:
    foreground: "#a80000"
  user_execute_file:
    foreground: "#00a800"
  user_execute_other:
    foreground: "#00a800"
  group_read:
    foreground: "#a85400"
  group_write:
    foreground: "#a80000"
  group_execute:
    foreground: "#00a800"
  other_read:
    foreground: "#a85400"
  other_write:
    foreground: "#a80000"
  other_execute:
    foreground: "#00a800"
  special_user_file:
    foreground: "#a800a8"
  special_other:
    foreground: "#7e7e7e"
  attribute:
    foreground: "#7e7e7e"

size:
  major:
    foreground: "#00a800"
  minor:
    foreground: "#00a800"
  number_byte:
    foreground: "#7e7e7e"
  number_kilo:
    foreground: "#545454"
  number_mega:
    foreground: "#a85400"
  number_giga:
    foreground: "#fcfc54"
  number_huge:
    foreground: "#a80000"
  unit_byte:
    foreground: "#7e7e7e"
  unit_kilo:
    foreground: "#545454"
  unit_mega:
    foreground: "#a85400"
  unit_giga:
    foreground: "#fcfc54"
  unit_huge:
    foreground: "#a80000"

users:
  user_you:
    foreground: "#545454"
  user_root:
    foreground: "#a80000"
  user_other:
    foreground: "#a800a8"
  group_yours:
    foreground: "#545454"
  group_other:
    foreground: "#7e7e7e"
  group_root:
    foreground: "#a80000"

links:
  normal:
    foreground: "#00a8a8"
  multi_link_file:
    foreground: "#545454"
    background: "#00a8a8"

git:
  new:
    foreground: "#00a800"
  modified:
    foreground: "#a85400"
  deleted:
    foreground: "#a80000"
  renamed:
    foreground: "#a8a8a8"
  typechange:
    foreground: "#a800a8"
  ignored:
    foreground: "#7e7e7e"
  conflicted:
    foreground: "#fcfc54"

git_repo:
  branch_main:
    foreground: "#545454"
  branch_other:
    foreground: "#a800a8"
  git_clean:
    foreground: "#00a800"
  git_dirty:
    foreground: "#a80000"

security_context:
  colon:
    foreground: "#7e7e7e"
  user:
    foreground: "#545454"
  role:
    foreground: "#a800a8"
  typ:
    foreground: "#7e7e7e"
  range:
    foreground: "#a800a8"

file_type:
  image:
    foreground: "#a85400"
  video:
    foreground: "#00a800"
  music:
    foreground: "#00a800"
  lossless:
    foreground: "#545454"
  crypto:
    foreground: "#7e7e7e"
  document:
    foreground: "#545454"
  compressed:
    foreground: "#a800a8"
  temp:
    foreground: "#a8a8a8"
    is_dimmed: false
  compiled:
    foreground: "#0000a8"
  build:
    foreground: "#7e7e7e"
    is_underline: false
  source:
    foreground: "#0000a8"

punctuation:
    foreground: "#7e7e7e"
date:
    foreground: "#7e7e7e"
inode:
    foreground: "#7e7e7e"
blocks:
    foreground: "#7e7e7e"
header:
    foreground: "#545454"
octal:
    foreground: "#a8a8a8"
flags:
    foreground: "#a800a8"

symlink_path:
    foreground: "#00a8a8"
control_char:
    foreground: "#fcfc54"
broken_symlink:
    foreground: "#a80000"
broken_path_overlay:
    foreground: "#7e7e7e"
