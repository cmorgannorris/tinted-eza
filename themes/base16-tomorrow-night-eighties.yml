# vim: ft=yaml

# Scheme Name: Tomorrow Night Eighties
# Scheme Author: Chris Kempson (http://chriskempson.com)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cccccc"
  directory:
    foreground: "#6699cc"
  symlink:
    foreground: "#66cccc"
  pipe:
    foreground: "#b4b7b4"
  block_device:
    foreground: "#ffcc66"
  char_device:
    foreground: "#ffcc66"
  socket:
    foreground: "#b4b7b4"
  special:
    foreground: "#cc99cc"
  executable:
    foreground: "#99cc99"
  mount_point:
    foreground: "#6699cc"

perms:
  user_read:
    foreground: "#cccccc"
  user_write:
    foreground: "#f99157"
  user_execute_file:
    foreground: "#99cc99"
  user_execute_other:
    foreground: "#99cc99"
  group_read:
    foreground: "#cccccc"
  group_write:
    foreground: "#f99157"
  group_execute:
    foreground: "#99cc99"
  other_read:
    foreground: "#b4b7b4"
  other_write:
    foreground: "#f99157"
  other_execute:
    foreground: "#99cc99"
  special_user_file:
    foreground: "#cc99cc"
  special_other:
    foreground: "#b4b7b4"
  attribute:
    foreground: "#b4b7b4"

size:
  major:
    foreground: "#99cc99"
  minor:
    foreground: "#99cc99"
  number_byte:
    foreground: "#b4b7b4"
  number_kilo:
    foreground: "#cccccc"
  number_mega:
    foreground: "#ffcc66"
  number_giga:
    foreground: "#f99157"
  number_huge:
    foreground: "#f2777a"
  unit_byte:
    foreground: "#b4b7b4"
  unit_kilo:
    foreground: "#cccccc"
  unit_mega:
    foreground: "#ffcc66"
  unit_giga:
    foreground: "#f99157"
  unit_huge:
    foreground: "#f2777a"

users:
  user_you:
    foreground: "#cccccc"
  user_root:
    foreground: "#f2777a"
  user_other:
    foreground: "#cc99cc"
  group_yours:
    foreground: "#cccccc"
  group_other:
    foreground: "#b4b7b4"
  group_root:
    foreground: "#f2777a"

links:
  normal:
    foreground: "#66cccc"
  multi_link_file:
    foreground: "#cccccc"
    background: "#66cccc"

git:
  new:
    foreground: "#99cc99"
  modified:
    foreground: "#ffcc66"
  deleted:
    foreground: "#f2777a"
  renamed:
    foreground: "#99cc99"
  typechange:
    foreground: "#cc99cc"
  ignored:
    foreground: "#b4b7b4"
  conflicted:
    foreground: "#f2777a"

git_repo:
  branch_main:
    foreground: "#cccccc"
  branch_other:
    foreground: "#cc99cc"
  git_clean:
    foreground: "#99cc99"
  git_dirty:
    foreground: "#f2777a"

security_context:
  colon:
    foreground: "#b4b7b4"
  user:
    foreground: "#cccccc"
  role:
    foreground: "#cc99cc"
  typ:
    foreground: "#b4b7b4"
  range:
    foreground: "#cc99cc"

file_type:
  image:
    foreground: "#ffcc66"
  video:
    foreground: "#f2777a"
  music:
    foreground: "#99cc99"
  lossless:
    foreground: "#66cccc"
  crypto:
    foreground: "#b4b7b4"
  document:
    foreground: "#cccccc"
  compressed:
    foreground: "#cc99cc"
  temp:
    foreground: "#f2777a"
  compiled:
    foreground: "#6699cc"
  build:
    foreground: "#b4b7b4"
    is_underline: false
  source:
    foreground: "#6699cc"

punctuation:
    foreground: "#b4b7b4"
date:
    foreground: "#ffcc66"
inode:
    foreground: "#b4b7b4"
blocks:
    foreground: "#b4b7b4"
header:
    foreground: "#cccccc"
octal:
    foreground: "#66cccc"
flags:
    foreground: "#cc99cc"

symlink_path:
    foreground: "#66cccc"
control_char:
    foreground: "#6699cc"
broken_symlink:
    foreground: "#f2777a"
broken_path_overlay:
    foreground: "#b4b7b4"
