# vim: ft=yaml

# Scheme Name: selenized-dark
# Scheme Author: Jan Warchol (https://github.com/jan-warchol/selenized) / adapted to base16 by ali
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#adbcbc"
  directory:
    foreground: "#4695f7"
  symlink:
    foreground: "#41c7b9"
  pipe:
    foreground: "#72898f"
  block_device:
    foreground: "#dbb32d"
  char_device:
    foreground: "#dbb32d"
  socket:
    foreground: "#72898f"
  special:
    foreground: "#af88eb"
  executable:
    foreground: "#75b938"
  mount_point:
    foreground: "#dbb32d"

perms:
  user_read:
    foreground: "#dbb32d"
  user_write:
    foreground: "#fa5750"
  user_execute_file:
    foreground: "#75b938"
  user_execute_other:
    foreground: "#75b938"
  group_read:
    foreground: "#dbb32d"
  group_write:
    foreground: "#fa5750"
  group_execute:
    foreground: "#75b938"
  other_read:
    foreground: "#dbb32d"
  other_write:
    foreground: "#fa5750"
  other_execute:
    foreground: "#75b938"
  special_user_file:
    foreground: "#af88eb"
  special_other:
    foreground: "#72898f"
  attribute:
    foreground: "#72898f"

size:
  major:
    foreground: "#75b938"
  minor:
    foreground: "#75b938"
  number_byte:
    foreground: "#72898f"
  number_kilo:
    foreground: "#adbcbc"
  number_mega:
    foreground: "#dbb32d"
  number_giga:
    foreground: "#ed8649"
  number_huge:
    foreground: "#fa5750"
  unit_byte:
    foreground: "#72898f"
  unit_kilo:
    foreground: "#adbcbc"
  unit_mega:
    foreground: "#dbb32d"
  unit_giga:
    foreground: "#ed8649"
  unit_huge:
    foreground: "#fa5750"

users:
  user_you:
    foreground: "#adbcbc"
  user_root:
    foreground: "#fa5750"
  user_other:
    foreground: "#af88eb"
  group_yours:
    foreground: "#adbcbc"
  group_other:
    foreground: "#72898f"
  group_root:
    foreground: "#fa5750"

links:
  normal:
    foreground: "#41c7b9"
  multi_link_file:
    foreground: "#adbcbc"
    background: "#41c7b9"

git:
  new:
    foreground: "#75b938"
  modified:
    foreground: "#dbb32d"
  deleted:
    foreground: "#fa5750"
  renamed:
    foreground: "#72898f"
  typechange:
    foreground: "#af88eb"
  ignored:
    foreground: "#72898f"
  conflicted:
    foreground: "#ed8649"

git_repo:
  branch_main:
    foreground: "#adbcbc"
  branch_other:
    foreground: "#af88eb"
  git_clean:
    foreground: "#75b938"
  git_dirty:
    foreground: "#fa5750"

security_context:
  colon:
    foreground: "#72898f"
  user:
    foreground: "#adbcbc"
  role:
    foreground: "#af88eb"
  typ:
    foreground: "#72898f"
  range:
    foreground: "#af88eb"

file_type:
  image:
    foreground: "#dbb32d"
  video:
    foreground: "#75b938"
  music:
    foreground: "#75b938"
  lossless:
    foreground: "#adbcbc"
  crypto:
    foreground: "#72898f"
  document:
    foreground: "#adbcbc"
  compressed:
    foreground: "#af88eb"
  temp:
    foreground: "#72898f"
    is_dimmed: false
  compiled:
    foreground: "#4695f7"
  build:
    foreground: "#72898f"
    is_underline: false
  source:
    foreground: "#4695f7"

punctuation:
    foreground: "#72898f"
date:
    foreground: "#72898f"
inode:
    foreground: "#72898f"
blocks:
    foreground: "#72898f"
header:
    foreground: "#adbcbc"
octal:
    foreground: "#72898f"
flags:
    foreground: "#af88eb"

symlink_path:
    foreground: "#41c7b9"
control_char:
    foreground: "#ed8649"
broken_symlink:
    foreground: "#fa5750"
broken_path_overlay:
    foreground: "#72898f"
