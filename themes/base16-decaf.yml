# vim: ft=yaml

# Scheme Name: Decaf
# Scheme Author: Alex Mirrington (https://github.com/alexmirrington)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#cccccc"
  directory:
    foreground: "#90bee1"
  symlink:
    foreground: "#bed6ff"
  pipe:
    foreground: "#b4b7b4"
  block_device:
    foreground: "#ffd67c"
  char_device:
    foreground: "#ffd67c"
  socket:
    foreground: "#b4b7b4"
  special:
    foreground: "#efb3f7"
  executable:
    foreground: "#beda78"
  mount_point:
    foreground: "#ffd67c"

perms:
  user_read:
    foreground: "#ffd67c"
  user_write:
    foreground: "#ff7f7b"
  user_execute_file:
    foreground: "#beda78"
  user_execute_other:
    foreground: "#beda78"
  group_read:
    foreground: "#ffd67c"
  group_write:
    foreground: "#ff7f7b"
  group_execute:
    foreground: "#beda78"
  other_read:
    foreground: "#ffd67c"
  other_write:
    foreground: "#ff7f7b"
  other_execute:
    foreground: "#beda78"
  special_user_file:
    foreground: "#efb3f7"
  special_other:
    foreground: "#b4b7b4"
  attribute:
    foreground: "#b4b7b4"

size:
  major:
    foreground: "#beda78"
  minor:
    foreground: "#beda78"
  number_byte:
    foreground: "#b4b7b4"
  number_kilo:
    foreground: "#cccccc"
  number_mega:
    foreground: "#ffd67c"
  number_giga:
    foreground: "#ffbf70"
  number_huge:
    foreground: "#ff7f7b"
  unit_byte:
    foreground: "#b4b7b4"
  unit_kilo:
    foreground: "#cccccc"
  unit_mega:
    foreground: "#ffd67c"
  unit_giga:
    foreground: "#ffbf70"
  unit_huge:
    foreground: "#ff7f7b"

users:
  user_you:
    foreground: "#cccccc"
  user_root:
    foreground: "#ff7f7b"
  user_other:
    foreground: "#efb3f7"
  group_yours:
    foreground: "#cccccc"
  group_other:
    foreground: "#b4b7b4"
  group_root:
    foreground: "#ff7f7b"

links:
  normal:
    foreground: "#bed6ff"
  multi_link_file:
    foreground: "#cccccc"
    background: "#bed6ff"

git:
  new:
    foreground: "#beda78"
  modified:
    foreground: "#ffd67c"
  deleted:
    foreground: "#ff7f7b"
  renamed:
    foreground: "#777777"
  typechange:
    foreground: "#efb3f7"
  ignored:
    foreground: "#b4b7b4"
  conflicted:
    foreground: "#ffbf70"

git_repo:
  branch_main:
    foreground: "#cccccc"
  branch_other:
    foreground: "#efb3f7"
  git_clean:
    foreground: "#beda78"
  git_dirty:
    foreground: "#ff7f7b"

security_context:
  colon:
    foreground: "#b4b7b4"
  user:
    foreground: "#cccccc"
  role:
    foreground: "#efb3f7"
  typ:
    foreground: "#b4b7b4"
  range:
    foreground: "#efb3f7"

file_type:
  image:
    foreground: "#ffd67c"
  video:
    foreground: "#beda78"
  music:
    foreground: "#beda78"
  lossless:
    foreground: "#cccccc"
  crypto:
    foreground: "#b4b7b4"
  document:
    foreground: "#cccccc"
  compressed:
    foreground: "#efb3f7"
  temp:
    foreground: "#777777"
    is_dimmed: false
  compiled:
    foreground: "#90bee1"
  build:
    foreground: "#b4b7b4"
    is_underline: false
  source:
    foreground: "#90bee1"

punctuation:
    foreground: "#b4b7b4"
date:
    foreground: "#b4b7b4"
inode:
    foreground: "#b4b7b4"
blocks:
    foreground: "#b4b7b4"
header:
    foreground: "#cccccc"
octal:
    foreground: "#777777"
flags:
    foreground: "#efb3f7"

symlink_path:
    foreground: "#bed6ff"
control_char:
    foreground: "#ffbf70"
broken_symlink:
    foreground: "#ff7f7b"
broken_path_overlay:
    foreground: "#b4b7b4"
