# vim: ft=yaml

# Scheme Name: Default Dark
# Scheme Author: Chris Kempson (http://chriskempson.com)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#d8d8d8"
  directory:
    foreground: "#7cafc2"
  symlink:
    foreground: "#86c1b9"
  pipe:
    foreground: "#b8b8b8"
  block_device:
    foreground: "#f7ca88"
  char_device:
    foreground: "#f7ca88"
  socket:
    foreground: "#b8b8b8"
  special:
    foreground: "#ba8baf"
  executable:
    foreground: "#a1b56c"
  mount_point:
    foreground: "#f7ca88"

perms:
  user_read:
    foreground: "#f7ca88"
  user_write:
    foreground: "#ab4642"
  user_execute_file:
    foreground: "#a1b56c"
  user_execute_other:
    foreground: "#a1b56c"
  group_read:
    foreground: "#f7ca88"
  group_write:
    foreground: "#ab4642"
  group_execute:
    foreground: "#a1b56c"
  other_read:
    foreground: "#f7ca88"
  other_write:
    foreground: "#ab4642"
  other_execute:
    foreground: "#a1b56c"
  special_user_file:
    foreground: "#ba8baf"
  special_other:
    foreground: "#b8b8b8"
  attribute:
    foreground: "#b8b8b8"

size:
  major:
    foreground: "#a1b56c"
  minor:
    foreground: "#a1b56c"
  number_byte:
    foreground: "#b8b8b8"
  number_kilo:
    foreground: "#d8d8d8"
  number_mega:
    foreground: "#f7ca88"
  number_giga:
    foreground: "#dc9656"
  number_huge:
    foreground: "#ab4642"
  unit_byte:
    foreground: "#b8b8b8"
  unit_kilo:
    foreground: "#d8d8d8"
  unit_mega:
    foreground: "#f7ca88"
  unit_giga:
    foreground: "#dc9656"
  unit_huge:
    foreground: "#ab4642"

users:
  user_you:
    foreground: "#d8d8d8"
  user_root:
    foreground: "#ab4642"
  user_other:
    foreground: "#ba8baf"
  group_yours:
    foreground: "#d8d8d8"
  group_other:
    foreground: "#b8b8b8"
  group_root:
    foreground: "#ab4642"

links:
  normal:
    foreground: "#86c1b9"
  multi_link_file:
    foreground: "#d8d8d8"
    background: "#86c1b9"

git:
  new:
    foreground: "#a1b56c"
  modified:
    foreground: "#f7ca88"
  deleted:
    foreground: "#ab4642"
  renamed:
    foreground: "#585858"
  typechange:
    foreground: "#ba8baf"
  ignored:
    foreground: "#b8b8b8"
  conflicted:
    foreground: "#dc9656"

git_repo:
  branch_main:
    foreground: "#d8d8d8"
  branch_other:
    foreground: "#ba8baf"
  git_clean:
    foreground: "#a1b56c"
  git_dirty:
    foreground: "#ab4642"

security_context:
  colon:
    foreground: "#b8b8b8"
  user:
    foreground: "#d8d8d8"
  role:
    foreground: "#ba8baf"
  typ:
    foreground: "#b8b8b8"
  range:
    foreground: "#ba8baf"

file_type:
  image:
    foreground: "#f7ca88"
  video:
    foreground: "#a1b56c"
  music:
    foreground: "#a1b56c"
  lossless:
    foreground: "#d8d8d8"
  crypto:
    foreground: "#b8b8b8"
  document:
    foreground: "#d8d8d8"
  compressed:
    foreground: "#ba8baf"
  temp:
    foreground: "#585858"
  compiled:
    foreground: "#7cafc2"
  build:
    foreground: "#b8b8b8"
    is_underline: false
  source:
    foreground: "#7cafc2"

punctuation:
    foreground: "#b8b8b8"
date:
    foreground: "#b8b8b8"
inode:
    foreground: "#b8b8b8"
blocks:
    foreground: "#b8b8b8"
header:
    foreground: "#d8d8d8"
octal:
    foreground: "#585858"
flags:
    foreground: "#ba8baf"

symlink_path:
    foreground: "#86c1b9"
control_char:
    foreground: "#dc9656"
broken_symlink:
    foreground: "#ab4642"
broken_path_overlay:
    foreground: "#b8b8b8"
