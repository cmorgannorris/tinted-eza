# vim: ft=yaml

# Scheme Name: Vesper
# Scheme Author: FormalSnake (https://github.com/formalsnake)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#b7b7b7"
  directory:
    foreground: "#8eaaaa"
  symlink:
    foreground: "#60a592"
  pipe:
    foreground: "#999999"
  block_device:
    foreground: "#ffc799"
  char_device:
    foreground: "#ffc799"
  socket:
    foreground: "#999999"
  special:
    foreground: "#d69094"
  executable:
    foreground: "#5f8787"
  mount_point:
    foreground: "#ffc799"

perms:
  user_read:
    foreground: "#ffc799"
  user_write:
    foreground: "#de6e6e"
  user_execute_file:
    foreground: "#5f8787"
  user_execute_other:
    foreground: "#5f8787"
  group_read:
    foreground: "#ffc799"
  group_write:
    foreground: "#de6e6e"
  group_execute:
    foreground: "#5f8787"
  other_read:
    foreground: "#ffc799"
  other_write:
    foreground: "#de6e6e"
  other_execute:
    foreground: "#5f8787"
  special_user_file:
    foreground: "#d69094"
  special_other:
    foreground: "#999999"
  attribute:
    foreground: "#999999"

size:
  major:
    foreground: "#5f8787"
  minor:
    foreground: "#5f8787"
  number_byte:
    foreground: "#999999"
  number_kilo:
    foreground: "#b7b7b7"
  number_mega:
    foreground: "#ffc799"
  number_giga:
    foreground: "#dab083"
  number_huge:
    foreground: "#de6e6e"
  unit_byte:
    foreground: "#999999"
  unit_kilo:
    foreground: "#b7b7b7"
  unit_mega:
    foreground: "#ffc799"
  unit_giga:
    foreground: "#dab083"
  unit_huge:
    foreground: "#de6e6e"

users:
  user_you:
    foreground: "#b7b7b7"
  user_root:
    foreground: "#de6e6e"
  user_other:
    foreground: "#d69094"
  group_yours:
    foreground: "#b7b7b7"
  group_other:
    foreground: "#999999"
  group_root:
    foreground: "#de6e6e"

links:
  normal:
    foreground: "#60a592"
  multi_link_file:
    foreground: "#b7b7b7"
    background: "#60a592"

git:
  new:
    foreground: "#5f8787"
  modified:
    foreground: "#ffc799"
  deleted:
    foreground: "#de6e6e"
  renamed:
    foreground: "#333333"
  typechange:
    foreground: "#d69094"
  ignored:
    foreground: "#999999"
  conflicted:
    foreground: "#dab083"

git_repo:
  branch_main:
    foreground: "#b7b7b7"
  branch_other:
    foreground: "#d69094"
  git_clean:
    foreground: "#5f8787"
  git_dirty:
    foreground: "#de6e6e"

security_context:
  colon:
    foreground: "#999999"
  user:
    foreground: "#b7b7b7"
  role:
    foreground: "#d69094"
  typ:
    foreground: "#999999"
  range:
    foreground: "#d69094"

file_type:
  image:
    foreground: "#ffc799"
  video:
    foreground: "#5f8787"
  music:
    foreground: "#5f8787"
  lossless:
    foreground: "#b7b7b7"
  crypto:
    foreground: "#999999"
  document:
    foreground: "#b7b7b7"
  compressed:
    foreground: "#d69094"
  temp:
    foreground: "#333333"
    is_dimmed: false
  compiled:
    foreground: "#8eaaaa"
  build:
    foreground: "#999999"
    is_underline: false
  source:
    foreground: "#8eaaaa"

punctuation:
    foreground: "#999999"
date:
    foreground: "#999999"
inode:
    foreground: "#999999"
blocks:
    foreground: "#999999"
header:
    foreground: "#b7b7b7"
octal:
    foreground: "#333333"
flags:
    foreground: "#d69094"

symlink_path:
    foreground: "#60a592"
control_char:
    foreground: "#dab083"
broken_symlink:
    foreground: "#de6e6e"
broken_path_overlay:
    foreground: "#999999"
