# vim: ft=yaml

# Scheme Name: Atelier Plateau Light
# Scheme Author: Bram de Haan (http://atelierbramdehaan.nl)
# Scheme System: base16

colourful: true

filekinds:
  normal:
    foreground: "#585050"
  directory:
    foreground: "#7272ca"
  symlink:
    foreground: "#5485b6"
  pipe:
    foreground: "#655d5d"
  block_device:
    foreground: "#a06e3b"
  char_device:
    foreground: "#a06e3b"
  socket:
    foreground: "#655d5d"
  special:
    foreground: "#8464c4"
  executable:
    foreground: "#4b8b8b"
  mount_point:
    foreground: "#a06e3b"

perms:
  user_read:
    foreground: "#a06e3b"
  user_write:
    foreground: "#ca4949"
  user_execute_file:
    foreground: "#4b8b8b"
  user_execute_other:
    foreground: "#4b8b8b"
  group_read:
    foreground: "#a06e3b"
  group_write:
    foreground: "#ca4949"
  group_execute:
    foreground: "#4b8b8b"
  other_read:
    foreground: "#a06e3b"
  other_write:
    foreground: "#ca4949"
  other_execute:
    foreground: "#4b8b8b"
  special_user_file:
    foreground: "#8464c4"
  special_other:
    foreground: "#655d5d"
  attribute:
    foreground: "#655d5d"

size:
  major:
    foreground: "#4b8b8b"
  minor:
    foreground: "#4b8b8b"
  number_byte:
    foreground: "#655d5d"
  number_kilo:
    foreground: "#585050"
  number_mega:
    foreground: "#a06e3b"
  number_giga:
    foreground: "#b45a3c"
  number_huge:
    foreground: "#ca4949"
  unit_byte:
    foreground: "#655d5d"
  unit_kilo:
    foreground: "#585050"
  unit_mega:
    foreground: "#a06e3b"
  unit_giga:
    foreground: "#b45a3c"
  unit_huge:
    foreground: "#ca4949"

users:
  user_you:
    foreground: "#585050"
  user_root:
    foreground: "#ca4949"
  user_other:
    foreground: "#8464c4"
  group_yours:
    foreground: "#585050"
  group_other:
    foreground: "#655d5d"
  group_root:
    foreground: "#ca4949"

links:
  normal:
    foreground: "#5485b6"
  multi_link_file:
    foreground: "#585050"
    background: "#5485b6"

git:
  new:
    foreground: "#4b8b8b"
  modified:
    foreground: "#a06e3b"
  deleted:
    foreground: "#ca4949"
  renamed:
    foreground: "#7e7777"
  typechange:
    foreground: "#8464c4"
  ignored:
    foreground: "#655d5d"
  conflicted:
    foreground: "#b45a3c"

git_repo:
  branch_main:
    foreground: "#585050"
  branch_other:
    foreground: "#8464c4"
  git_clean:
    foreground: "#4b8b8b"
  git_dirty:
    foreground: "#ca4949"

security_context:
  colon:
    foreground: "#655d5d"
  user:
    foreground: "#585050"
  role:
    foreground: "#8464c4"
  typ:
    foreground: "#655d5d"
  range:
    foreground: "#8464c4"

file_type:
  image:
    foreground: "#a06e3b"
  video:
    foreground: "#4b8b8b"
  music:
    foreground: "#4b8b8b"
  lossless:
    foreground: "#585050"
  crypto:
    foreground: "#655d5d"
  document:
    foreground: "#585050"
  compressed:
    foreground: "#8464c4"
  temp:
    foreground: "#7e7777"
    is_dimmed: false
  compiled:
    foreground: "#7272ca"
  build:
    foreground: "#655d5d"
    is_underline: false
  source:
    foreground: "#7272ca"

punctuation:
    foreground: "#655d5d"
date:
    foreground: "#655d5d"
inode:
    foreground: "#655d5d"
blocks:
    foreground: "#655d5d"
header:
    foreground: "#585050"
octal:
    foreground: "#7e7777"
flags:
    foreground: "#8464c4"

symlink_path:
    foreground: "#5485b6"
control_char:
    foreground: "#b45a3c"
broken_symlink:
    foreground: "#ca4949"
broken_path_overlay:
    foreground: "#655d5d"
